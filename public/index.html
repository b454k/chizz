<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Chizz</title>
<!-- Inline so it costs no request and keeps the "nothing loaded from outside" rule. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131418'/%3E%3Ctext x='32' y='34' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23ff5c3d' text-anchor='middle' dominant-baseline='central'%3Ec%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#131418;
    --panel:#1b1d23;
    --panel2:#23262e;
    --ink:#f1f2f4;
    --muted:#949aa5;
    --line:#2f333c;
    --accent:#ff5c3d;
    --ok:#4ade80;
    --no:#f87171;
    --paper:#e8e5de;
    --pen:#17181c;
  }
  /* Chosen in settings and kept on the device. The dark palette above is the
     default; this only has to restate the colours that actually differ. */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f5f4f0;
    --panel:#ffffff;
    --panel2:#eae7e0;
    --ink:#16181d;
    --muted:#6b7280;
    --line:#d8d4cb;
    --accent:#d8431f;
    --ok:#15803d;
    --no:#b91c1c;
    --paper:#ffffff;
    --pen:#17181c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* manipulation keeps panning and pinch but kills double-tap zoom, which fired
     constantly while drawing fast. The pad itself stays touch-action:none. */
  html, body{touch-action:manipulation;}
  /* A drag that starts on a label must not select text mid-round. Inputs opt back in. */
  body{-webkit-user-select:none; -ms-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  /* keep [hidden] winning over rules that set display:flex/block */
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:600px; margin:0 auto; height:100%;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    display:flex; flex-direction:column;
  }
  .screen{display:none; flex:1; min-height:0; flex-direction:column;}
  .screen.on{display:flex;}
  #home, #send, #result{overflow-y:auto; -webkit-overflow-scrolling:touch;}

  h1{font-size:34px; letter-spacing:-.02em; margin:24px 0 6px;}

  button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;}
  input{font:inherit; color:inherit;}

  /* home screen: vertically centred and plain.
     "safe centre": drops the centring when the viewport is short, otherwise the
     top gets clipped with no way to scroll to it. */
  #home{justify-content:center; justify-content:safe center;}
  .hwrap{width:100%; max-width:340px; margin:0 auto; padding:28px 0; flex:none;}
  #home h1{font-size:52px; text-align:center; margin:0 0 14px; letter-spacing:-.04em;}
  .tagline{
    color:var(--muted); font-size:14px; line-height:1.5; text-align:center;
    margin:0 0 22px;
  }

  /* One per row rather than side by side: the names and their explanations need
     the width, and there are only two of them. */
  .diffs{display:grid; grid-template-columns:1fr; gap:10px;}
  .diff{
    border:2px solid var(--line); border-radius:14px; padding:13px 15px; text-align:left;
    background:var(--panel);
  }
  .diff .mname{display:block; text-transform:lowercase; font-size:16px;}
  .diff .mdesc{
    display:block; margin-top:3px; color:var(--muted);
    font-size:13px; line-height:1.4; font-weight:500;
  }
  .diff.sel .mdesc{color:var(--ink); opacity:.75;}
  .diff.sel{border-color:var(--ink); background:var(--panel2);}

  /* settings on the home screen */
  .settings{
    border:2px solid var(--line); border-radius:14px; padding:14px 15px; margin:0 0 14px;
  }
  .srow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px;}
  .srow + .srow{margin-top:10px;}
  .srow .lbl{font-size:14px; font-weight:600; color:var(--muted);}
  .srow output{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  #secs{
    width:100%; margin:8px 0 2px; accent-color:var(--accent);
    background:transparent; touch-action:manipulation;
  }
  .shint{color:var(--muted); font-size:12px; margin:2px 0 0;}
  .seg{display:flex; gap:6px;}
  .seg button{
    border:2px solid var(--line); border-radius:10px; padding:7px 12px;
    font-size:14px; font-weight:700; color:var(--muted);
  }
  .seg button.sel{border-color:var(--ink); color:var(--ink); background:var(--panel2);}

  /* a primary button that is not ready to be pressed yet, but still takes a tap
     so it can say why */
  .primary.off{opacity:.45;}

  /* name asked at the point it is needed, rather than before the game */
  .namerow{display:flex; gap:8px; align-items:flex-start; margin:0 0 10px;}
  .namerow .txt{margin:0;}
  .namerow button{
    flex:none; border:2px solid var(--line); border-radius:14px; padding:14px 18px; font-weight:700;
  }
  .diff b{display:block; font-size:16px;}

  .primary{
    display:block; width:100%; background:var(--ink); color:var(--bg); border-radius:14px;
    padding:17px; font-size:18px; font-weight:700; text-align:center; margin:22px 0 0;
  }
  .primary:disabled{opacity:.28;}
  .ghost{
    display:block; width:100%; border:2px solid var(--line); border-radius:14px;
    padding:14px; font-size:16px; font-weight:600; text-align:center;
  }
  .txt{
    width:100%; border:2px solid var(--line); border-radius:14px; padding:14px 15px;
    background:var(--panel); outline:none;
  }
  .txt:focus{border-color:var(--ink);}

  /* joining with a code */
  #joinRow{display:flex; gap:10px; margin-top:28px;}
  #joinCode{
    flex:1; text-align:center; text-transform:uppercase; letter-spacing:.22em;
    font-weight:700; font-size:17px; padding:13px 10px;
  }
  #joinCode::placeholder{letter-spacing:normal; text-transform:none; font-weight:600; color:var(--muted);}
  #joinGo{
    width:auto; padding:13px 22px; border:2px solid var(--line); border-radius:14px;
    font-weight:700; color:var(--muted);
  }
  #joinGo:active{background:var(--panel2);}
  .err{color:var(--no); font-size:14px; font-weight:600; margin:10px 0 0; min-height:19px;}

  /* countdown */
  #countdown{align-items:center; justify-content:center;}
  #cdNum{font-size:26vh; font-weight:800; line-height:1; letter-spacing:-.05em;}
  #cdNum.pop{animation:pop .28s ease-out;}
  @keyframes pop{from{transform:scale(.6); opacity:.2} to{transform:scale(1); opacity:1}}

  /* draw */
  #draw{padding-top:10px;}
  .drawtop{display:flex; align-items:center; gap:12px;}
  .headrow{display:flex; align-items:center; gap:10px;}
  .back{
    flex:none; width:36px; height:36px; border-radius:11px; border:2px solid var(--line);
    color:var(--muted); font-size:18px; line-height:1; background:var(--panel);
    display:flex; align-items:center; justify-content:center;
  }
  .back:active{background:var(--panel2);}

  /* The round code, in the corner of the header, from the moment guessing starts:
     people want to play the same round together without going and finding it. */
  /* The title has to give way, not the chip: without min-width:0 a flex item will
     not shrink past its longest word, and the chip was pushed off the screen. */
  .headrow h2{min-width:0;}
  .chip2{
    flex:none; margin-left:auto; display:flex; align-items:center; gap:7px;
    border:2px solid var(--line); border-radius:999px; padding:5px 11px;
    background:var(--panel);
  }
  .chip2:active{background:var(--panel2);}
  .chip2 .cc{font-weight:800; font-size:14px; letter-spacing:.1em;}
  .chip2 .cl{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}

  /* leave-game confirmation */
  #confirm{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.62);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #confirm.on{display:flex;}
  #confirmCard{
    background:var(--panel); border-radius:18px; padding:20px; width:100%; max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.28); text-align:center;
  }
  #confirmCard b{display:block; font-size:19px; margin-bottom:6px;}
  #confirmCard p{color:var(--muted); font-size:14px; margin:0 0 4px;}
  #confirmCard .primary{margin:14px 0 8px;}
  #word{font-size:34px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #counter{font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700; font-size:15px;}
  #track{height:6px; background:var(--line); border-radius:99px; margin:10px 0 12px; overflow:hidden;}
  #bar{height:100%; background:var(--accent); transform-origin:left center; transform:scaleX(1);}
  #stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding-bottom:14px;}
  #pad{background:var(--paper); border:2px solid var(--line); border-radius:16px; touch-action:none; display:block;}

  /* ara ekranlar */
  .mid{align-items:center; justify-content:center; text-align:center;}
  .mid h2{font-size:28px; margin:0 0 8px; letter-spacing:-.02em;}
  .mid p{color:var(--muted); margin:0 0 26px;}
  .mid .stack{width:100%; max-width:320px;}
  .mid .stack .primary{margin:0 0 10px;}

  /* recall + result */
  .head{padding:16px 0 12px;}
  .head h2{font-size:24px; margin:0; letter-spacing:-.02em;}
  .head p{color:var(--muted); margin:4px 0 0; font-size:14px;}
  .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #result .scroll{flex:none; overflow:visible;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-bottom:14px;}
  @media (min-width:520px){ .grid{grid-template-columns:repeat(5,1fr);} }

  .cell{position:relative; text-align:center;}
  .box{
    position:relative; width:100%; aspect-ratio:1/1; border:2px solid var(--line);
    border-radius:12px; overflow:hidden; background:var(--paper);
  }
  .cell.sel .box{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,77,46,.18);}
  .cell.done .box{border-color:var(--ink);}
  .cell.right .box{border-color:var(--ok);}
  .cell.wrong .box{border-color:var(--no);}
  .box canvas{position:absolute; inset:0; width:100%; height:100%;}
  .cap{font-size:12px; line-height:1.25; margin-top:4px; min-height:15px; word-break:break-word;}
  .cap .bad{color:var(--no); text-decoration:line-through;}
  .cap .good{color:var(--ok); font-weight:700;}
  .cap .pick{font-weight:700;}

  .foot{border-top:1px solid var(--line); padding:10px 0 14px; display:flex; align-items:center; gap:12px;}
  .foot .count{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; font-size:14px;}
  .foot .primary{margin:0; flex:1; padding:15px;}

  /* word pool (bottom sheet) */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--panel);
    border-top:1px solid var(--line); box-shadow:0 -10px 30px rgba(0,0,0,.10);
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .16s ease-out; visibility:hidden;
  }
  #sheet.on{transform:translateY(0); visibility:visible;}
  /* Tapping away from the sheet should close it. A scrim does that without the
     tap also landing on whatever cell happens to be underneath. */
  #sheetScrim{position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.35);}
  .grab{
    width:40px; height:4px; border-radius:99px; background:var(--line);
    margin:0 auto 10px; flex:none;
  }
  #modalCard .grab{margin-bottom:14px;}
  #sheet .row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #sheet .row b{font-size:15px;}
  #sheet .x{font-size:22px; line-height:1; color:var(--muted); padding:4px 8px;}
  /* The grid cell is ~76px wide, far too small to recognise a scribble by. Show the
     drawing at something near the size it was drawn at while the word is chosen. */
  #sheetPrev{
    width:min(56vw, 30vh, 240px); height:min(56vw, 30vh, 240px); display:block;
    margin:0 auto 12px; border:2px solid var(--line); border-radius:14px;
    background:var(--paper); flex:none;
  }
  #chips{display:flex; flex-wrap:wrap; gap:8px; max-height:32vh; overflow-y:auto;}
  .chip{border:2px solid var(--line); border-radius:99px; padding:10px 15px; font-size:15px; font-weight:600; background:var(--panel);}
  .chip:active{background:var(--panel2);}

  /* typed answer: a card near the top, so the keyboard cannot cover it */
  #modal{
    position:fixed; inset:0; bottom:auto; height:100%; z-index:30; background:rgba(0,0,0,.62);
    display:none; justify-content:center; align-items:flex-end;
  }
  #modal.on{display:flex;}
  #modalCard{
    background:var(--panel); border-radius:20px 20px 0 0; width:100%; max-width:600px;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 50px rgba(0,0,0,.45);
  }
  #modalPrev{
    width:min(74vw, 38vh, 320px); height:min(74vw, 38vh, 320px); display:block; margin:0 auto 14px;
    border:2px solid var(--line); border-radius:14px; background:var(--paper);
    flex:none;
  }
  /* let the card scroll instead of overflowing when the keyboard shrinks the space */
  #modalCard{max-height:100%; overflow-y:auto;}
  #modalCard .primary{margin:12px 0 0;}
  #modalSkip{display:block; width:100%; text-align:center; color:var(--muted); font-size:14px; font-weight:600; padding:12px 0 2px;}

  /* result */
  #score{font-size:42px; font-weight:800; letter-spacing:-.03em; margin:14px 0 2px; line-height:1.1;}
  /* difficulty caption on the drawing and result screens: small, centred, faint */
  .lvl{
    text-align:center; font-size:11px; font-weight:700; letter-spacing:.2em;
    text-transform:uppercase; color:var(--muted); opacity:.45;
    margin:10px 0 4px; flex:none;
  }
  #scoreSub{margin:10px 0 6px;}
  #copyNote{color:var(--ok); font-weight:600; font-size:14px; text-align:center; min-height:20px; margin:2px 0 0;}
  #fallback{
    width:100%; margin-top:10px; border:2px solid var(--line); border-radius:12px; padding:10px;
    font:16px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre; display:none;
  }
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 0 16px;}

  /* tap a finished drawing to see it full size */
  #zoom{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.72);
    display:none; justify-content:center; align-items:center; padding:20px;
  }
  #zoom.on{display:flex;}
  #zoomCard{width:100%; max-width:520px; text-align:center;}
  #zoomPrev{
    width:min(84vw, 58vh, 460px); height:min(84vw, 58vh, 460px); display:block;
    margin:0 auto 14px; border:2px solid var(--line); border-radius:16px;
    background:var(--paper);
  }
  #zoomCap{font-size:16px; font-weight:600; margin:0 0 16px; min-height:22px;}
  #zoomCap .bad{color:var(--no); text-decoration:line-through; margin-right:8px;}
  #zoomCap .good{color:var(--ok); font-weight:700;}
  #zoomClose{max-width:220px; margin:0 auto;}
  .cell.tappable{cursor:pointer;}

  /* duel: send screen */
  #send .wrap{margin:auto 0; padding:20px 0;}
  #send h2{font-size:26px; margin:0 0 8px; letter-spacing:-.02em;}
  #send p{color:var(--muted); margin:0 0 22px;}
  #code{
    font-size:44px; font-weight:800; letter-spacing:.14em; text-align:center;
    border:2px dashed var(--line); border-radius:16px; padding:18px 10px; margin:0 0 14px;
  }
  #link{
    display:block; width:100%; border:2px solid var(--line); border-radius:12px; padding:12px;
    font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break:break-all; text-align:center;
    color:var(--muted); margin-bottom:12px;
  }
  .spin{color:var(--muted); font-weight:600; text-align:center; padding:10px 0;}

  /* cell number - dark, because it sits on the paper */
  .num{
    position:absolute; top:3px; left:5px; font-size:11px; font-weight:700;
    color:#a9a49a; font-variant-numeric:tabular-nums; pointer-events:none;
  }

  /* score tablosu */
  #board{margin:18px 0 4px;}
  #board h3{font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:700;
            letter-spacing:.06em; text-transform:uppercase;}
  .brow{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
    background:var(--panel); margin-bottom:6px;
  }
  .brow.me{background:var(--panel2); box-shadow:inset 0 0 0 2px var(--accent);}
  .brow .rk{width:22px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; font-size:14px;}
  .brow .nm{flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brow .tm{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; margin-right:10px;}
  .brow .sc{font-weight:800; font-variant-numeric:tabular-nums;}
  #boardEmpty, #scoresEmpty{color:var(--muted); font-size:14px; padding:4px 0 8px;}
  .bnote{color:var(--muted); font-size:12px; margin:8px 0 0;}
  #nameRow{display:flex; gap:10px; margin-bottom:10px;}
  #nameRow .txt{flex:1; text-align:center; font-weight:700; letter-spacing:.08em;}
  #nameGo{width:auto; padding:14px 20px; border:2px solid var(--line); border-radius:14px; font-weight:700;}
  #fallback{background:var(--panel); color:var(--ink);}
  #modalPrev{background:var(--paper);}
</style>

<div id="app">

  <!-- ============ ANA EKRAN ============ -->
  <section class="screen on" id="home">
    <div class="hwrap">
      <h1>chizz</h1>
      <p class="tagline" data-t="tagline"></p>
      <div class="diffs" id="modes"></div>

      <div class="settings">
        <div class="srow">
          <span class="lbl" data-t="perWord"></span>
          <output id="secsOut"></output>
        </div>
        <input type="range" id="secs" min="1" max="10" step="0.5" data-tal="perWord">
        <p class="shint" data-t="recommended"></p>
        <div class="srow">
          <span class="lbl" data-t="theme"></span>
          <div class="seg" id="themes"></div>
        </div>
      </div>

      <button class="primary" id="start" data-t="start"></button>
      <div id="joinRow">
        <input class="txt" id="joinCode" maxlength="4" data-tph="codePlaceholder"
               autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go">
        <button id="joinGo" data-t="join"></button>
      </div>
      <p class="err" id="joinErr"></p>
    </div>
  </section>

  <!-- ============ COUNTDOWN ============ -->
  <section class="screen" id="countdown">
    <div id="cdNum">3</div>
  </section>

  <!-- ============ DRAWING ============ -->
  <section class="screen" id="draw">
    <p class="lvl" id="drawLevel"></p>
    <div class="drawtop">
      <button class="back" id="backDraw" data-tal="backToMenu">←</button>
      <div id="word"></div>
      <div id="counter">1 / 20</div>
    </div>
    <div id="track"><div id="bar"></div></div>
    <div id="stage"><canvas id="pad"></canvas></div>
  </section>

  <!-- ============ ARA EKRAN ============ -->
  <section class="screen mid" id="between">
    <h2 data-t="drawingsDone"></h2>
    <p data-t="whatNow"></p>
    <div class="stack">
      <button class="primary" id="toSend" data-t="sendToFriend"></button>
      <button class="ghost" id="toRecall" data-t="guessMyself"></button>
    </div>
  </section>

  <!-- ============ SEND ============ -->
  <section class="screen" id="send">
    <div class="wrap">
      <div id="sendForm">
        <h2 data-t="sendToFriend"></h2>
        <p data-t="sendIntro"></p>
        <input class="txt" id="sendName" maxlength="10" data-tph="namePlaceholder"
               autocorrect="off" spellcheck="false" enterkeyhint="go" style="margin-bottom:10px">
        <button class="primary off" id="sendGo" data-t="send"></button>
        <p class="err" id="sendErr"></p>
        <button class="ghost" id="sendBack" style="margin-top:10px" data-t="cancel"></button>
      </div>

      <div id="sendBusy" class="spin" hidden data-t="sending"></div>

      <div id="sendDone" hidden>
        <h2 data-t="ready"></h2>
        <p data-t="shareCodeOrLink"></p>
        <div id="code"></div>
        <div id="link"></div>
        <button class="primary" id="linkCopy" style="margin:0 0 10px" data-t="copyLink"></button>
        <p id="linkNote" class="err" style="color:var(--ok)"></p>
        <button class="ghost" id="toScores" style="margin-bottom:10px" data-t="watchScores"></button>
        <button class="ghost" id="doneRecall" style="margin-bottom:10px" data-t="guessMineToo"></button>
        <button class="ghost" id="doneHome" data-t="home"></button>
      </div>
    </div>
  </section>

  <!-- ============ LOADING (duel link) ============ -->
  <section class="screen mid" id="loading">
    <h2 id="loadTitle"></h2>
    <p id="loadMsg"></p>
    <div class="stack"><button class="ghost" id="loadHome" hidden data-t="backHome"></button></div>
  </section>

  <!-- ============ SCORE WATCH (for the drawer) ============ -->
  <section class="screen" id="scores">
    <div class="head">
      <div class="headrow">
        <button class="back" id="scoresBack" data-tal="back">←</button>

  const n = Math.round(Number(v) * 2) / 2;                 // half-second steps
  if (!isFinite(n)) return SECS_DEFAULT;
  return Math.min(SECS_MAX, Math.max(SECS_MIN, n));

/* --------------------------------------------------------------- storage --- */
/* The v1 brief banned localStorage, back when a round was one throwaway sitting.
   Shared rounds changed that: a link gets opened twice, a phone reloads the tab,
   and the player expects to find their game where they left it. Only what the
   round already shows is kept -- the name typed on this device, and per round
   code the grid order, the answers and whether it was finished. Every access is
   wrapped: Safari in private mode throws on localStorage rather than no-opping. */
const STORE_KEY   = "chizz.v1";
const KEEP_ROUNDS = 40;
const ROUND_TTL   = 30 * 24 * 60 * 60 * 1000;   // the server expires rounds on the same clock

function loadStore(){
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!v || typeof v !== "object") return { name: "", rounds: {} };
    if (!v.rounds || typeof v.rounds !== "object") v.rounds = {};
    if (typeof v.name !== "string") v.name = "";
    return v;
  } catch(e){ return { name: "", rounds: {} }; }
}

function saveStore(store){
  // Drop what the server has expired anyway, then keep the newest few.
  const now = Date.now();
  const kept = {};
  Object.keys(store.rounds)
    .filter(function(c){ return now - (store.rounds[c].at || 0) < ROUND_TTL; })
    .sort(function(a, b){ return (store.rounds[b].at || 0) - (store.rounds[a].at || 0); })
    .slice(0, KEEP_ROUNDS)
    .forEach(function(c){ kept[c] = store.rounds[c]; });
  store.rounds = kept;

// Put the round in the address bar so a reload returns to it instead of the home
// screen. replaceState, not pushState: the back button should still leave.
function setUrlCode(code){

}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function show(id){
  const list = document.querySelectorAll(".screen");
  for (let i = 0; i < list.length; i++) list[i].classList.toggle("on", list[i].id === id);
  if (typeof closeZoom === "function") closeZoom();
  // The code can arrive from a save, a reload, or a link, so the chip is refreshed
  // on every screen change rather than at any one of those points.
  if (typeof updateCodeChip === "function") updateCodeChip();
  // stop polling on any screen other than the score board
  if (id !== "result" && id !== "scores" && typeof stopBoardPoll === "function") stopBoardPoll();
}

/* ------------------------------------------------- cevap normalizasyonu --- */

const TURKISH_FOLD = { "ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u","ê":"e" };

let PUNCTUATION;
try { PUNCTUATION = new RegExp("[^\\p{L}\\p{N}\\s]", "gu"); }
catch (e){ PUNCTUATION = /[^a-z0-9\s]/g; }

function norm(s){
  s = String(s == null ? "" : s);
  s = s.toLocaleLowerCase("tr");
  s = s.replace(/̇/g, "");                     // combining dot left by lowercasing "İ"
  s = s.replace(/[çğıöşüâîûê]/g, function(ch){ return TURKISH_FOLD[ch] || ch; });
  s = s.replace(PUNCTUATION, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

// Levenshtein mesafesi <= 1 mi
function withinOneEdit(a, b){
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb){
    let d = 0;
    for (let i = 0; i < la; i++) if (a[i] !== b[i] && ++d > 1) return false;
    return true;
  }
  const kisa = la < lb ? a : b, uzun = la < lb ? b : a;
  let i = 0, j = 0, d = 0;
  while (i < kisa.length && j < uzun.length){
    if (kisa[i] === uzun[j]){ i++; j++; }
    else { if (++d > 1) return false; j++; }
  }
  return true;
}

function isCorrect(cevap, kelime){
  const a = norm(cevap);
  if (!a) return false;                 // a blank answer is always wrong
  return withinOneEdit(a, norm(kelime));
}

/* --------------------------------------------------------------- sound --- */
/* Tones are synthesised rather than loaded, so the page still pulls nothing from
   outside. A browser will not let audio start without a gesture, so the context is
   created and resumed on the first tap -- pressing start, in practice -- and every
   later beep runs on that one permission. */
let audio = null;

function wakeAudio(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return;
    if (!audio) audio = new Ctx();
    if (audio.state === "suspended") audio.resume();
  } catch(e){ audio = null; }      // no audio is not a reason to stop the game
}

function tone(freq, startIn, length, peak){
  if (!audio || audio.state !== "running") return;
  try {
    const t0 = audio.currentTime + startIn;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    // Ramped rather than switched, so it does not click at either end.
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t0); osc.stop(t0 + length + 0.02);
  } catch(e){}
}

function beepCount(){ tone(660, 0, 0.12, 0.14); }            // 3, 2, 1
function beepGo(){    tone(990, 0, 0.22, 0.17); }            // draw
function beepScores(){                                        // the board is in
  tone(523.25, 0,    0.16, 0.11);
  tone(659.25, 0.13, 0.16, 0.11);
  tone(783.99, 0.26, 0.30, 0.13);
}

// Any tap will do, in case the round was reached through a link rather than start.
document.addEventListener("pointerdown", wakeAudio, { once: true });

let cdTimer = null;

function randomSet(){
  const havuz = SETS.filter(function(s){ return s.id !== lastSetId; });
  return havuz[Math.floor(Math.random() * havuz.length)];
}

function startGame(){

  lastSetId = s.id;

  drawerName  = "";
  lastCode   = "";

  recallMs  = 0;
  scores  = [];
  scoreSent = false;

  drawings = words.map(function(){ return []; });
  order    = shuffle(words.map(function(_, i){ return i; }));

/* ----------------------------------------------------------- drawing phase --- */

const pad = $("pad");
const pctx = pad.getContext("2d");

let padSize = 0;
let strokes = [];
// One stroke per pointer, keyed by pointerId. A single shared "current stroke"
// made a second finger carry on the first one, so two hands drew a line joining
// them instead of two separate lines. Any number of pointers now draw at once.
const live = new Map();
let idx = 0;
let wordStart = 0;
let raf = 0;

function sizePad(){
  const stage = $("stage");
  const size = Math.max(160, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)));
  if (size === padSize) return;
  padSize = size;
  const dpr = window.devicePixelRatio || 1;
  pad.style.width  = size + "px";
  pad.style.height = size + "px";
  pad.width  = Math.round(size * dpr);
  pad.height = Math.round(size * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintPad();
}

function penWidth(){ return Math.max(3, padSize * 0.011); }

function paintPad(){
  pctx.clearRect(0, 0, padSize, padSize);
  paintStrokes(pctx, strokes, padSize, penWidth());
}

function paintStrokes(ctx, list, size, lw){
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = PEN;
  ctx.fillStyle = PEN;
  for (let k = 0; k < list.length; k++){
    const s = list[k];
    if (!s || !s.length) continue;
    if (s.length === 1){
      ctx.beginPath();
      ctx.arc(s[0].x * size, s[0].y * size, lw / 2, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(s[0].x * size, s[0].y * size);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x * size, s[i].y * size);
    ctx.stroke();
  }
}

function padPoint(e){
  const r = pad.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top)  / r.height;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}

pad.addEventListener("pointerdown", function(e){
  if (!$("draw").classList.contains("on")) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch(err){}
  const stroke = [padPoint(e)];
  live.set(e.pointerId, stroke);
  strokes.push(stroke);
  paintPad();
});

pad.addEventListener("pointermove", function(e){
  const stroke = live.get(e.pointerId);
  if (!stroke) return;
  e.preventDefault();
  // getCoalescedEvents sometimes returns an empty array; fall back to the event
  let evts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evts || !evts.length) evts = [e];
  const lw = penWidth();
  pctx.lineWidth = lw; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = PEN;
  for (let i = 0; i < evts.length; i++){
    const p = padPoint(evts[i]);
    const prev = stroke[stroke.length - 1];
    if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.0015) continue;
    pctx.beginPath();
    pctx.moveTo(prev.x * padSize, prev.y * padSize);
    pctx.lineTo(p.x * padSize, p.y * padSize);
    pctx.stroke();
    stroke.push(p);
  }
});

function endStroke(e){
  if (!e){ live.clear(); return; }        // called with nothing = drop every pointer
  if (!live.has(e.pointerId)) return;     // a finger that was never drawing
  e.preventDefault();
  live.delete(e.pointerId);
}
pad.addEventListener("pointerup", endStroke);
pad.addEventListener("pointercancel", endStroke);
pad.addEventListener("pointerleave", endStroke);

function startDrawPhase(){
  show("draw");
  padSize = 0;
  sizePad();            // layout is ready after show(), so measure synchronously
  startWord(0);
}

function startWord(i){
  idx = i;
  strokes = [];
  live.clear();
  paintPad();
  $("drawLevel").textContent = roundLabel();
  $("word").textContent = words[i];
  $("counter").textContent = (i + 1) + " / " + N;
  $("bar").style.transform = "scaleX(1)";
  wordStart = performance.now();
  raf = requestAnimationFrame(tick);
}

function tick(){
  const ms = roundMs();
  const el = performance.now() - wordStart;
  $("bar").style.transform = "scaleX(" + Math.max(0, 1 - el / ms) + ")";
  if (el >= ms){ nextWord(); return; }
  raf = requestAnimationFrame(tick);
}

function nextWord(){
  cancelAnimationFrame(raf);
  live.clear();
  drawings[idx] = strokes.filter(function(s){ return s && s.length; });   // empty drawing = []
  if (idx + 1 < N) startWord(idx + 1);
  else show("between");
}

// rAF stops while the tab is in the background. Push wordStart forward by the
// hidden duration so the player does not lose the rest of the word.
let hiddenAt = 0;
document.addEventListener("visibilitychange", function(){
  if (pausedAt) return;              // already paused by the leave confirmation
  if (document.hidden) hiddenAt = performance.now();
  else if (hiddenAt){ wordStart += performance.now() - hiddenAt; hiddenAt = 0; }
});

/* --------------------------------------------------- leave confirmation --- */

let pausedAt = 0;

function pauseTimer(){
  if (!$("draw").classList.contains("on") || pausedAt) return;
  cancelAnimationFrame(raf);
  pausedAt = performance.now();          // freeze the timer while the dialog is open
}

function resumeTimer(){
  // do nothing unless we actually paused, or a second rAF loop starts and time runs twice as fast
  if (!pausedAt || !$("draw").classList.contains("on")) return;
  wordStart += performance.now() - pausedAt;
  pausedAt = 0;
  raf = requestAnimationFrame(tick);
}

function askExit(){
  pauseTimer();
  $("confirm").classList.add("on");
}

function cancelExit(){
  $("confirm").classList.remove("on");
  resumeTimer();
}

function confirmExit(){
  $("confirm").classList.remove("on");
  cancelAnimationFrame(raf);
  clearTimeout(cdTimer);
  pausedAt = 0;
  live.clear();
  closeSheet(); closeModal(); closeZoom();
  clearUrl();
  show("home");
}

$("backDraw").onclick    = askExit;
$("backRecall").onclick  = askExit;
$("confirmStay").onclick = cancelExit;
$("confirmLeave").onclick = confirmExit;
$("confirm").onclick = function(e){ if (e.target === $("confirm")) cancelExit(); };

window.addEventListener("resize", function(){
  if ($("draw").classList.contains("on")){
    const keep = strokes;
    padSize = 0; sizePad(); strokes = keep; paintPad();
  }
  const cvs = document.querySelectorAll(".grid canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
});

/* ----------------------------------------------------------- recall screen --- */

function paintCell(cv){
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  paintStrokes(ctx, drawings[Number(cv.dataset.di)] || [], size, Math.max(1.5, size * 0.028));
}

function paintAll(gridId){
  const cvs = $(gridId).querySelectorAll("canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
}

// If the grid is built before layout exists (a background tab, width 0) the
// drawings paint at the wrong size and never repaint. Repaint once a cell has one.
const gridRO = typeof ResizeObserver !== "undefined"
  ? new ResizeObserver(function(girisler){
      for (let i = 0; i < girisler.length; i++) paintCell(girisler[i].target);
    })
  : null;

function resetGridObserver(){ if (gridRO) gridRO.disconnect(); }

function makeCell(pos, di){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.pos = pos;
  const box = document.createElement("div");
  box.className = "box";
  const cv = document.createElement("canvas");
  cv.dataset.di = di;
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = pos + 1;      // grid order is shuffled, so the number gives nothing away
  box.appendChild(cv);
  box.appendChild(num);
  if (gridRO) gridRO.observe(cv);
  const cap = document.createElement("div");
  cap.className = "cap";
  cell.appendChild(box); cell.appendChild(cap);
  return cell;
}

function buildRecall(){
  const g = $("recallGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    cell.onclick = function(){ onCellTap(pos); };
    g.appendChild(cell);
  });
  $("recallLevel").textContent = roundLabel();
  $("recallTitle").textContent = role === "guesser"
    ? (drawerName ? TEXT.whatDidDraw.replace("{name}", drawerName) : TEXT.whatWasDrawn)
    : TEXT.whichWasWhich;
  $("recallHint").textContent = modeId === "typed"
    ? TEXT.hintTyped
    : TEXT.hintPool;
  closeSheet(); closeModal();
  if (!recallStart){
    recallStart = Date.now();
    if (lastCode) rememberRound(lastCode, { startedAt: recallStart });
  }
  ensureCode();
  refreshRecall();
  show("recall");
  paintAll("recallGrid");
}

function onCellTap(pos){
  if (modeId === "typed"){ selPos = pos; openModal(pos); refreshRecall(); return; }
  if (picks[pos]){                       // tapping an assigned cell releases the word
    picks[pos] = null; selPos = -1; closeSheet(); refreshRecall(); return;
  }
  selPos = pos;
  openSheet(pos);
  refreshRecall();
}

// Wall clock from the grid appearing to the finish button. Kept with the round so
// a reload carries on the same clock instead of restarting it.
function elapsedMs(){
  if (recallMs) return recallMs;
  return recallStart ? Math.max(0, Date.now() - recallStart) : 0;
}

function timeLabel(ms){
  if (!ms) return "\u2013";
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + " sn";
  const m = Math.floor(s / 60);
  return m + ":" + String(Math.round(s - m * 60)).padStart(2, "0");
}

function answeredCount(){
  return picks.filter(function(p){ return p && String(p).trim(); }).length;
}

function refreshRecall(){
  const g = $("recallGrid");
  order.forEach(function(di, pos){
    const cell = g.children[pos];
    if (!cell) return;
    const dolu = !!(picks[pos] && String(picks[pos]).trim());
    cell.classList.toggle("sel", pos === selPos);
    cell.classList.toggle("done", dolu);
    const cap = cell.querySelector(".cap");
    cap.innerHTML = "";
    if (dolu){
      const s = document.createElement("span");
      s.className = "pick";
      s.textContent = picks[pos];
      cap.appendChild(s);
    }
  });
  const n = answeredCount();
  $("assigned").textContent = n + " / " + N;
  // any mode can be finished early; anything left blank counts as wrong
  $("finish").disabled = false;
  // Keep the answers on the device: a reload should come back to this grid with
  // the work still in it. The order goes with them -- see loadGame.
  if (lastCode) rememberRound(lastCode, { order: order, picks: picks });
}

/* kelime havuzu */
function openSheet(pos){
  const used = {};
  picks.forEach(function(w){ if (w) used[w] = true; });
  const pool = words.filter(function(w){ return !used[w]; })
                    .sort(function(a, b){ return a.localeCompare(b, "tr"); });
  $("sheetTitle").textContent = "Bu ne?";
  const box = $("chips");
  box.innerHTML = "";
  pool.forEach(function(w){
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = w;
    b.onclick = function(){ picks[pos] = w; selPos = -1; closeSheet(); refreshRecall(); };
    box.appendChild(b);
  });
  const sc = $("recallGrid").parentElement;
  if (sc && sheetScroll < 0) sheetScroll = sc.scrollTop;   // where to come back to
  paintPreview($("sheetPrev"), order[pos]);   // the cell is too small to judge from
  $("sheetScrim").hidden = false;
  $("sheet").classList.add("on");
  $("recallGrid").style.paddingBottom = ($("sheet").offsetHeight + 20) + "px";
}

// The pool is position:fixed, so the grid takes on bottom padding to keep its last
// rows reachable above it. That padding is scrollable space which exists only while
// the pool is open: dropping it shrinks the scroll range, the browser clamps
// scrollTop, and the whole grid slides under the player, who reads it as the
// drawings having swapped places. How far it slides depends on the screen, which is
// why it looked different on every device. Nothing can hold a position inside space
// that no longer exists, so instead the offset from before the pool opened is put
// back -- it was reached with the padding collapsed, so it is always reachable again.
let sheetScroll = -1;

function closeSheet(){
  const g = $("recallGrid");
  const sc = g.parentElement;
  $("sheetScrim").hidden = true;
  $("sheet").classList.remove("on");
  g.style.paddingBottom = "14px";
  if (sc && sheetScroll >= 0) sc.scrollTop = sheetScroll;
  sheetScroll = -1;
}

$("sheetX").onclick = function(){ selPos = -1; closeSheet(); refreshRecall(); };

/* Reaching the little cross in the corner one-handed is a stretch on a phone, so
   both panels also close by dragging them down or tapping away from them. */
function enableSwipeDown(el, close, holdsOwnGesture){
  let startY = 0, dragging = false;

  el.addEventListener("pointerdown", function(e){
    if (holdsOwnGesture && holdsOwnGesture(e.target)) return;   // scrolling or typing
    dragging = true;
    startY = e.clientY;
    el.style.transition = "none";
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });

  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    const dy = e.clientY - startY;
    if (dy > 0) el.style.transform = "translateY(" + dy + "px)";   // downward only
  });

  const release = function(e){
    if (!dragging) return;
    dragging = false;
    const dy = e.clientY - startY;
    el.style.transition = "";
    el.style.transform = "";
    if (dy > 60) close();
  };
  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

function dismissSheet(){ selPos = -1; closeSheet(); refreshRecall(); }

$("sheetScrim").onclick = dismissSheet;
enableSwipeDown($("sheet"), dismissSheet, function(t){
  return !!(t.closest && t.closest("#chips"));      // the word list scrolls on its own
});
enableSwipeDown($("modalCard"), function(){ selPos = -1; closeModal(); refreshRecall(); }, function(t){
  return !!(t.closest && t.closest("input, button, textarea"));
});

/* typed answer */
function openModal(pos){
  paintPreview($("modalPrev"), order[pos]);
  const inp = $("modalInput");
  inp.value = picks[pos] || "";
  $("modal").classList.add("on");
  modalYerlestir();
  // Focus must happen synchronously inside the tap handler for the keyboard to
  // open: setTimeout breaks the user-gesture chain and iOS ignores it.
  inp.focus();
  inp.select();
  setTimeout(modalYerlestir, 60);
}

function closeModal(){

  $("modal").style.top = "";
}

// Every enlarged view of a drawing goes through here. The canvas keeps its fixed
// backing size and CSS scales it, so the strokes stay smooth however big it gets.
function paintPreview(cv, di){
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  paintStrokes(ctx, drawings[di] || [], cv.width, Math.max(3, cv.width * 0.025));
}

function buildResult(){
  if (!recallMs) recallMs = elapsedMs();      // stop the clock before anything is drawn
  score = 0;
  order.forEach(function(di, pos){ if (isCorrect(picks[pos], words[di])) score++; });

  $("score").textContent = role === "guesser"
    ? ((drawerName ? TEXT.inDrawingsOf.replace("{name}", drawerName) : TEXT.inTheseDrawings) + score + "/" + N)
    : TEXT.outOf.replace("{n}", N).replace("{score}", score);
  $("scoreSub").textContent = roundLabel() + " \u00b7 " + TEXT.totalTime + " " + timeLabel(elapsedMs());
  $("copyNote").textContent = "";
  $("fallback").style.display = "none";

  const g = $("resultGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    const ok = isCorrect(picks[pos], words[di]);
    cell.classList.add(ok ? "right" : "wrong");
    const cap = cell.querySelector(".cap");
    if (ok){
      const s = document.createElement("span");
      s.className = "good";
      s.textContent = words[di];
      cap.appendChild(s);
    } else {
      const bad = document.createElement("span");
      bad.className = "bad";
      bad.textContent = (picks[pos] && String(picks[pos]).trim()) ? picks[pos] : "—";
      const good = document.createElement("span");
      good.className = "good";
      good.textContent = words[di];
      cap.appendChild(bad);
      cap.appendChild(document.createElement("br"));
      cap.appendChild(good);
    }
    cell.classList.add("tappable");
    cell.onclick = function(){ openZoom(pos); };
    g.appendChild(cell);
  });

  $("again").textContent = role === "guesser" ? TEXT.youDrawToo : TEXT.playAgain;
  // Guessing your own drawings first used to be a dead end: there was no way to
  // hand the round to anyone afterwards. Only the person who drew it can.
  $("inviteFriends").hidden = role === "guesser";   // only the person who drew it can hand it on
  // Record the finish before the board goes up: opening this code again on this
  // device should land here, on the score table, rather than on an empty grid.
  if (lastCode) rememberRound(lastCode, { done: true, score: score, ms: recallMs, order: order, picks: picks, name: myName });
  showBoard();
  show("result");
  paintAll("resultGrid");
}

/* ------------------------------------------------------- score tablosu --- */

function sameName(a, b){
  return norm(a) === norm(b);          // same rule as the server's name key
}

function showBoard(){
  $("board").hidden = !lastCode;              // the board only exists for shared rounds
  if (!lastCode) return;
  $("boardTitle").textContent = boardHeading();
  // A score needs a name to sit under. Without one the board is still readable,
  // it just has no row for this player until they add one.
  $("boardNameRow").hidden = !!myName;
  beepScores();
  if (myName && !scoreSent){ scoreSent = true; sendScore(); }
  renderScores();
  fetchScores();
  startBoardPoll();
}

// Winner first: best score, and on a tie whoever got there quickest. Rows written
// before times were recorded have no ms and fall in behind the timed ones.
function rankScores(list){
  return list.slice().sort(function(a, b){
    if (b.score !== a.score) return b.score - a.score;
    const am = a.ms > 0 ? a.ms : Infinity, bm = b.ms > 0 ? b.ms : Infinity;
    if (am !== bm) return am - bm;
    return (a.ts || 0) - (b.ts || 0);
  });
}

function renderScores(){
  const liste = rankScores(scores);
  // Always show your own row: KV listing is eventually consistent, so a score
  // just written may not be in the list yet.
  if (myName && !liste.some(function(s){ return sameName(s.name, myName); })){
    liste.push({ name: myName, score: score, ms: elapsedMs() });
  }
  const sirali = rankScores(liste);

  const kutular = [$("boardList"), $("scoresList")];
  kutular.forEach(function(box){
    if (!box) return;
    box.innerHTML = "";
    sirali.forEach(function(s, i){
      const row = document.createElement("div");
      row.className = "brow" + (myName && sameName(s.name, myName) ? " me" : "");
      const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = s.name;
      const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = s.ms > 0 ? timeLabel(s.ms) : "";
      const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = s.score + "/" + N;
      row.appendChild(rk); row.appendChild(nm); row.appendChild(tm); row.appendChild(sc);
      box.appendChild(row);
    });
  });
  const bos = sirali.length === 0;
  if ($("boardEmpty"))  $("boardEmpty").hidden  = !bos;
  if ($("scoresEmpty")) $("scoresEmpty").hidden = !bos;
}

function fetchScores(){
  if (!lastCode) return;
  api("/api/scores/" + encodeURIComponent(lastCode)).then(function(r){
    if (r.ok && r.data && Array.isArray(r.data.scores)){ scores = r.data.scores; renderScores(); }
  }).catch(function(){ /* if the board fails, your own row still shows */ });
}

/* Refresh as friends finish. A read is a single get on the server side, so
   this poll is cheap. */
// A read is a single KV get, and the free tier allows 100,000 a day, so a board
// being watched for ten minutes costs about 240 of them. Six seconds was slow
// enough that a friend finishing felt like nothing had happened.
const POLL_MS = 2000;
let boardTimer = null;

function startBoardPoll(){
  stopBoardPoll();
  if (!lastCode) return;
  boardTimer = setInterval(function(){
    const visible = $("result").classList.contains("on") || $("scores").classList.contains("on");
    if (!visible){ stopBoardPoll(); return; }   // stop once the screen is left
    if (document.hidden) return;               // do not fetch while backgrounded
    fetchScores();
  }, POLL_MS);
}

function stopBoardPoll(){
  if (boardTimer){ clearInterval(boardTimer); boardTimer = null; }
}

// Coming back from another app should refresh at once, not wait for the next tick.
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && boardTimer) fetchScores();
});

/* the drawer watching the scores on their own link */
function openScoresScreen(){
  $("scoresTitle").textContent = boardHeading();
  renderScores();
  fetchScores();
  show("scores");
  startBoardPoll();
}

$("toScores").onclick  = openScoresScreen;
$("scoresBack").onclick = function(){ stopBoardPoll(); show("send"); };

function sendScore(){
  if (!lastCode || !myName) return;
  renderScores();                                 // show your own row without waiting
  api("/api/scores/" + encodeURIComponent(lastCode), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: myName, score: score, ms: elapsedMs() })
  }).then(function(r){
    rememberRound(lastCode, { sent: true });      // do not post it again on a revisit
    if (r.ok && r.data && Array.isArray(r.data.scores)){ scores = r.data.scores; renderScores(); }
  }).catch(function(){ /* already shown locally, fail quietly */ });
}

/* ---------------------------------------------------------- name sorma --- */

// Nothing is asked before a round any more: you press start and draw. A name is
// only needed to put your round in someone else's hands, or your score on a
// board, so it is asked at exactly those two points.
function setName(raw){
  const name = String(raw || "").trim().slice(0, NAME_MAX);
  if (!name) return "";
  myName = name;
  rememberName(name);
  return name;
}

function shareText(){
  let rows = "";
  order.forEach(function(di, pos){
    rows += (isCorrect(picks[pos], words[di]) ? "🟩" : "🟥");
    // The grid is 4 across and 5 down on a phone, so the shared squares match it:
    // a 5-wide block was not the shape the player had been looking at.
    if (pos % 4 === 3 && pos !== N - 1) rows += "\n";
  });
  // The set is never named in the share text, so it cannot leak which words came up.
  // Whose drawings these are: the other player's when guessing, your own otherwise.
  // Guessing your own round used to fall through to the bare title, so sharing it
  // said nothing about who drew it.
  const who = role === "guesser" ? drawerName : myName;
  const head = who
    ? "Chizz 🎨 " + TEXT.drawingsOf.replace("{name}", who)
    : "Chizz 🎨";
  let out = head + "\n" + roundLabel() + "\n" + score + "/" + N
          + " \u00b7 " + timeLabel(elapsedMs()) + "\n\n" + rows;
  // Anyone reading the score can play the same round straight from the message.
  if (lastCode) out += "\n\n" + inviteText();
  return out;
}

// The one place the invite is worded, so every screen that offers it says the same
// thing and carries the same link.
function inviteText(){
  return TEXT.guessTooInvite + "\n" + gameLink(lastCode);
}

function copyText(t){
  return new Promise(function(resolve){
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(t).then(
        function(){ resolve(true); },
        function(){ resolve(legacyCopy(t)); }
      );
      return;
    }
    resolve(legacyCopy(t));
  });
}

function legacyCopy(t){
  try {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    ta.setAttribute("readonly", "readonly");
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(err){ return false; }
}

/* ------------------------------------------------------------------ duel --- */

// round to 0-255 integers and drop consecutive points closer than 2 units
function encodeDrawings(list){
  return list.map(function(strokeList){
    const out = [];
    (strokeList || []).forEach(function(st){
      if (!st || !st.length) return;
      const pts = [];
      let last = null;
      for (let i = 0; i < st.length; i++){
        const x = Math.round(Math.min(1, Math.max(0, st[i].x)) * 255);
        const y = Math.round(Math.min(1, Math.max(0, st[i].y)) * 255);
        if (last){
          const dx = x - last[0], dy = y - last[1];
          if (dx * dx + dy * dy < 4){ continue; }
        }
        pts.push([x, y]); last = [x, y];
      }
      // keep the last point so the stroke end survives
      const sonX = Math.round(Math.min(1, Math.max(0, st[st.length - 1].x)) * 255);
      const sonY = Math.round(Math.min(1, Math.max(0, st[st.length - 1].y)) * 255);
      if (!pts.length || pts[pts.length - 1][0] !== sonX || pts[pts.length - 1][1] !== sonY){
        pts.push([sonX, sonY]);
      }
      out.push(pts);
    });
    return out;
  });
}

function decodeDrawings(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(function(strokeList){
    if (!Array.isArray(strokeList)) return [];
    return strokeList.map(function(st){
      if (!Array.isArray(st)) return [];
      return st.map(function(p){
        return { x: (Number(p[0]) || 0) / 255, y: (Number(p[1]) || 0) / 255 };
      });
    }).filter(function(st){ return st.length; });
  });
}

function api(yol, opts){
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 12000);
  const o = opts || {};
  if (ctrl) o.signal = ctrl.signal;
  return fetch(yol, o).then(function(r){
    clearTimeout(t);
    return r.json().catch(function(){ return {}; }).then(function(j){
      return { ok: r.ok, status: r.status, data: j };
    });
  }, function(e){ clearTimeout(t); throw e; });
}

// One place that posts a round, so the share screen and the automatic save on the
// way into guessing cannot drift apart.
function postRound(name){
  return api("/api/save", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      setId: setId,
      mode: modeId,
      seconds: secs,
      name: name || "",
      words: words,
      drawings: encodeDrawings(drawings)
    })
  }).then(function(r){
    if (!r.ok || !r.data || !r.data.code) throw new Error("save failed");
    lastCode = r.data.code;
    if (name) drawerName = name;
    rememberRound(lastCode, { mine: true, order: order, picks: picks });
    setUrlCode(lastCode);
    return lastCode;
  });
}

/* People want to play the same round side by side, so the round is saved as soon
   as its own guessing begins rather than only when the share screen is opened.
   The code then exists for the corner chip, and for the invite line in the share
   text, without the player having to do anything first. */
function ensureCode(){
  if (lastCode || role === "guesser") return;
  if (!drawings.some(function(d){ return d && d.length; })) return;   // nothing worth sharing
  postRound(myName).then(updateCodeChip).catch(function(){
    /* offline, or the save failed: the chip stays hidden and the share screen can
       still try again later. Nothing is lost, the drawings are in memory. */
  });
}

// A round saved before a name existed gets the name attached once there is one.
function claimRoundName(){
  if (!lastCode || !myName || role === "guesser" || drawerName) return;
  drawerName = myName;
  api("/api/game/" + encodeURIComponent(lastCode), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: myName })
  }).catch(function(){});
}

$("sendGo").onclick = function(){
  // The button stays tappable while it is dimmed, so it can say what is missing
  // rather than silently doing nothing.
  if (!sendNameReady()){
    $("sendErr").textContent = TEXT.enterName;
    $("sendName").focus();
    return;
  }
  const name = setName($("sendName").value);
  sendShow("busy");

  // Guessing first already saved the round, so there is a code to keep rather than
  // a second copy to make: name that one instead of saving the drawings twice.
  const done = lastCode
    ? Promise.resolve(claimRoundName()).then(function(){ return lastCode; })
    : postRound(name);

  done.then(function(){
    drawerName = name;
    $("code").textContent = lastCode;
    $("link").textContent = gameLink(lastCode);
    updateCodeChip();
    sendShow("done");
  }).catch(function(){
    // the drawings are still in memory, nothing lost
    $("sendErr").textContent = TEXT.sendFailed;
    sendShow("form");
  });
};

// A link sent to a friend must always point at the public address. One generated
// while playing on localhost, or from a file:// copy, will not open for them.
// When the domain changes, this is the ONLY line to edit.
const PUBLIC_BASE_URL = "https://chizz.party";

function gameLink(code){
  // Local, file:// and the old pages.dev address must not be used as the link
  // base: the first two never open for the recipient, and pages.dev is filtered
  // by some networks. Fall back to the canonical address in all three cases.
  const nonCanonical = location.protocol === "file:" ||
                       !location.hostname ||
                       /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?)$/i.test(location.hostname) ||
                       /\.pages\.dev$/i.test(location.hostname);
  const base = nonCanonical
    ? PUBLIC_BASE_URL
    : location.origin + location.pathname.replace(/index\.html$/i, "");
  return base.replace(/\/+$/, "") + "/?o=" + code;
}

$("linkCopy").onclick = function(){

function loadGame(code){
  code = String(code || "").toUpperCase();
  show("loading");
  $("loadTitle").textContent = TEXT.loadingDrawings;
  $("loadMsg").textContent = "";
  $("loadHome").hidden = true;

  api("/api/game/" + encodeURIComponent(code)).then(function(r){
    if (r.status === 404) throw new Error("notfound");
    if (!r.ok) throw new Error("error");
    const v = r.data || {};
    const loadedWords = v.words, loadedDrawings = decodeDrawings(v.drawings);
    if (!Array.isArray(loadedWords) || loadedWords.length !== N || loadedDrawings.length !== N) throw new Error("malformed");

    setId    = v.setId && SETS.some(function(s){ return s.id === v.setId; }) ? v.setId : SETS[0].id;
    // Accept both shapes: rounds shared before modes existed only have a difficulty.
    const legacy = LEGACY_DIFFS[v.difficulty];
    modeId = MODES.some(function(m){ return m.id === v.mode; }) ? v.mode
           : (legacy ? legacy.mode : "pool");
    secs   = v.seconds !== undefined ? clampSecs(v.seconds)
           : (legacy ? legacy.seconds : SECS_DEFAULT);
    lastCode   = code;
    scores  = [];
    drawerName  = typeof v.name === "string" ? v.name.slice(0, NAME_MAX) : "";
    words    = loadedWords;
    drawings = loadedDrawings;
    selPos   = -1;

    // Has this device been here before? The grid order has to be restored with
    // the answers: it is reshuffled on every visit, so putting old picks against
    // a fresh order would pin every answer to the wrong drawing.
    const rec = savedRound(code);
    const resumable = !!(rec && Array.isArray(rec.order) && rec.order.length === N);
    role      = rec && rec.mine ? "drawer" : "guesser";
    scoreSent = !!(rec && rec.sent);
    order     = resumable ? rec.order.slice()
                          : shuffle(words.map(function(_, i){ return i; }));
    picks     = resumable && Array.isArray(rec.picks) && rec.picks.length === N
                  ? rec.picks.slice()
                  : new Array(N).fill(null);
    recallStart = rec && rec.startedAt ? rec.startedAt : 0;
    recallMs  = rec && rec.done && rec.ms ? rec.ms : 0;
    if (!resumable) rememberRound(code, { order: order });
    buildHome();
    setUrlCode(code);                 // reloading returns here, including after a join by code

    if (rec && rec.done){             // already played on this device: straight to the scores
      buildResult();
      return;
    }
    if (rec && rec.mine){             // this device drew the round: back to the share screen
      $("code").textContent = code;
      $("link").textContent = gameLink(code);
      sendShow("done");
      show("send");
      return;
    }
    buildRecall();                    // straight into guessing; the name comes later
  }).catch(function(e){
    $("loadTitle").textContent = e && e.message === "notfound"
      ? TEXT.codeInvalid
      : TEXT.fetchFailed;
    $("loadMsg").textContent = e && e.message === "notfound" ? "" : TEXT.checkConnection;
    $("loadHome").hidden = false;
  });
}

/* iOS stopped honouring user-scalable=no years ago, so the meta tag alone leaves
   double-tap zoom working. Worse, once it has zoomed there is no way back out,
   because the same tag blocks pinching out again. Three things are needed:
   touch-action:manipulation in the CSS, refusing Safari's own pinch gestures, and
   swallowing the second tap of a double-tap before it counts as one. */
["gesturestart", "gesturechange", "gestureend"].forEach(function(type){
  document.addEventListener(type, function(e){ e.preventDefault(); }, { passive: false });
});

let lastTapAt = 0, lastTapX = 0, lastTapY = 0;
document.addEventListener("touchend", function(e){
  const t = e.changedTouches && e.changedTouches[0];
  const now = Date.now();
  const x = t ? t.clientX : 0, y = t ? t.clientY : 0;
  // Time and place both, so tapping a cell and then a chip in quick succession is
  // still two taps, while tapping the same spot twice is the zoom gesture and dies.
  if (now - lastTapAt <= 350 && Math.abs(x - lastTapX) < 30 && Math.abs(y - lastTapY) < 30){
    e.preventDefault();
  }
  lastTapAt = now; lastTapX = x; lastTapY = y;
}, { passive: false });

// A second finger anywhere but the pad is a pinch, never a drawing gesture.
document.addEventListener("touchmove", function(e){
  if (e.touches.length > 1 && e.target !== pad) e.preventDefault();
}, { passive: false });

// Safari also zooms when a form field is focused and the font is under 16px.
document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive: false });

myName = savedName();             // the device already knows who is playing
loadSettings();
applyTheme();
applyText();
buildHome();

// did we arrive through a duel link?
(function(){
  const m = /[?&]o=([^&]+)/.exec(location.search || "");
  if (m) loadGame(decodeURIComponent(m[1]));
})();
})();
</script>
