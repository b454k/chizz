/* -------------------------------------------------------------- game flow --- */

let cdTimer = null;

function startGame(){
  shelvePending();
  setId = "mix";
  isDaily = false; dailyDay = 0; afterDraw = "";

  role      = "solo";
  drawerName  = "";
  lastCode   = "";
  recallStart = 0;
  recallMs  = 0;
  scores  = [];
  scoreSent = false;
  words    = shuffle(freshWords());
  rememberSeen(words);
  drawings = words.map(function(){ return []; });
  order    = shuffle(words.map(function(_, i){ return i; }));
  picks    = new Array(N).fill(null);
  selPos   = -1;
  closeSheet(); closeModal();

  beginRound();
}

/* The day's puzzle. Everyone gets the same twenty words and the same settings, so
   a score posted to the day board means the same thing for everybody. The settings
   panel is deliberately ignored here. */
function startDaily(){
  shelvePending();
  dailyDay = dailyDayNumber();
  isDaily  = true;
  modeId   = "typed";
  secs     = 3;
  setId    = null;

  role      = "solo";
  drawerName  = "";
  lastCode   = "";
  recallStart = 0;
  recallMs  = 0;
  scores  = [];
  scoreSent = false;
  words    = dailyWords(dailyDay);
  rememberSeen(words, true);
  drawings = words.map(function(){ return []; });
  order    = shuffle(words.map(function(_, i){ return i; }));
  picks    = new Array(N).fill(null);
  selPos   = -1;
  closeSheet(); closeModal();

  beginRound();
}

function beginRound(){
  show("countdown");
  const num = $("cdNum");
  const startAt = performance.now();

  // The tones go on the clock as soon as the context is awake; both they and the
  // numbers are pinned to startAt, so they cannot slide apart.
  wakeAudio().then(function(){ countdownBeeps(startAt); });

  const step = function(k){
    num.textContent = String(3 - k);
    num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
    // Each wait is measured back to startAt rather than being a flat 1000, so a
    // late callback does not push everything after it later still.
    const nextAt = startAt + (k + 1) * 1000;
    const wait = Math.max(0, nextAt - performance.now());
    cdTimer = setTimeout(k < 2 ? function(){ step(k + 1); } : startDrawPhase, wait);
  };
  step(0);
}

/* ----------------------------------------------------------- drawing phase --- */

const pad = $("pad");
const pctx = pad.getContext("2d");

let padSize = 0;
let strokes = [];
// One stroke per pointer, keyed by pointerId. A single shared "current stroke"
// made a second finger carry on the first one, so two hands drew a line joining
// them instead of two separate lines. Any number of pointers now draw at once.
const live = new Map();
let idx = 0;
let wordStart = 0;
let raf = 0;

function sizePad(){
  const stage = $("stage");
  const size = Math.max(160, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)));
  if (size === padSize) return;
  padSize = size;
  const dpr = window.devicePixelRatio || 1;
  pad.style.width  = size + "px";
  pad.style.height = size + "px";
  pad.width  = Math.round(size * dpr);
  pad.height = Math.round(size * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintPad();
}

function penWidth(){ return Math.max(3, padSize * 0.011); }

function paintPad(){
  pctx.clearRect(0, 0, padSize, padSize);
  paintStrokes(pctx, strokes, padSize, penWidth());
}

function paintStrokes(ctx, list, size, lw){
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = PEN;
  ctx.fillStyle = PEN;
  for (let k = 0; k < list.length; k++){
    const s = list[k];
    if (!s || !s.length) continue;
    if (s.length === 1){
      ctx.beginPath();
      ctx.arc(s[0].x * size, s[0].y * size, lw / 2, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(s[0].x * size, s[0].y * size);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x * size, s[i].y * size);
    ctx.stroke();
  }
}

function padPoint(e){
  const r = pad.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top)  / r.height;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}

pad.addEventListener("pointerdown", function(e){
  if (!$("draw").classList.contains("on")) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch(err){}
  const stroke = [padPoint(e)];
  live.set(e.pointerId, stroke);
  strokes.push(stroke);
  paintPad();
});

pad.addEventListener("pointermove", function(e){
  const stroke = live.get(e.pointerId);
  if (!stroke) return;
  e.preventDefault();
  // getCoalescedEvents sometimes returns an empty array; fall back to the event
  let evts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evts || !evts.length) evts = [e];
  const lw = penWidth();
  pctx.lineWidth = lw; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = PEN;
  for (let i = 0; i < evts.length; i++){
    const p = padPoint(evts[i]);
    const prev = stroke[stroke.length - 1];
    if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.0015) continue;
    pctx.beginPath();
    pctx.moveTo(prev.x * padSize, prev.y * padSize);
    pctx.lineTo(p.x * padSize, p.y * padSize);
    pctx.stroke();
    stroke.push(p);
  }
});

function endStroke(e){
  if (!e){ live.clear(); return; }        // called with nothing = drop every pointer
  if (!live.has(e.pointerId)) return;     // a finger that was never drawing
  e.preventDefault();
  live.delete(e.pointerId);
}
pad.addEventListener("pointerup", endStroke);
pad.addEventListener("pointercancel", endStroke);
pad.addEventListener("pointerleave", endStroke);

function startDrawPhase(){
  show("draw");
  padSize = 0;
  sizePad();            // layout is ready after show(), so measure synchronously
  startWord(0);
}

/* The word used to appear at the top of a blank page with the clock already running,
   which on a phone is easy to start drawing over before reading it. It now arrives in
   the middle of the page, big, and flies up into the header -- ending exactly where and
   how the word will sit while you draw, so the two read as one thing rather than a
   title card followed by a page. The pen is dead until it lands. */
const REVEAL_HOLD = 700;    // the word alone in the middle of the page
const REVEAL_FADE = 300;    // and fading out as the pen wakes
let revealing = false;
let revealPending = false;
let revealTimer = 0;

/* The biggest size at which the word still fits the square, found by halving rather
   than guessed: one number cannot suit both "ev" and "çamaşır makinesi". */
const REVEAL_EDGE = 40;    // the gap left on either side, the same on both
const REVEAL_MIN  = 20;
const REVEAL_MAX  = 76;    // a short word at 96 was pressing against the square

function fitWord(el, boxW, boxH){
  let lo = REVEAL_MIN, hi = REVEAL_MAX, best = REVEAL_MIN;
  el.style.width = boxW + "px";
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + "px";
    if (el.scrollWidth <= boxW && el.scrollHeight <= boxH){ best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  el.style.fontSize = best + "px";
}

/* How far the letters sit below the middle of their own line box, in pixels.
   Above the letters is the font's full ascender; below them only the descender, which a
   word like "domuz" never reaches. Centring the box therefore leaves more room above
   than below. The canvas reports both the font's box and the ink's, so the difference
   can be measured for the actual word rather than guessed at. */
function inkNudge(el, text){
  try {
    const cv = inkNudge.cv || (inkNudge.cv = document.createElement("canvas"));
    const c = cv.getContext("2d");
    const cs = getComputedStyle(el);
    c.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    const m = c.measureText(text);
    const fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent;
    const ia = m.actualBoundingBoxAscent, id = m.actualBoundingBoxDescent;
    if (![fa, fd, ia, id].every(function(v){ return typeof v === "number" && isFinite(v); })) return 0;
    return ((fa - ia) - (fd - id)) / 2;
  } catch (e) { return 0; }        // older browsers: leave it where it is
}

function revealThenDraw(i){
  revealing = true;
  const el = $("revealWord");
  const rv = $("reveal");
  el.textContent = words[i];
  el.style.transition = "none";
  el.style.opacity = "1";
  rv.classList.add("on");

  // Over the square itself, so the word is centred on the paper it is about to be
  // drawn on, with the same air on all four sides of it.
  const pad = $("pad").getBoundingClientRect();
  rv.style.left = Math.round(pad.left) + "px";
  rv.style.top = Math.round(pad.top) + "px";
  rv.style.width = Math.round(pad.width) + "px";
  rv.style.height = Math.round(pad.height) + "px";
  fitWord(el, Math.round(pad.width) - REVEAL_EDGE * 2, Math.round(pad.height) - REVEAL_EDGE * 2);
  // Equal air above and below the letters themselves.
  el.style.transform = "translateY(" + (-Math.round(inkNudge(el, words[i]))) + "px)";

  void el.offsetWidth;                     // let that state land before the fade

  clearTimeout(revealTimer);
  revealTimer = setTimeout(function(){
    /* The word's own time starts as it begins to fade, so the second spent reading it
       is not taken out of the drawing. The pen has been live throughout, and the word in
       the header never left, so nothing is lost when this one goes. */
    revealing = false;
    wordStart = performance.now();
    raf = requestAnimationFrame(tick);

    el.style.transition = "opacity " + REVEAL_FADE + "ms linear";
    el.style.opacity = "0";
    revealTimer = setTimeout(function(){
      rv.classList.remove("on");
    }, REVEAL_FADE);
  }, REVEAL_HOLD);
}

function clearReveal(){
  clearTimeout(revealTimer);
  revealing = false;
  revealPending = false;
  $("reveal").classList.remove("on");
  const el = $("revealWord");
  el.style.transition = "none";
  el.style.opacity = "1";
  el.style.transform = "none";
}

function startWord(i){
  idx = i;
  strokes = [];
  live.clear();
  paintPad();
  $("drawLevel").textContent = roundLabel();
  $("word").textContent = words[i];
  $("counter").textContent = (i + 1) + " / " + N;
  $("bar").style.transform = "scaleX(1)";
  revealThenDraw(i);
}

function tick(){
  const ms = roundMs();
  const el = performance.now() - wordStart;
  $("bar").style.transform = "scaleX(" + Math.max(0, 1 - el / ms) + ")";
  if (el >= ms){ nextWord(); return; }
  raf = requestAnimationFrame(tick);
}

function nextWord(){
  cancelAnimationFrame(raf);
  live.clear();
  drawings[idx] = strokes.filter(function(s){ return s && s.length; });   // empty drawing = []
  if (idx + 1 < N){ startWord(idx + 1); return; }

  if (isDaily){
    // Keep the drawings: the player may go and guess their friend's round first
    // and come back to their own, possibly after a reload.
    rememberDay(dailyDay, { drawn: true, words: words, drawings: encodeDrawings(drawings) });
  } else {
    rememberPending();
  }
  if (afterDraw === "pick"){ afterDraw = ""; showPick(); }
  else show("between");
  // The first round drawn on a device is where a name is asked for, over whatever
  // screen comes next. Once there is one it is never asked again.
  if (!myName) askName();
}

// rAF stops while the tab is in the background. Push wordStart forward by the
// hidden duration so the player does not lose the rest of the word.
let hiddenAt = 0;
document.addEventListener("visibilitychange", function(){
  if (pausedAt) return;              // already paused by the leave confirmation
  if (document.hidden) hiddenAt = performance.now();
  else if (hiddenAt){ wordStart += performance.now() - hiddenAt; hiddenAt = 0; }
});

/* --------------------------------------------------- leave confirmation --- */

let pausedAt = 0;

function pauseTimer(){
  if (!$("draw").classList.contains("on") || pausedAt) return;
  cancelAnimationFrame(raf);
  pausedAt = performance.now();          // freeze the timer while the dialog is open
  // Asked to leave while the word is still up: hold the reveal too, or the drawing
  // time would run out behind the dialog.
  if (revealing){ clearTimeout(revealTimer); revealPending = true; }
}

function resumeTimer(){
  // do nothing unless we actually paused, or a second rAF loop starts and time runs twice as fast
  if (!pausedAt || !$("draw").classList.contains("on")) return;
  if (revealPending){                    // paused before the word had been shown
    revealPending = false;
    pausedAt = 0;
    revealThenDraw(idx);
    return;
  }
  wordStart += performance.now() - pausedAt;
  pausedAt = 0;
  raf = requestAnimationFrame(tick);
}

function askExit(){
  pauseTimer();
  $("confirm").classList.add("on");
}

function cancelExit(){
  $("confirm").classList.remove("on");
  resumeTimer();
}

function confirmExit(){
  $("confirm").classList.remove("on");
  cancelAnimationFrame(raf);
  clearTimeout(cdTimer);
  clearReveal();
  pausedAt = 0;
  live.clear();
  closeSheet(); closeModal(); closeZoom();
  shelvePending();
  // The round's own entry goes with it: back from wherever this lands must not lead into
  // a round that no longer exists.
  if (history.state && history.state.screen === "draw" && history.state.depth > 0){
    leavingRound = true;
    history.back();
  } else {
    show("home");
  }
}

$("backDraw").onclick    = askExit;
$("backRecall").onclick  = askExit;
$("confirmStay").onclick = cancelExit;
$("confirmLeave").onclick = confirmExit;
$("confirm").onclick = function(e){ if (e.target === $("confirm")) cancelExit(); };

window.addEventListener("resize", function(){
  if ($("draw").classList.contains("on")){
    const keep = strokes;
    padSize = 0; sizePad(); strokes = keep; paintPad();
  }
  const cvs = document.querySelectorAll(".grid canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
});

/* ----------------------------------------------------------- recall screen --- */

function paintCell(cv){
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  paintStrokes(ctx, drawings[Number(cv.dataset.di)] || [], size, Math.max(1.5, size * 0.028));
}

function paintAll(gridId){
  const cvs = $(gridId).querySelectorAll("canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
}

// If the grid is built before layout exists (a background tab, width 0) the
// drawings paint at the wrong size and never repaint. Repaint once a cell has one.
const gridRO = typeof ResizeObserver !== "undefined"
  ? new ResizeObserver(function(girisler){
      for (let i = 0; i < girisler.length; i++) paintCell(girisler[i].target);
    })
  : null;

function resetGridObserver(){ if (gridRO) gridRO.disconnect(); }

function makeCell(pos, di){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.pos = pos;
  const box = document.createElement("div");
  box.className = "box";
  const cv = document.createElement("canvas");
  cv.dataset.di = di;
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = pos + 1;      // grid order is shuffled, so the number gives nothing away
  box.appendChild(cv);
  box.appendChild(num);
  if (gridRO) gridRO.observe(cv);
  const cap = document.createElement("div");
  cap.className = "cap";
  cell.appendChild(box); cell.appendChild(cap);
  return cell;
}

function buildRecall(){
  viewOnly = false;
  const g = $("recallGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    cell.onclick = function(){ onCellTap(pos); };
    g.appendChild(cell);
  });
  $("recallLevel").textContent = roundLabel();
  $("recallTitle").textContent = role === "guesser"
    ? (drawerName ? TEXT.whatDidDraw.replace("{name}", drawerName) : TEXT.whatWasDrawn)
    : TEXT.whichWasWhich;
  $("recallHint").textContent = modeId === "typed"
    ? TEXT.hintTyped
    : TEXT.hintPool;
  closeSheet(); closeModal();
  if (!recallStart){
    recallStart = Date.now();
    if (lastCode) rememberRound(lastCode, { startedAt: recallStart });
  }
  ensureCode();
  refreshRecall();
  show("recall");
  paintAll("recallGrid");
}

function onCellTap(pos){
  if (modeId === "typed"){ selPos = pos; openModal(pos); refreshRecall(); return; }
  if (picks[pos]){                       // tapping an assigned cell releases the word
    picks[pos] = null; selPos = -1; closeSheet(); refreshRecall(); return;
  }
  selPos = pos;
  openSheet(pos);
  refreshRecall();
}

// Wall clock from the grid appearing to the finish button. Kept with the round so
// a reload carries on the same clock instead of restarting it.
function elapsedMs(){
  if (recallMs) return recallMs;
  return recallStart ? Math.max(0, Date.now() - recallStart) : 0;
}

function timeLabel(ms){
  if (!ms) return "\u2013";
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + " sn";
  const m = Math.floor(s / 60);
  return m + ":" + String(Math.round(s - m * 60)).padStart(2, "0");
}

function answeredCount(){
  return picks.filter(function(p){ return p && String(p).trim(); }).length;
}

function refreshRecall(){
  const g = $("recallGrid");
  order.forEach(function(di, pos){
    const cell = g.children[pos];
    if (!cell) return;
    const dolu = !!(picks[pos] && String(picks[pos]).trim());
    cell.classList.toggle("sel", pos === selPos);
    cell.classList.toggle("done", dolu);
    const cap = cell.querySelector(".cap");
    cap.innerHTML = "";
    if (dolu){
      const s = document.createElement("span");
      s.className = "pick";
      s.textContent = picks[pos];
      cap.appendChild(s);
    }
  });
  const n = answeredCount();
  $("assigned").textContent = n + " / " + N;
  // any mode can be finished early; anything left blank counts as wrong
  $("finish").disabled = false;
  // Keep the answers on the device: a reload should come back to this grid with
  // the work still in it. The order goes with them -- see loadGame.
  if (lastCode) rememberRound(lastCode, { order: order, picks: picks });
}

/* kelime havuzu */
function openSheet(pos){
  const used = {};
  picks.forEach(function(w){ if (w) used[w] = true; });
  const pool = words.filter(function(w){ return !used[w]; })
                    .sort(function(a, b){ return a.localeCompare(b, "tr"); });
  $("sheetTitle").textContent = "bu ne?";
  const box = $("chips");
  box.innerHTML = "";
  pool.forEach(function(w){
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = w;
    b.onclick = function(){ picks[pos] = w; selPos = -1; closeSheet(); refreshRecall(); };
    box.appendChild(b);
  });
  const sc = $("recallGrid").parentElement;
  if (sc && sheetScroll < 0) sheetScroll = sc.scrollTop;   // where to come back to
  paintPreview($("sheetPrev"), order[pos]);   // the cell is too small to judge from
  $("sheetScrim").hidden = false;
  $("sheet").classList.add("on");
  $("recallGrid").style.paddingBottom = ($("sheet").offsetHeight + 20) + "px";
}

// The pool is position:fixed, so the grid takes on bottom padding to keep its last
// rows reachable above it. That padding is scrollable space which exists only while
// the pool is open: dropping it shrinks the scroll range, the browser clamps
// scrollTop, and the whole grid slides under the player, who reads it as the
// drawings having swapped places. How far it slides depends on the screen, which is
// why it looked different on every device. Nothing can hold a position inside space
// that no longer exists, so instead the offset from before the pool opened is put
// back -- it was reached with the padding collapsed, so it is always reachable again.
let sheetScroll = -1;

function closeSheet(){
  const g = $("recallGrid");
  const sc = g.parentElement;
  $("sheetScrim").hidden = true;
  $("sheet").classList.remove("on");
  g.style.paddingBottom = "14px";
  if (sc && sheetScroll >= 0) sc.scrollTop = sheetScroll;
  sheetScroll = -1;
}

$("sheetX").onclick = function(){ selPos = -1; closeSheet(); refreshRecall(); };

/* Reaching the little cross in the corner one-handed is a stretch on a phone, so
   both panels also close by dragging them down or tapping away from them. */
const SWIPE_CLOSE_PX = 60;

function enableSwipeDown(el, close, holdsOwnGesture, scrim){
  let startY = 0, dragging = false;

  function clear(){
    el.style.transition = "";
    el.style.transform = "";
    if (scrim) scrim.style.opacity = "";
  }

  el.addEventListener("pointerdown", function(e){
    if (holdsOwnGesture && holdsOwnGesture(e.target)) return;   // scrolling or typing
    dragging = true;
    startY = e.clientY;
    el.style.transition = "none";
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });

  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    const dy = e.clientY - startY;
    if (dy <= 0) return;                                        // downward only
    el.style.transform = "translateY(" + dy + "px)";
    // The backdrop thins out as the panel goes, so the two move together.
    if (scrim) scrim.style.opacity = String(Math.max(0, 1 - dy / (el.offsetHeight || 300)));
  });

  const release = function(e){
    if (!dragging) return;
    dragging = false;
    const dy = e.clientY - startY;

    if (dy <= SWIPE_CLOSE_PX){ clear(); return; }               // springs back

    // Carry on in the direction the finger was going, rather than snapping back to
    // the top and only then playing the close animation.
    let finished = false;
    const done = function(){
      if (finished) return;
      finished = true;
      el.removeEventListener("transitionend", done);
      clear();
      close();
    };
    el.style.transition = "transform .18s ease-in";
    el.style.transform = "translateY(" + (el.offsetHeight + 60) + "px)";
    if (scrim) scrim.style.opacity = "0";
    el.addEventListener("transitionend", done);
    setTimeout(done, 260);      // transitionend never fires if nothing actually moves
  };

  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

function dismissSheet(){ selPos = -1; closeSheet(); refreshRecall(); }

$("sheetScrim").onclick = dismissSheet;
enableSwipeDown($("sheet"), dismissSheet, function(t){
  return !!(t.closest && t.closest("#chips"));      // the word list scrolls on its own
}, $("sheetScrim"));
enableSwipeDown($("modalCard"), function(){ selPos = -1; closeModal(); refreshRecall(); }, function(t){
  return !!(t.closest && t.closest("input, button, textarea"));
});

/* typed answer */
function openModal(pos){
  paintPreview($("modalPrev"), order[pos]);
  const inp = $("modalInput");
  inp.value = picks[pos] || "";
  $("modal").classList.add("on");
  modalYerlestir();
  // Focus must happen synchronously inside the tap handler for the keyboard to
  // open: setTimeout breaks the user-gesture chain and iOS ignores it.
  inp.focus();
  inp.select();
  setTimeout(modalYerlestir, 60);
}

function closeModal(){
  $("modal").classList.remove("on");
  $("modal").style.height = "";
  $("modal").style.top = "";
}

// Every enlarged view of a drawing goes through here. The canvas keeps its fixed
// backing size and CSS scales it, so the strokes stay smooth however big it gets.
function paintPreview(cv, di){
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  paintStrokes(ctx, drawings[di] || [], cv.width, Math.max(3, cv.width * 0.025));
}

/* ----------------------------------------------------------- daily duel --- */

/* Two rounds are in play during a daily duel: yours and the one a friend sent.
   Whose round it is gets written into the day record when their link is opened, so
   the way between the two survives a reload. Nothing about it is held only in memory. */

// The round that is not on screen and still waiting to be guessed, or null.
function duelPartner(){
  const today = dailyDayNumber();
  if (!isDaily || dailyDay !== today) return null;
  const day = savedDay(today) || {};
  if (role === "guesser"){
    const ready = day.drawn && Array.isArray(day.words) && day.words.length === N;
    return ready && !day.done ? { mine: true } : null;
  }
  if (!day.duelCode || day.duelCode === lastCode) return null;
  const theirs = savedRound(day.duelCode) || {};
  return theirs.done ? null : { mine: false, code: day.duelCode, name: day.duelName || "" };
}

// Go to the other round. Both routes put it in the address bar, so a reload from
// there comes back to it.
function goToOther(){
  const other = duelPartner();
  if (!other) return;
  if (other.mine) resumeDaily(savedDay(dailyDay));
  else loadGame(other.code);
}

function showPick(){
  const day = savedDay(dailyDay) || {};
  $("pickTheirs").textContent = day.duelName
    ? TEXT.guessTheirsFirst.replace("{name}", day.duelName)
    : TEXT.guessMyself;
  show("pick");
}

$("gateDraw").onclick = function(){ wakeAudio(); afterDraw = "pick"; startDaily(); };
$("gateHome").onclick = function(){ show("home"); };
$("pickMine").onclick = function(){ resumeDaily(savedDay(dailyDayNumber())); };
$("pickTheirs").onclick = function(){
  const day = savedDay(dailyDayNumber()) || {};
  // After a reload on this screen the friend's round is already the one loaded.
  if (role === "guesser" && lastCode === day.duelCode){ if (recallStart) buildRecall(); else showChoose(); }
  else if (day.duelCode) loadGame(day.duelCode);
};
$("switchRound").onclick = goToOther;

/* ------------------------------------------------------------------ zoom --- */

function openZoom(pos){
  const di = order[pos];
  paintPreview($("zoomPrev"), di);
  const cap = $("zoomCap");
  cap.innerHTML = "";
  // A bigger look at the drawing is fine at any time; the word is not. viewOnly means
  // the round below has not been guessed yet, so there is nothing to tell.
  if (!viewOnly){
    const guess = picks[pos] && String(picks[pos]).trim();
    if (!isCorrect(picks[pos], words[di])){
      const bad = document.createElement("span");
      bad.className = "bad";
      bad.textContent = guess ? guess : "\u2014";
      cap.appendChild(bad);
    }
    const good = document.createElement("span");
    good.className = "good";
    good.textContent = words[di];
    cap.appendChild(good);
  }
  $("zoom").classList.add("on");
}

function closeZoom(){ $("zoom").classList.remove("on"); }

$("zoomClose").onclick = closeZoom;
$("zoom").onclick = function(e){ if (e.target === $("zoom")) closeZoom(); };
document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeZoom(); });

// Keep the sheet above the keyboard by sitting it on the visual viewport.
function modalYerlestir(){
  const m = $("modal");
  if (!m.classList.contains("on") || !window.visualViewport) return;
  m.style.height = window.visualViewport.height + "px";
  m.style.top = window.visualViewport.offsetTop + "px";
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", modalYerlestir);
  window.visualViewport.addEventListener("scroll", modalYerlestir);
}

function saveModal(val){
  if (selPos >= 0) picks[selPos] = String(val || "").trim();
  selPos = -1;
  closeModal();
  refreshRecall();
}

$("modalForm").onsubmit = function(e){ e.preventDefault(); saveModal($("modalInput").value); };
$("modalSkip").onclick  = function(){ saveModal(""); };
$("modal").onclick      = function(e){ if (e.target === $("modal")){ selPos = -1; closeModal(); refreshRecall(); } };

/* ----------------------------------------------------------- result screen --- */

function buildResult(){
  viewOnly = false;
  if (!recallMs) recallMs = elapsedMs();      // stop the clock before anything is drawn
  score = 0;
  order.forEach(function(di, pos){ if (isCorrect(picks[pos], words[di])) score++; });

  $("score").textContent = role === "guesser"
    ? ((drawerName ? TEXT.inDrawingsOf.replace("{whose}", whose(drawerName)) : TEXT.inTheseDrawings) + score + "/" + N)
    : TEXT.outOf.replace("{n}", N).replace("{score}", score);
  $("scoreSub").textContent = roundLabel() + " \u00b7 " + TEXT.totalTime + " " + timeLabel(elapsedMs());
  $("copyNote").textContent = "";
  $("fallback").style.display = "none";

  const g = $("resultGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    markCell(cell, picks[pos], words[di]);
    cell.classList.add("tappable");
    cell.onclick = function(){ openZoom(pos); };
    g.appendChild(cell);
  });

  $("again").textContent = role === "guesser" ? TEXT.youDrawToo : TEXT.playAgain;
  // One way to hand the round on: paylaş, which copies the score and the link
  // together. A second button beside it only made the two look like different things.
  $("reviewGuess").hidden = true;
  $("nameBlock").hidden = false;
  fillNameRow();
  // Record the finish before the board goes up: opening this code again on this
  // device should land here, on the score table, rather than on an empty grid.
  if (lastCode) rememberRound(lastCode, { done: true, score: score, ms: recallMs, order: order, picks: picks, name: myName });
  // No second attempt at the day: closing it here is what makes the score mean
  // something on a board everybody shares.
  if (onDayBoard()) rememberDay(dailyDay, { done: true, score: score, ms: recallMs, order: order, picks: picks });
  // During a daily duel, offer the other round. Asked after the finish is recorded,
  // and answered from storage, so it is still offered after a reload.
  const other = $("switchRound");
  const partner = duelPartner();
  other.hidden = !partner;
  if (partner){
    other.textContent = partner.mine ? TEXT.nowGuessMine
      : (partner.name ? TEXT.nowGuessTheirs.replace("{name}", partner.name) : TEXT.guessMyself);
  }
  showBoard();
  show("result");
  paintAll("resultGrid");
}

/* A cell marked against its word: green with the word when the answer is right, red
   with the answer struck through and the word under it when not. */
function markCell(cell, answer, word){
  const ok = isCorrect(answer, word);
  cell.classList.add(ok ? "right" : "wrong");
  const cap = cell.querySelector(".cap");
  if (!ok){
    const bad = document.createElement("span");
    bad.className = "bad";
    bad.textContent = (answer && String(answer).trim()) ? answer : "\u2014";
    cap.appendChild(bad);
    cap.appendChild(document.createElement("br"));
  }
  const good = document.createElement("span");
  good.className = "good";
  good.textContent = word;
  cap.appendChild(good);
  return ok;
}

/* What this device answered, by drawing rather than by grid position: the grid is
   shuffled per player, so only the drawing's own index means the same thing to everyone. */
function answersByDrawing(){
  const out = new Array(N).fill("");
  order.forEach(function(di, pos){ out[di] = picks[pos] ? String(picks[pos]) : ""; });
  return out;
}

/* A round's board can be opened row by row once this device has guessed the round: the
   answers are the words. Never the day's board, and never before guessing. */
function boardOpens(){ return !onDayBoard() && !viewOnly && !!lastCode; }

let answersOf = "";         // whose answers the answers screen shows

function openAnswers(name){
  answersOf = name;
  $("answersTitle").textContent = TEXT.answersOf.replace("{whose}", whose(name));
  $("answersSub").textContent = "";
  $("answersGrid").innerHTML = "";
  const note = $("answersNote");
  show("answers");
  // This device's own row needs no request: the answers are here.
  if (myName && sameName(name, myName) && order.length === N){ fillAnswers(answersByDrawing()); return; }
  note.hidden = false;
  note.textContent = TEXT.loadingAnswers;
  api("/api/scores/" + encodeURIComponent(lastCode) + "?name=" + encodeURIComponent(name)).then(function(r){
    if (answersOf !== name || !$("answers").classList.contains("on")) return;
    if (r.ok && r.data && Array.isArray(r.data.answers) && r.data.answers.length === N) fillAnswers(r.data.answers);
    else note.textContent = TEXT.noAnswers;
  }).catch(function(){
    if (answersOf === name) note.textContent = TEXT.fetchFailed;
  });
}

function fillAnswers(list){
  $("answersNote").hidden = true;
  const g = $("answersGrid");
  resetGridObserver();
  g.innerHTML = "";
  let right = 0;
  // In this device's grid order, so the drawings sit where the reader last saw them.
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    if (markCell(cell, list[di], words[di])) right++;
    g.appendChild(cell);
  });
  $("answersSub").textContent = right + "/" + N;
  paintAll("answersGrid");
}

$("answersBack").onclick = function(){ goBack("result"); };

/* The drawings and the board, for the drawer who sent the round on and has not
   guessed it yet. The same screen as the result, minus the marking: the board
   belongs under the drawings it is about, not on a screen of its own. */
function buildReview(){
  viewOnly = true;
  $("score").textContent = "";
  $("scoreSub").textContent = roundLabel();
  $("copyNote").textContent = "";
  $("fallback").style.display = "none";

  const g = $("resultGrid");
  resetGridObserver();
  g.innerHTML = "";
  // No captions. This screen is reached before the round has been guessed, so a word
  // written under its drawing would be the answer handed over.
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    cell.classList.add("tappable");
    cell.onclick = function(){ openZoom(pos); };
    g.appendChild(cell);
  });

  $("again").textContent = TEXT.playAgain;
  $("switchRound").hidden = true;
  $("reviewGuess").hidden = false;
  /* No name field here. This screen comes before the round has been guessed, and
     saving a name on it put a score of 0/20 on the board without a game being played.
     The name is asked on the result, where there is a score to put under it. */
  $("nameBlock").hidden = true;
  showBoard();
  show("result", "review");
  paintAll("resultGrid");
}

$("reviewGuess").onclick = function(){ buildRecall(); };

/* ------------------------------------------------------- score tablosu --- */

function sameName(a, b){
  return norm(a) === norm(b);          // same rule as the server's name key
}

function showBoard(){
  /* Which round these drawings belong to. It is set before the board's own check, so it
     shows on the screen reached straight after sending a round off -- where the person
     waiting for friends is the one who needs the code. */
  const line = $("boardCode");
  if (line){
    line.hidden = !lastCode;
    line.textContent = lastCode ? TEXT.gameCode.replace("{code}", lastCode) : "";
  }
  $("board").hidden = !hasBoard();
  if (!hasBoard()) return;
  $("boardTitle").textContent = onDayBoard()
    ? TEXT.dailyBoardTitle.replace("{date}", dailyDateLabel(dailyDay))
    : boardHeading();
  // A score needs a name to sit under. Without one the board is still readable,
  // it just has no row for this player until they add one.
  beepScores();
  if (myName && !scoreSent && !viewOnly){ scoreSent = true; sendScore(); }
  renderScores();
  fetchScores();
  startBoardPoll();
}

// Winner first: best score, and on a tie whoever got there quickest. Rows written
// before times were recorded have no ms and fall in behind the timed ones.
function rankScores(list){
  return list.slice().sort(function(a, b){
    if (b.score !== a.score) return b.score - a.score;
    const am = a.ms > 0 ? a.ms : Infinity, bm = b.ms > 0 ? b.ms : Infinity;
    if (am !== bm) return am - bm;
    return (a.ts || 0) - (b.ts || 0);
  });
}

function renderScores(){
  const liste = rankScores(scores);
  // Always show your own row: KV listing is eventually consistent, so a score
  // just written may not be in the list yet.
  if (myName && !viewOnly && !liste.some(function(s){ return sameName(s.name, myName); })){
    liste.push({ name: myName, score: score, ms: elapsedMs() });
  }
  const sirali = rankScores(liste);

  const kutular = [$("boardList"), $("scoresList")];
  kutular.forEach(function(box){
    if (!box) return;
    box.innerHTML = "";
    sirali.forEach(function(s, i){
      const row = document.createElement("div");
      row.className = "brow" + (myName && sameName(s.name, myName) ? " me" : "");
      const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = (i + 1) + ".";
      const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = s.name;
      const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = s.ms > 0 ? timeLabel(s.ms) : "";
      const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = s.score + "/" + N;
      row.appendChild(rk); row.appendChild(nm); row.appendChild(tm); row.appendChild(sc);
      if (box === $("boardList") && boardOpens()){
        row.classList.add("opens");
        row.onclick = function(){ openAnswers(s.name); };
      }
      box.appendChild(row);
    });
  });
  const bos = sirali.length === 0;
  if ($("boardHint")) $("boardHint").hidden = bos || !boardOpens();
  if ($("boardEmpty"))  $("boardEmpty").hidden  = !bos;
  if ($("scoresEmpty")) $("scoresEmpty").hidden = !bos;
  // Column names over nothing at all would be a table pretending to have rows.
  if ($("boardHead"))   $("boardHead").hidden   = bos;
  if ($("scoresHead"))  $("scoresHead").hidden  = bos;
}

// A round has its own board, keyed by its code; the day has one global board that
// everyone who played that day lands on. Same shape, different address.
/* The day board holds your score on your OWN drawings. Guessing a friend's daily
   round is a different thing -- how well you read their scribbles depends on how they
   draw -- so that goes to their round's own board, exactly like a free-play duel. */
function onDayBoard(){ return isDaily && role !== "guesser"; }

function boardUrl(){
  return onDayBoard() ? "/api/daily/" + dailyDay : "/api/scores/" + encodeURIComponent(lastCode);
}

function hasBoard(){ return onDayBoard() ? !!dailyDay : !!lastCode; }

function fetchScores(){
  if (!hasBoard()) return;
  api(boardUrl()).then(function(r){
    if (r.ok && r.data && Array.isArray(r.data.scores)){ scores = r.data.scores; renderScores(); }
  }).catch(function(){ /* if the board fails, your own row still shows */ });
}

/* Refresh as friends finish. A read is a single get on the server side, so
   this poll is cheap. */
// A read is a single KV get against a 100,000/day allowance, so a board watched
// for ten minutes costs about 600 of them. The server side was measured at half a
// second, so the poll interval is what the wait actually is.
const POLL_MS = 1000;
let boardTimer = null;

function startBoardPoll(){
  stopBoardPoll();
  if (!hasBoard()) return;
  boardTimer = setInterval(function(){
    const visible = $("result").classList.contains("on") || $("scores").classList.contains("on");
    if (!visible){ stopBoardPoll(); return; }   // stop once the screen is left
    if (document.hidden) return;               // do not fetch while backgrounded
    fetchScores();
  }, POLL_MS);
}

function stopBoardPoll(){
  if (boardTimer){ clearInterval(boardTimer); boardTimer = null; }
}

// Coming back from another app should refresh at once, not wait for the next tick.
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && boardTimer) fetchScores();
});

// Reached from the start screen once the day is done.

function openDailyBoard(){
  const day = dailyDayNumber();
  const rec = savedDay(day) || {};
  // Readable before the day is played, in which case there is no row to add and
  // nothing to post -- only everyone else's scores to look at.
  viewOnly = !rec.done;
  isDaily = true; dailyDay = day;
  score = rec.score || 0;
  recallMs = rec.ms || 0;
  scores = [];
  $("scoresTitle").textContent = TEXT.dailyBoardTitle.replace("{date}", dailyDateLabel(day));
  renderScores();
  fetchScores();
  show("scores");
  startBoardPoll();
}

// The only board with a screen to itself is the day's, which is global and has no
// drawings of its own. Every other score table sits under the drawings it is about.
$("scoresBack").onclick = function(){
  stopBoardPoll();
  goBack("home");
};

function sendScore(){
  if (!hasBoard() || !myName) return;
  renderScores();                                 // show your own row without waiting
  const rec = (onDayBoard() ? savedDay(dailyDay) : savedRound(lastCode)) || {};
  api(boardUrl(), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      name: myName,
      score: score,
      ms: elapsedMs(),
      // So friends can tap this row and see them. The day's board has no use for them.
      answers: onDayBoard() ? undefined : answersByDrawing(),
      // What this round was last posted under, and the proof it was us, so a
      // rename moves the row rather than adding a second one.
      was: rec.postedAs || "",
      token: rec.scoreToken || ""
    })
  }).then(function(r){
    const patch = { sent: true, postedAs: myName };   // do not post it again on a revisit
    if (r.ok && r.data && r.data.token) patch.scoreToken = r.data.token;
    if (onDayBoard()) rememberDay(dailyDay, patch); else rememberRound(lastCode, patch);
    if (r.ok && r.data && Array.isArray(r.data.scores)){ scores = r.data.scores; renderScores(); }
  }).catch(function(){ /* already shown locally, fail quietly */ });
}

// Nothing is asked before a round any more: you press start and draw. A name is
// only needed to put your round in someone else's hands, or your score on a
// board, so it is asked at exactly those two points.
function setName(raw){
  const name = String(raw || "").trim().slice(0, NAME_MAX);
  if (!name) return "";
  myName = name;
  rememberName(name);
  return name;
}

function shareText(){
  let rows = "";
  order.forEach(function(di, pos){
    rows += (isCorrect(picks[pos], words[di]) ? "🟩" : "🟥");
    // The grid is 4 across and 5 down on a phone, so the shared squares match it:
    // a 5-wide block was not the shape the player had been looking at.
    if (pos % 4 === 3 && pos !== N - 1) rows += "\n";
  });
  // The set is never named in the share text, so it cannot leak which words came up.
  // Whose drawings these are: the other player's when guessing, your own otherwise.
  // Guessing your own round used to fall through to the bare title, so sharing it
  // said nothing about who drew it.
  const who = role === "guesser" ? drawerName : myName;
  const head = "chizz 🎨" + dailyTag() + (who ? " " + TEXT.drawingsOf.replace("{whose}", whose(who)) : "");
  let out = head + "\n" + roundLabel() + "\n" + score + "/" + N
          + " \u00b7 " + timeLabel(elapsedMs()) + "\n\n" + rows;
  // Anyone reading the score can play the same round straight from the message.
  if (lastCode) out += "\n\n" + inviteText();
  return out;
}

// The tail that goes under a score: the message above it already says what this is.
function inviteText(){
  return TEXT.guessTooInvite + "\n" + gameLink(lastCode);
}

/* The whole message, for the places that send the link on its own. It has to say
   something in words, because a message containing nothing but a URL is swallowed
   whole by the link preview -- WhatsApp shows the card and not a single line of
   text, so the reader never sees who sent it or why. */
/* Whether a round is the day's puzzle is the first thing a reader needs to know, so
   it goes into every line this game shares -- the drawings, the score, the invite --
   rather than only the ones posted from the day board. */
function dailyTag(){
  return isDaily && dailyDay ? " " + TEXT.dailyShare.replace("{date}", dailyDateLabel(dailyDay)) : "";
}

function inviteMessage(){
  const who = role === "guesser" ? drawerName : myName;
  const head = "chizz \u{1F3A8}" + dailyTag() + (who ? " " + TEXT.drawingsOf.replace("{whose}", whose(who)) : "");
  return head + "\n" + TEXT.inviteBlurb + "\n\n" + inviteText();
}

function copyText(t){
  return new Promise(function(resolve){
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(t).then(
        function(){ resolve(true); },
        function(){ resolve(legacyCopy(t)); }
      );
      return;
    }
    resolve(legacyCopy(t));
  });
}

function legacyCopy(t){
  try {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    ta.setAttribute("readonly", "readonly");
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(err){ return false; }
}

// round to 0-255 integers and drop consecutive points closer than 2 units
function encodeDrawings(list){
  return list.map(function(strokeList){
    const out = [];
    (strokeList || []).forEach(function(st){
      if (!st || !st.length) return;
      const pts = [];
      let last = null;
      for (let i = 0; i < st.length; i++){
        const x = Math.round(Math.min(1, Math.max(0, st[i].x)) * 255);
        const y = Math.round(Math.min(1, Math.max(0, st[i].y)) * 255);
        if (last){
          const dx = x - last[0], dy = y - last[1];
          if (dx * dx + dy * dy < 4){ continue; }
        }
        pts.push([x, y]); last = [x, y];
      }
      // keep the last point so the stroke end survives
      const sonX = Math.round(Math.min(1, Math.max(0, st[st.length - 1].x)) * 255);
      const sonY = Math.round(Math.min(1, Math.max(0, st[st.length - 1].y)) * 255);
      if (!pts.length || pts[pts.length - 1][0] !== sonX || pts[pts.length - 1][1] !== sonY){
        pts.push([sonX, sonY]);
      }
      out.push(pts);
    });
    return out;
  });
}

function decodeDrawings(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(function(strokeList){
    if (!Array.isArray(strokeList)) return [];
    return strokeList.map(function(st){
      if (!Array.isArray(st)) return [];
      return st.map(function(p){
        return { x: (Number(p[0]) || 0) / 255, y: (Number(p[1]) || 0) / 255 };
      });
    }).filter(function(st){ return st.length; });
  });
}

function api(yol, opts){
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 12000);
  const o = opts || {};
  if (ctrl) o.signal = ctrl.signal;
  return fetch(yol, o).then(function(r){
    clearTimeout(t);
    return r.json().catch(function(){ return {}; }).then(function(j){
      return { ok: r.ok, status: r.status, data: j };
    });
  }, function(e){ clearTimeout(t); throw e; });
}

// One place that posts a round, so the share screen and the automatic save on the
// way into guessing cannot drift apart.
function postRound(name){
  return api("/api/save", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      setId: setId,
      mode: modeId,
      seconds: secs,
      day: isDaily ? dailyDay : 0,
      name: name || "",
      words: words,
      drawings: encodeDrawings(drawings)
    })
  }).then(function(r){
    if (!r.ok || !r.data || !r.data.code) throw new Error("save failed");
    lastCode = r.data.code;
    if (name) drawerName = name;
    // Guessing may have started before this save returned, when there was no code to
    // stamp the start time on, so it travels with the save.
    rememberRound(lastCode, { mine: true, owner: r.data.owner || "", order: order, picks: picks, startedAt: recallStart || 0 });
    clearPending();                 // it has a code now; that is the better record
    if (isDaily) rememberDay(dailyDay, { code: lastCode });
    setUrlCode(lastCode);
    return lastCode;
  });
}

/* People want to play the same round side by side, so the round is saved as soon
   as its own guessing begins rather than only when the share screen is opened.
   The code then exists for the corner chip, and for the invite line in the share
   text, without the player having to do anything first. */
function ensureCode(){
  if (lastCode || role === "guesser") return;
  if (!drawings.some(function(d){ return d && d.length; })) return;   // nothing worth sharing
  postRound(myName).then(updateCodeChip).catch(function(){
    /* offline, or the save failed: the chip stays hidden and the share screen can
       still try again later. Nothing is lost, the drawings are in memory. */
  });
}

// Push the current name onto the round this device saved: either filling the blank
// left by the automatic save, or replacing a name that has since been changed. The
// token proves the round is ours to rename.
function syncRoundName(){
  if (!lastCode || !myName || role === "guesser") return;
  if (drawerName === myName) return;
  const rec = savedRound(lastCode) || {};
  drawerName = myName;
  api("/api/game/" + encodeURIComponent(lastCode), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: myName, owner: rec.owner || "" })
  }).catch(function(){});
}

  const done = lastCode
    ? Promise.resolve(syncRoundName()).then(function(){ return lastCode; })
    : postRound(name);

  });
};

// A link sent to a friend must always point at the public address. One generated
// while playing on localhost, or from a file:// copy, will not open for them.
// When the domain changes, this is the ONLY line to edit.
const PUBLIC_BASE_URL = "https://chizz.party";

function gameLink(code){
  // Local, file:// and the old pages.dev address must not be used as the link
  // base: the first two never open for the recipient, and pages.dev is filtered
  // by some networks. Fall back to the canonical address in all three cases.
  const nonCanonical = location.protocol === "file:" ||
                       !location.hostname ||
                       /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?)$/i.test(location.hostname) ||
                       /\.pages\.dev$/i.test(location.hostname);
  const base = nonCanonical
    ? PUBLIC_BASE_URL
    : location.origin + location.pathname.replace(/index\.html$/i, "");
  return base.replace(/\/+$/, "") + "/?o=" + code;
}

$("linkCopy").onclick = function(){
  // The message, not the bare address: a lone URL arrives as a preview card with no
  // words beside it.
  copyText(inviteMessage()).then(function(ok){
    $("linkNote").style.color = ok ? "var(--ok)" : "var(--no)";
    $("linkNote").textContent = ok ? TEXT.linkCopied : TEXT.linkCopyFailed;
  });
};

function loadGame(code, want, who){
  code = String(code || "").toUpperCase();
  show("loading");
  $("loadTitle").textContent = TEXT.loadingDrawings;
  $("loadMsg").textContent = "";
  $("loadHome").hidden = true;
  $("loadReport").hidden = true;

  api("/api/game/" + encodeURIComponent(code)).then(function(r){
    if (r.status === 404) throw new Error("notfound");
    if (!r.ok) throw new Error("error");
    const v = r.data || {};
    const loadedWords = v.words, loadedDrawings = decodeDrawings(v.drawings);
    if (!Array.isArray(loadedWords) || loadedWords.length !== N || loadedDrawings.length !== N) throw new Error("malformed");

    setId    = typeof v.setId === "string" ? v.setId : "mix";
    // Accept both shapes: rounds shared before modes existed only have a difficulty.
    const legacy = LEGACY_DIFFS[v.difficulty];
    modeId = MODES.some(function(m){ return m.id === v.mode; }) ? v.mode
           : (legacy ? legacy.mode : "pool");
    secs   = v.seconds !== undefined ? clampSecs(v.seconds)
           : (legacy ? legacy.seconds : SECS_DEFAULT);
    lastCode   = code;
    scores  = [];
    drawerName  = typeof v.name === "string" ? v.name.slice(0, NAME_MAX) : "";
    words    = loadedWords;
    drawings = loadedDrawings;
    selPos   = -1;

    // Has this device been here before? The grid order has to be restored with
    // the answers: it is reshuffled on every visit, so putting old picks against
    // a fresh order would pin every answer to the wrong drawing.
    const rec = savedRound(code);
    if (rec && MODES.some(function(m){ return m.id === rec.modeId; })) modeId = rec.modeId;
    const resumable = !!(rec && Array.isArray(rec.order) && rec.order.length === N);
    role      = rec && rec.mine ? "drawer" : "guesser";
    scoreSent = !!(rec && rec.sent);
    order     = resumable ? rec.order.slice()
                          : shuffle(words.map(function(_, i){ return i; }));
    picks     = resumable && Array.isArray(rec.picks) && rec.picks.length === N
                  ? rec.picks.slice()
                  : new Array(N).fill(null);
    recallStart = rec && rec.startedAt ? rec.startedAt : 0;
    recallMs  = rec && rec.done && rec.ms ? rec.ms : 0;
    if (!resumable) rememberRound(code, { order: order });
    isDaily = Number(v.day) > 0;
    dailyDay = isDaily ? Number(v.day) : 0;
    buildHome();

    const todaysDuel = isDaily && dailyDay === dailyDayNumber() && role === "guesser";
    if (todaysDuel) rememberDay(dailyDay, { duelCode: code, duelName: drawerName });

    // Today's puzzle is the same twenty words for everyone, so looking at a
    // friend's grid before drawing would show the reader the words. Hold it.
    if (todaysDuel && !drewToday()){
      show("gate");
      return;
    }

    if (rec && rec.done && want === "answers" && who){ openAnswers(who); return; }
    if (rec && rec.done){             // already played on this device: straight to the scores
      buildResult();
      return;
    }
    // A round of this device's own can be looked at two ways -- the link screen or the
    // drawings with their board -- and the address says nothing about which. The history
    // entry, or the archive, does.
    if (rec && rec.mine && want === "review"){ buildReview(); return; }
    if (rec && rec.mine && want === "send"){ openShareScreen("home"); return; }
    // Drawn today but neither round started: a reload on the choice screen returns to it.
    const day = todaysDuel ? (savedDay(dailyDay) || {}) : null;
    if (day && !day.code && !day.done && !recallStart){
      showPick();
      return;
    }
    // Was guessing its own drawings: back to the grid. A daily round is only ever saved
    // on the way into guessing, so for one of those the share screen is never right.
    if (rec && rec.mine && (rec.startedAt || isDaily)){
      buildRecall();
      return;
    }
    if (rec && rec.mine){             // this device drew the round: back to the share screen
      $("code").textContent = code;
      $("link").textContent = gameLink(code);
      sendShow("done");
      show("send");
      return;
    }
    // A friend's round not started yet: how to guess it comes first, every time.
    if (!recallStart){ showChoose(); return; }
    buildRecall();                    // back into guessing; the name comes later
  }).catch(function(e){
    historyQuiet = false;
    $("loadTitle").textContent = e && e.message === "notfound"
      ? TEXT.codeInvalid
      : TEXT.fetchFailed;
    $("loadMsg").textContent = e && e.message === "notfound" ? "" : TEXT.checkConnection;
    $("loadHome").hidden = false;
    $("loadReport").hidden = false;
  });
}

  const was = myName;
  if (!setName($("nameField").value)){ $("nameField").focus(); return; }
  if (myName === was && scoreSent){ fillNameRow(); return; }   // nothing to do

  syncRoundName();           // the round was saved before this name, or under an old one
  // Re-post under the new name. sendScore carries the old one and the row token, so
  // the board moves the row instead of growing a second one.
  if (lastCode){ scoreSent = true; sendScore(); }
  fillNameRow();               // before the note, since refilling the row clears it
  $("nameNote").textContent = TEXT.nameSaved;
  setTimeout(function(){ $("nameNote").textContent = ""; }, 2000);
  renderScores();
};

$("nameField").addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); $("nameSave").click(); }
});

$("loadHome").onclick = function(){ show("home"); };

$("joinGo").onclick = function(){
  const code = $("joinCode").value.trim().toUpperCase();
  const valid = code.length === 4 && code.split("").every(function(c){ return CODE_ALPHABET.indexOf(c) >= 0; });
  if (!valid){ $("joinErr").textContent = TEXT.enterCode; return; }
  $("joinErr").textContent = "";
  loadGame(code);
};

$("joinCode").addEventListener("keydown", function(e){
  if (e.key === "Enter"){ e.preventDefault(); $("joinGo").click(); }
});

/* ------------------------------------------------------------------ wiring --- */

/* The time per word is a setting that outlives the visit, so the first unlimited
   round of the day says what it is before the countdown starts. Once a day only:
   past that it is nagging, not news. */
function hintedToday(){ return loadStore().hintDay === dailyDayNumber(); }
function rememberHint(){
  const store = loadStore();
  store.hintDay = dailyDayNumber();
  saveStore(store);
}
function closeTimeAsk(){ $("timeAsk").classList.remove("on"); }

$("start").onclick = function(){     // the countdown wakes the audio itself
  if (hintedToday()){ startGame(); return; }
  $("timeAskText").textContent = TEXT.timeNotice.replace("{n}", String(secs).replace(".", ","));
  $("timeAsk").classList.add("on");
};
$("timeStart").onclick = function(){ closeTimeAsk(); rememberHint(); startGame(); };
// Changing the time is an answer to the question, so it is not asked again either.
$("timeChange").onclick = function(){ closeTimeAsk(); rememberHint(); $("secs").focus(); };
$("timeAsk").onclick = function(e){ if (e.target === $("timeAsk")) closeTimeAsk(); };
$("toRecall").onclick = buildRecall;
// A stray tap on Bitir used to end the round on the spot, which for the daily means
// the day is gone. Ask first.
$("finish").onclick   = function(){ $("finishAsk").classList.add("on"); };
$("finishKeep").onclick = function(){ $("finishAsk").classList.remove("on"); };
$("finishAsk").onclick = function(e){ if (e.target === $("finishAsk")) $("finishAsk").classList.remove("on"); };
$("finishYes").onclick = function(){
  $("finishAsk").classList.remove("on");
  closeSheet(); closeModal(); buildResult();
};

$("share").onclick = function(){
  const t = viewOnly ? inviteMessage() : shareText();
  copyText(t).then(function(ok){
    if (ok){
      $("copyNote").textContent = TEXT.copied;
      setTimeout(function(){ $("copyNote").textContent = ""; }, 2200);
    } else {
      $("copyNote").textContent = TEXT.copyFailedSelect;
      const fb = $("fallback");
      fb.value = t; fb.style.display = "block"; fb.focus(); fb.select();
    }
  });
};

$("again").onclick = function(){ clearTimeout(cdTimer); startGame(); };
$("home2").onclick = function(){ clearTimeout(cdTimer); closeSheet(); closeModal(); show("home"); };

/* iOS stopped honouring user-scalable=no years ago, so the meta tag alone leaves
   double-tap zoom working. Worse, once it has zoomed there is no way back out,
   because the same tag blocks pinching out again. Three things are needed:
   touch-action:manipulation in the CSS, refusing Safari's own pinch gestures, and
   swallowing the second tap of a double-tap before it counts as one. */
["gesturestart", "gesturechange", "gestureend"].forEach(function(type){
  document.addEventListener(type, function(e){ e.preventDefault(); }, { passive: false });
});

let lastTapAt = 0, lastTapX = 0, lastTapY = 0;
document.addEventListener("touchend", function(e){
  const t = e.changedTouches && e.changedTouches[0];
  const now = Date.now();
  const x = t ? t.clientX : 0, y = t ? t.clientY : 0;
  // Time and place both, so tapping a cell and then a chip in quick succession is
  // still two taps, while tapping the same spot twice is the zoom gesture and dies.
  if (now - lastTapAt <= 350 && Math.abs(x - lastTapX) < 30 && Math.abs(y - lastTapY) < 30){
    e.preventDefault();
  }
  lastTapAt = now; lastTapX = x; lastTapY = y;
}, { passive: false });

// A second finger anywhere but the pad is a pinch, never a drawing gesture.
document.addEventListener("touchmove", function(e){
  if (e.touches.length > 1 && e.target !== pad) e.preventDefault();
}, { passive: false });

// Safari also zooms when a form field is focused and the font is under 16px.
document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive: false });

myName = savedName();             // the device already knows who is playing
loadSettings();
applyTheme();
applyText();
buildHome();

/* Where to start.

   A reload -- or coming back to this page with the back or forward button -- lands on a
   history entry that says which screen it was, so that screen comes back. A round link
   opened fresh loads that round. Anything else is a fresh visit and starts at the start,
   with an entry of its own so there is a start screen to come back to. */
(function(){
  const st = history.state;
  if (st && st.screen){ restoreEntry(st); return; }

  const m = /[?&]o=([^&]+)/.exec(location.search || "");
  if (m){
    historyQuiet = true;      // opened from a link: back should leave, not step into the app
    loadGame(decodeURIComponent(m[1]));
    return;
  }

  try { history.replaceState({ screen: "home", code: "", depth: 0 }, "", location.pathname); } catch (e) {}
})();
})();
</script>
