<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>chizz</title>
<!-- What the address alone should say when it is pasted somewhere. A round's link
     gets its own title, description and picture from functions/_middleware.js. -->
<meta name="description" content="20 kelime, 20 çizim, her biri için birkaç saniye. sonra: hangisi neydi? arkadaşlarınla oyna.">
<meta property="og:title" content="chizz">
<meta property="og:description" content="20 kelime, 20 çizim, her biri için birkaç saniye. sonra: hangisi neydi? arkadaşlarınla oyna.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="chizz">
<meta name="theme-color" content="#131418">
<!-- A file rather than a data: URI, because link previews and search results fetch
     the icon by URL and skip an inlined one -- which is why the card showed a globe. -->
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon.svg">
<!-- Inline so it costs no request and keeps the "nothing loaded from outside" rule. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23131418'/%3E%3Ctext x='32' y='34' font-family='Helvetica,Arial,sans-serif' font-size='46' font-weight='700' fill='%23ff5c3d' text-anchor='middle' dominant-baseline='central'%3Ec%3C/text%3E%3C/svg%3E">
<style>
  :root{
    color-scheme:dark;
    --bg:#131418;
    --panel:#1b1d23;
    --panel2:#23262e;
    --ink:#f1f2f4;
    --muted:#949aa5;
    --line:#2f333c;
    --accent:#ff5c3d;
    --ok:#4ade80;
    --no:#f87171;
    --paper:#e8e5de;
    --pen:#17181c;
  }
  /* Chosen in settings and kept on the device. The dark palette above is the
     default; this only has to restate the colours that actually differ. */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f5f4f0;
    --panel:#ffffff;
    --panel2:#eae7e0;
    --ink:#16181d;
    --muted:#6b7280;
    --line:#d8d4cb;
    --accent:#d8431f;
    --ok:#15803d;
    --no:#b91c1c;
    --paper:#ffffff;
    --pen:#17181c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* manipulation keeps panning and pinch but kills double-tap zoom, which fired
     constantly while drawing fast. The pad itself stays touch-action:none. */
  html, body{touch-action:manipulation;}
  /* A drag that starts on a label must not select text mid-round. Inputs opt back in. */
  body{-webkit-user-select:none; -ms-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  /* keep [hidden] winning over rules that set display:flex/block */
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:600px; margin:0 auto; height:100%;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    display:flex; flex-direction:column;
  }
  .screen{display:none; flex:1; min-height:0; flex-direction:column;}
  .screen.on{display:flex;}
  #home, #send, #result{overflow-y:auto; -webkit-overflow-scrolling:touch;}

  h1{font-size:34px; letter-spacing:-.02em; margin:24px 0 6px;}

  button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;}
  input{font:inherit; color:inherit;}

  /* home screen: vertically centred and plain.
     "safe centre": drops the centring when the viewport is short, otherwise the
     top gets clipped with no way to scroll to it. */
  #home{justify-content:center; justify-content:safe center;}
  .hwrap{width:100%; max-width:340px; margin:0 auto; padding:28px 0; flex:none;}
  #home h1{font-size:52px; text-align:center; margin:0 0 14px; letter-spacing:-.04em;}
  /* the day's puzzle, above everything else on the start screen */
  #dailyRow{
    display:flex; align-items:center; gap:12px;
    border:2px solid var(--accent); border-radius:14px;
    padding:12px 12px 12px 15px; margin:0;
    background:var(--panel);
  }
  #dailyRow .dtext{flex:1; min-width:0;}
  #dailyRow b{display:block; font-size:16px;}
  #dailyRow span{display:block; font-size:13px; color:var(--muted); margin-top:2px;}
  #dailyGo{
    flex:none; background:var(--accent); color:#fff; border-radius:12px;
    padding:11px 20px; font-weight:800; font-size:15px;
  }
  #dailyGo:active{filter:brightness(.9);}
  #dailyGo.done{background:transparent; color:var(--muted); border:2px solid var(--line); font-weight:700;}
  .tagline{
    color:var(--muted); font-size:16px; font-weight:700; line-height:1.5; text-align:center;
    margin:0 0 22px;
  }

  /* The start screen holds two different games: the day's puzzle, one go for
     everybody on the same words, and the one you can play as often as you like.
     They are kept apart so neither is read as a setting of the other. */
  .hsec{margin:0 0 30px;}
  .hsec:last-child{margin-bottom:0;}
  .hsectitle{
    font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--muted);
    margin:0 0 10px;
  }
  #dailyBoard{margin-top:10px; padding:11px; font-size:14px;}

  /* Side by side, the way the choice is made: kelimeler açık on the left,
     kelimeler gizli on the right. */
  .diffs{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 14px;}
  .diff{
    border:2px solid var(--line); border-radius:14px; padding:12px 13px; text-align:left;
    background:var(--panel);
  }
  .diff .mname{display:block; text-transform:lowercase; font-size:16px;}
  .diff .mdesc{
    display:block; margin-top:4px; color:var(--muted);
    font-size:12px; line-height:1.35; font-weight:500;
  }
  .diff.sel .mdesc{color:var(--ink); opacity:.75;}
  .diff.sel{border-color:var(--ink); background:var(--panel2);}

  /* settings on the home screen */
  .settings{
    border:2px solid var(--line); border-radius:14px; padding:14px 15px; margin:0 0 14px;
  }
  .srow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px;}
  .srow + .srow{margin-top:10px;}
  .srow .lbl{font-size:14px; font-weight:600; color:var(--muted);}
  .srow output{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  #secs{
    width:100%; margin:8px 0 2px; accent-color:var(--accent);
    background:transparent; touch-action:manipulation;
  }
  .shint{color:var(--muted); font-size:12px; margin:2px 0 0;}
  .nlabel{color:var(--muted); font-size:13px; font-weight:600; margin:0 0 6px;}
  #nameNote{color:var(--ok); font-weight:600; font-size:13px; min-height:18px; margin:4px 0 0;}
  .seg{display:flex; gap:6px;}
  .seg button{
    border:2px solid var(--line); border-radius:10px; padding:7px 12px;
    font-size:14px; font-weight:700; color:var(--muted);
  }
  .seg button.sel{border-color:var(--ink); color:var(--ink); background:var(--panel2);}

  /* a primary button that is not ready to be pressed yet, but still takes a tap
     so it can say why */
  .primary.off{opacity:.45;}

  /* name asked at the point it is needed, rather than before the game */
  .namerow{display:flex; gap:8px; align-items:flex-start; margin:0 0 10px;}
  .namerow .txt{margin:0;}
  .namerow button{
    flex:none; border:2px solid var(--line); border-radius:14px; padding:14px 18px; font-weight:700;
  }
  .diff b{display:block; font-size:16px;}

  .primary{
    display:block; width:100%; background:var(--ink); color:var(--bg); border-radius:14px;
    padding:17px; font-size:18px; font-weight:700; text-align:center; margin:22px 0 0;
  }
  .primary:disabled{opacity:.28;}
  .ghost{
    display:block; width:100%; border:2px solid var(--line); border-radius:14px;
    padding:14px; font-size:16px; font-weight:600; text-align:center;
  }
  .txt{
    width:100%; border:2px solid var(--line); border-radius:14px; padding:14px 15px;
    background:var(--panel); outline:none;
  }
  .txt:focus{border-color:var(--ink);}

  /* joining with a code */
  #joinRow{display:flex; gap:10px; margin-top:28px;}
  #joinCode{
    flex:1; text-align:center; text-transform:uppercase; letter-spacing:.22em;
    font-weight:700; font-size:17px; padding:13px 10px;
  }
  #joinCode::placeholder{letter-spacing:normal; text-transform:none; font-weight:600; color:var(--muted);}
  #joinGo{
    width:auto; padding:13px 22px; border:2px solid var(--line); border-radius:14px;
    font-weight:700; color:var(--muted);
  }
  #joinGo:active{background:var(--panel2);}
  .err{color:var(--no); font-size:14px; font-weight:600; margin:10px 0 0; min-height:19px;}

  /* countdown */
  #countdown{align-items:center; justify-content:center;}
  #cdNum{font-size:26vh; font-weight:800; line-height:1; letter-spacing:-.05em;}
  #cdNum.pop{animation:pop .28s ease-out;}
  @keyframes pop{from{transform:scale(.6); opacity:.2} to{transform:scale(1); opacity:1}}

  /* draw */
  #draw{padding-top:10px;}
  .drawtop{display:flex; align-items:center; gap:12px;}
  .headrow{display:flex; align-items:center; gap:10px;}
  .back{
    flex:none; width:36px; height:36px; border-radius:11px; border:2px solid var(--line);
    color:var(--muted); font-size:18px; line-height:1; background:var(--panel);
    display:flex; align-items:center; justify-content:center;
  }
  .back:active{background:var(--panel2);}

  /* The round code, in the corner of the header, from the moment guessing starts:
     people want to play the same round together without going and finding it. */
  /* The title has to give way, not the chip: without min-width:0 a flex item will
     not shrink past its longest word, and the chip was pushed off the screen. */
  .headrow h2{min-width:0;}
  .chip2{
    flex:none; margin-left:auto; display:flex; align-items:center; gap:7px;
    border:2px solid var(--line); border-radius:999px; padding:5px 11px;
    background:var(--panel);
  }
  .chip2:active{background:var(--panel2);}
  .chip2 .cc{font-weight:800; font-size:14px; letter-spacing:.1em;}
  .chip2 .cl{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}

  /* leave-game confirmation */
  #confirm, #finishAsk, #timeAsk{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.62);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #confirm.on, #finishAsk.on, #timeAsk.on{display:flex;}
  #confirmCard, #finishAskCard, #timeAskCard{
    box-sizing:border-box;   /* the padding has to fit inside 100%, or the card runs off a narrow phone */
    background:var(--panel); border-radius:18px; padding:20px; width:100%; max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.28); text-align:center;
  }
  #confirmCard b, #finishAskCard b, #timeAskCard b{display:block; font-size:19px; margin-bottom:6px;}
  #confirmCard p, #finishAskCard p, #timeAskCard p{color:var(--muted); font-size:14px; margin:0 0 4px;}
  #confirmCard .primary, #finishAskCard .primary, #timeAskCard .primary{margin:14px 0 8px;}
  #word{font-size:34px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #counter{font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700; font-size:15px;}
  #track{height:6px; background:var(--line); border-radius:99px; margin:10px 0 12px; overflow:hidden;}
  #bar{height:100%; background:var(--accent); transform-origin:left center; transform:scaleX(1);}
  #stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding-bottom:14px;}
  #pad{background:var(--paper); border:2px solid var(--line); border-radius:16px; touch-action:none; display:block;}

  /* the word alone, before the pen goes live */
  #reveal{
    position:fixed; inset:0; z-index:35; background:var(--bg);
    display:none; align-items:center; justify-content:center; padding:24px;
  }
  #reveal.on{display:flex;}
  #revealWord{
    font-size:46px; font-weight:800; letter-spacing:-.03em; line-height:1.1;
    text-align:center; word-break:break-word;
  }

  /* ara ekranlar */
  .mid{align-items:center; justify-content:center; text-align:center;}
  .mid h2{font-size:28px; margin:0 0 8px; letter-spacing:-.02em;}
  .mid p{color:var(--muted); margin:0 0 26px;}
  .mid .stack{width:100%; max-width:320px;}
  .mid .stack .primary{margin:0 0 10px;}

  /* recall + result */
  .head{padding:16px 0 12px;}
  .head h2{font-size:24px; margin:0; letter-spacing:-.02em;}
  .head p{color:var(--muted); margin:4px 0 0; font-size:14px;}
  .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #result .scroll{flex:none; overflow:visible;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-bottom:14px;}
  @media (min-width:520px){ .grid{grid-template-columns:repeat(5,1fr);} }

  .cell{position:relative; text-align:center;}
  .box{
    position:relative; width:100%; aspect-ratio:1/1; border:2px solid var(--line);
    border-radius:12px; overflow:hidden; background:var(--paper);
  }
  .cell.sel .box{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,77,46,.18);}
  .cell.done .box{border-color:var(--ink);}
  .cell.right .box{border-color:var(--ok);}
  .cell.wrong .box{border-color:var(--no);}
  .box canvas{position:absolute; inset:0; width:100%; height:100%;}
  .cap{font-size:12px; line-height:1.25; margin-top:4px; min-height:15px; word-break:break-word;}
  .cap .bad{color:var(--no); text-decoration:line-through;}
  .cap .good{color:var(--ok); font-weight:700;}
  .cap .pick{font-weight:700;}

  .foot{border-top:1px solid var(--line); padding:10px 0 14px; display:flex; align-items:center; gap:12px;}
  .foot .count{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; font-size:14px;}
  .foot .primary{margin:0; flex:1; padding:15px;}

  /* word pool (bottom sheet) */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--panel);
    border-top:1px solid var(--line); box-shadow:0 -10px 30px rgba(0,0,0,.10);
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .16s ease-out; visibility:hidden;
  }
  #sheet.on{transform:translateY(0); visibility:visible;}
  /* Tapping away from the sheet should close it. A scrim does that without the
     tap also landing on whatever cell happens to be underneath. */
  #sheetScrim{
    position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.35);
    transition:opacity .18s ease-out;
  }
  .grab{
    width:40px; height:4px; border-radius:99px; background:var(--line);
    margin:0 auto 10px; flex:none;
  }
  #modalCard .grab{margin-bottom:14px;}
  /* The card itself scrolls once the keyboard shrinks it, so only the handle and
     the drawing give their vertical gesture to the drag. */
  #modalCard .grab, #modalPrev{touch-action:none;}
  .grab{cursor:grab;}
  #sheet .row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #sheet .row b{font-size:15px;}
  #sheet .x{font-size:22px; line-height:1; color:var(--muted); padding:4px 8px;}
  /* The grid cell is ~76px wide, far too small to recognise a scribble by. Show the
     drawing at something near the size it was drawn at while the word is chosen. */
  #sheetPrev{
    width:min(56vw, 30vh, 240px); height:min(56vw, 30vh, 240px); display:block;
    margin:0 auto 12px; border:2px solid var(--line); border-radius:14px;
    background:var(--paper); flex:none;
  }
  /* The sheet keeps vertical drags for itself; the word list is the one part that
     still scrolls, so it takes them back. */
  #sheet{touch-action:none;}
  #chips{
    display:flex; flex-wrap:wrap; gap:8px; max-height:32vh; overflow-y:auto;
    touch-action:pan-y;
  }
  .chip{border:2px solid var(--line); border-radius:99px; padding:10px 15px; font-size:15px; font-weight:600; background:var(--panel);}
  .chip:active{background:var(--panel2);}

  /* typed answer: a card near the top, so the keyboard cannot cover it */
  #modal{
    position:fixed; inset:0; bottom:auto; height:100%; z-index:30; background:rgba(0,0,0,.62);
    display:none; justify-content:center; align-items:flex-end;
  }
  #modal.on{display:flex;}
  #modalCard{
    background:var(--panel); border-radius:20px 20px 0 0; width:100%; max-width:600px;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 50px rgba(0,0,0,.45);
  }
  #modalPrev{
    width:min(74vw, 38vh, 320px); height:min(74vw, 38vh, 320px); display:block; margin:0 auto 14px;
    border:2px solid var(--line); border-radius:14px; background:var(--paper);
    flex:none;
  }
  /* let the card scroll instead of overflowing when the keyboard shrinks the space */
  #modalCard{max-height:100%; overflow-y:auto;}
  #modalCard .primary{margin:12px 0 0;}
  #modalSkip{display:block; width:100%; text-align:center; color:var(--muted); font-size:14px; font-weight:600; padding:12px 0 2px;}

  /* result */
  #score{font-size:42px; font-weight:800; letter-spacing:-.03em; margin:14px 0 2px; line-height:1.1;}
  /* difficulty caption on the drawing and result screens: small, centred, faint */
  .lvl{
    text-align:center; font-size:11px; font-weight:700; letter-spacing:.2em;
    color:var(--muted); opacity:.45;
    margin:10px 0 4px; flex:none;
  }
  #scoreSub{margin:10px 0 6px;}
  #copyNote{color:var(--ok); font-weight:600; font-size:14px; text-align:center; min-height:20px; margin:2px 0 0;}
  #fallback{
    width:100%; margin-top:10px; border:2px solid var(--line); border-radius:12px; padding:10px;
    font:16px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; white-space:pre; display:none;
  }
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:12px 0 16px;}

  /* tap a finished drawing to see it full size */
  #zoom{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.72);
    display:none; justify-content:center; align-items:center; padding:20px;
  }
  #zoom.on{display:flex;}
  #zoomCard{width:100%; max-width:520px; text-align:center;}
  #zoomPrev{
    width:min(84vw, 58vh, 460px); height:min(84vw, 58vh, 460px); display:block;
    margin:0 auto 14px; border:2px solid var(--line); border-radius:16px;
    background:var(--paper);
  }
  #zoomCap{font-size:16px; font-weight:600; margin:0 0 16px; min-height:22px;}
  #zoomCap .bad{color:var(--no); text-decoration:line-through; margin-right:8px;}
  #zoomCap .good{color:var(--ok); font-weight:700;}
  #zoomClose{max-width:220px; margin:0 auto;}
  .cell.tappable{cursor:pointer;}

  /* duel: send screen */
  #send .wrap{margin:auto 0; padding:20px 0;}
  #send h2{font-size:26px; margin:0 0 8px; letter-spacing:-.02em;}
  #send p{color:var(--muted); margin:0 0 22px;}
  #code{
    font-size:44px; font-weight:800; letter-spacing:.14em; text-align:center;
    border:2px dashed var(--line); border-radius:16px; padding:18px 10px; margin:0 0 14px;
  }
  #link{
    display:block; width:100%; border:2px solid var(--line); border-radius:12px; padding:12px;
    font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace; word-break:break-all; text-align:center;
    color:var(--muted); margin-bottom:12px;
  }
  .spin{color:var(--muted); font-weight:600; text-align:center; padding:10px 0;}

  /* cell number - dark, because it sits on the paper */
  .num{
    position:absolute; top:3px; left:5px; font-size:11px; font-weight:700;
    color:#a9a49a; font-variant-numeric:tabular-nums; pointer-events:none;
  }

  /* score tablosu */
  #board{margin:18px 0 4px;}
  #board h3{font-size:15px; margin:0 0 10px; color:var(--muted); font-weight:700;
            letter-spacing:.06em;}
  .brow{
    display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px;
    background:var(--panel); margin-bottom:6px;
  }
  .brow.me{background:var(--panel2); box-shadow:inset 0 0 0 2px var(--accent);}
  .brow .rk{width:22px; color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; font-size:14px;}
  .brow .nm{flex:1; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .brow .tm{color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; margin-right:10px;}
  .brow .sc{font-weight:800; font-variant-numeric:tabular-nums;}
  #boardEmpty, #scoresEmpty{color:var(--muted); font-size:14px; padding:4px 0 8px;}
  .bnote{color:var(--muted); font-size:12px; margin:8px 0 0;}
  #nameRow{display:flex; gap:10px; margin-bottom:10px;}
  #nameRow .txt{flex:1; text-align:center; font-weight:700; letter-spacing:.08em;}
  #nameGo{width:auto; padding:14px 20px; border:2px solid var(--line); border-radius:14px; font-weight:700;}
  #fallback{background:var(--panel); color:var(--ink);}
  #modalPrev{background:var(--paper);}
</style>

<div id="app">

  <!-- ============ ANA EKRAN ============ -->
  <section class="screen on" id="home">
    <div class="hwrap">
      <h1>chizz</h1>
      <p class="tagline" data-t="tagline"></p>

      <div class="hsec">
        <h2 class="hsectitle" data-t="dailyTitle"></h2>
        <div id="dailyRow">
          <div class="dtext">

const DAILY_FAMILIES = Object.keys(DAILY_POOL).sort();
const DAILY_WINDOW = 14;   // a word may return on the 14th day, not before
const DAILY_PER_FAMILY = 10;
// Midnight in Turkey on 8 Sep 2026, written in UTC. Turkey has no daylight saving.
const DAILY_EPOCH = Date.UTC(2026, 8, 7, 21, 0, 0);
const DAY_MS = 86400000;

function dailyDayNumber(at){
  return Math.floor(((at === undefined ? Date.now() : at) - DAILY_EPOCH) / DAY_MS) + 1;
}

// When the current day ends, so a saved daily round can expire with it.
function dailyEndsIn(at){
  const now = at === undefined ? Date.now() : at;
  const next = DAILY_EPOCH + dailyDayNumber(now) * DAY_MS;
  return Math.max(60, Math.round((next - now) / 1000));
}

function dailyDateLabel(day){
  const d = new Date(DAILY_EPOCH + (day - 1) * DAY_MS + DAY_MS / 2);
  const p = function (n){ return n < 10 ? "0" + n : String(n); };
  return p(d.getUTCDate()) + "/" + p(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
}

// Deterministic, so every device shuffles a day the same way for ever.
function dailyRandom(seed){
  let a = (seed * 1831565813) >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dailyTake(list, n, rnd){
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a.slice(0, n);
}

/* Which words are free today depends on what the days before used, so the whole
   schedule is replayed from day one. A few hundred cheap iterations, years in.

   Nothing is rotated in order. A family is in the running only if it can field ten
   words nobody has seen for fourteen days, and the day picks two of those at random;
   the rule then holds by construction rather than by schedule, and a family that is
   short simply sits the day out and comes back when it has refilled. Small families
   end up appearing every nine days or so and large ones every six, which is exactly
   right -- a small family needs longer to refresh. */
function dailyWords(day){
  const lastUsed = {};
  let out = [];
  for (let d = 1; d <= day; d++){
    const rnd = dailyRandom(d);
    const freeIn = function(f){
      return DAILY_POOL[f].filter(function(w){
        return lastUsed[w] === undefined || d - lastUsed[w] >= DAILY_WINDOW;
      });
    };
    const ready = DAILY_FAMILIES.filter(function(f){
      return freeIn(f).length >= DAILY_PER_FAMILY;
    });
    out = [];
    dailyTake(ready, 2, rnd).forEach(function(f){
      dailyTake(freeIn(f), DAILY_PER_FAMILY, rnd).forEach(function(w){
        lastUsed[w] = d; out.push(w);
      });
    });
  }
  return out;
}

/* Whose drawings, in Turkish. The possessive ending is not fixed: it follows the
   last vowel of the name (vowel harmony), and a name ending in a vowel takes a
   buffer n first. So Ayşe'nin, Mert'in, Çağla'nın, Oğuz'un, Ümmü'nün -- a fixed 'ın
   was only right for names like Başak. Names are typed freely, so the dotted and
   dotless capitals are folded by hand before looking at them, and a name with no
   vowels at all falls back to 'in. */
function whose(name){
  const letters = String(name).replace(/I/g, "ı").replace(/İ/g, "i").toLowerCase()
    .replace(/[^a-zçğıöşüâîû]/g, "");
  const vowels = letters.match(/[aeıioöuüâîû]/g);
  const last = vowels ? vowels[vowels.length - 1] : "e";
  const ending = { a: "ın", â: "ın", ı: "ın", e: "in", i: "in", î: "in",
                   o: "un", u: "un", û: "un", ö: "ün", ü: "ün" }[last];
  const buffer = /[aeıioöuüâîû]$/.test(letters) ? "n" : "";
  return name + "'" + buffer + ending;
}

function boardHeading(){
  const who = drawerName ? TEXT.drawingsOf.replace("{whose}", whose(drawerName)) : TEXT.theseDrawings;
  return who + TEXT.scoresSuffix;
}

/* --------------------------------------------------------------- storage --- */
/* The v1 brief banned localStorage, back when a round was one throwaway sitting.
   Shared rounds changed that: a link gets opened twice, a phone reloads the tab,
   and the player expects to find their game where they left it. Only what the
   round already shows is kept -- the name typed on this device, and per round
   code the grid order, the answers and whether it was finished. Every access is
   wrapped: Safari in private mode throws on localStorage rather than no-opping. */
const STORE_KEY   = "chizz.v1";
const KEEP_ROUNDS = 40;
const ROUND_TTL   = 30 * 24 * 60 * 60 * 1000;   // the server expires rounds on the same clock

function loadStore(){
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!v || typeof v !== "object") return { name: "", rounds: {} };
    if (!v.rounds || typeof v.rounds !== "object") v.rounds = {};
    if (!v.days || typeof v.days !== "object") v.days = {};
    if (typeof v.name !== "string") v.name = "";
    return v;
  } catch(e){ return { name: "", rounds: {} }; }
}

function saveStore(store){
  // Drop what the server has expired anyway, then keep the newest few.
  const now = Date.now();
  const kept = {};
  Object.keys(store.rounds)
    .filter(function(c){ return now - (store.rounds[c].at || 0) < ROUND_TTL; })
    .sort(function(a, b){ return (store.rounds[b].at || 0) - (store.rounds[a].at || 0); })
    .slice(0, KEEP_ROUNDS)
    .forEach(function(c){ kept[c] = store.rounds[c]; });
  store.rounds = kept;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}

function savedName(){ return loadStore().name; }

function rememberSettings(){
  const store = loadStore();
  store.mode  = modeId;
  store.secs  = secs;
  store.theme = theme;
  saveStore(store);
}

function loadSettings(){
  const store = loadStore();
  if (MODES.some(function(m){ return m.id === store.mode; })) modeId = store.mode;
  if (store.secs !== undefined) secs = clampSecs(store.secs);
  if (store.theme === "light" || store.theme === "dark") theme = store.theme;
}

function rememberName(n){
  const store = loadStore();
  store.name = String(n || "").slice(0, NAME_MAX);
  saveStore(store);
}

function savedRound(code){
  return code ? (loadStore().rounds[code] || null) : null;
}

/* What this device has done with a given day. There is no archive -- only today
   can be played -- so yesterday is kept purely so a late finish survives midnight,
   and everything older is dropped. */
function savedDay(day){
  const s = loadStore();
  return (s.days || {})[String(day)] || null;
}

function rememberDay(day, patch){
  if (!day) return;
  const store = loadStore();
  store.days = store.days || {};
  const rec = store.days[String(day)] || {};
  Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
  store.days[String(day)] = rec;
  Object.keys(store.days).forEach(function(k){ if (Number(k) < day - 1) delete store.days[k]; });
  saveStore(store);
}

/* Where the player is, for the three screens the address cannot describe: the "what
   now" screen after drawing, whose round has no code yet; the drawings shown with
   their board; and the day's score board, which belongs to no round. Every other
   screen is worked out from the code in the address, which is the better record
   because it survives being sent to somebody else. */
const PLACES = { between: 1, send: 1, review: 1, scores: 1 };

/* Screens on the way to somewhere else. They must not record a place, and must not
   clear one either: fetching a round puts the loading screen up first, which was
   erasing the memory of where the player had been before it could be read. */
const PASSING = { loading: 1, countdown: 1, draw: 1 };

function rememberPlace(screen){
  if (PASSING[screen]) return;
  const store = loadStore();
  if (!PLACES[screen]){
    if (store.place){ delete store.place; saveStore(store); }
    return;
  }
  store.place = { screen: screen, code: lastCode || "", day: isDaily ? dailyDay : 0 };
  saveStore(store);
}

function savedPlace(){ return loadStore().place || null; }

/* Twenty drawings with nowhere to live yet: a round gets its code when it is sent or
   when guessing starts, so until then a reload would throw the drawings away. */
function rememberPending(){
  const store = loadStore();
  store.pending = {
    setId: setId, modeId: modeId, secs: secs,
    words: words, drawings: encodeDrawings(drawings)
  };
  saveStore(store);
}

function clearPending(){
  const store = loadStore();
  if (!store.pending) return;
  delete store.pending;
  saveStore(store);
}

function resumePending(rec){
  isDaily = false; dailyDay = 0; afterDraw = "";
  setId = SETS.some(function(s){ return s.id === rec.setId; }) ? rec.setId : SETS[0].id;
  modeId = MODES.some(function(m){ return m.id === rec.modeId; }) ? rec.modeId : modeId;
  secs = clampSecs(rec.secs);
  role = "solo"; drawerName = ""; lastCode = "";
  scores = []; scoreSent = false;
  recallStart = 0; recallMs = 0;
  words = rec.words.slice();
  drawings = decodeDrawings(rec.drawings || []);
  order = shuffle(words.map(function(_, i){ return i; }));
  picks = new Array(N).fill(null);
  selPos = -1;
  show("between");
}

function drewToday(){
  const rec = savedDay(dailyDayNumber());
  return !!(rec && rec.drawn);
}

function rememberRound(code, patch){
  if (!code) return;
  const store = loadStore();
  const rec = store.rounds[code] || {};
  Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
  rec.at = Date.now();
  store.rounds[code] = rec;
  saveStore(store);
}

// Put the round in the address bar so a reload returns to it instead of the home
// screen. replaceState, not pushState: the back button should still leave.
function setUrlCode(code){
  try { history.replaceState(null, "", location.pathname + "?o=" + encodeURIComponent(code)); } catch(e){}
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function show(id){
  const list = document.querySelectorAll(".screen");
  for (let i = 0; i < list.length; i++) list[i].classList.toggle("on", list[i].id === id);
  if (typeof closeZoom === "function") closeZoom();
  if (id === "home"){
    // Leaving a round leaves its address behind as well. Without this a reload on the
    // start screen walks back into the round the player has just stepped out of.
    if (typeof clearUrl === "function") clearUrl();
    // The day's line goes stale the moment it is played, and every route back to the
    // start screen has to show the new state, not just the ones that rebuild the page.
    if (typeof buildDailyRow === "function") buildDailyRow();
  }
  if (typeof rememberPlace === "function") rememberPlace(id);
  // The code can arrive from a save, a reload, or a link, so the chip is refreshed
  // on every screen change rather than at any one of those points.
  if (typeof updateCodeChip === "function") updateCodeChip();
  // stop polling on any screen other than the score board
  if (id !== "result" && id !== "scores" && typeof stopBoardPoll === "function") stopBoardPoll();
}

const TURKISH_FOLD = { "ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u","ê":"e" };

let PUNCTUATION;
try { PUNCTUATION = new RegExp("[^\\p{L}\\p{N}\\s]", "gu"); }
catch (e){ PUNCTUATION = /[^a-z0-9\s]/g; }

function norm(s){
  s = String(s == null ? "" : s);
  s = s.toLocaleLowerCase("tr");
  s = s.replace(/̇/g, "");                     // combining dot left by lowercasing "İ"
  s = s.replace(/[çğıöşüâîûê]/g, function(ch){ return TURKISH_FOLD[ch] || ch; });
  s = s.replace(PUNCTUATION, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

// Levenshtein mesafesi <= 1 mi
function withinOneEdit(a, b){
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb){
    let d = 0;
    for (let i = 0; i < la; i++) if (a[i] !== b[i] && ++d > 1) return false;
    return true;
  }
  const kisa = la < lb ? a : b, uzun = la < lb ? b : a;
  let i = 0, j = 0, d = 0;
  while (i < kisa.length && j < uzun.length){
    if (kisa[i] === uzun[j]){ i++; j++; }
    else { if (++d > 1) return false; j++; }
  }
  return true;
}

function isCorrect(cevap, kelime){
  const a = norm(cevap);
  if (!a) return false;                 // a blank answer is always wrong
  return withinOneEdit(a, norm(kelime));
}

             : (Array.isArray(rec.order) && rec.order.length === N ? rec : null);

/* --------------------------------------------------------------- sound --- */
/* Tones are synthesised rather than loaded, so the page still pulls nothing from
   outside. A browser will not let audio start without a gesture, so the context is
   created and resumed on the first tap -- pressing start, in practice -- and every
   later beep runs on that one permission. */
let audio = null;

// Resolves once the context is actually running, so a countdown can wait for it
// instead of scheduling tones into a context that is still suspended and dropping
// them.
function wakeAudio(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return Promise.resolve();
    if (!audio) audio = new Ctx();
    if (audio.state === "suspended"){
      const r = audio.resume();
      if (r && r.then) return r.catch(function(){});
    }
  } catch(e){ audio = null; }      // no audio is not a reason to stop the game
  return Promise.resolve();
}

function tone(freq, startIn, length, peak){
  if (!audio || audio.state !== "running") return;
  try {
    const t0 = audio.currentTime + startIn;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    // Ramped rather than switched, so it does not click at either end.
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t0); osc.stop(t0 + length + 0.02);
  } catch(e){}
}

/* All four countdown tones are scheduled in one go, on the audio clock, against the
   same absolute grid the numbers use. Firing each one from its own setTimeout at
   "currentTime + 0" was the problem: the timeout chain restarted from whenever the
   callback actually ran, so lateness piled up, and a tone asked for at +0 lands on
   the next render quantum rather than now. The audio clock does not drift, so the
   beats stay even however busy the page gets.

   startAt is a performance.now() reading, so the offset is measured rather than
   assumed -- scheduling may happen a little after the countdown became visible,
   while waiting for the context to resume. */
function countdownBeeps(startAt){
  if (!audio || audio.state !== "running") return;
  for (let k = 0; k <= 3; k++){
    const when = (startAt + k * 1000 - performance.now()) / 1000;
    if (when < -0.05) continue;                        // that beat is already gone
    if (k < 3) tone(660, Math.max(0, when), 0.12, 0.14);   // 3, 2, 1
    else       tone(990, Math.max(0, when), 0.22, 0.17);   // draw
  }
}
function beepScores(){                                        // the board is in
  tone(523.25, 0,    0.16, 0.11);
  tone(659.25, 0.13, 0.16, 0.11);
  tone(783.99, 0.26, 0.30, 0.13);
}

document.addEventListener("pointerdown", wakeAudio, { once: true });

  order    = shuffle(words.map(function(_, i){ return i; }));

/* The day's puzzle. Everyone gets the same twenty words and the same settings, so
   a score posted to the day board means the same thing for everybody. The settings
   panel is deliberately ignored here. */
function startDaily(){
  clearPending();
  clearUrl();
  dailyDay = dailyDayNumber();
  isDaily  = true;
  modeId   = "typed";
  secs     = 3;
  setId    = null;

function beginRound(){
  show("countdown");
  const num = $("cdNum");
  const startAt = performance.now();

  // The tones go on the clock as soon as the context is awake; both they and the
  // numbers are pinned to startAt, so they cannot slide apart.
  wakeAudio().then(function(){ countdownBeeps(startAt); });

  const step = function(k){
    num.textContent = String(3 - k);
    num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
    // Each wait is measured back to startAt rather than being a flat 1000, so a
    // late callback does not push everything after it later still.
    const nextAt = startAt + (k + 1) * 1000;
    const wait = Math.max(0, nextAt - performance.now());
    cdTimer = setTimeout(k < 2 ? function(){ step(k + 1); } : startDrawPhase, wait);
  };
  step(0);
}

/* ----------------------------------------------------------- drawing phase --- */

const pad = $("pad");
const pctx = pad.getContext("2d");

let padSize = 0;
let strokes = [];
// One stroke per pointer, keyed by pointerId. A single shared "current stroke"
// made a second finger carry on the first one, so two hands drew a line joining
// them instead of two separate lines. Any number of pointers now draw at once.
const live = new Map();
let idx = 0;
let wordStart = 0;
let raf = 0;

function sizePad(){
  const stage = $("stage");
  const size = Math.max(160, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)));
  if (size === padSize) return;
  padSize = size;
  const dpr = window.devicePixelRatio || 1;
  pad.style.width  = size + "px";
  pad.style.height = size + "px";
  pad.width  = Math.round(size * dpr);
  pad.height = Math.round(size * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintPad();
}

function penWidth(){ return Math.max(3, padSize * 0.011); }

function paintPad(){
  pctx.clearRect(0, 0, padSize, padSize);
  paintStrokes(pctx, strokes, padSize, penWidth());
}

function paintStrokes(ctx, list, size, lw){
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = PEN;
  ctx.fillStyle = PEN;
  for (let k = 0; k < list.length; k++){
    const s = list[k];
    if (!s || !s.length) continue;
    if (s.length === 1){
      ctx.beginPath();
      ctx.arc(s[0].x * size, s[0].y * size, lw / 2, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(s[0].x * size, s[0].y * size);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x * size, s[i].y * size);
    ctx.stroke();
  }
}

function padPoint(e){
  const r = pad.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top)  / r.height;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)) };
}

pad.addEventListener("pointerdown", function(e){
  if (!$("draw").classList.contains("on") || revealing) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch(err){}
  const stroke = [padPoint(e)];
  live.set(e.pointerId, stroke);
  strokes.push(stroke);
  paintPad();
});

pad.addEventListener("pointermove", function(e){
  const stroke = live.get(e.pointerId);
  if (!stroke) return;
  e.preventDefault();
  // getCoalescedEvents sometimes returns an empty array; fall back to the event
  let evts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evts || !evts.length) evts = [e];
  const lw = penWidth();
  pctx.lineWidth = lw; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = PEN;
  for (let i = 0; i < evts.length; i++){
    const p = padPoint(evts[i]);
    const prev = stroke[stroke.length - 1];
    if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.0015) continue;
    pctx.beginPath();
    pctx.moveTo(prev.x * padSize, prev.y * padSize);
    pctx.lineTo(p.x * padSize, p.y * padSize);
    pctx.stroke();
    stroke.push(p);
  }
});

function endStroke(e){
  if (!e){ live.clear(); return; }        // called with nothing = drop every pointer
  if (!live.has(e.pointerId)) return;     // a finger that was never drawing
  e.preventDefault();
  live.delete(e.pointerId);
}
pad.addEventListener("pointerup", endStroke);
pad.addEventListener("pointercancel", endStroke);
pad.addEventListener("pointerleave", endStroke);

function startDrawPhase(){
  show("draw");
  padSize = 0;
  sizePad();            // layout is ready after show(), so measure synchronously
  startWord(0);
}

/* The word used to appear at the top of a blank page with the clock already
   running, which on a phone is easy to start drawing over before reading it. It
   now gets half a second on its own, and the pen is dead until that is over. */
const REVEAL_MS = 500;
let revealing = false;
let revealPending = false;
let revealTimer = 0;

function revealThenDraw(i){
  revealing = true;
  $("revealWord").textContent = words[i];
  $("reveal").classList.add("on");
  clearTimeout(revealTimer);
  revealTimer = setTimeout(function(){
    $("reveal").classList.remove("on");
    revealing = false;
    wordStart = performance.now();     // the word's own time starts here, not before
    raf = requestAnimationFrame(tick);
  }, REVEAL_MS);
}

function clearReveal(){
  clearTimeout(revealTimer);
  revealing = false;
  revealPending = false;
  $("reveal").classList.remove("on");
}

function startWord(i){
  idx = i;
  strokes = [];
  live.clear();
  paintPad();
  $("drawLevel").textContent = roundLabel();
  $("word").textContent = words[i];
  $("counter").textContent = (i + 1) + " / " + N;
  $("bar").style.transform = "scaleX(1)";
  revealThenDraw(i);
}

function tick(){
  const ms = roundMs();
  const el = performance.now() - wordStart;
  $("bar").style.transform = "scaleX(" + Math.max(0, 1 - el / ms) + ")";
  if (el >= ms){ nextWord(); return; }
  raf = requestAnimationFrame(tick);
}

function nextWord(){
  cancelAnimationFrame(raf);
  live.clear();
  drawings[idx] = strokes.filter(function(s){ return s && s.length; });   // empty drawing = []
  if (idx + 1 < N){ startWord(idx + 1); return; }

  if (isDaily){
    // Keep the drawings: the player may go and guess their friend's round first
    // and come back to their own, possibly after a reload.
    rememberDay(dailyDay, { drawn: true, words: words, drawings: encodeDrawings(drawings) });
  } else {
    rememberPending();
  }
  if (afterDraw === "pick"){ afterDraw = ""; showPick(); return; }
  show("between");
}

// rAF stops while the tab is in the background. Push wordStart forward by the
// hidden duration so the player does not lose the rest of the word.
let hiddenAt = 0;
document.addEventListener("visibilitychange", function(){
  if (pausedAt) return;              // already paused by the leave confirmation
  if (document.hidden) hiddenAt = performance.now();
  else if (hiddenAt){ wordStart += performance.now() - hiddenAt; hiddenAt = 0; }
});

/* --------------------------------------------------- leave confirmation --- */

let pausedAt = 0;

function pauseTimer(){
  if (!$("draw").classList.contains("on") || pausedAt) return;
  cancelAnimationFrame(raf);
  pausedAt = performance.now();          // freeze the timer while the dialog is open
  // Asked to leave while the word is still up: hold the reveal too, or the drawing
  // time would run out behind the dialog.
  if (revealing){ clearTimeout(revealTimer); revealPending = true; }
}

function resumeTimer(){
  // do nothing unless we actually paused, or a second rAF loop starts and time runs twice as fast
  if (!pausedAt || !$("draw").classList.contains("on")) return;
  if (revealPending){                    // paused before the word had been shown
    revealPending = false;
    pausedAt = 0;
    revealThenDraw(idx);
    return;
  }
  wordStart += performance.now() - pausedAt;
  pausedAt = 0;
  raf = requestAnimationFrame(tick);
}

function askExit(){
  pauseTimer();
  $("confirm").classList.add("on");
}

function cancelExit(){
  $("confirm").classList.remove("on");
  resumeTimer();
}

function confirmExit(){
  $("confirm").classList.remove("on");
  cancelAnimationFrame(raf);
  clearTimeout(cdTimer);
  clearReveal();
  pausedAt = 0;
  live.clear();
  closeSheet(); closeModal(); closeZoom();
  clearPending();
  show("home");                    // which clears the address on the way
}

$("backDraw").onclick    = askExit;
$("backRecall").onclick  = askExit;
$("confirmStay").onclick = cancelExit;
$("confirmLeave").onclick = confirmExit;
$("confirm").onclick = function(e){ if (e.target === $("confirm")) cancelExit(); };

window.addEventListener("resize", function(){
  if ($("draw").classList.contains("on")){
    const keep = strokes;
    padSize = 0; sizePad(); strokes = keep; paintPad();
  }
  const cvs = document.querySelectorAll(".grid canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
});

/* ----------------------------------------------------------- recall screen --- */

function paintCell(cv){
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  paintStrokes(ctx, drawings[Number(cv.dataset.di)] || [], size, Math.max(1.5, size * 0.028));
}

function paintAll(gridId){
  const cvs = $(gridId).querySelectorAll("canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
}

// If the grid is built before layout exists (a background tab, width 0) the
// drawings paint at the wrong size and never repaint. Repaint once a cell has one.
const gridRO = typeof ResizeObserver !== "undefined"
  ? new ResizeObserver(function(girisler){
      for (let i = 0; i < girisler.length; i++) paintCell(girisler[i].target);
    })
  : null;

function resetGridObserver(){ if (gridRO) gridRO.disconnect(); }

function makeCell(pos, di){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.pos = pos;
  const box = document.createElement("div");
  box.className = "box";
  const cv = document.createElement("canvas");
  cv.dataset.di = di;
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = pos + 1;      // grid order is shuffled, so the number gives nothing away
  box.appendChild(cv);
  box.appendChild(num);
  if (gridRO) gridRO.observe(cv);
  const cap = document.createElement("div");
  cap.className = "cap";
  cell.appendChild(box); cell.appendChild(cap);
  return cell;
}

function buildRecall(){
  viewOnly = false;
  const g = $("recallGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    cell.onclick = function(){ onCellTap(pos); };
    g.appendChild(cell);
  });
  $("recallLevel").textContent = roundLabel();
  $("recallTitle").textContent = role === "guesser"
    ? (drawerName ? TEXT.whatDidDraw.replace("{name}", drawerName) : TEXT.whatWasDrawn)
    : TEXT.whichWasWhich;
  $("recallHint").textContent = modeId === "typed"
    ? TEXT.hintTyped
    : TEXT.hintPool;
  closeSheet(); closeModal();
  if (!recallStart){
    recallStart = Date.now();
    if (lastCode) rememberRound(lastCode, { startedAt: recallStart });
  }
  ensureCode();
  refreshRecall();
  show("recall");
  paintAll("recallGrid");
}

function onCellTap(pos){
  if (modeId === "typed"){ selPos = pos; openModal(pos); refreshRecall(); return; }
  if (picks[pos]){                       // tapping an assigned cell releases the word
    picks[pos] = null; selPos = -1; closeSheet(); refreshRecall(); return;
  }
  selPos = pos;
  openSheet(pos);
  refreshRecall();
}

// Wall clock from the grid appearing to the finish button. Kept with the round so
// a reload carries on the same clock instead of restarting it.
function elapsedMs(){
  if (recallMs) return recallMs;
  return recallStart ? Math.max(0, Date.now() - recallStart) : 0;
}

function timeLabel(ms){
  if (!ms) return "\u2013";
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + " sn";
  const m = Math.floor(s / 60);
  return m + ":" + String(Math.round(s - m * 60)).padStart(2, "0");
}

function answeredCount(){
  return picks.filter(function(p){ return p && String(p).trim(); }).length;
}

function refreshRecall(){
  const g = $("recallGrid");
  order.forEach(function(di, pos){
    const cell = g.children[pos];
    if (!cell) return;
    const dolu = !!(picks[pos] && String(picks[pos]).trim());
    cell.classList.toggle("sel", pos === selPos);
    cell.classList.toggle("done", dolu);
    const cap = cell.querySelector(".cap");
    cap.innerHTML = "";
    if (dolu){
      const s = document.createElement("span");
      s.className = "pick";
      s.textContent = picks[pos];
      cap.appendChild(s);
    }
  });
  const n = answeredCount();
  $("assigned").textContent = n + " / " + N;
  // any mode can be finished early; anything left blank counts as wrong
  $("finish").disabled = false;
  // Keep the answers on the device: a reload should come back to this grid with
  // the work still in it. The order goes with them -- see loadGame.
  if (lastCode) rememberRound(lastCode, { order: order, picks: picks });
}

function openSheet(pos){
  const used = {};
  picks.forEach(function(w){ if (w) used[w] = true; });
  const pool = words.filter(function(w){ return !used[w]; })
                    .sort(function(a, b){ return a.localeCompare(b, "tr"); });

    box.appendChild(b);

  if (sc && sheetScroll < 0) sheetScroll = sc.scrollTop;   // where to come back to

// The pool is position:fixed, so the grid takes on bottom padding to keep its last
// rows reachable above it. That padding is scrollable space which exists only while
// the pool is open: dropping it shrinks the scroll range, the browser clamps
// scrollTop, and the whole grid slides under the player, who reads it as the
// drawings having swapped places. How far it slides depends on the screen, which is
// why it looked different on every device. Nothing can hold a position inside space
// that no longer exists, so instead the offset from before the pool opened is put
// back -- it was reached with the padding collapsed, so it is always reachable again.
let sheetScroll = -1;

function closeSheet(){
  const g = $("recallGrid");
  const sc = g.parentElement;
  $("sheetScrim").hidden = true;
  $("sheet").classList.remove("on");
  g.style.paddingBottom = "14px";
  if (sc && sheetScroll >= 0) sc.scrollTop = sheetScroll;
  sheetScroll = -1;
}

/* Reaching the little cross in the corner one-handed is a stretch on a phone, so
   both panels also close by dragging them down or tapping away from them. */
const SWIPE_CLOSE_PX = 60;

function enableSwipeDown(el, close, holdsOwnGesture, scrim){
  let startY = 0, dragging = false;

  function clear(){
    el.style.transition = "";
    el.style.transform = "";
    if (scrim) scrim.style.opacity = "";
  }

  el.addEventListener("pointerdown", function(e){
    if (holdsOwnGesture && holdsOwnGesture(e.target)) return;   // scrolling or typing
    dragging = true;
    startY = e.clientY;
    el.style.transition = "none";
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });

  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    const dy = e.clientY - startY;
    if (dy <= 0) return;                                        // downward only
    el.style.transform = "translateY(" + dy + "px)";
    // The backdrop thins out as the panel goes, so the two move together.
    if (scrim) scrim.style.opacity = String(Math.max(0, 1 - dy / (el.offsetHeight || 300)));
  });

  const release = function(e){
    if (!dragging) return;
    dragging = false;
    const dy = e.clientY - startY;

    if (dy <= SWIPE_CLOSE_PX){ clear(); return; }               // springs back

    // Carry on in the direction the finger was going, rather than snapping back to
    // the top and only then playing the close animation.
    let finished = false;
    const done = function(){
      if (finished) return;
      finished = true;
      el.removeEventListener("transitionend", done);
      clear();
      close();
    };
    el.style.transition = "transform .18s ease-in";
    el.style.transform = "translateY(" + (el.offsetHeight + 60) + "px)";
    if (scrim) scrim.style.opacity = "0";
    el.addEventListener("transitionend", done);
    setTimeout(done, 260);      // transitionend never fires if nothing actually moves
  };

  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

function dismissSheet(){ selPos = -1; closeSheet(); refreshRecall(); }

$("sheetScrim").onclick = dismissSheet;
enableSwipeDown($("sheet"), dismissSheet, function(t){
  return !!(t.closest && t.closest("#chips"));      // the word list scrolls on its own
}, $("sheetScrim"));
enableSwipeDown($("modalCard"), function(){ selPos = -1; closeModal(); refreshRecall(); }, function(t){
  return !!(t.closest && t.closest("input, button, textarea"));
});

// Every enlarged view of a drawing goes through here. The canvas keeps its fixed
// backing size and CSS scales it, so the strokes stay smooth however big it gets.
function paintPreview(cv, di){
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  paintStrokes(ctx, drawings[di] || [], cv.width, Math.max(3, cv.width * 0.025));
}

/* ----------------------------------------------------------- daily duel --- */

/* Two rounds are in play during a daily duel: yours and the one a friend sent.
   Whose round it is gets written into the day record when their link is opened, so
   the way between the two survives a reload. Nothing about it is held only in memory. */

// The round that is not on screen and still waiting to be guessed, or null.
function duelPartner(){
  const today = dailyDayNumber();
  if (!isDaily || dailyDay !== today) return null;
  const day = savedDay(today) || {};
  if (role === "guesser"){
    const ready = day.drawn && Array.isArray(day.words) && day.words.length === N;
    return ready && !day.done ? { mine: true } : null;
  }
  if (!day.duelCode || day.duelCode === lastCode) return null;
  const theirs = savedRound(day.duelCode) || {};
  return theirs.done ? null : { mine: false, code: day.duelCode, name: day.duelName || "" };
}

// Go to the other round. Both routes put it in the address bar, so a reload from
// there comes back to it.
function goToOther(){
  const other = duelPartner();
  if (!other) return;
  if (other.mine) resumeDaily(savedDay(dailyDay));
  else loadGame(other.code);
}

function showPick(){
  const day = savedDay(dailyDay) || {};
  $("pickTheirs").textContent = day.duelName
    ? TEXT.guessTheirsFirst.replace("{name}", day.duelName)
    : TEXT.guessMyself;
  show("pick");
}

$("gateHome").onclick = function(){ clearUrl(); show("home"); };
$("pickMine").onclick = function(){ resumeDaily(savedDay(dailyDayNumber())); };
$("pickTheirs").onclick = function(){
  const day = savedDay(dailyDayNumber()) || {};
  // After a reload on this screen the friend's round is already the one loaded.
  if (role === "guesser" && lastCode === day.duelCode) buildRecall();
  else if (day.duelCode) loadGame(day.duelCode);
};

function buildResult(){
  viewOnly = false;
  if (!recallMs) recallMs = elapsedMs();      // stop the clock before anything is drawn
  score = 0;
  order.forEach(function(di, pos){ if (isCorrect(picks[pos], words[di])) score++; });

  $("score").textContent = role === "guesser"
    ? ((drawerName ? TEXT.inDrawingsOf.replace("{whose}", whose(drawerName)) : TEXT.inTheseDrawings) + score + "/" + N)
    : TEXT.outOf.replace("{n}", N).replace("{score}", score);
  $("scoreSub").textContent = roundLabel() + " \u00b7 " + TEXT.totalTime + " " + timeLabel(elapsedMs());
  $("copyNote").textContent = "";
  $("fallback").style.display = "none";

  const g = $("resultGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    const ok = isCorrect(picks[pos], words[di]);
    cell.classList.add(ok ? "right" : "wrong");
    const cap = cell.querySelector(".cap");
    if (ok){
      const s = document.createElement("span");
      s.className = "good";
      s.textContent = words[di];
      cap.appendChild(s);
    } else {
      const bad = document.createElement("span");
      bad.className = "bad";
      bad.textContent = (picks[pos] && String(picks[pos]).trim()) ? picks[pos] : "—";
      const good = document.createElement("span");
      good.className = "good";
      good.textContent = words[di];
      cap.appendChild(bad);
      cap.appendChild(document.createElement("br"));
      cap.appendChild(good);
    }
    cell.classList.add("tappable");
    cell.onclick = function(){ openZoom(pos); };
    g.appendChild(cell);
  });

  $("again").textContent = role === "guesser" ? TEXT.youDrawToo : TEXT.playAgain;
  // One way to hand the round on: paylaş, which copies the score and the link
  // together. A second button beside it only made the two look like different things.
  $("reviewGuess").hidden = true;
  fillNameRow();
  // Record the finish before the board goes up: opening this code again on this
  // device should land here, on the score table, rather than on an empty grid.
  if (lastCode) rememberRound(lastCode, { done: true, score: score, ms: recallMs, order: order, picks: picks, name: myName });
  // No second attempt at the day: closing it here is what makes the score mean
  // something on a board everybody shares.
  if (onDayBoard()) rememberDay(dailyDay, { done: true, score: score, ms: recallMs, order: order, picks: picks });
  // During a daily duel, offer the other round. Asked after the finish is recorded,
  // and answered from storage, so it is still offered after a reload.
  const other = $("switchRound");
  const partner = duelPartner();
  other.hidden = !partner;
  if (partner){
    other.textContent = partner.mine ? TEXT.nowGuessMine
      : (partner.name ? TEXT.nowGuessTheirs.replace("{name}", partner.name) : TEXT.guessMyself);
  }
  showBoard();
  show("result");
  paintAll("resultGrid");
}
