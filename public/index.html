  /* ================================================================= base === */
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* manipulation keeps panning and pinch but kills double-tap zoom, which fired
     constantly while drawing fast. The pad itself stays touch-action:none. */
  html, body{touch-action:manipulation;}
  /* A drag that starts on a label must not select text mid-round. Inputs opt back in. */
  body{-webkit-user-select:none; -ms-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  /* keep [hidden] winning over rules that set display:flex/block */
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink);
    /* The dots sit on the body, which never scrolls, so a page slides over them without
       anything being repainted. */
    background-color:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, var(--dot) 1.15px, transparent 1.45px);
    background-size:22px 22px;
    font:16px/1.45 var(--text);
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  #app{
    height:100%;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    display:flex; flex-direction:column;
  }
  .screen{
    display:none; flex:1; min-height:0; flex-direction:column;
    padding-left:16px; padding-right:16px; box-sizing:border-box;
  }
  .screen.on{display:flex;}

  /* On a wide screen the game is a column down the middle, and it used to be that column
     that scrolled: the wheel did nothing anywhere else, because everything either side of
     it was the body, which does not scroll. So the scrolling element is the full width of
     the window now -- a wheel or a drag anywhere in it moves the page -- and it is the
     content inside that is held to a readable width and centred. Anything more specific
     comes after this and still wins, which is how #home keeps its narrower column. */
  .screen > *, .scroll > *{
    width:100%; max-width:600px; margin-left:auto; margin-right:auto;
  }
  /* A screen that scrolls is a flex column taller than itself, and a child with its own
     overflow clipped would be squeezed to nothing to make it fit -- which is what the
     board did. Only what is meant to give way (.scroll, the drawing stage) may shrink. */
  .screen > *{flex-shrink:0;}
  /* the scrolling one keeps the whole width; what is inside it is centred instead */
  .screen > .scroll{max-width:none;}
  #home, #send, #result{overflow-y:auto; -webkit-overflow-scrolling:touch;}

  .txt:focus-visible{outline:none;}
  .sr{position:absolute !important; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;}

  .i-home{--i:var(--i-home);} .i-check{--i:var(--i-check);} .i-user{--i:var(--i-user);}
  .i-grid{--i:var(--i-grid);} .i-exit{--i:var(--i-exit);} .i-chat{--i:var(--i-chat);}
  .i-sun{--i:var(--i-sun);} .i-moon{--i:var(--i-moon);} .i-auto{--i:var(--i-auto);}

  /* ============================================================== buttons ===
     Three weights and no more, so every screen says which one thing it wants: yellow and
     lifted for that thing, outlined and lifted for the other ways on, plain text for the
     ways out. Pressing one pushes it down onto its shadow, the way a key goes down. */
  .primary{
    position:relative; display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:58px; margin-top:22px; margin-bottom:0; padding:13px 22px;
    background:var(--hi); color:var(--on-hi);
    border:2.5px solid var(--hi-edge); border-radius:18px;
    box-shadow:0 5px 0 var(--hi-shadow);
    font:800 19px/1.15 var(--font); letter-spacing:-.005em; text-align:center;
    transition:transform .09s var(--ease), box-shadow .09s var(--ease), background-color .15s;
  }
  .primary:active{transform:translateY(4px); box-shadow:0 1px 0 var(--hi-shadow);}
  .primary.ic::before{width:23px; height:23px;}
  /* a primary button that is not ready to be pressed yet, but still takes a tap
     so it can say why */
  .primary.off, .primary:disabled{
    background:var(--panel2); color:var(--muted); border-color:var(--line2); box-shadow:0 5px 0 var(--line2);
  }
  button[disabled]{opacity:.55; cursor:default;}
  .primary:disabled{opacity:1;}

  .ghost{
    position:relative; display:flex; align-items:center; justify-content:center; gap:9px;
    width:100%; min-height:54px; padding:11px 18px;
    background:var(--panel); color:var(--ink);
    border:2px solid var(--edge); border-radius:17px;
    box-shadow:0 3px 0 var(--shadow);
    font:750 16.5px/1.2 var(--font); text-align:center;
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  .ghost:active{transform:translateY(3px); box-shadow:0 0 0 var(--shadow);}
  .ghost.ic::before{width:21px; height:21px;}
  .danger{color:var(--no);}
  @media (hover:hover){
    .primary:not(.off):not(:disabled):hover{background:var(--hi2);}
    .ghost:hover, .pill:hover, .back:hover, .chip:hover, .arow:hover, .diff:hover{background:var(--panel2);}
  }

  /* the little rounded ones along the top of the start screen, and the eraser */
  .pill{
    position:relative; display:inline-flex; align-items:center; gap:6px;
    min-height:38px; padding:6px 14px 6px 11px;
    background:var(--panel); color:var(--ink);
    border:2px solid var(--edge); border-radius:99px; box-shadow:0 2px 0 var(--shadow);
    font:750 14px/1 var(--font); white-space:nowrap;
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  .pill.ic::before{width:18px; height:18px;}
  .pill:active{transform:translateY(2px); box-shadow:none;}
  /* a 38px pill with a 46px place to land on */
  .pill::after{content:""; position:absolute; inset:-5px -2px;}

  .linkish, .linkbtn{
    display:flex; align-items:center; justify-content:center; gap:7px;
    width:auto; min-height:44px; margin:10px auto 0; padding:6px 12px;
    color:var(--muted); font:700 14px/1.2 var(--font);
  }
  .linkish{text-decoration:underline; text-decoration-thickness:1.5px; text-underline-offset:4px;}
  .linkish.ic::before{width:17px; height:17px;}
  .linkbtn{color:var(--ink); font-size:15px;}
  .linkbtn.ic::before{width:20px; height:20px;}

  .back{
    flex:none; width:44px; height:44px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    background:var(--panel); color:var(--ink);
    border:2px solid var(--edge); box-shadow:0 3px 0 var(--shadow);
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  .back.ic::before{width:22px; height:22px;}
  .back:active{transform:translateY(3px); box-shadow:none;}

  /* =============================================================== fields === */
  .txt{
    width:100%; min-height:54px; padding:13px 16px;
    background:var(--panel); color:var(--ink);
    border:2px solid var(--line2); border-radius:16px; outline:none;
    font:600 17px/1.25 var(--text);
    transition:border-color .15s, box-shadow .15s;
  }
  .txt::placeholder{color:var(--muted); opacity:1; font-weight:500;}
  .txt:focus{border-color:var(--ink); box-shadow:0 0 0 4px var(--hi-soft);}
  .err{color:var(--no); font:700 14px/1.35 var(--font); margin:10px 0 0; min-height:19px;}
  .nlabel{display:flex; align-items:center; gap:7px; color:var(--ink); font:800 14.5px/1.2 var(--font); margin:0 0 9px;}
  .nlabel.ic::before{width:19px; height:19px;}
  .shint{color:var(--muted); font:650 12.5px/1.3 var(--font); margin:4px 0 0;}

  /* the time a word gets. A fat pill that fills with yellow up to the chosen second, so
     the choice reads as an amount rather than as a dot on a line. */
  input[type="range"]{
    -webkit-appearance:none; appearance:none; display:block;
    width:100%; height:46px; margin:12px 0 6px; padding:0;
    background:var(--sunk); border:2px solid var(--edge); border-radius:15px;
    overflow:hidden; cursor:pointer; touch-action:manipulation;
  }
  input[type="range"]::-webkit-slider-runnable-track{height:100%; background:transparent;}
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; appearance:none; width:26px; height:42px; border-radius:11px;
    background:var(--panel);
    /* The yellow is the thumb's own shadow thrown off to the left, clipped by the pill:
       a filled track with no script to keep it in step. It ends at the thumb's middle, so
       none of it shows past the thumb's rounded right side. */
    box-shadow:calc(-100vw - 13px) 0 0 100vw var(--hi), inset 0 0 0 2px var(--edge);
    background-image:linear-gradient(90deg, transparent 9px, var(--line2) 9px, var(--line2) 11px, transparent 11px, transparent 15px, var(--line2) 15px, var(--line2) 17px, transparent 17px);
    background-size:100% 14px; background-repeat:no-repeat; background-position:center;
  }
  input[type="range"]::-moz-range-track{height:100%; background:transparent; border:none;}
  input[type="range"]::-moz-range-progress{height:100%; background:var(--hi);}
  input[type="range"]::-moz-range-thumb{
    width:24px; height:40px; border-radius:11px; background:var(--panel);
    border:2px solid var(--edge); box-sizing:border-box;
  }
  input[type="range"]:focus-visible{outline:3px solid var(--focus); outline-offset:3px;}
  .srow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px;}
  .srow .lbl{color:var(--muted); font:750 14.5px/1.2 var(--font);}
  .srow output{font:900 26px/1 var(--font); font-variant-numeric:tabular-nums; letter-spacing:-.02em;}
  /* önerilen: 3 sn, pinned under the 3 on the pill -- (3 - 1) / 9 of the way along the
     thumb's travel -- so the recommendation is a place, not a sentence. */
  .settings{position:relative; padding-bottom:22px;}
  .settings .shint{
    position:absolute; left:calc(15px + (100% - 30px) * 2 / 9); bottom:0; transform:translateX(-50%);
    margin:0; white-space:nowrap; display:flex; flex-direction:column; align-items:center;
  }
  .settings .shint::before{
    content:""; width:0; height:0; margin:0 0 2px;
    border:5px solid transparent; border-top:0; border-bottom:6px solid var(--muted);
  }

  /* ================================================================ cards === */
  .card{
    background:var(--panel); border:2px solid var(--edge); border-radius:24px;
    box-shadow:0 5px 0 var(--shadow); padding:18px;
  }
  .over{
    display:flex; align-items:center; gap:8px; margin:0 0 12px;
    font:850 17px/1.2 var(--font); letter-spacing:-.01em; color:var(--ink);
  }
  .over.ic::before{width:22px; height:22px;}

  /* ============================================================ home screen ===
     "safe centre": drops the centring when the viewport is short, otherwise the top gets
     clipped with no way to scroll to it. */
  #home{justify-content:center; justify-content:safe center;}
  .hwrap{width:100%; max-width:440px; margin:0 auto; padding:14px 0 30px; flex:none;}
  /* The first screen holds the wordmark and the day's game and nothing more: the page used
     to open on everything at once, which was a lot to take in. The wordmark and its line sit
     in the middle of the screen with the day's card whole beneath them, and sınırsız and the
     rest are a scroll away -- but the top 24px of the sınırsız card is left showing at the
     bottom, its corners and edge and none of its words, so it is plain there is more and
     what it is takes a scroll to find out. The pills above and the card below share what the
     wordmark leaves, four parts to five, which sets it a little above the middle: a mark at
     the exact centre, with a heavy card under it, looks as if it sits low. Neither part
     shrinks below what it holds, so on a short screen the wordmark moves up rather than the
     card being cut off. The height is the screen's, less the column's 14px top padding,
     those 24px and the phone's safe areas. */
  .hhero{
    display:flex; flex-direction:column; padding-bottom:22px;
    min-height:calc(100vh - 38px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    min-height:calc(100svh - 38px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
  }
  .hhero > .htop{flex:4 1 0; align-items:flex-start;}
  .hhero > .hlow{flex:5 1 0;}
  .htop{display:flex; justify-content:space-between; gap:10px; margin:0 0 6px;}
  .brand{display:flex; justify-content:center; margin:6px 0 0;}
  .mark{display:block; width:min(236px, 64vw); height:auto; overflow:visible;}
  .mark path{fill:none; stroke:var(--ink); stroke-width:13; stroke-linecap:round; stroke-linejoin:round;}
  .mark .sw{stroke:var(--hi); stroke-width:11;}
  .mark .dot{fill:var(--hi); stroke:var(--ink); stroke-width:4;}
  /* The wordmark draws itself once, on arrival: a pencil game should open with a pencil
     moving. The class goes on as the page comes on screen (below) and comes off after it
     has played, so a return to the start screen finds the wordmark simply there. */
  .intro .mark .s, .intro .mark .sw{stroke-dasharray:1 2; animation:ink .42s var(--ease) both;}
  .intro .mark .s1{animation-delay:.05s;} .intro .mark .s2{animation-delay:.32s; animation-duration:.26s;}
  .intro .mark .s3{animation-delay:.5s;} .intro .mark .s4{animation-delay:.78s; animation-duration:.2s;}
  .intro .mark .s5{animation-delay:.92s;} .intro .mark .s6{animation-delay:1.16s;}
  .intro .mark .sw{animation-delay:1.4s; animation-duration:.5s;}
  .intro .mark .dot{transform-origin:131px 31px; animation:dotpop .42s var(--spring) 1.02s both;}
  @keyframes ink{0%{stroke-dashoffset:1; opacity:0} 1%{opacity:1} 100%{stroke-dashoffset:0; opacity:1}}
  @keyframes dotpop{0%{transform:scale(0)} 100%{transform:scale(1)}}
  /* Every word on the page, the day's leaf and the screen to show are put in by the script
     at the end of the file, and a phone paints before that script has run. A reload showed
     the start screen with no words for a moment -- inside a round too -- then jumped into
     place, with the wordmark already drawing over the jump. So the page stays off screen
     until the script has filled it in, and the wordmark starts drawing as it comes on. Were
     the script ever to fail, the page would show after 2s anyway, the wordmark just there. */
  .boot #app{visibility:hidden; animation:unhold 0s 2s forwards;}
  @keyframes unhold{to{visibility:visible}}
  .tagline{
    color:var(--muted); font:750 17px/1.4 var(--font); text-align:center;
    margin:2px 0 22px;
  }
  /* The start screen holds two different games: the day's puzzle, one go for
     everybody on the same words, and the one you can play as often as you like.
     They are kept apart so neither is read as a setting of the other. */
  .hsec{margin:0 0 20px;}
  .hsec:last-child{margin-bottom:0;}

  /* the day, as a leaf torn off a wall calendar */
  #dailyRow{display:flex; align-items:center; gap:16px;}
  .leaf{
    position:relative; flex:none; width:78px; text-align:center;
    background:#FFFFFF; color:#1D1B18; border:2px solid var(--edge); border-radius:14px;
    box-shadow:0 3px 0 var(--shadow); transform:rotate(-3deg);
  }
  .leaf span{display:block;}
  #leafDay{
    background:#D7372B; color:#FFFFFF; font:800 11px/1 var(--font); letter-spacing:.02em;
    padding:7px 2px 6px; border-bottom:2px solid var(--edge); border-radius:12px 12px 0 0;
  }
  #leafNum{display:block; font:900 34px/1 var(--font); letter-spacing:-.04em; padding:7px 0 1px; font-variant-numeric:tabular-nums;}
  #leafMon{font:750 12px/1 var(--font); color:#6B6459; padding:0 0 9px;}
  /* played: stamped */
  .leaf::after{
    content:""; position:absolute; right:-11px; bottom:-11px; width:34px; height:34px; border-radius:50%;
    background:var(--ok); border:2.5px solid var(--panel); opacity:0; transform:scale(.4) rotate(-20deg);
    transition:opacity .2s, transform .3s var(--spring);
  }
  .leaf::before{
    content:""; position:absolute; z-index:1; right:-3px; bottom:-3px; width:18px; height:18px;
    background:var(--on-ok); opacity:0;
    -webkit-mask:var(--i-check-b) center/contain no-repeat; mask:var(--i-check-b) center/contain no-repeat;
    transition:opacity .2s .08s;
  }
  .daily:has(#dailyGo.done) .leaf::after{opacity:1; transform:none;}
  .daily:has(#dailyGo.done) .leaf::before{opacity:1;}
  .dtext{flex:1; min-width:0;}
  .dtitle{font:900 23px/1.1 var(--font); letter-spacing:-.02em;}
  #dailyState{
    display:flex; align-items:center; gap:6px; margin-top:7px;
    color:var(--muted); font:750 15px/1.2 var(--font); font-variant-numeric:tabular-nums;
  }
  #dailyState::before{
    content:""; flex:none; width:18px; height:18px; background:currentColor;
    -webkit-mask:var(--i-clock) center/contain no-repeat; mask:var(--i-clock) center/contain no-repeat;
  }
  .daily:has(#dailyGo.done) #dailyState{color:var(--ok);}
  .daily:has(#dailyGo.done) #dailyState::before{-webkit-mask-image:var(--i-check); mask-image:var(--i-check);}
  #dailyGo{margin-top:18px;}
  /* Once the day is played the button is no longer the thing to press: it becomes the way
     to the board, and the yellow moves down to sınırsız. */
  #dailyGo.done{
    --i:var(--i-trophy);
    background:var(--panel); color:var(--ink); border:2px solid var(--edge);
    box-shadow:0 3px 0 var(--shadow); min-height:54px; font-size:17px;
  }
  #dailyGo.done:active{transform:translateY(3px); box-shadow:none;}
  #dailyBoard{margin:10px auto -6px;}

  /* sınırsız. Until the day has been played, başla is the second thing on this screen,
     not a second first thing: two yellow buttons would each say "press me" and neither
     would be heard. */
  #start{margin-top:14px;}
  .hwrap:not(:has(#dailyGo.done)) #start{
    background:var(--panel); color:var(--ink); border:2px solid var(--edge);
    box-shadow:0 3px 0 var(--shadow); min-height:54px; font-size:17px;
  }
  .hwrap:not(:has(#dailyGo.done)) #start:active{transform:translateY(3px); box-shadow:none;}
  @media (hover:hover){ .hwrap:not(:has(#dailyGo.done)) #start:hover{background:var(--panel2);} }

  /* joining with a code: a ticket stub under the dashed line */
  #joinRow{display:flex; gap:10px; margin-top:18px; padding-top:18px; border-top:2px dashed var(--line2);}
  #joinCode{
    flex:1; min-width:0; text-align:center; text-transform:uppercase;
    font:800 21px/1 var(--mono); letter-spacing:.34em; text-indent:.34em; padding:12px 8px;
  }
  #joinCode::placeholder{font:650 16px/1 var(--font); letter-spacing:normal; text-indent:0; text-transform:none;}
  #joinGo{
    flex:none; min-width:96px; padding:0 18px; border-radius:16px;
    background:var(--panel); border:2px solid var(--edge); box-shadow:0 3px 0 var(--shadow);
    font:800 16px/1 var(--font);
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  #joinGo:active{transform:translateY(3px); box-shadow:none;}
  #joinErr{margin:8px 0 0; min-height:0;}
  #joinErr:empty{display:none;}

  /* arşiv: every round this device has, each with its twenty drawings */
  .arow{
    display:block; width:100%; text-align:left; margin:0 0 12px; padding:13px 13px 11px;
    background:var(--panel); border:2px solid var(--edge); border-radius:20px;
    box-shadow:0 4px 0 var(--shadow);
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  .arow:active{transform:translateY(3px); box-shadow:0 1px 0 var(--shadow);}
  .ahead{display:flex; align-items:center; gap:8px; margin:0 0 10px; font-family:var(--font);}
  .ahead .awhen{font:850 15px/1 var(--font); font-variant-numeric:tabular-nums;}
  .ahead .awho{
    flex:none; max-width:50%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    color:var(--muted); font:750 12.5px/1 var(--font); padding:5px 9px; border-radius:99px; background:var(--panel2);
  }
  .ahead .ascore{
    margin-left:auto; font:900 15px/1 var(--font); font-variant-numeric:tabular-nums;
    padding:5px 9px; border-radius:9px; background:var(--panel2);
  }
  .acode{margin-top:9px; font:750 12px/1 var(--mono); letter-spacing:.12em; color:var(--muted);}
  /* the twenty drawings, in the same four across the round itself uses */
  .astrip{display:grid; grid-template-columns:repeat(10,1fr); gap:4px;}
  .athumb{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:5px;
    overflow:hidden; background:var(--paper); box-shadow:inset 0 0 0 1.5px var(--line2);
  }
  .athumb canvas{position:absolute; inset:0; width:100%; height:100%;}
  #archiveEmpty{color:var(--muted); font-size:15px; margin-top:0; margin-bottom:0; text-align:center; padding:30px 0;}
  #archiveOpen{margin-top:4px;}
  #archiveScreen .scroll{padding-bottom:20px;}

  /* Theme belongs to the app, not to the round about to be played, so it sits at the
     foot of the screen rather than among the settings for a game. */
  #themeSec{margin-top:28px; padding-top:18px; border-top:2px dashed var(--line2);}
  #themeSec .lbl{display:block; color:var(--muted); font:750 14px/1 var(--font); margin:0 0 10px;}
  #themeSec .seg + .lbl{margin-top:18px;}
  #themeSec .foot{margin:2px 0 0; text-align:center; color:var(--muted); font:600 12px/1.4 var(--font);}
  .seg{display:flex; gap:4px; padding:4px; border-radius:16px; background:var(--panel2); box-shadow:inset 0 0 0 2px var(--line);}
  .seg button{
    flex:1; display:flex; align-items:center; justify-content:center; gap:6px;
    min-height:44px; padding:6px 8px; border-radius:12px;
    color:var(--muted); font:750 14.5px/1 var(--font);
  }
  .seg button.ic::before{width:18px; height:18px;}
  .seg button.sel{background:var(--panel); color:var(--ink); box-shadow:inset 0 0 0 2px var(--edge), 0 2px 0 var(--shadow);}

  /* A few doodles on the desk behind the start screen. On a wide screen they sit in the
     margins at full size; on a phone they are smaller and fainter, and the cards slide
     over them, so they show in the gaps without getting in the way of anything to read. */
  .doodles{display:block; position:fixed; inset:0; pointer-events:none; max-width:none; margin:0; z-index:0; opacity:.6;}
  .doodles svg{position:absolute; width:58px; height:58px; overflow:visible;}
  .doodles path, .doodles circle, .doodles rect{fill:none; stroke:var(--line2); stroke-width:4.5; stroke-linecap:round; stroke-linejoin:round;}
  .hwrap{position:relative; z-index:1;}
  /* The places written on each doodle are for the wide screen's margins; on a phone most of
     them fall behind the day's card. Here they gather in the open paper instead: the band
     between the buttons at the top and the wordmark, and either side of the wordmark. */
  @media (max-width:979.98px), (max-height:619.98px){
    .doodles svg:nth-child(1){left:6% !important;  top:11% !important;}
    .doodles svg:nth-child(2){left:30% !important; top:18% !important;}
    .doodles svg:nth-child(3){left:2% !important;  top:41% !important;}
    .doodles svg:nth-child(4){right:7% !important; top:10% !important;}
    .doodles svg:nth-child(5){right:1% !important; top:40% !important;}
    .doodles svg:nth-child(6){right:24% !important; top:19% !important;}
  }
  @media (min-width:980px) and (min-height:620px){
    .doodles{opacity:1;}
    .doodles svg{width:120px; height:120px;}
    .doodles path, .doodles circle, .doodles rect{stroke-width:3.5;}
  }

  /* ============================================================ countdown === */
  #countdown{align-items:center; justify-content:center;}
  /* The screen centres this by flex, which only worked while the box was as wide as the
     number. It is as wide as the screen now, like every other child of a screen, so the
     number is centred in it rather than by it. */
  #cdNum{
    font:900 min(30vh, 54vw)/1 var(--font); letter-spacing:-.05em; text-align:center;
    font-variant-numeric:tabular-nums;
  }
  #cdNum.pop{animation:pop .34s var(--spring);}
  @keyframes pop{from{transform:scale(.55); opacity:.1} to{transform:scale(1); opacity:1}}

  /* ================================================================= draw === */
  #draw{padding-top:12px;}
  /* One fixed height, whatever the word: the header shrinking or growing under a long
     one would move the paper between words, under a pen that is already on its way. */
  .drawtop{display:flex; align-items:center; gap:12px; height:50px;}
  .headrow{display:flex; align-items:center; gap:12px;}
  #word{
    flex:1; min-width:0; font:900 32px/1.1 var(--font); letter-spacing:-.025em;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  }
  .drawmeta{flex:none; display:flex; flex-direction:column; align-items:flex-end; gap:4px;}
  #counter{
    font:850 14.5px/1 var(--font); font-variant-numeric:tabular-nums; white-space:nowrap;
    padding:6px 10px; border-radius:99px; background:var(--panel);
    border:2px solid var(--edge); box-shadow:0 2px 0 var(--shadow);
  }
  #drawLevel{margin:0; color:var(--muted); font:750 12px/1 var(--font); padding-right:4px;}
  /* the time left for this word, as a gauge in a pencil outline */
  #track{
    position:relative; height:14px; margin-top:14px; margin-bottom:12px; overflow:hidden;
    border:2px solid var(--edge); border-radius:99px; background:var(--sunk);
  }
  #bar{height:100%; background:var(--hi); transform-origin:left center; transform:scaleX(1);}
  #clearPad{align-self:center; width:auto; margin:0 auto 14px;}
  #clearPad.ic::before{width:19px; height:19px;}
  /* No padding: sizePad takes the square from the stage's client size, which counts padding,
     so any would make the paper bigger than its room and push it up over the eraser. The
     space for the shadow is a margin instead. */
  #stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:0; margin-bottom:20px;}
  #pad{
    background:var(--paper); border:2.5px solid var(--edge); border-radius:22px;
    box-shadow:0 6px 0 var(--shadow); touch-action:none; display:block;
  }

  /* The word alone for a second, centred on the paper it is about to be drawn on, then
     gone. Transparent, so the paper shows behind it, and the word in the header never
     leaves. The layer is laid over the square and takes the taps until the fade begins.
     REVEAL_EDGE below keeps the same gap on either side; the size is measured to fit. */
  #reveal{
    /* Laid over the drawing square, which is where the word belongs: the square sits
       below the header and the bar, so centring on the screen reads high on the paper.
       The box is set in revealThenDraw, from the square's own measurements. */
    position:fixed; z-index:35; display:none;
    align-items:center; justify-content:center;
    /* The pen is never blocked: the word is something to read, not a door to wait at. */
    pointer-events:none;
  }
  #reveal.on{display:flex; animation:reveal .22s var(--ease);}
  @keyframes reveal{from{transform:scale(.94); opacity:.4} to{transform:none; opacity:1}}
  #revealWord{
    font-family:var(--font); font-weight:900; letter-spacing:-.03em; line-height:1.05;
    text-align:center; color:var(--pen);
    /* Break between words, never inside one: a word split across lines is unreadable,
       and it let the fitter keep a size that did not really fit. */
    word-break:normal; overflow-wrap:normal; hyphens:none;
  }

  /* ======================================================= middle screens === */
  .mid{align-items:center; justify-content:center; text-align:center;}
  .mid h2{font:900 30px/1.12 var(--font); letter-spacing:-.025em; margin:0 0 8px;}
  /* The screen's own sentence only: a field's label, hint and error inside it keep their
     own look, or "önce adını yaz." came out grey instead of red. */
  .mid > p, .mid .stack > p{color:var(--muted); margin:0 0 24px; font-size:16px;}
  .mid > p:empty, .mid .stack > p:empty{display:none;}
  .mid .stack{width:100%; max-width:360px;}
  .mid .stack .primary{margin:0 0 12px;}
  .mid .stack .ghost + .ghost{margin-top:10px;}
  .screen > .art{display:block; width:min(190px, 52vw); height:auto; margin:0 auto 20px; overflow:visible;}
  .art .k{fill:none; stroke:var(--ink); stroke-width:4; stroke-linecap:round; stroke-linejoin:round;}
  .art .p{fill:var(--paper); stroke:var(--edge); stroke-width:3.5; stroke-linejoin:round;}
  .art .y{fill:var(--hi); stroke:var(--edge); stroke-width:3.5; stroke-linejoin:round;}
  .art .m{fill:none; stroke:var(--muted); stroke-width:3; stroke-linecap:round; stroke-dasharray:2 7;}
  .art .tick-edge{fill:none; stroke:var(--edge); stroke-width:15; stroke-linecap:round; stroke-linejoin:round;}
  .art .tick{fill:none; stroke:var(--hi); stroke-width:9; stroke-linecap:round; stroke-linejoin:round;}
  .art .draw{stroke-dasharray:1 2; animation:ink .55s var(--ease) .3s both;}
  #between.on .art .fan1{animation:fan1 .5s var(--spring) both;}
  #between.on .art .fan2{animation:fan2 .5s var(--spring) .06s both;}
  @keyframes fan1{from{transform:rotate(0)} to{transform:rotate(-9deg)}}
  @keyframes fan2{from{transform:rotate(0)} to{transform:rotate(7deg)}}
  .art .fan1{transform-origin:100px 130px; transform:rotate(-9deg);}
  .art .fan2{transform-origin:100px 130px; transform:rotate(7deg);}

  /* kolay or zor, side by side, the way the choice is made */
  .diffs{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:0 0 16px;}
  .diff{
    position:relative; display:flex; flex-direction:column; align-items:flex-start;
    padding:14px 14px 16px; text-align:left;
    background:var(--panel); border:2px solid var(--edge); border-radius:20px;
    box-shadow:0 4px 0 var(--shadow);
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  .diff:active{transform:translateY(3px); box-shadow:0 1px 0 var(--shadow);}
  .diff::before{content:""; width:46px; height:46px; border-radius:14px; background:var(--ok-soft); margin:0 0 12px;}
  .diff::after{
    content:""; position:absolute; top:24px; left:24px; width:26px; height:26px; background:var(--ok);
    -webkit-mask:var(--i-tags) center/contain no-repeat; mask:var(--i-tags) center/contain no-repeat;
  }
  .diff[data-mode="typed"]::before{background:var(--no-soft);}
  .diff[data-mode="typed"]::after{background:var(--no); -webkit-mask-image:var(--i-keyboard); mask-image:var(--i-keyboard);}
  .diff .mtag{
    position:absolute; top:14px; right:12px; padding:5px 9px; border-radius:99px;
    background:var(--ok-soft); color:var(--ok); font:850 12.5px/1 var(--font);
  }
  .diff[data-mode="typed"] .mtag{background:var(--no-soft); color:var(--no);}
  .diff .mname{display:block; font:850 17px/1.15 var(--font); letter-spacing:-.01em;}
  .diff .mdesc{display:block; margin-top:5px; color:var(--muted); font:600 13px/1.35 var(--text);}
  #chooseModes{margin:6px 0 14px; text-align:left;}
  /* the language to guess in: two small flags in the corner, the one in use lifted and
     the other faded, so a tap on it plainly changes something */
  .flags{display:flex; justify-content:flex-end; gap:8px; margin:0 0 2px;}
  .flags button{
    position:relative; width:36px; height:24px; padding:0; border-radius:6px;
    border:2px solid var(--line2); opacity:.45; transition:opacity .15s;
  }
  .flags button.sel{opacity:1; border-color:var(--edge); box-shadow:0 2px 0 var(--shadow);}
  .flags button svg{display:block; width:100%; height:100%; border-radius:4px; overflow:hidden;}
  /* a 24px flag with a 44px place to land on */
  .flags button::after{content:""; position:absolute; inset:-10px -4px;}
  #chooseName{margin:0 0 18px; text-align:left;}
  #chooseName .txt{margin:0;}
  #chooseName .shint{margin:7px 0 0;}
  #chooseNameErr{margin:6px 0 0;}
  #chooseNameErr:empty{display:none;}
  /* the field the error is about says so too */
  #chooseName:has(#chooseNameErr:not(:empty)) .txt{border-color:var(--no); box-shadow:0 0 0 4px var(--no-soft);}

  /* ================================================================== send === */
  #send .wrap{margin-top:auto; margin-bottom:auto; padding:22px 0;}
  #send h2{font:900 29px/1.12 var(--font); letter-spacing:-.025em; margin:0 0 8px;}
  #send p{color:var(--muted); margin:0 0 20px;}
  #sendName{margin:0 0 4px;}
  #sendBack{margin-top:12px;}
  #sendForm .art, #sendDone .art{display:block; width:min(170px, 46vw); height:auto; margin:0 0 16px; overflow:visible;}
  /* the code as a paper ticket stub, punched either side. Paper, not yellow: it is the
     thing to hand over, and the yellow belongs to the button that hands it over. */
  #code{
    position:relative; margin:0 0 12px; padding:24px 10px 22px;
    background:var(--paper); color:var(--pen);
    border:2.5px solid var(--edge); border-radius:20px; box-shadow:0 5px 0 var(--shadow);
    outline:2px dashed var(--line2); outline-offset:-10px;
    font:900 50px/1 var(--mono); letter-spacing:.22em; text-indent:.22em; text-align:center;
  }
  #code::before, #code::after{
    content:""; position:absolute; top:50%; width:26px; height:26px; margin-top:-13px; border-radius:50%;
    background:var(--bg); border:2.5px solid var(--edge);
  }
  #code::before{left:-14px; clip-path:inset(0 0 0 50%);}
  #code::after{right:-14px; clip-path:inset(0 50% 0 0);}
  #link{
    display:block; width:100%; margin-bottom:14px; padding:12px 14px; border-radius:14px;
    background:var(--panel2); color:var(--muted); text-align:center; word-break:break-all;
    font:600 13.5px/1.4 var(--mono);
  }
  #linkCopy{margin:0 0 6px;}
  #linkNote{color:var(--ok); text-align:center; min-height:0; margin:8px 0 6px;}
  #linkNote:empty{display:none;}
  #noStore{margin:0 0 12px;}
  #doneRecall{margin:10px 0 10px;}
  .spin{display:flex; flex-direction:column; align-items:center; gap:14px; color:var(--muted); font:750 16px var(--font); padding:30px 0;}

  /* ============================================================== loading === */
  .loader .k{stroke-dasharray:1 2; animation:scribble 1.6s var(--ease) infinite;}
  @keyframes scribble{
    0%{stroke-dashoffset:1} 55%{stroke-dashoffset:0} 100%{stroke-dashoffset:-1}
  }
  .spin .loader{width:120px; height:auto;}
  #loading .broken{display:none;}
  #loading:has(#loadHome:not([hidden])) .broken{display:block;}
  #loading:has(#loadHome:not([hidden])) .loader{display:none;}
  #loading .stack{margin-top:10px;}
  #loadReport{margin-top:14px;}
  #answersSub{color:var(--ink); font:900 20px/1 var(--font); font-variant-numeric:tabular-nums;}
  #pick h2{margin-bottom:22px;}

  /* ======================================================= recall + result === */
  .head{padding:14px 0 12px;}
  .head h2{font:900 25px/1.15 var(--font); letter-spacing:-.02em; margin:0;}
  .head p{color:var(--muted); margin:8px 0 0; font-size:14.5px;}
  .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #result .scroll{flex:none; overflow:visible;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 9px; padding-bottom:14px;}
  @media (min-width:520px){ .grid{grid-template-columns:repeat(5,1fr); gap:14px 12px;} }

  /* the difficulty caption on the drawing and result screens */
  .lvl{
    text-align:center; font:750 12.5px/1.3 var(--font); letter-spacing:.01em;
    color:var(--muted); margin-top:12px; margin-bottom:2px; flex:none;
  }

  /* The title has to give way, not the chip: without min-width:0 a flex item will
     not shrink past its longest word, and the chip was pushed off the screen. */
  .headrow h2{min-width:0;}
  /* The round code, in the corner of the header, from the moment guessing starts:
     people want to play the same round together without going and finding it. */
  .chip2{
    flex:none; margin-left:auto; display:flex; align-items:center; gap:7px;
    min-height:44px; padding:5px 12px; border-radius:99px;
    background:var(--panel); color:var(--ink); border:2px solid var(--edge); box-shadow:0 2px 0 var(--shadow);
    transition:transform .09s var(--ease), box-shadow .09s var(--ease);
  }
  .chip2:active{transform:translateY(2px); box-shadow:none;}
  .chip2 .cc{font:850 14.5px/1 var(--mono); letter-spacing:.1em;}
  .chip2 .cl{display:flex; align-items:center; gap:4px; font:750 12.5px/1 var(--font); white-space:nowrap;}
  .chip2 .cl::before{
    content:""; width:15px; height:15px; background:currentColor;
    -webkit-mask:var(--i-share) center/contain no-repeat; mask:var(--i-share) center/contain no-repeat;
  }

  .cell{position:relative; text-align:center;}
  .box{
    position:relative; width:100%; aspect-ratio:1/1; overflow:hidden; background:var(--paper);
    border:2px solid var(--line2); border-radius:14px; box-shadow:0 3px 0 var(--line2);
    transition:transform .14s var(--ease), box-shadow .14s var(--ease), border-color .14s;
  }
  .cell.tappable, #recallGrid .cell{cursor:pointer;}
  #recallGrid .cell:active .box{transform:translateY(2px); box-shadow:0 1px 0 var(--line2);}
  .cell.sel .box{
    border-color:var(--ink); transform:translateY(-3px);
    box-shadow:0 0 0 4px var(--hi), 0 5px 0 4px var(--hi);
  }
  /* An answered drawing says so three ways, because in the dark theme a light frame round
     light paper was all but invisible: a pencil badge in its corner, its word on a solid
     yellow label, and a frame in --done, graphite by day and yellow at night. */
  .cell.done .box{border-color:var(--done); box-shadow:0 3px 0 var(--done);}
  .cell.done .box::before{
    content:""; position:absolute; z-index:1; top:4px; right:4px; width:20px; height:20px;
    border-radius:50%; background:var(--hi); box-shadow:0 0 0 2px var(--paper);
  }
  .cell.done .box::after{
    content:""; position:absolute; z-index:2; top:4px; right:4px; width:20px; height:20px; background:var(--on-hi);
    -webkit-mask:var(--i-pencil) center/12px no-repeat; mask:var(--i-pencil) center/12px no-repeat;
  }
  /* A right answer is framed green. A wrong one keeps a plain frame and says so with its
     cross and its struck-out word: a bad round framed in red twenty times over read as
     being told off, in a game that is meant to be laughed at. */
  .cell.right .box{border-color:var(--ok); box-shadow:0 3px 0 var(--ok);}
  .cell.wrong .box{border-color:var(--line2); box-shadow:0 3px 0 var(--line2);}
  /* A tick or a cross in the corner as well as the colour, so the marking does not
     depend on telling red from green. */
  .cell.right .box::before, .cell.wrong .box::before{
    content:""; position:absolute; z-index:1; top:4px; right:4px; width:19px; height:19px;
    border-radius:50%; background:var(--ok);
  }
  .cell.wrong .box::before{background:var(--no);}
  .cell.right .box::after, .cell.wrong .box::after{
    content:""; position:absolute; z-index:2; top:4px; right:4px; width:19px; height:19px;
    background:var(--on-ok);
    -webkit-mask:var(--i-check-b) center/12px no-repeat; mask:var(--i-check-b) center/12px no-repeat;
  }
  .cell.wrong .box::after{background:var(--on-no); -webkit-mask-image:var(--i-x-b); mask-image:var(--i-x-b);}
  .box canvas{position:absolute; inset:0; width:100%; height:100%;}
  /* cell number - dark, because it sits on the paper */
  .num{
    position:absolute; top:4px; left:6px; font:800 11px/1 var(--font);
    color:#ADA595; font-variant-numeric:tabular-nums; pointer-events:none;
  }
  .cap{font:700 12.5px/1.25 var(--font); margin-top:6px; min-height:16px; word-break:break-word;}
  .cap .bad{color:var(--no); text-decoration:line-through; text-decoration-thickness:1.5px;}
  .cap .good{color:var(--ok); font-weight:850;}
  /* what was picked, on a label: solid, so it reads on either theme */
  .cap .pick{
    display:inline-block; font-weight:850; padding:2px 7px 3px; border-radius:7px;
    background:var(--hi); color:var(--on-hi);
    -webkit-box-decoration-break:clone; box-decoration-break:clone;
  }

  /* the foot of the grid: how far along, and the way to finish */
  .foot{display:flex; align-items:center; gap:14px; padding:12px 0 14px; border-top:2px solid var(--line);}
  .prog{flex:none; width:90px; display:flex; flex-direction:column; gap:7px;}
  .foot .count{font:850 16px/1 var(--font); font-variant-numeric:tabular-nums;}
  .pbar{display:block; height:8px; border-radius:99px; background:var(--line); overflow:hidden;}
  .pbar i{display:block; height:100%; width:calc(var(--done, 0) * 100%); background:var(--hi); border-radius:99px; transition:width .3s var(--ease);}
  .foot .primary{margin:0; flex:1; min-height:54px; padding:12px;}
  /* Finishing is always allowed -- a blank counts as wrong -- but it only turns yellow once
     every drawing has an answer, which is when it has become the thing to do. */
  #recall:has(.cell:not(.done)) #finish{
    background:var(--panel); color:var(--ink); border:2px solid var(--edge); box-shadow:0 3px 0 var(--shadow);
  }
  #recall:has(.cell:not(.done)) #finish:active{transform:translateY(3px); box-shadow:none;}

  /* ============================================================ word pool ===
     a bottom sheet with the drawing large and the words left to give it */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:20; width:100%; max-width:640px; margin:0 auto;
    background:var(--panel); border:2px solid var(--edge); border-bottom:none;
    border-radius:28px 28px 0 0; box-shadow:0 -12px 40px rgba(0,0,0,.18);
    padding:10px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(105%); visibility:hidden;
    transition:transform .22s var(--ease), visibility 0s .22s;
  }
  #sheet.on{transform:translateY(0); visibility:visible; transition:transform .24s var(--ease), visibility 0s;}
  /* Tapping away from the sheet should close it. A scrim does that without the
     tap also landing on whatever cell happens to be underneath. */
  #sheetScrim{position:fixed; inset:0; z-index:19; background:var(--scrim); opacity:.7; transition:opacity .18s ease-out;}
  .grab{width:46px; height:5px; border-radius:99px; background:var(--line2); margin:0 auto 12px; flex:none; cursor:grab;}
  #modalCard .grab{margin-bottom:14px;}
  /* The card itself scrolls once the keyboard shrinks it, so only the handle and
     the drawing give their vertical gesture to the drag. */
  #modalCard .grab, #modalPrev{touch-action:none;}
  #sheet .row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #sheet .row b{font:900 20px/1 var(--font); letter-spacing:-.01em;}
  #sheet .x{
    width:44px; height:44px; border-radius:14px; display:flex; align-items:center; justify-content:center;
    color:var(--ink); background:var(--panel2);
  }
  #sheet .x.ic::before{width:20px; height:20px;}
  /* The grid cell is ~76px wide, far too small to recognise a scribble by. Show the
     drawing at something near the size it was drawn at while the word is chosen. */
  #sheetPrev{
    width:min(56vw, 30vh, 240px); height:min(56vw, 30vh, 240px); display:block;
    margin:0 auto 16px; background:var(--paper);
    border:2px solid var(--edge); border-radius:18px; box-shadow:0 4px 0 var(--shadow); flex:none;
  }
  /* The sheet keeps vertical drags for itself; the word list is the one part that
     still scrolls, so it takes them back. */
  #sheet{touch-action:none;}
  #chips{
    display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-height:32vh; overflow-y:auto;
    padding:2px 2px 6px; touch-action:pan-y;
  }
  .chip{
    min-height:44px; padding:10px 14px; border-radius:12px; background:var(--panel);
    border:2px solid var(--edge); box-shadow:0 3px 0 var(--shadow);
    font:750 16px/1.15 var(--font);
    transition:transform .07s var(--ease), box-shadow .07s var(--ease);
  }
  .chip:active{transform:translateY(3px); box-shadow:none; background:var(--hi); color:var(--on-hi);}

  /* typed answer: a card up from the bottom, above the keyboard */
  #modal{
    position:fixed; inset:0; bottom:auto; height:100%; z-index:30; background:var(--scrim);
    display:none; justify-content:center; align-items:flex-end;
  }
  #modal.on{display:flex;}
  #modalCard{
    width:100%; max-width:600px; background:var(--panel);
    border:2px solid var(--edge); border-bottom:none; border-radius:28px 28px 0 0;
    padding:10px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 50px rgba(0,0,0,.35);
  }
  #modal.on #modalCard{animation:rise .24s var(--ease);}
  @keyframes rise{from{transform:translateY(40px); opacity:.3} to{transform:none; opacity:1}}
  /* Sized against the space the keyboard leaves -- --sheet -- rather than the window,
     which the keyboard does not change. Sized against the window the card came out
     taller than the room it had, so it scrolled, and the browser sliding the focused
     box into view took the drawing up with it. */
  #modalPrev{
    width:min(74vw, calc(var(--sheet, 100vh) * 0.38), 320px);
    height:min(74vw, calc(var(--sheet, 100vh) * 0.38), 320px); display:block; margin:0 auto 16px;
    background:var(--paper); border:2px solid var(--edge); border-radius:18px; box-shadow:0 4px 0 var(--shadow);
    flex:none;
  }
  /* let the card scroll instead of overflowing when the keyboard shrinks the space */
  #modalCard{max-height:100%; overflow-y:auto;}
  #modalInput{text-align:center; font:750 20px/1.2 var(--font);}
  #modalCard .primary{margin:12px 0 0;}
  #modalSkip{display:block; width:100%; min-height:48px; text-align:center; color:var(--muted); font:750 15px var(--font); padding:12px 0 4px;}

  /* =============================================================== result ===
     The score is marked the way a teacher marks a paper: circled in red pen. */
  .grade{text-align:center; padding:6px 0 4px;}
  .grade .lvl{margin:12px 0 6px;}
  .gradebox{position:relative; display:inline-block; max-width:100%; margin:8px 0 12px; vertical-align:top;}
  .gradebox:has(#score:empty){display:none;}
  #score{
    position:relative; z-index:1; overflow:hidden; white-space:nowrap; padding:4px 22px;
    font:900 46px/1.08 var(--font); letter-spacing:-.03em;
  }
  .ring{position:absolute; left:-10px; top:-17px; width:calc(100% + 20px); height:calc(100% + 32px); overflow:visible;}
  .ring path{fill:none; stroke:var(--no); stroke-width:3.6; stroke-linecap:round; stroke-dasharray:1 2;}
  #result.on .ring path{animation:ink .75s var(--ease) .2s both;}
  #copyNote{color:var(--ok); font:750 14px var(--font); text-align:center; min-height:20px; margin-top:8px; margin-bottom:4px;}
  #fallback{
    width:100%; margin-top:6px; margin-bottom:10px; border:2px solid var(--line2); border-radius:14px; padding:12px;
    font:16px/1.5 var(--mono); white-space:pre; display:none; background:var(--panel); color:var(--ink);
  }
  #switchRound, #reviewGuess{margin-top:0; margin-bottom:14px;}
  #result > .scroll{margin-top:6px;}
  /* the two ways to take the round away, side by side under the drawings they take */
  /* On a phone the pair is measured to fit one line each: paylaş takes what its word needs,
     the long cevaplarımı kaydet takes the rest, both a little tighter than elsewhere. From
     480px there is room for two equal halves; under 360px they stack. */
  .keep{display:flex; gap:8px; align-items:stretch; margin-top:2px;}
  .keep > *{width:auto; margin:0; min-width:0;}
  .keep #share{flex:0 0 auto; gap:8px; padding-left:12px; padding-right:12px;}
  .keep #share.ic::before{width:20px; height:20px;}
  .keep #saveShot{flex:1 1 auto; gap:7px; padding-left:10px; padding-right:10px; font-size:clamp(14px, 4.1vw, 16.5px);}
  .keep #saveShot.ic::before{width:18px; height:18px;}
  @media (min-width:480px){ .keep #share, .keep #saveShot{flex:1 1 0;} }
  @media (max-width:359px){ .keep{flex-direction:column;} }
  .btnrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:16px 0 4px;}
  #resultReport{margin:10px auto 18px;}

/* The theme this device chose, put on before anything is painted. The page itself waits for
   its script (see .boot), but until that ran the page's colour, and the browser bar's, were
   the device's: koyu on a light phone opened light for a moment on every reload.
   applyTheme() does the same again once the page is running. */
try {
  const t = (JSON.parse(localStorage.getItem("chizz.v1") || "null") || {}).theme;
  document.documentElement.dataset.theme = t === "light" || t === "dark" ? t : "auto";
  document.querySelector('meta[name="theme-color"]').setAttribute("content",
    getComputedStyle(document.documentElement).getPropertyValue("--bg").trim());

<script>
(function(){
"use strict";

/* -------------------------------------------------------------- ölçüm --- */
/* What this visit does -- the screens it goes through, where it taps, when it leaves, and
   the rounds it draws and guesses -- sent to /api/events for the owner's /admin page and
   for analysis. Nothing in it names anyone: the visit id is random, kept only in memory
   and gone with the tab; no name and no typed text other than a guess is sent; the server
   keeps no address. A browser that asks not to be tracked (Global Privacy Control, Do Not
   Track) sends nothing. /privacy says all of this; keep the two in step. */
const OLC_OFF = navigator.globalPrivacyControl === true || navigator.doNotTrack === "1"
             || location.protocol === "file:";
const OLC_FLUSH_MS = 10000;
const OLC_BATCH = 40;
const OLC_ENTRY = location.search || "";     // before the page rewrites its own address

function olcRandomId(){
  const b = new Uint8Array(8);
  crypto.getRandomValues(b);
  return Array.from(b, function(x){ return x.toString(16).padStart(2, "0"); }).join("");
}

const visitId = olcRandomId();
const visitStart = Date.now();
let olcQueue = [];
let olcRounds = {};          // round id -> the report waiting to go with the next batch
let olcSeq = 0;
let olcMetaSent = false;
let olcTimer = 0;
let olcInput = "";           // what the first pointer was: touch, mouse or pen

function track(type, data){
  if (OLC_OFF) return;
  const e = { t: Math.max(0, Date.now() - visitStart), type: type };
  for (const k in data) if (data[k] !== undefined && data[k] !== null && data[k] !== "") e[k] = data[k];
  olcQueue.push(e);
  if (olcQueue.length >= OLC_BATCH) olcFlush(false);
  else if (!olcTimer) olcTimer = setTimeout(function(){ olcFlush(false); }, OLC_FLUSH_MS);
}

// The device in the broadest strokes: what it runs, how big the screen is, whether it came
// by a link, and whether and since when it has played -- read from what the game already
// keeps for itself, and sent as a day number and counts, never the records themselves.
function olcMeta(){
  const store = loadStore();
  const ua = navigator.userAgent;
  const os = /iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? "ios"
           : /Android/.test(ua) ? "android" : /Windows/.test(ua) ? "windows"
           : /Macintosh/.test(ua) ? "mac" : /Linux/.test(ua) ? "linux" : "other";
  const via = /[?&]o=([^&]+)/.exec(OLC_ENTRY);
  const today = dailyDayNumber();
  let first = 0;
  const note = function(n){ n = Number(n); if (n > 0 && n <= today && (!first || n < first)) first = n; };
  (Array.isArray(store.dailyPlayed) ? store.dailyPlayed : []).forEach(note);
  Object.keys(store.days || {}).forEach(note);
  Object.keys(store.rounds || {}).forEach(function(k){
    const r = store.rounds[k] || {};
    const at = r.at || r.startedAt;
    if (typeof at === "number" && at > 0) note(dailyDayNumber(at));
  });
  return {
    hour: new Date().getHours(), lang: lang, input: olcInput || undefined, os: os,
    w: window.innerWidth, h: window.innerHeight,
    entry: via ? "link" : "home",
    via: via ? decodeURIComponent(via[1]).toUpperCase() : undefined,
    returning: !newHere,
    firstDay: first || undefined,
    daysPlayed: dailyDaysPlayed(store, today).length
  };
}

function olcFlush(leaving){
  clearTimeout(olcTimer);
  olcTimer = 0;
  if (OLC_OFF) return;
  const rounds = Object.keys(olcRounds).map(function(k){ return olcRounds[k]; });
  if (!olcQueue.length && !rounds.length) return;
  const body = { v: visitId, seq: olcSeq++, events: olcQueue.splice(0, 100) };
  if (rounds.length){ body.rounds = rounds; olcRounds = {}; }
  if (!olcMetaSent){
    olcMetaSent = true;
    try { body.meta = olcMeta(); } catch (e) {}
  }
  if (olcQueue.length) olcTimer = setTimeout(function(){ olcFlush(false); }, 1000);
  const text = JSON.stringify(body);
  try {
    // A page on its way out gets one last request, and only a beacon is sure to go.
    if (leaving && navigator.sendBeacon && text.length < 60000 &&
        navigator.sendBeacon("/api/events", new Blob([text], { type: "application/json" }))) return;
    fetch("/api/events", {
      method: "POST", headers: { "content-type": "application/json" },
      body: text, keepalive: text.length < 60000
    }).catch(function(){});
  } catch (e) {}
}

document.addEventListener("pointerdown", function(e){
  if (!olcInput && e.pointerType) olcInput = e.pointerType;
}, true);

// What was tapped, as the page names it: its id, or the nearest id above it and what it is.
function olcDescribe(el){
  const tag = el.tagName.toLowerCase();
  let s = el.id ? "#" + el.id
        : tag + (el.dataset.t ? "[" + el.dataset.t + "]" : el.dataset.kind ? "[" + el.dataset.kind + "]"
                 : el.classList[0] ? "." + el.classList[0] : "");
  if (!el.id){
    const host = el.parentElement && el.parentElement.closest("[id]");
    if (host) s = "#" + host.id + " " + s;
  }
  return s.slice(0, 80);
}
// A keyboard press on a button is a click with no place on the screen, so it gets none.
document.addEventListener("click", function(e){
  const el = e.target && e.target.closest ? e.target.closest("button, a, input, textarea, label, canvas, [id]") : null;
  if (!el || el.id === "pad") return;
  const placed = e.detail > 0 && window.innerWidth && window.innerHeight;
  track("tap", {
    screen: screenNow(), target: olcDescribe(el),
    x: placed ? Math.min(1, Math.max(0, e.clientX / window.innerWidth)) : undefined,
    y: placed ? Math.min(1, Math.max(0, e.clientY / window.innerHeight)) : undefined
  });
}, true);

document.addEventListener("visibilitychange", function(){
  if (document.hidden){ track("hide", { screen: screenNow() }); olcFlush(true); }
  else track("show", { screen: screenNow() });
});
window.addEventListener("pagehide", function(){
  track("leave", { screen: screenNow() });
  olcFlush(true);
});

/* Rounds. One report per round, sent in two halves that the server joins on the id: the
   drawing when the twentieth word is done, the guesses when the round is finished. A
   round is known by its words, so drawing the day, guessing a friend's round and coming
   back to the day's own grid still lands its guesses on the round that was drawn. */
let olcRound = null;
const olcKnown = {};          // words joined -> the round they belong to
let olcClears = 0;            // times the pad was wiped during the current word
let olcWordAt = 0;            // when the current word went up

// fresh: a new drawing is starting, so it is a new round even with words seen before.
function olcRoundFor(fresh){
  const key = words.join("|");
  if (fresh || !olcKnown[key]){
    olcKnown[key] = {
      id: olcRandomId(),
      kind: isDaily ? "daily" : role === "guesser" ? "friend" : "unlimited",
      role: role, day: isDaily ? dailyDay : undefined, secs: secs, lang: lang,
      words: words.slice(), input: undefined, seen: null, tries: null, answerMs: null, finished: false
    };
  }
  olcRound = olcKnown[key];
  return olcRound;
}

function olcSend(r, extra){
  const out = { id: r.id, kind: r.kind, role: r.role, day: r.day, secs: r.secs, lang: r.lang,
                input: r.input, words: r.words, code: lastCode || undefined };
  for (const k in extra) out[k] = extra[k];
  olcRounds[r.id] = out;
  olcFlush(false);
}

// A drawing as Quick, Draw! keeps one: per stroke [xs, ys, ts] on a 0-255 grid, ts in ms
// since the word went up, thinned the way encodeDrawings thins a saved round.
function olcDrawing(list){
  let points = 0, ink = 0, first = -1, last = -1;
  const out = list.map(function(st){
    const xs = [], ys = [], ts = [];
    for (let i = 0; i < st.length; i++){
      if (i) ink += Math.hypot(st[i].x - st[i - 1].x, st[i].y - st[i - 1].y);
      const t = Math.max(0, Math.round(st[i].t || 0));
      if (first < 0 || t < first) first = t;
      if (t > last) last = t;
      const x = Math.round(Math.min(1, Math.max(0, st[i].x)) * 255);
      const y = Math.round(Math.min(1, Math.max(0, st[i].y)) * 255);
      const n = xs.length;
      if (n && i < st.length - 1){
        const dx = x - xs[n - 1], dy = y - ys[n - 1];
        if (dx * dx + dy * dy < 4) continue;
      }
      xs.push(x); ys.push(y); ts.push(t);
    }
    points += xs.length;
    return [xs, ys, ts];
  });
  return { drawing: out, points: points, ink: ink,
           firstMs: first < 0 ? undefined : first, lastMs: last < 0 ? undefined : last };
}

function olcWordDrawn(i, list){
  const r = olcRound;
  if (!r) return;
  const d = olcDrawing(list);
  (r.items || (r.items = []))[i] = {
    idx: i, strokes: list.length, points: d.points, ink: d.ink,
    firstMs: d.firstMs, lastMs: d.lastMs, clears: olcClears, drawing: d.drawing
  };
  olcClears = 0;
  if (i === N - 1){
    olcSend(r, { drawn: true, items: r.items.filter(Boolean) });
    r.items = null;                     // sent; the guesses go without them
  }
}

// Every change to an answer, from refreshRecall: which drawing, when, and how many times.
function olcPicks(){
  const r = olcRound;
  if (!r || !recallStart) return;
  if (!r.seen){                         // the grid as it came up, restored answers included
    r.seen = picks.slice();
    r.tries = new Array(N).fill(0);
    r.answerMs = new Array(N).fill(undefined);
    return;
  }
  picks.forEach(function(p, pos){
    if ((p || "") === (r.seen[pos] || "")) return;
    r.tries[pos]++;
    r.answerMs[pos] = Math.max(0, Date.now() - recallStart);
  });
  r.seen = picks.slice();
}

function olcFinished(){
  const r = olcRound;
  if (!r || r.finished) return;
  r.finished = true;
  const items = order.map(function(di, pos){
    const a = picks[pos] ? String(picks[pos]).trim() : "";
    const right = isCorrect(picks[pos], words[di]);
    const match = right ? words[di] : a ? words.find(function(w){ return isCorrect(a, w); }) : undefined;
    return { idx: di, gridPos: pos, answer: a, answerWord: match, correct: right,
             answerMs: r.answerMs ? r.answerMs[pos] : undefined, tries: r.tries ? r.tries[pos] : undefined };
  });
  olcSend(r, { mode: modeId, finished: true, score: score, recallMs: recallMs, items: items });
}

// The last few script errors, sent along with a bug report. Kept from the start so an
// error on the way to the problem is not missed.
const recentErrors = [];
function noteError(message, where){
  recentErrors.push({ message: String(message || "").slice(0, 200), where: String(where || "").slice(0, 120), at: Date.now() });
  track("error", { message: String(message || "").slice(0, 200), where: String(where || "").slice(0, 120) });
  if (recentErrors.length > 5) recentErrors.shift();
}
window.addEventListener("error", function(e){
  noteError(e && e.message, e && e.filename ? e.filename.split("/").pop() + ":" + e.lineno + ":" + e.colno : "");
});
window.addEventListener("unhandledrejection", function(e){
  noteError(e && e.reason && (e.reason.message || e.reason), "promise");
});

/* ---------------------------------------------------------------- data --- */

/* Two ways to answer, and the clock set separately in settings. The four fixed
   difficulties conflated the two, so "medium" and "hard" differed only in how you
   answered while sharing a timing nobody could change. */
// The ids stay pool/typed: they are written into every saved round, so renaming
// them would break links already shared. Only the labels changed.
const MODES = [
  { id:"pool",  key:"modeOpen",   desc:"modeOpenDesc",   tag:"modeEasy" },
  { id:"typed", key:"modeHidden", desc:"modeHiddenDesc", tag:"modeHard" }
];
const SECS_MIN = 1, SECS_MAX = 10, SECS_DEFAULT = 3;   // the recommended speed

// Rounds saved before modes existed carry one of these instead.
const LEGACY_DIFFS = {
  easy:       { mode:"pool",  seconds:4   },
  medium:     { mode:"pool",  seconds:2.5 },
  hard:       { mode:"typed", seconds:2.5 },
  impossible: { mode:"typed", seconds:1.5 }
};


/* ========================================================= daily puzzle ===
   The same twenty words for everyone, every day, chosen from the pool in
   docs/words.json. sınırsız deals from the same pool, per device (see

   of another, so half the grid is ruled out at a glance and the work happens

const DAILY_FAMILIES = Object.keys(DAILY_POOL).sort();
const DAILY_WINDOW = 14;   // a word may return on the 14th day, not before
const DAILY_PER_FAMILY = 10;

/* Seventeen of the thirty-one winged words are birds, so ten drawn at random came out
   half birds and the day read as a round about birds rather than a round about a shape.
   Two at most. Birds live only in that family, so this costs the others nothing. */
const DAILY_BIRDS = ["ağaçkakan","baykuş","civciv","devekuşu","flamingo","güvercin","hindi",
                     "horoz","kartal","kaz","kuğu","kuş","leylek","martı","ördek","penguen",
                     "serçe","tavuk","tavus kuşu"];
const DAILY_BIRD_MAX = 2;

function isBird(w){ return DAILY_BIRDS.indexOf(w) >= 0; }

/* The days already played, exactly as they were dealt, day 1 first. Every day is replayed
   from day one against the pool, so changing the pool reshuffles the whole schedule --
   today included, for anyone who has not played it yet. Before changing the pool, add
   every day up to and including today here (from the schedule as it stands), so the
   change only reaches days nobody has seen. */

// Midnight in Turkey on 8 Sep 2026, written in UTC. Turkey has no daylight saving.
const DAILY_EPOCH = Date.UTC(2026, 8, 7, 21, 0, 0);
const DAY_MS = 86400000;

function dailyDayNumber(at){
  return Math.floor(((at === undefined ? Date.now() : at) - DAILY_EPOCH) / DAY_MS) + 1;
}

// 02/10/2026 reads as the tenth of February to half the English-speaking world, so English
// names the month. A file name keeps the numbers, in either language.
function dailyDateLabel(day, asFile){
  const d = new Date(DAILY_EPOCH + (day - 1) * DAY_MS + DAY_MS / 2);
  const p = function (n){ return n < 10 ? "0" + n : String(n); };
  if (lang === "en" && !asFile) return d.getUTCDate() + " " + TEXT.months.split(" ")[d.getUTCMonth()] + " " + d.getUTCFullYear();
  return p(d.getUTCDate()) + "/" + p(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
}

// Deterministic, so every device shuffles a day the same way for ever.
function dailyRandom(seed){
  let a = (seed * 1831565813) >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dailyTake(list, n, rnd){
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a.slice(0, n);
}

/* Ten words from one family, never more than two of them birds. The same shuffle as
   everywhere else -- so the day stays the same on every device, and a family with no
   birds in it draws exactly what it drew before -- with birds simply passed over once
   two are in hand. */
function dailyPick(list, rnd){
  return dealFrom(dailyTake(list, list.length, rnd));
}

/* Ten words taken in the order given, with the bird cap. */
function dealFrom(ordered){
  const out = [];
  let birds = 0;
  for (let i = 0; i < ordered.length && out.length < DAILY_PER_FAMILY; i++){
    const w = ordered[i];
    if (isBird(w)){
      if (birds >= DAILY_BIRD_MAX) continue;
      birds++;
    }
    out.push(w);
  }
  return out;
}

/* Which words are free today depends on what the days before used, so the whole
   schedule is replayed from day one. A few hundred cheap iterations, years in.

   Nothing is rotated in order. A family is in the running only if it can field ten
   words nobody has seen for fourteen days, and the day picks two of those at random;
   the rule then holds by construction rather than by schedule, and a family that is
   short simply sits the day out and comes back when it has refilled. Small families
   end up appearing every nine days or so and large ones every six, which is exactly
   right -- a small family needs longer to refresh. */
function dailyWords(day){
  return dailyDays(day, day)[0] || [];
}

/* The days from..to, each as its twenty words, out of a single replay of the schedule. */
function dailyDays(from, to){
  const lastUsed = {};
  const days = [];
  let out = [];
  for (let d = 1; d <= to; d++){
    if (d <= DAILY_PLAYED.length){
      out = DAILY_PLAYED[d - 1].slice();
      out.forEach(function(w){ lastUsed[w] = d; });
      if (d >= from) days.push(out);
      continue;
    }
    const rnd = dailyRandom(d);
    const freeIn = function(f){
      return DAILY_POOL[f].filter(function(w){
        return lastUsed[w] === undefined || d - lastUsed[w] >= DAILY_WINDOW;
      });
    };
    const ready = DAILY_FAMILIES.filter(function(f){
      const free = freeIn(f);
      // Ten words of which at most two may be birds, so eight non-birds have to be
      // free. For every family but the winged one this is the same test as before.
      return free.length >= DAILY_PER_FAMILY &&
             free.filter(function(w){ return !isBird(w); }).length >= DAILY_PER_FAMILY - DAILY_BIRD_MAX;
    });
    out = [];
    dailyTake(ready, 2, rnd).forEach(function(f){
      dailyPick(freeIn(f), rnd).forEach(function(w){
        lastUsed[w] = d; out.push(w);
      });
    });
    if (d >= from) days.push(out);
  }
  return days;
}

/* sınırsız: two families and ten words from each, dealt the way the day is, but for
   this device. Words it has not been shown for fourteen days -- here or in the daily
   game -- come first, in random order. When a family runs short of those, the words it
   saw longest ago fill the ten, so a player who plays a lot sees old words again rather
   than no game at all. The two families are the ones that need the fewest such repeats,
   at random among equals.

   The daily game's words are not kept out of sınırsız, only deferred: the twenty for
   today and for each of the next thirteen days are dealt last among the words this
   device has not seen, and still ahead of any word it has. So a round takes them only
   when a family is short of anything fresher, and no family is ever starved. Held back
   outright, as they were, those 280 words were 8.2 repeats a sınırsız round for someone
   who plays the day and one round a day; deferred, that is 0, at the price of 2.6 of the
   day's own twenty -- the day is the same for everyone and cannot steer around this
   device. Dropped altogether the price would be 8.6 of the day's twenty, which is the
   round people share, so deferring beats both.

   The day's twenty and a sınırsız twenty are never the same round either way. */
const SEEN_SPREAD = 7;

function freshWords(){
  const store = loadStore();
  const seen = store.seen || {};
  const today = dailyDayNumber();
  // 0 for a word free to deal, otherwise the day it was last shown.
  const since = function(w){
    const d = seen[w];
    return typeof d === "number" && today - d < DAILY_WINDOW ? d : 0;
  };
  // The daily days this round has to stay clear of: the last fourteen and the next
  // fourteen, today counted once.
  const from = Math.max(1, today - DAILY_WINDOW + 1);
  const near = dailyDays(from, today + DAILY_WINDOW - 1);
  const soon = {};
  near.slice(today - from).forEach(function(list){
    list.forEach(function(w){ soon[w] = true; });
  });
  // Three tiers: -2 a word free to deal, -1 a free word the day is about to use, and the
  // day it was shown for a word seen inside the window, which is 1 or more.
  const level = function(w){ return since(w) || (soon[w] ? -1 : -2); };
  // Within a tier the order is random; seen words are spread across a week around the day
  // they were shown, so strictly by day, the ten dealt together on one day came back
  // together too.
  const order = function(x){ return x.d >= 1 ? x.d + x.r * SEEN_SPREAD : x.d + x.r; };
  const families = DAILY_FAMILIES.map(function(f){
    const line = DAILY_POOL[f]
      .map(function(w){ return { w: w, d: level(w), r: Math.random() }; })
      .sort(function(a, b){ return order(a) - order(b); })
      .map(function(x){ return x.w; });
    const newest = Math.max.apply(null, dealFrom(line).map(level));
    return { line: line, newest: newest, r: Math.random() };
  }).sort(function(a, b){ return a.newest - b.newest || a.r - b.r; });

  const two = families.slice(0, 2);
  const out = [];
  two.forEach(function(fam){
    dealFrom(fam.line).forEach(function(w){ out.push(w); });
  });
  // A family down to exactly ten words it can deal has no choice about which ten, so the
  // same twenty as a daily day can come up -- about once in a thousand rounds. When it
  // does, the last word gives way to the next one along. The stand-ins are never birds,
  // so the two-bird cap cannot be broken by the swap.
  const sameAsADay = function(){
    return near.some(function(day){
      return day.every(function(w){ return out.indexOf(w) >= 0; });
    });
  };
  const spare = two[1].line.filter(function(w){
    return !isBird(w) && out.indexOf(w) < 0;
  });
  for (let i = 0; i < spare.length && sameAsADay(); i++) out[out.length - 1] = spare[i];
  return out;
}

/* The different days, within the last fourteen, on which this device played the daily
   game. days[N] and the single dailyAt an earlier version kept are read too, so a device
   that played before this list existed is not forgotten. */
function dailyDaysPlayed(store, today){
  const found = {};
  const note = function(n){
    n = Number(n);
    if (n > 0 && today - n >= 0 && today - n < DAILY_WINDOW) found[n] = true;
  };
  (Array.isArray(store.dailyPlayed) ? store.dailyPlayed : []).forEach(note);
  if (typeof store.dailyAt === "number") note(store.dailyAt);
  Object.keys(store.days || {}).forEach(function(n){ if (store.days[n] && store.days[n].drawn) note(n); });
  return Object.keys(found).map(Number);
}

/* The words a round put in front of this device, on today's date. A daily round also
   records the day it was played (see freshWords). */
function rememberSeen(list, daily){
  const store = loadStore();
  if (!store.seen || typeof store.seen !== "object") store.seen = {};
  const today = dailyDayNumber();
  list.forEach(function(w){ store.seen[w] = today; });
  if (daily){
    const played = dailyDaysPlayed(store, today);
    if (played.indexOf(today) < 0) played.push(today);
    store.dailyPlayed = played;
    delete store.dailyAt;
  }
  saveStore(store);
}

/* Whose drawings, in Turkish. The possessive ending is not fixed: it follows the
   last vowel of the name (vowel harmony), and a name ending in a vowel takes a
   buffer n first. So Ayşe'nin, Mert'in, Çağla'nın, Oğuz'un, Ümmü'nün -- a fixed 'ın
   was only right for names like Başak. Names are typed freely, so the dotted and
   dotless capitals are folded by hand before looking at them, and a name with no
   vowels at all falls back to 'in. In English it is 's, or a bare ' after an s. */
function whose(name){
  if (lang === "en") return name + (/s$/i.test(name) ? "'" : "'s");
  const letters = String(name).replace(/I/g, "ı").replace(/İ/g, "i").toLowerCase()
    .replace(/[^a-zçğıöşüâîû]/g, "");
  const vowels = letters.match(/[aeıioöuüâîû]/g);
  const last = vowels ? vowels[vowels.length - 1] : "e";
  const ending = { a: "ın", â: "ın", ı: "ın", e: "in", i: "in", î: "in",
                   o: "un", u: "un", û: "un", ö: "ün", ü: "ün" }[last];
  const buffer = /[aeıioöuüâîû]$/.test(letters) ? "n" : "";
  return name + "'" + buffer + ending;
}

function boardHeading(){
  const who = drawerName ? TEXT.drawingsOf.replace("{whose}", whose(drawerName)) : TEXT.theseDrawings;
  return who + TEXT.scoresSuffix;
}

/* --------------------------------------------------------------- storage --- */
/* The v1 brief banned localStorage, back when a round was one throwaway sitting.
   Shared rounds changed that: a link gets opened twice, a phone reloads the tab,
   and the player expects to find their game where they left it. Only what the
   round already shows is kept -- the name typed on this device, and per round
   code the grid order, the answers and whether it was finished. Every access is
   wrapped: Safari in private mode throws on localStorage rather than no-opping. */
const STORE_KEY   = "chizz.v1";
/* Nothing is forgotten here because it got old -- the server keeps a saved round now, so
   the device has no reason to drop its half of one. What is left is a limit on space,
   which is real: a phone gives the page about 5 MB. A round record is a few hundred bytes
   of order, answers and tokens, so two hundred of them cost almost nothing; a drawing
   kept here is tens of kilobytes, so those stay capped where they were. */
const KEEP_ROUNDS = 200;        // records of saved rounds: small, so arşiv can go back far
const KEEP_DRAFTS = 40;         // drawings never saved: these are the heavy ones

function loadStore(){
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!v || typeof v !== "object") return { name: "", rounds: {} };
    if (!v.rounds || typeof v.rounds !== "object") v.rounds = {};
    if (!v.days || typeof v.days !== "object") v.days = {};
    if (typeof v.name !== "string") v.name = "";
    return v;
  } catch(e){ return { name: "", rounds: {} }; }
}

function saveStore(store){
  // The newest are kept and the oldest give way when there are too many; none of them is
  // dropped for having been drawn a while ago.
  const kept = {};
  Object.keys(store.rounds)
    .sort(function(a, b){ return (store.rounds[b].at || 0) - (store.rounds[a].at || 0); })
    .slice(0, KEEP_ROUNDS)
    .forEach(function(c){ kept[c] = store.rounds[c]; });
  store.rounds = kept;
  // Words stop mattering once fourteen days have passed.
  if (store.seen && typeof store.seen === "object"){
    const today = dailyDayNumber();
    Object.keys(store.seen).forEach(function(w){
      if (!(today - store.seen[w] < DAILY_WINDOW)) delete store.seen[w];
    });
  }
  if (Array.isArray(store.drafts)){
    store.drafts = store.drafts
      .filter(function(d){ return !!d; })
      .sort(function(a, b){ return (b.at || 0) - (a.at || 0); })
      .slice(0, KEEP_DRAFTS);
  }
  storageOk = writeStore(store);
  while (!storageOk && shedSome(store)) storageOk = writeStore(store);
  return storageOk;
}

/* A phone gives a page about 5 MB and a round of drawings runs to 130 KB, so someone who
   draws a lot can fill it. This write used to be tried once and its failure dropped on the
   floor, which cost far more than the drawings: the device also forgot which rounds were
   its own, whether the day had been drawn, and the token that moves its row on a board
   when the name changes. The work was safe on the server and nothing on the phone could
   claim it any more -- the player's own link opened as a stranger's round and sat behind
   "önce sen çiz", and a new name wrote a second row on the board beside the old one.

   So a write that does not fit sheds the heavy things and tries again. What is left is a
   few hundred bytes, and it is the part that matters. Nothing shed is lost to the game:
   a saved round lives on the server, and only unsaved drawings go, oldest first. */
let storageOk = true;

function writeStore(store){
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); return true; }
  catch(e){ return false; }
}

// One thing at a time, heaviest and least missed first, so the write is retried after
// each. store.pending is never shed: it is the round the player is in the middle of.
function shedSome(store){
  if (Array.isArray(store.drafts) && store.drafts.length){
    store.drafts.pop();                       // sorted newest first, so the oldest goes
    return true;
  }
  const days = Object.keys(store.days || {})
    .filter(function(k){ return store.days[k] && store.days[k].drawings; })
    .sort(function(a, b){ return Number(a) - Number(b); });
  if (days.length){
    delete store.days[days[0]].drawings;      // the oldest day keeps its record, not its pictures
    return true;
  }
  const codes = Object.keys(store.rounds || {});
  if (codes.length > 5){
    codes.sort(function(a, b){ return (store.rounds[b].at || 0) - (store.rounds[a].at || 0); })
         .slice(5).forEach(function(c){ delete store.rounds[c]; });
    return true;
  }
  return false;
}

function savedName(){ return loadStore().name; }

function rememberSettings(){
  const store = loadStore();
  store.secs  = secs;
  store.theme = theme;
  saveStore(store);
}

function loadSettings(){
