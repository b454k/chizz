<!doctype html>
<html lang="tr">

<!-- What the address alone should say when it is pasted somewhere or found in a search.
     A round's link gets its own title, description and picture from
     functions/_middleware.js, which rewrites these tags where they stand.

     The description names chizz because a search for the name shows whatever text on the
     page contains it -- a description without the word lost to the game's own labels.
     The title is more than the bare name because search engines rewrite a one-word title
     (and capitalised it). -->
<meta name="description" content="chizz: 20 kelime, 20 çizim, her biri için birkaç saniye. sonra hangi çizim hangi kelimeydi? arkadaşlarınla oyna ya da günlük oyunda herkesle yarış.">
<meta property="og:title" content="chizz">
<meta property="og:description" content="20 kelime, 20 çizim, her biri için birkaç saniye. sonra hangi çizim hangi kelimeydi? arkadaşlarınla oyna ya da günlük oyunda herkesle yarış.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="chizz">
<meta property="og:url" content="https://chizz.party/">
<meta property="og:image" content="https://chizz.party/icon-512.png">

<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<meta name="theme-color" content="#131418">
<!-- Files, not data: URIs. Search results and link previews fetch the icon by URL, and
     most of them only take /favicon.ico or a PNG. tools/make-icons.js draws them. -->
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebSite","name":"chizz","url":"https://chizz.party/"}</script>
<style>
  :root{
    color-scheme:dark;
    --bg:#131418;
    --panel:#1b1d23;
    --panel2:#23262e;
    --ink:#f1f2f4;
    --muted:#949aa5;
    --line:#2f333c;
    --accent:#ff5c3d;
    --ok:#4ade80;
    --no:#f87171;
    --paper:#e8e5de;
    --pen:#17181c;
  }
  /* Chosen in settings and kept on the device. The dark palette above is the
     default; this only has to restate the colours that actually differ. */
  :root[data-theme="light"]{
    color-scheme:light;
    --bg:#f5f4f0;
    --panel:#ffffff;
    --panel2:#eae7e0;
    --ink:#16181d;
    --muted:#6b7280;
    --line:#d8d4cb;
    --accent:#d8431f;
    --ok:#15803d;
    --no:#b91c1c;
    --paper:#ffffff;
    --pen:#17181c;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* manipulation keeps panning and pinch but kills double-tap zoom, which fired
     constantly while drawing fast. The pad itself stays touch-action:none. */
  html, body{touch-action:manipulation;}
  /* A drag that starts on a label must not select text mid-round. Inputs opt back in. */
  body{-webkit-user-select:none; -ms-user-select:none; user-select:none;}
  input, textarea{-webkit-user-select:text; user-select:text;}
  /* keep [hidden] winning over rules that set display:flex/block */
  [hidden]{display:none !important;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    overscroll-behavior:none;
    -webkit-text-size-adjust:100%;
  }
  #app{
    max-width:600px; margin:0 auto; height:100%;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    display:flex; flex-direction:column;
  }
  .screen{display:none; flex:1; min-height:0; flex-direction:column;}
  .screen.on{display:flex;}
  #home, #send, #result{overflow-y:auto; -webkit-overflow-scrolling:touch;}

  h1{font-size:34px; letter-spacing:-.02em; margin:24px 0 6px;}

  button{font:inherit; color:inherit; background:none; border:none; padding:0; cursor:pointer;}
  input{font:inherit; color:inherit;}

  /* home screen: vertically centred and plain.
     "safe centre": drops the centring when the viewport is short, otherwise the
     top gets clipped with no way to scroll to it. */
  #home{justify-content:center; justify-content:safe center;}
  .hwrap{width:100%; max-width:340px; margin:0 auto; padding:28px 0; flex:none;}
  #home h1{font-size:52px; text-align:center; margin:0 0 14px; letter-spacing:-.04em;}
  /* the day's puzzle, above everything else on the start screen */
  #dailyRow{
    display:flex; align-items:center; gap:12px;
    border:2px solid var(--accent); border-radius:14px;
    padding:12px 12px 12px 15px; margin:0;
    background:var(--panel);
  }
  #dailyRow .dtext{flex:1; min-width:0;}
  #dailyRow b{display:block; font-size:16px;}
  #dailyRow span{display:block; font-size:13px; color:var(--muted); margin-top:2px;}
  #dailyGo{
    flex:none; background:var(--accent); color:#fff; border-radius:12px;
    padding:11px 20px; font-weight:800; font-size:15px;
  }
  #dailyGo:active{filter:brightness(.9);}
  #dailyGo.done{background:transparent; color:var(--muted); border:2px solid var(--line); font-weight:700;}
  .tagline{
    color:var(--muted); font-size:16px; font-weight:700; line-height:1.5; text-align:center;
    margin:0 0 22px;
  }

  /* The start screen holds two different games: the day's puzzle, one go for
     everybody on the same words, and the one you can play as often as you like.
     They are kept apart so neither is read as a setting of the other. */
  .hsec{margin:0 0 30px;}
  .hsec:last-child{margin-bottom:0;}
  .hsectitle{
    font-size:12px; font-weight:800; letter-spacing:.16em; color:var(--muted);
    margin:0 0 10px;
  }
  #dailyBoard{margin-top:10px; padding:11px; font-size:14px;}
  #themeSec{border-top:2px solid var(--line); padding:14px 0 4px; margin-top:26px;}

  /* Side by side, the way the choice is made: kelimeler açık on the left,
     kelimeler gizli on the right. */
  .diffs{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:0 0 14px;}
  .diff{
    border:2px solid var(--line); border-radius:14px; padding:12px 13px; text-align:left;
    background:var(--panel);
  }
  .diff .mname{display:block; text-transform:lowercase; font-size:16px;}
  .diff .mdesc{
    display:block; margin-top:4px; color:var(--muted);
    font-size:12px; line-height:1.35; font-weight:500;
  }
  .diff.sel .mdesc{color:var(--ink); opacity:.75;}
  .diff.sel{border-color:var(--ink); background:var(--panel2);}
  #chooseModes{margin:6px 0 14px; text-align:left;}
  #answersNote{color:var(--muted); font-size:14px; text-align:center; padding:14px;}

  /* settings on the home screen */
  .settings{
    border:2px solid var(--line); border-radius:14px; padding:14px 15px; margin:0 0 14px;
  }
  .srow{display:flex; align-items:center; justify-content:space-between; gap:12px; min-height:34px;}
  .srow + .srow{margin-top:10px;}
  .srow .lbl{font-size:14px; font-weight:600; color:var(--muted);}
  .srow output{font-size:15px; font-weight:800; font-variant-numeric:tabular-nums;}
  #secs{
    width:100%; margin:8px 0 2px; accent-color:var(--accent);
    background:transparent; touch-action:manipulation;
  }
  .shint{color:var(--muted); font-size:12px; margin:2px 0 0;}
  .nlabel{color:var(--muted); font-size:13px; font-weight:600; margin:0 0 6px;}

  /* arşiv: what this device has finished, with the drawings from each round */
  .arow{
    border:2px solid var(--line); border-radius:14px; padding:12px 13px; margin:0 0 10px;
    background:var(--panel); width:100%; text-align:left; display:block;
  }
  .arow:active{background:var(--panel2);}
  .ahead{display:flex; align-items:baseline; gap:8px; margin:0 0 9px;}
  .ahead .awhen{color:var(--muted); font-size:13px; font-weight:600;}
  .ahead .awho{color:var(--muted); font-size:13px; font-weight:600; flex:1; min-width:0;
               overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .ahead .ascore{font-weight:800; font-size:15px; font-variant-numeric:tabular-nums;}
  .acode{
    font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--muted);
  }
  /* the twenty drawings, in the same four across the round itself uses */
  .astrip{display:grid; grid-template-columns:repeat(10,1fr); gap:3px;}
  .athumb{
    position:relative; width:100%; aspect-ratio:1/1; border-radius:4px;
    overflow:hidden; background:var(--paper);
  }
  .athumb canvas{position:absolute; inset:0; width:100%; height:100%;}
  #archiveEmpty{color:var(--muted); font-size:14px; margin:0;}
  #archiveOpen{margin-top:4px;}
  #archiveScreen .scroll{padding-bottom:20px;}
  #nameNote{color:var(--ok); font-weight:600; font-size:13px; min-height:18px; margin:4px 0 0;}
  .seg{display:flex; gap:6px;}
  .seg button{
    border:2px solid var(--line); border-radius:10px; padding:7px 12px;
    font-size:14px; font-weight:700; color:var(--muted);
  }
  .seg button.sel{border-color:var(--ink); color:var(--ink); background:var(--panel2);}

  /* a primary button that is not ready to be pressed yet, but still takes a tap
     so it can say why */
  .primary.off{opacity:.45;}

  /* name asked at the point it is needed, rather than before the game */
  .namerow{display:flex; gap:8px; align-items:flex-start; margin:0 0 10px;}
  .namerow .txt{margin:0;}
  .namerow button{
    flex:none; border:2px solid var(--line); border-radius:14px; padding:14px 18px; font-weight:700;
  }
  .diff b{display:block; font-size:16px;}

  .primary{
    display:block; width:100%; background:var(--ink); color:var(--bg); border-radius:14px;
    padding:17px; font-size:18px; font-weight:700; text-align:center; margin:22px 0 0;
  }
  .primary:disabled{opacity:.28;}
  .ghost{
    display:block; width:100%; border:2px solid var(--line); border-radius:14px;
    padding:14px; font-size:16px; font-weight:600; text-align:center;
  }
  .txt{
    width:100%; border:2px solid var(--line); border-radius:14px; padding:14px 15px;
    background:var(--panel); outline:none;
  }
  .txt:focus{border-color:var(--ink);}

  /* joining with a code */
  #joinRow{display:flex; gap:10px; margin-top:28px;}
  #joinCode{
    flex:1; text-align:center; text-transform:uppercase; letter-spacing:.22em;
    font-weight:700; font-size:17px; padding:13px 10px;
  }
  #joinCode::placeholder{letter-spacing:normal; text-transform:none; font-weight:600; color:var(--muted);}
  #joinGo{
    width:auto; padding:13px 22px; border:2px solid var(--line); border-radius:14px;
    font-weight:700; color:var(--muted);
  }
  #joinGo:active{background:var(--panel2);}
  .err{color:var(--no); font-size:14px; font-weight:600; margin:10px 0 0; min-height:19px;}

  /* countdown */
  #countdown{align-items:center; justify-content:center;}
  #cdNum{font-size:26vh; font-weight:800; line-height:1; letter-spacing:-.05em;}
  #cdNum.pop{animation:pop .28s ease-out;}
  @keyframes pop{from{transform:scale(.6); opacity:.2} to{transform:scale(1); opacity:1}}

  /* draw */
  #draw{padding-top:10px;}
  .drawtop{display:flex; align-items:center; gap:12px;}
  .headrow{display:flex; align-items:center; gap:10px;}
  .back{
    flex:none; width:36px; height:36px; border-radius:11px; border:2px solid var(--line);
    color:var(--muted); font-size:18px; line-height:1; background:var(--panel);
    display:flex; align-items:center; justify-content:center;
  }
  .back:active{background:var(--panel2);}

  /* The round code, in the corner of the header, from the moment guessing starts:
     people want to play the same round together without going and finding it. */
  /* The title has to give way, not the chip: without min-width:0 a flex item will
     not shrink past its longest word, and the chip was pushed off the screen. */
  .headrow h2{min-width:0;}
  .chip2{
    flex:none; margin-left:auto; display:flex; align-items:center; gap:7px;
    border:2px solid var(--line); border-radius:999px; padding:5px 11px;
    background:var(--panel);
  }
  .chip2:active{background:var(--panel2);}
  .chip2 .cc{font-weight:800; font-size:14px; letter-spacing:.1em;}
  .chip2 .cl{font-size:12px; font-weight:700; color:var(--muted); white-space:nowrap;}

  /* leave-game confirmation */
  #confirm, #finishAsk, #timeAsk, #nameAsk, #fbAsk{
    position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.62);
    display:none; align-items:center; justify-content:center; padding:16px;
  }
  #confirm.on, #finishAsk.on, #timeAsk.on, #nameAsk.on, #fbAsk.on{display:flex;}
  #confirmCard, #finishAskCard, #timeAskCard, #nameAskCard, #fbAskCard{
    box-sizing:border-box;   /* the padding has to fit inside 100%, or the card runs off a narrow phone */
    background:var(--panel); border-radius:18px; padding:20px; width:100%; max-width:360px;
    box-shadow:0 20px 60px rgba(0,0,0,.28); text-align:center;
  }
  #confirmCard b, #finishAskCard b, #timeAskCard b, #nameAskCard b, #fbAskCard b{display:block; font-size:19px; margin-bottom:6px;}
  #confirmCard p, #finishAskCard p, #timeAskCard p, #nameAskCard p{color:var(--muted); font-size:14px; margin:0 0 4px;}
  #nameAskCard .txt{margin:14px 0 0; text-align:center;}
  #confirmCard .primary, #finishAskCard .primary, #timeAskCard .primary, #nameAskCard .primary, #fbAskCard .primary{margin:14px 0 8px;}
  /* geri bildirim */
  #fbAskCard .seg{justify-content:center; margin:12px 0 0;}
  #fbText{display:block; box-sizing:border-box; margin:12px 0 0; min-height:118px; resize:none;
          font-family:inherit; font-size:16px; line-height:1.4; text-align:left;}
  .fbmeta{display:flex; justify-content:space-between; gap:10px; font-size:12px; color:var(--muted);
          margin:6px 2px 0; text-align:left;}
  #fbCount{font-variant-numeric:tabular-nums; flex:none;}
  #fbMsg{min-height:18px; font-size:13px; font-weight:600; margin:8px 0 0;}
  #fbMsg.ok{color:var(--ok);}
  #fbMsg.bad{color:var(--no);}
  #fbWebsite{position:absolute; left:-9999px; width:1px; height:1px; opacity:0;}
  .htop{display:flex; justify-content:flex-end; margin:0 0 6px;}
  #fbOpen{border:2px solid var(--line); border-radius:999px; padding:6px 13px;
          font-size:13px; font-weight:700; background:var(--panel);}
  .linkish{display:block; margin:0 auto 14px; font-size:13px; font-weight:600; color:var(--muted);
           text-decoration:underline; text-underline-offset:3px;}
  #word{font-size:34px; font-weight:800; letter-spacing:-.02em; flex:1; min-width:0;
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  #counter{font-variant-numeric:tabular-nums; color:var(--muted); font-weight:700; font-size:15px;}
  #track{height:6px; background:var(--line); border-radius:99px; margin:10px 0 12px; overflow:hidden;}
  #bar{height:100%; background:var(--accent); transform-origin:left center; transform:scaleX(1);}
  #stage{flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding-bottom:14px;}
  #pad{background:var(--paper); border:2px solid var(--line); border-radius:16px; touch-action:none; display:block;}

  /* The word alone for a second, centred on the paper it is about to be drawn on, then
     gone. Transparent, so the paper shows behind it, and the word in the header never
     leaves. The layer is laid over the square and takes the taps until the fade begins.
     REVEAL_EDGE below keeps the same gap on either side; the size is measured to fit. */
  #reveal{
    /* Laid over the drawing square, which is where the word belongs: the square sits
       below the header and the bar, so centring on the screen reads high on the paper.
       The box is set in revealThenDraw, from the square's own measurements. */
    position:fixed; z-index:35; display:none;
    align-items:center; justify-content:center;
    /* The pen is never blocked: the word is something to read, not a door to wait at. */
    pointer-events:none;
  }
  #reveal.on{display:flex;}
  #revealWord{
    font-weight:800; letter-spacing:-.03em; line-height:1.05;
    text-align:center; color:var(--pen);
    /* Break between words, never inside one: a word split across lines is unreadable,
       and it let the fitter keep a size that did not really fit. */
    word-break:normal; overflow-wrap:normal; hyphens:none;
  }

  /* ara ekranlar */
  .mid{align-items:center; justify-content:center; text-align:center;}
  .mid h2{font-size:28px; margin:0 0 8px; letter-spacing:-.02em;}
  .mid p{color:var(--muted); margin:0 0 26px;}
  .mid .stack{width:100%; max-width:320px;}
  .mid .stack .primary{margin:0 0 10px;}

  /* recall + result */
  .head{padding:16px 0 12px;}
  .head h2{font-size:24px; margin:0; letter-spacing:-.02em;}
  .head p{color:var(--muted); margin:4px 0 0; font-size:14px;}
  .scroll{flex:1; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  #result .scroll{flex:none; overflow:visible;}
  .grid{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding-bottom:14px;}
  @media (min-width:520px){ .grid{grid-template-columns:repeat(5,1fr);} }

  .cell{position:relative; text-align:center;}
  .box{
    position:relative; width:100%; aspect-ratio:1/1; border:2px solid var(--line);
    border-radius:12px; overflow:hidden; background:var(--paper);
  }
  .cell.sel .box{border-color:var(--accent); box-shadow:0 0 0 3px rgba(255,77,46,.18);}
  .cell.done .box{border-color:var(--ink);}
  .cell.right .box{border-color:var(--ok);}
  .cell.wrong .box{border-color:var(--no);}
  .box canvas{position:absolute; inset:0; width:100%; height:100%;}
  .cap{font-size:12px; line-height:1.25; margin-top:4px; min-height:15px; word-break:break-word;}
  .cap .bad{color:var(--no); text-decoration:line-through;}
  .cap .good{color:var(--ok); font-weight:700;}
  .cap .pick{font-weight:700;}

  .foot{border-top:1px solid var(--line); padding:10px 0 14px; display:flex; align-items:center; gap:12px;}
  .foot .count{color:var(--muted); font-weight:700; font-variant-numeric:tabular-nums; font-size:14px;}
  .foot .primary{margin:0; flex:1; padding:15px;}

  /* word pool (bottom sheet) */
  #sheet{
    position:fixed; left:0; right:0; bottom:0; z-index:20; background:var(--panel);
    border-top:1px solid var(--line); box-shadow:0 -10px 30px rgba(0,0,0,.10);
    padding:12px 16px calc(16px + env(safe-area-inset-bottom));
    transform:translateY(105%); transition:transform .16s ease-out; visibility:hidden;
  }
  #sheet.on{transform:translateY(0); visibility:visible;}
  /* Tapping away from the sheet should close it. A scrim does that without the
     tap also landing on whatever cell happens to be underneath. */
  #sheetScrim{
    position:fixed; inset:0; z-index:19; background:rgba(0,0,0,.35);
    transition:opacity .18s ease-out;
  }
  .grab{
    width:40px; height:4px; border-radius:99px; background:var(--line);
    margin:0 auto 10px; flex:none;
  }
  #modalCard .grab{margin-bottom:14px;}
  /* The card itself scrolls once the keyboard shrinks it, so only the handle and
     the drawing give their vertical gesture to the drag. */
  #modalCard .grab, #modalPrev{touch-action:none;}
  .grab{cursor:grab;}
  #sheet .row{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
  #sheet .row b{font-size:15px;}
  #sheet .x{font-size:22px; line-height:1; color:var(--muted); padding:4px 8px;}
  /* The grid cell is ~76px wide, far too small to recognise a scribble by. Show the
     drawing at something near the size it was drawn at while the word is chosen. */
  #sheetPrev{
    width:min(56vw, 30vh, 240px); height:min(56vw, 30vh, 240px); display:block;
    margin:0 auto 12px; border:2px solid var(--line); border-radius:14px;
    background:var(--paper); flex:none;
  }
  /* The sheet keeps vertical drags for itself; the word list is the one part that
     still scrolls, so it takes them back. */
  #sheet{touch-action:none;}
  #chips{
    display:flex; flex-wrap:wrap; gap:8px; max-height:32vh; overflow-y:auto;
    touch-action:pan-y;
  }
  .chip{border:2px solid var(--line); border-radius:99px; padding:10px 15px; font-size:15px; font-weight:600; background:var(--panel);}
  .chip:active{background:var(--panel2);}

  /* typed answer: a card near the top, so the keyboard cannot cover it */
  #modal{
    position:fixed; inset:0; bottom:auto; height:100%; z-index:30; background:rgba(0,0,0,.62);
    display:none; justify-content:center; align-items:flex-end;
  }
  #modal.on{display:flex;}
  #modalCard{
    background:var(--panel); border-radius:20px 20px 0 0; width:100%; max-width:600px;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
    box-shadow:0 -14px 50px rgba(0,0,0,.45);
  }
  #modalPrev{
    width:min(74vw, 38vh, 320px); height:min(74vw, 38vh, 320px); display:block; margin:0 auto 14px;
    border:2px solid var(--line); border-radius:14px; background:var(--paper);
    flex:none;
  }
  /* let the card scroll instead of overflowing when the keyboard shrinks the space */
  #modalCard{max-height:100%; overflow-y:auto;}
  #modalCard .primary{margin:12px 0 0;}
  #modalSkip{display:block; width:100%; text-align:center; color:var(--muted); font-size:14px; font-weight:600; padding:12px 0 2px;}

  /* result */
  #score{font-size:42px; font-weight:800; letter-spacing:-.03em; margin:14px 0 2px; line-height:1.1;}
  /* difficulty caption on the drawing and result screens: small, centred, faint */
  .lvl{
    text-align:center; font-size:11px; font-weight:700; letter-spacing:.2em;
    color:var(--muted); opacity:.45;
    margin:10px 0 4px; flex:none;
  }
  #scoreSub{margin:10px 0 6px;}
  #copyNote{color:var(--ok); font-weight:600; font-size:14px; text-align:center; min-height:20px; margin:2px 0 0;}
  #fallback{

<script>
(function(){
"use strict";

// The last few script errors, sent along with a bug report. Kept from the start so an
// error on the way to the problem is not missed.
const recentErrors = [];
function noteError(message, where){
  recentErrors.push({ message: String(message || "").slice(0, 200), where: String(where || "").slice(0, 120), at: Date.now() });
  if (recentErrors.length > 5) recentErrors.shift();
}
window.addEventListener("error", function(e){
  noteError(e && e.message, e && e.filename ? e.filename.split("/").pop() + ":" + e.lineno + ":" + e.colno : "");
});
window.addEventListener("unhandledrejection", function(e){
  noteError(e && e.reason && (e.reason.message || e.reason), "promise");
});

/* ---------------------------------------------------------------- data --- */

/* Two ways to answer, and the clock set separately in settings. The four fixed
   difficulties conflated the two, so "medium" and "hard" differed only in how you
   answered while sharing a timing nobody could change. */
// The ids stay pool/typed: they are written into every saved round, so renaming
// them would break links already shared. Only the labels changed.
const MODES = [
  { id:"pool",  key:"modeOpen",   desc:"modeOpenDesc"   },
  { id:"typed", key:"modeHidden", desc:"modeHiddenDesc" }
];
const SECS_MIN = 1, SECS_MAX = 10, SECS_DEFAULT = 3;   // the recommended speed

// Rounds saved before modes existed carry one of these instead.
const LEGACY_DIFFS = {
  easy:       { mode:"pool",  seconds:4   },
  medium:     { mode:"pool",  seconds:2.5 },
  hard:       { mode:"typed", seconds:2.5 },
  impossible: { mode:"typed", seconds:1.5 }
};


/* ========================================================= daily puzzle ===
   The same twenty words for everyone, every day, chosen from the pool in
   docs/words.json. sınırsız deals from the same pool, per device (see
   freshWords). Families are what make it a game: ten words of one silhouette and ten
   of another, so half the grid is ruled out at a glance and the work happens
   inside a family where the shapes collide.

   Day 1 is Tuesday 8 September 2026, and the day turns over at midnight in
   Turkey for everyone, so two friends in different countries are always playing
   the same puzzle and their scores mean the same thing.
   ========================================================================= */
const DAILY_POOL = {
  boxy: ["asansör","battaniye","bavul","bilgisayar","buzdolabı","cüzdan","çamaşır makinesi","çanta","çekmece","çerçeve","defter","dolap","dosya","ekran","ev","fırın","gazete","halı","harita","havlu","hediye","hoparlör","kapı","kasa","kitap","klima","kumbara","kutu","mektup","mendil","peçete","pencere","pil","radyo","sandık","tablet","tablo","telefon","televizyon","tuğla","valiz","yastık","zarf"],
  curved: ["ahtapot","ayak","beyin","bıyık","bulut","burun","çengel","dalga","damla","dudak","duman","düğüm","el","fiyonk","gül","hortum","ip","kalp","kanca","kaş","kedi","kulak","kurdele","kuyruk","lale","nehir","saç","salyangoz","sarmaşık","solucan","soru işareti","şimşek","tırtıl","tüy","virgül","yaprak","yılan","yumak"],

const DAILY_FAMILIES = Object.keys(DAILY_POOL).sort();
const DAILY_WINDOW = 14;   // a word may return on the 14th day, not before
const DAILY_PER_FAMILY = 10;

/* Seventeen of the thirty-one winged words are birds, so ten drawn at random came out
   half birds and the day read as a round about birds rather than a round about a shape.
   Two at most. Birds live only in that family, so this costs the others nothing. */
const DAILY_BIRDS = ["baykuş","civciv","devekuşu","flamingo","güvercin","horoz","kartal",
                     "kaz","kuğu","kuş","leylek","martı","penguen","serçe","tavuk",
                     "tavus kuşu","ördek"];
const DAILY_BIRD_MAX = 2;

function isBird(w){ return DAILY_BIRDS.indexOf(w) >= 0; }

/* The days already played, exactly as they were dealt, day 1 first. Every day is replayed
   from day one against the pool, so changing the pool reshuffles the whole schedule --
   today included, for anyone who has not played it yet. Before changing the pool, add
   every day up to and including today here (from the schedule as it stands), so the
   change only reaches days nobody has seen. */
const DAILY_PLAYED = [
  ["deve","kanepe","araba","minibüs","aslan","inek","traktör","sörf tahtası","kaplan","yatak","havai fişek","örümcek ağı","rüzgar gülü","direksiyon","vantilatör","deniz kestanesi","dişli","papatya","çark","patlama"],

  ["gözyaşı","tespih","zeytin","kabak","hap","mercimek","hindistan cevizi","kozalak","armut","çakıl","süzgeç","el arabası","tirbuşon","sürahi","çapa","kapı kolu","bardak","tava","tırmık","balta"],
  ["salıncak","karides","tavuk","gemi","kaz","arı","uğur böceği","ateş böceği","uçak","kulaklık","kova","kepçe","raket","fincan","vazo","kürek","rende","kilit","sepet","çaydanlık"],
  ["ağ","takvim","çit","ızgara","parmaklık","gözlük","merdiven","ütü","piyano","klavye","çengel","fiyonk","tüy","kuyruk","şimşek","dudak","burun","lale","bıyık","kaş"],
  ["selvi","kolon","ampul","ağaç","gökdelen","sütun","asa","kaktüs","termometre","çeşme","kürdan","olta","pense","tarak","flüt","tebeşir","kibrit","cetvel","havuç","çivi"],
  ["çikolata","çamaşır ipi","yapboz","kafes","tabela","kalorifer","barkod","korkuluk","nota","raf","çekirge","horoz","leylek","peri","sosisli","yusufçuk","şort","kelebek","pantolon","melek"],
  ["anahtar","maşa","spatula","çatal","çekiç","vida","tornavida","muz","sihirli değnek","kalem","trafik lambası","duş","kule","mum","lamba","direk","insan","şelale","musluk","mısır"],
  ["cımbız","biber","sosis","kaşık","testere","kılıç","baget","makas","matkap","sopa","bayrak","fermuar","demiryolu","örgü","perde","gofret","satranç tahtası","yaya geçidi","ray","file"],

// Midnight in Turkey on 8 Sep 2026, written in UTC. Turkey has no daylight saving.
const DAILY_EPOCH = Date.UTC(2026, 8, 7, 21, 0, 0);
const DAY_MS = 86400000;

function dailyDayNumber(at){
  return Math.floor(((at === undefined ? Date.now() : at) - DAILY_EPOCH) / DAY_MS) + 1;
}

// When the current day ends, so a saved daily round can expire with it.
function dailyEndsIn(at){
  const now = at === undefined ? Date.now() : at;
  const next = DAILY_EPOCH + dailyDayNumber(now) * DAY_MS;
  return Math.max(60, Math.round((next - now) / 1000));
}

function dailyDateLabel(day){
  const d = new Date(DAILY_EPOCH + (day - 1) * DAY_MS + DAY_MS / 2);
  const p = function (n){ return n < 10 ? "0" + n : String(n); };
  return p(d.getUTCDate()) + "/" + p(d.getUTCMonth() + 1) + "/" + d.getUTCFullYear();
}

// Deterministic, so every device shuffles a day the same way for ever.
function dailyRandom(seed){
  let a = (seed * 1831565813) >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function dailyTake(list, n, rnd){
  const a = list.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(rnd() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a.slice(0, n);
}

/* Ten words from one family, never more than two of them birds. The same shuffle as
   everywhere else -- so the day stays the same on every device, and a family with no
   birds in it draws exactly what it drew before -- with birds simply passed over once
   two are in hand. */
function dailyPick(list, rnd){
  return dealFrom(dailyTake(list, list.length, rnd));
}

/* Ten words taken in the order given, with the bird cap. */
function dealFrom(ordered){
  const out = [];
  let birds = 0;
  for (let i = 0; i < ordered.length && out.length < DAILY_PER_FAMILY; i++){
    const w = ordered[i];
    if (isBird(w)){
      if (birds >= DAILY_BIRD_MAX) continue;
      birds++;
    }
    out.push(w);
  }
  return out;
}

/* Which words are free today depends on what the days before used, so the whole
   schedule is replayed from day one. A few hundred cheap iterations, years in.

   Nothing is rotated in order. A family is in the running only if it can field ten
   words nobody has seen for fourteen days, and the day picks two of those at random;
   the rule then holds by construction rather than by schedule, and a family that is
   short simply sits the day out and comes back when it has refilled. Small families
   end up appearing every nine days or so and large ones every six, which is exactly
   right -- a small family needs longer to refresh. */
function dailyWords(day){
  return dailyDays(day, day)[0] || [];
}

/* The days from..to, each as its twenty words, out of a single replay of the schedule. */
function dailyDays(from, to){
  const lastUsed = {};
  const days = [];
  let out = [];
  for (let d = 1; d <= to; d++){
    if (d <= DAILY_PLAYED.length){
      out = DAILY_PLAYED[d - 1].slice();
      out.forEach(function(w){ lastUsed[w] = d; });
      if (d >= from) days.push(out);
      continue;
    }
    const rnd = dailyRandom(d);
    const freeIn = function(f){
      return DAILY_POOL[f].filter(function(w){
        return lastUsed[w] === undefined || d - lastUsed[w] >= DAILY_WINDOW;
      });
    };
    const ready = DAILY_FAMILIES.filter(function(f){
      const free = freeIn(f);
      // Ten words of which at most two may be birds, so eight non-birds have to be
      // free. For every family but the winged one this is the same test as before.
      return free.length >= DAILY_PER_FAMILY &&
             free.filter(function(w){ return !isBird(w); }).length >= DAILY_PER_FAMILY - DAILY_BIRD_MAX;
    });
    out = [];
    dailyTake(ready, 2, rnd).forEach(function(f){
      dailyPick(freeIn(f), rnd).forEach(function(w){
        lastUsed[w] = d; out.push(w);
      });
    });
    if (d >= from) days.push(out);
  }
  return days;
}

/* sınırsız: two families and ten words from each, dealt the way the day is, but for
   this device. Words it has not been shown for fourteen days -- here or in the daily
   game -- come first, in random order. When a family runs short of those, the words it
   saw longest ago fill the ten, so a player who plays a lot sees old words again rather
   than no game at all. The two families are the ones that need the fewest such repeats,
   at random among equals.

   On a device that has played the daily game on at least two different days in the
   last fourteen, the daily game's words for today and the next thirteen are held back,
   and dealt only when nothing else is left. The day is the same for everyone and cannot steer around this
   device, so a word dealt here would otherwise turn up again in the daily game inside
   the fourteen days: simulated, that was 13 of the day's 20 words for a player of the
   daily game and one sınırsız round a day. A device that never plays the day has no
   such repeats to avoid, and keeps those 280 words. One day is not enough to count:
   a single try of the daily game held back 280 words for fourteen days, and a player
   of sınırsız alone went from no repeats to six or seven a round. */
const SEEN_SPREAD = 7;

function freshWords(){
  const store = loadStore();
  const seen = store.seen || {};
  const today = dailyDayNumber();
  // 0 for a word free to deal, otherwise the day it was last shown.
  const since = function(w){
    const d = seen[w];
    return typeof d === "number" && today - d < DAILY_WINDOW ? d : 0;
  };
  const playsDaily = dailyDaysPlayed(store, today).length >= 2;
  const held = {};
  if (playsDaily){
    dailyDays(today, today + DAILY_WINDOW - 1).forEach(function(list){
      list.forEach(function(w){ held[w] = true; });
    });
  }
  // A held word ranks after a word seen today, whatever the spread below does to that.
  const level = function(w){ return held[w] ? today + SEEN_SPREAD + 1 : since(w); };
  // Free words sort below every seen one (keys under 0, at random). Seen words are spread
  // across a week around the day they were shown: strictly by day, the ten dealt together
  // on one day came back together too.
  const order = function(x){ return x.d ? x.d + x.r * SEEN_SPREAD : x.r - 1; };
  const families = DAILY_FAMILIES.map(function(f){
    const line = DAILY_POOL[f]
      .map(function(w){ return { w: w, d: level(w), r: Math.random() }; })
      .sort(function(a, b){ return order(a) - order(b); })
      .map(function(x){ return x.w; });
    const newest = Math.max.apply(null, dealFrom(line).map(level));
    return { line: line, newest: newest, r: Math.random() };
  }).sort(function(a, b){ return a.newest - b.newest || a.r - b.r; });

  const out = [];
  families.slice(0, 2).forEach(function(fam){
    dealFrom(fam.line).forEach(function(w){ out.push(w); });
  });
  return out;
}

/* The different days, within the last fourteen, on which this device played the daily
   game. days[N] and the single dailyAt an earlier version kept are read too, so a device
   that played before this list existed is not forgotten. */
function dailyDaysPlayed(store, today){
  const found = {};
  const note = function(n){
    n = Number(n);
    if (n > 0 && today - n >= 0 && today - n < DAILY_WINDOW) found[n] = true;
  };
  (Array.isArray(store.dailyPlayed) ? store.dailyPlayed : []).forEach(note);
  if (typeof store.dailyAt === "number") note(store.dailyAt);
  Object.keys(store.days || {}).forEach(function(n){ if (store.days[n] && store.days[n].drawn) note(n); });
  return Object.keys(found).map(Number);
}

/* The words a round put in front of this device, on today's date. A daily round also
   records the day it was played (see freshWords). */
function rememberSeen(list, daily){
  const store = loadStore();
  if (!store.seen || typeof store.seen !== "object") store.seen = {};
  const today = dailyDayNumber();
  list.forEach(function(w){ store.seen[w] = today; });
  if (daily){
    const played = dailyDaysPlayed(store, today);
    if (played.indexOf(today) < 0) played.push(today);
    store.dailyPlayed = played;
    delete store.dailyAt;
  }
  saveStore(store);
}

  dailyShare:       "günlük · {date}",
  guessTooInvite:   "sen de tahmin et:",
  inviteBlurb:      "20 çizim, 20 kelime. hangisi neydi?"
};

// Fill every element that carries a text key.
function applyText(){
  document.querySelectorAll("[data-t]").forEach(function(el){
    const v = TEXT[el.getAttribute("data-t")];
    if (v != null) el.textContent = v;
  });
  document.querySelectorAll("[data-tph]").forEach(function(el){
    const v = TEXT[el.getAttribute("data-tph")];
    if (v != null) el.setAttribute("placeholder", v);
  });
  document.querySelectorAll("[data-tal]").forEach(function(el){

// What the round was set to, shown on the drawing, recall and result screens and in
// the share text. The two settings say it themselves; there is no grade on top.
function roundLabel(){
  return TEXT[modeOf().key] + " \u00b7 " + secsText(secs);
}

/* Whose drawings, in Turkish. The possessive ending is not fixed: it follows the
   last vowel of the name (vowel harmony), and a name ending in a vowel takes a
   buffer n first. So Ayşe'nin, Mert'in, Çağla'nın, Oğuz'un, Ümmü'nün -- a fixed 'ın
   was only right for names like Başak. Names are typed freely, so the dotted and
   dotless capitals are folded by hand before looking at them, and a name with no
   vowels at all falls back to 'in. */
function whose(name){
  const letters = String(name).replace(/I/g, "ı").replace(/İ/g, "i").toLowerCase()
    .replace(/[^a-zçğıöşüâîû]/g, "");
  const vowels = letters.match(/[aeıioöuüâîû]/g);
  const last = vowels ? vowels[vowels.length - 1] : "e";
  const ending = { a: "ın", â: "ın", ı: "ın", e: "in", i: "in", î: "in",
                   o: "un", u: "un", û: "un", ö: "ün", ü: "ün" }[last];
  const buffer = /[aeıioöuüâîû]$/.test(letters) ? "n" : "";
  return name + "'" + buffer + ending;
}

function boardHeading(){
  const who = drawerName ? TEXT.drawingsOf.replace("{whose}", whose(drawerName)) : TEXT.theseDrawings;
  return who + TEXT.scoresSuffix;
}

const PEN = "#17181c";          // pen colour on the paper
const N = 20;
const CODE_ALPHABET = "23456789ABCDEFGHJKLMNPQRSTUVWXYZ";

/* --------------------------------------------------------------- status --- */

let modeId   = "pool";
let secs     = SECS_DEFAULT;     // seconds per word, 1-10
let theme    = "dark";
let setId    = null;      // "mix" for sınırsız, null for the day; kept only because saves carry it

let words    = [];        // the shuffled 20 words; index = drawing index
let drawings = [];        // drawings[i] = [[{x,y},...], ...]  0-1 normalize
let order    = [];        // order[pos] = index of the drawing shown at grid pos
let picks    = [];        // picks[pos] = chosen or typed answer, or null
let selPos   = -1;
let score    = 0;

let role      = "solo";    // "solo" | "drawer" | "guesser"
let drawerName  = "";        // name of whoever drew the round, in a duel
let lastCode   = "";        // code of the shared round; keys the score board
const NAME_MAX = 10;     // not shown anywhere: the field simply stops accepting more
let myName  = "";        // asked when it is first needed, then kept on the device
let scores  = [];        // [{name, score}] — sunucudan gelen tablo
let scoreSent = false;   // has this round's score been posted yet
let isDaily  = false;    // this round is the day's puzzle, at fixed settings
let dailyDay = 0;
let afterDraw = "";     // where the drawing phase should hand off to
let viewOnly = false;   // reading a board without having finished the round below it
let recallStart = 0;     // when the grid first went up; the board ranks ties by this
let recallMs  = 0;       // how long the round took, frozen once it is finished

const $ = function(id){ return document.getElementById(id); };
const modeOf = function(){ return MODES.find(function(m){ return m.id === modeId; }) || MODES[0]; };
const roundMs = function(){ return Math.round(secs * 1000); };

function clampSecs(v){
  const n = Math.round(Number(v) * 2) / 2;                 // half-second steps
  if (!isFinite(n)) return SECS_DEFAULT;
  return Math.min(SECS_MAX, Math.max(SECS_MIN, n));
}

function secsText(v){ return String(v).replace(".", ",") + " sn"; }

function applyTheme(){
  document.documentElement.dataset.theme = theme;
}

/* --------------------------------------------------------------- storage --- */
/* The v1 brief banned localStorage, back when a round was one throwaway sitting.
   Shared rounds changed that: a link gets opened twice, a phone reloads the tab,
   and the player expects to find their game where they left it. Only what the
   round already shows is kept -- the name typed on this device, and per round
   code the grid order, the answers and whether it was finished. Every access is
   wrapped: Safari in private mode throws on localStorage rather than no-opping. */
const STORE_KEY   = "chizz.v1";
const KEEP_ROUNDS = 40;
const ROUND_TTL   = 30 * 24 * 60 * 60 * 1000;   // the server expires rounds on the same clock

function loadStore(){
  try {
    const v = JSON.parse(localStorage.getItem(STORE_KEY) || "null");
    if (!v || typeof v !== "object") return { name: "", rounds: {} };
    if (!v.rounds || typeof v.rounds !== "object") v.rounds = {};
    if (!v.days || typeof v.days !== "object") v.days = {};
    if (typeof v.name !== "string") v.name = "";
    return v;
  } catch(e){ return { name: "", rounds: {} }; }
}

function saveStore(store){
  // Drop what the server has expired anyway, then keep the newest few.
  const now = Date.now();
  const kept = {};
  Object.keys(store.rounds)
    .filter(function(c){ return now - (store.rounds[c].at || 0) < ROUND_TTL; })
    .sort(function(a, b){ return (store.rounds[b].at || 0) - (store.rounds[a].at || 0); })
    .slice(0, KEEP_ROUNDS)
    .forEach(function(c){ kept[c] = store.rounds[c]; });
  store.rounds = kept;
  // Words stop mattering once fourteen days have passed; unsaved drawings keep to the
  // same limits as rounds.
  if (store.seen && typeof store.seen === "object"){
    const today = dailyDayNumber();
    Object.keys(store.seen).forEach(function(w){
      if (!(today - store.seen[w] < DAILY_WINDOW)) delete store.seen[w];
    });
  }
  if (Array.isArray(store.drafts)){
    store.drafts = store.drafts
      .filter(function(d){ return d && now - (d.at || 0) < ROUND_TTL; })
      .sort(function(a, b){ return (b.at || 0) - (a.at || 0); })
      .slice(0, KEEP_ROUNDS);
  }
  try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
}

function savedName(){ return loadStore().name; }

function rememberSettings(){
  const store = loadStore();
  store.mode  = modeId;
  store.secs  = secs;
  store.theme = theme;
  saveStore(store);
}

function loadSettings(){
  const store = loadStore();
  if (MODES.some(function(m){ return m.id === store.mode; })) modeId = store.mode;
  if (store.secs !== undefined) secs = clampSecs(store.secs);
  if (store.theme === "light" || store.theme === "dark") theme = store.theme;
}

function rememberName(n){
  const store = loadStore();
  store.name = String(n || "").slice(0, NAME_MAX);
  saveStore(store);
}

function savedRound(code){
  return code ? (loadStore().rounds[code] || null) : null;
}

/* What this device has done with a given day. There is no archive -- only today
   can be played -- so yesterday is kept purely so a late finish survives midnight,
   and everything older is dropped. */
function savedDay(day){
  const s = loadStore();
  return (s.days || {})[String(day)] || null;
}

function rememberDay(day, patch){
  if (!day) return;
  const store = loadStore();
  store.days = store.days || {};
  const rec = store.days[String(day)] || {};
  Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
  store.days[String(day)] = rec;
  Object.keys(store.days).forEach(function(k){ if (Number(k) < day - 1) delete store.days[k]; });
  saveStore(store);
}

/* Every screen the player arrives at is an entry in the browser's own history, carrying
   the screen and the round it belongs to. That one record is what the back button walks,
   what a reload reads to come back to the screen it was on, and what a fresh visit lacks
   -- which is how the two are told apart.

   A drawing round owns a single entry from its countdown on, so the back button can be
   caught there and asked about instead of silently throwing the drawings away. */
const ROUND_SCREENS = { send: 1, review: 1, result: 1, recall: 1, gate: 1, pick: 1, choose: 1, answers: 1 };

let historyQuiet = false;    // the next arrival replaces the entry rather than adding one
let leavingRound = false;    // a deliberate exit from a round, not a back press to catch

function historyUrl(screen){
  return location.pathname +
    (ROUND_SCREENS[screen] && lastCode ? "?o=" + encodeURIComponent(lastCode) : "");
}

function recordArrival(screen){
  if (screen === "loading" || screen === "draw") return;   // on the way, or inside the round's entry
  if (screen === "countdown") screen = "draw";
  const here = history.state || {};
  const state = { screen: screen, code: ROUND_SCREENS[screen] ? lastCode : "", depth: here.depth || 0 };
  if (screen === "answers") state.who = answersOf;
  try {
    // Replace when restoring, when nothing has changed, or when a round ends: a finished
    // or abandoned round is not a step to go back into.
    if (historyQuiet || (here.screen === screen && here.code === state.code) || here.screen === "draw"){
      history.replaceState(state, "", historyUrl(screen));
    } else {
      state.depth = (here.depth || 0) + 1;
      history.pushState(state, "", historyUrl(screen));
    }
  } catch (e) { /* private modes that refuse history: the game still works */ }
  historyQuiet = false;
}

/* Back, for the arrows drawn on the page: the same step the browser's own button takes,
   so the two can never disagree. With nothing earlier in this visit to go back to, the
   fallback screen instead. */
function goBack(fallback){
  if (history.state && history.state.depth > 0) history.back();
  else show(fallback || "home");
}

/* Put a history entry's screen back on, without adding another entry for it. */
function restoreEntry(st){
  $("finishAsk").classList.remove("on");
  $("timeAsk").classList.remove("on");
  $("fbAsk").classList.remove("on");
  historyQuiet = true;
  const s = st && st.screen;
  if (s === "scores"){ openDailyBoard(); return; }
  if (s === "archiveScreen"){ buildArchive("archiveFull", 0); show("archiveScreen"); return; }
  // The link form before the round is saved has no code yet: its drawings are the unsaved ones.
  if (s === "between" || (s === "send" && !st.code)){
    const p = loadStore().pending;
    if (p && Array.isArray(p.words) && p.words.length === N){
      resumePending(p);
      if (s === "send"){ historyQuiet = true; openShareScreen("between"); }
      return;
    }
  }
  if (ROUND_SCREENS[s] && st.code){
    // The round already in memory: put the screen back as it was.
    if (st.code === lastCode && words && words.length === N){
      if (s === "result"){ buildResult(); return; }
      if (s === "review"){ buildReview(); return; }
      if (s === "recall"){ buildRecall(); return; }
      if (s === "send"){ openShareScreen("home"); return; }
      if (s === "pick"){ showPick(); return; }
      if (s === "gate"){ show("gate"); return; }
      if (s === "choose"){ showChoose(); return; }
      if (s === "answers" && st.who){ openAnswers(st.who); return; }
    }
    loadGame(st.code, s, st.who);
    return;
  }
  show("home");
}

window.addEventListener("popstate", function(e){
  const drawing = $("draw").classList.contains("on") || $("countdown").classList.contains("on");
  if (drawing && !leavingRound){
    // A half-drawn round is not something to step out of by accident: put the round's
    // entry back, and ask, exactly as the arrow on the drawing screen does.
    try {
      history.pushState({ screen: "draw", code: "", depth: ((e.state && e.state.depth) || 0) + 1 }, "", location.pathname);
    } catch (err) {}
    askExit();
    return;
  }
  leavingRound = false;
  restoreEntry(e.state || { screen: "home", depth: 0 });
});

/* Twenty drawings with nowhere to live yet: a round gets its code when it is sent or
   when guessing starts, so until then a reload would throw the drawings away. */
function rememberPending(){
  const store = loadStore();
  store.pending = {
    setId: setId, modeId: modeId, secs: secs,
    words: words, drawings: encodeDrawings(drawings), at: Date.now()
  };
  saveStore(store);
}

function clearPending(){
  const store = loadStore();
  if (!store.pending) return;
  delete store.pending;
  saveStore(store);
}

/* The round on the between screen is store.pending; a new round used to delete it, so
   only the last unsaved drawing ever survived. Now it moves to store.drafts instead, if
   anything was drawn in it -- a round with no line anywhere is not worth keeping. */
function hasLines(p){
  return !!(p && Array.isArray(p.words) && p.words.length === N &&
            Array.isArray(p.drawings) && p.drawings.some(function(d){ return d && d.length; }));
}

function shelve(store){
  const p = store.pending;
  delete store.pending;
  if (!hasLines(p)) return;
  store.drafts = (store.drafts || []).filter(function(d){ return d.at !== p.at; });
  store.drafts.push(p);
}

function shelvePending(){
  const store = loadStore();
  if (!store.pending) return;
  shelve(store);
  saveStore(store);
}

/* Back to an older unsaved drawing from arşiv: it becomes the round on the between
   screen, and whatever was there goes to the drafts. */
function reopenDraft(p){
  const store = loadStore();
  if (store.pending && store.pending.at !== p.at) shelve(store);
  store.drafts = (store.drafts || []).filter(function(d){ return d.at !== p.at; });
  store.pending = p;
  saveStore(store);
  resumePending(p);
}

function resumePending(rec){
  isDaily = false; dailyDay = 0; afterDraw = "";
  setId = typeof rec.setId === "string" ? rec.setId : "mix";
  modeId = MODES.some(function(m){ return m.id === rec.modeId; }) ? rec.modeId : modeId;
  secs = clampSecs(rec.secs);
  role = "solo"; drawerName = ""; lastCode = "";
  scores = []; scoreSent = false;
  recallStart = 0; recallMs = 0;
  words = rec.words.slice();
  drawings = decodeDrawings(rec.drawings || []);
  order = shuffle(words.map(function(_, i){ return i; }));
  picks = new Array(N).fill(null);
  selPos = -1;
  show("between");
  // A reload can land here with the name question unanswered; it is still required.
  if (!myName) askName();
}

function drewToday(){
  const rec = savedDay(dailyDayNumber());
  return !!(rec && rec.drawn);
}

function rememberRound(code, patch){
  if (!code) return;
  const store = loadStore();
  const rec = store.rounds[code] || {};
  Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
  rec.at = Date.now();
  store.rounds[code] = rec;
  saveStore(store);
}

// Put the round in the address bar so a reload returns to it instead of the home
// screen. replaceState, not pushState: the back button should still leave.
/* The code arrives after the send screen's history entry was made, so that one entry is
   given its code here. Every other screen gets its address as it is arrived at. */
function setUrlCode(code){
  try {
    const st = Object.assign({}, history.state || {}, { code: code });
    history.replaceState(st, "", location.pathname + "?o=" + encodeURIComponent(code));
  } catch(e){}
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function show(id, as){
  const list = document.querySelectorAll(".screen");
  for (let i = 0; i < list.length; i++) list[i].classList.toggle("on", list[i].id === id);
  if (typeof closeZoom === "function") closeZoom();
  if (id === "home"){
    // The day's line goes stale the moment it is played, and every route back to the
    // start screen has to show the new state, not just the ones that rebuild the page.
    if (typeof buildDailyRow === "function") buildDailyRow();
    // So is arşiv: a round drawn or finished since the page was built belongs in it.
    if (typeof archiveButton === "function") archiveButton();
  }
  // "as" is for a screen that borrows another's section: the drawings-with-board screen
  // is the result's section, but it is not the result.
  if (typeof recordArrival === "function") recordArrival(as || id);
  // The code can arrive from a save, a reload, or a link, so the chip is refreshed
  // on every screen change rather than at any one of those points.
  if (typeof updateCodeChip === "function") updateCodeChip();
  // stop polling on any screen other than the score board
  if (id !== "result" && id !== "scores" && typeof stopBoardPoll === "function") stopBoardPoll();
}

/* ------------------------------------------------- cevap normalizasyonu --- */

const TURKISH_FOLD = { "ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u","ê":"e" };

let PUNCTUATION;
try { PUNCTUATION = new RegExp("[^\\p{L}\\p{N}\\s]", "gu"); }
catch (e){ PUNCTUATION = /[^a-z0-9\s]/g; }

function norm(s){
  s = String(s == null ? "" : s);
  s = s.toLocaleLowerCase("tr");
  s = s.replace(/̇/g, "");                     // combining dot left by lowercasing "İ"
  s = s.replace(/[çğıöşüâîûê]/g, function(ch){ return TURKISH_FOLD[ch] || ch; });
  s = s.replace(PUNCTUATION, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

// Levenshtein mesafesi <= 1 mi
function withinOneEdit(a, b){
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb){
    let d = 0;
    for (let i = 0; i < la; i++) if (a[i] !== b[i] && ++d > 1) return false;
    return true;
  }
  const kisa = la < lb ? a : b, uzun = la < lb ? b : a;
  let i = 0, j = 0, d = 0;
  while (i < kisa.length && j < uzun.length){
    if (kisa[i] === uzun[j]){ i++; j++; }
    else { if (++d > 1) return false; j++; }
  }
  return true;
}

function isCorrect(cevap, kelime){
  const a = norm(cevap);
  if (!a) return false;                 // a blank answer is always wrong
  return withinOneEdit(a, norm(kelime));
}

function showChoose(){

/* The way in, and whether there is anything behind it. A button opening an empty page is
   worse than no button, so it waits until this device has finished something. */
function archiveButton(){
  const items = archiveItems();
  $("archiveSec").hidden = items.length === 0;
  if (!items.length) return;
  buildArchive("archive", 2);
  // A way through only when there is something through it.
  $("archiveOpen").hidden = items.length <= 2;
}

$("archiveOpen").onclick = function(){ buildArchive("archiveFull", 0); show("archiveScreen"); };
$("archiveBack").onclick = function(){ goBack("home"); };

/* ------------------------------------------------------------- arşiv --- */

/* What this device has finished, newest first. The store already keeps thirty days of
   rounds and no more -- the same clock the server expires them on -- so "the last thirty
   days" is simply everything in it that has been played to the end.

   Only the bookkeeping is on the device; the drawings live on the server. Fetching forty
   rounds the moment the start screen opens would be rude, so a row asks for its own
   drawings when it comes into view, and what arrives is kept for the rest of the visit. */
const archiveSeen = {};        // code -> the round as the server has it

let archiveIO = null;

/* Twenty small canvases can be handed their drawings before the layout has given them a
   width, and a canvas painted at zero width stays empty for good. The round grid keeps a
   ResizeObserver for the same reason; this is the archive's. */
const archiveRO = typeof ResizeObserver !== "undefined"
  ? new ResizeObserver(function(entries){
      for (let i = 0; i < entries.length; i++) paintThumb(entries[i].target);
    })
  : null;

/* One drawing, small. The strokes are on the canvas itself, so a repaint needs nothing
   looked up: whatever the row fetched is still here when the width arrives. */
function paintThumb(cv){
  const strokes = cv.__strokes;
  if (!strokes) return;
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  paintStrokes(ctx, strokes, size, Math.max(1, size * 0.05));
}

function archiveWhen(at){
  const d = new Date(at || Date.now());
  const p = function(n){ return n < 10 ? "0" + n : String(n); };
  return p(d.getDate()) + "/" + p(d.getMonth() + 1);
}

/* What the archive holds, newest first: every round this device finished, every round it
   drew that nobody has guessed yet, and a drawing never saved at all. The last has no code,
   so it is carried as the drawing itself. */
function archiveItems(){
  const store = loadStore();
  const items = Object.keys(store.rounds || {})
    .filter(function(c){ const r = store.rounds[c]; return r && (r.done || r.mine); })
    .map(function(c){ return { code: c, at: store.rounds[c].at || 0 }; });
  (store.drafts || []).concat(store.pending ? [store.pending] : []).forEach(function(p){
    if (hasLines(p)) items.push({ pending: p, at: p.at || 0 });
  });
  return items.sort(function(a, b){ return b.at - a.at; });
}

/* Into whichever list is asked for: the short one on the start screen, or the whole
   thing on its own page. A limit of 0 means all of them. */
function buildArchive(boxId, limit){
  const box = $(boxId);
  if (!box) return;
  const store = loadStore();
  const all = archiveItems();
  const items = limit ? all.slice(0, limit) : all;

  if ($("archiveEmpty")) $("archiveEmpty").hidden = all.length > 0;
  if (archiveIO) archiveIO.disconnect();
  if (archiveRO) archiveRO.disconnect();
  archiveIO = typeof IntersectionObserver !== "undefined"
    ? new IntersectionObserver(function(rows){
        rows.forEach(function(r){
          if (!r.isIntersecting) return;
          archiveIO.unobserve(r.target);
          fillArchiveRow(r.target);
        });
      }, { rootMargin: "200px" })
    : null;

  box.innerHTML = "";
  items.forEach(function(item){
    const rec = item.pending ? { mine: true } : store.rounds[item.code];
    const row = document.createElement("button");
    row.className = "arow";
    if (item.code) row.dataset.code = item.code;

    const head = document.createElement("div");
    head.className = "ahead";
    const when = document.createElement("span");
    when.className = "awhen";
    when.textContent = archiveWhen(item.at);
    const who = document.createElement("span");
    who.className = "awho";
    who.textContent = rec.mine ? TEXT.archiveMine : TEXT.archiveTheirs;
    const score = document.createElement("span");
    score.className = "ascore";
    // Nobody has guessed it yet, so there is no score to show -- not a score of zero.
    score.textContent = rec.done ? (rec.score || 0) + "/" + N : "\u2014";
    head.appendChild(when); head.appendChild(who); head.appendChild(score);

    const strip = document.createElement("div");
    strip.className = "astrip";
    for (let i = 0; i < N; i++){
      const t = document.createElement("div");
      t.className = "athumb";
      t.appendChild(document.createElement("canvas"));
      strip.appendChild(t);
    }

    const code2 = document.createElement("div");
    code2.className = "acode";
    code2.textContent = item.pending
      ? TEXT.archiveUnsaved
      : item.code + (rec.ms ? " \u00b7 " + timeLabel(rec.ms) : "");

    row.appendChild(head);
    row.appendChild(strip);
    row.appendChild(code2);
    box.appendChild(row);

    if (item.pending){
      // Drawn here and never saved: the drawings are on the device, and with no code there
      // is no board, so it opens where a just-drawn round opens.
      row.onclick = function(){ reopenDraft(item.pending); };
      paintArchiveRow(row, { drawings: decodeDrawings(item.pending.drawings || []), day: 0 });
      return;
    }
    // Finished opens the result; drawn but not yet guessed opens the drawings with the board.
    row.onclick = function(){ loadGame(item.code, rec.done ? "" : "review"); };
    if (archiveIO) archiveIO.observe(row); else fillArchiveRow(row);
  });
}

/* One row's drawings. A round that has expired on the server simply keeps its empty
   squares: the score beside them is this device's own record and still true. */
function fillArchiveRow(row){
  const code = row.dataset.code;
  if (!code) return;
  if (archiveSeen[code]){ paintArchiveRow(row, archiveSeen[code]); return; }
  api("/api/game/" + encodeURIComponent(code)).then(function(r){
    if (!r.ok || !r.data) return;
    const round = {
      drawings: decodeDrawings(r.data.drawings),
      day: Number(r.data.day) > 0 ? Number(r.data.day) : 0,
      name: typeof r.data.name === "string" ? r.data.name : ""
    };
    archiveSeen[code] = round;
    paintArchiveRow(row, round);
  }).catch(function(){ /* offline: the row keeps its score and its empty squares */ });
}

function paintArchiveRow(row, round){
  // Whether it was a daily round is something only the server knows, so it is said here,
  // where the answer arrives.
  if (round.day){
    const who = row.querySelector(".awho");
    if (who) who.textContent = TEXT.archiveDaily;
  }
  const cvs = row.querySelectorAll(".athumb canvas");
  for (let i = 0; i < cvs.length; i++){
    cvs[i].__strokes = round.drawings[i] || [];
    paintThumb(cvs[i]);                     // now, if it already has a width
    if (archiveRO) archiveRO.observe(cvs[i]);   // and again when it gets one
  }
}

/* The day's puzzle sits above everything else. Once it is done it stops being a

/* Put your own day back in play from what this device stored. The day record holds
   the drawings; once guessing has started, the answers so far are kept against the
   round's code, so they are read from there. Comes back to the grid if the day is
   still open and to the result if it is finished. */
function resumeDaily(rec){
  const round = (rec.code && savedRound(rec.code)) || {};
  const kept = Array.isArray(round.order) && round.order.length === N ? round
             : (Array.isArray(rec.order) && rec.order.length === N ? rec : null);
  const done = !!(rec.done || round.done);
  dailyDay = dailyDayNumber();
  isDaily = true; modeId = "typed"; secs = 3; setId = null;
  role = "solo"; drawerName = ""; lastCode = rec.code || "";
  scores = []; scoreSent = !!rec.sent;
  recallStart = round.startedAt || 0;
  recallMs = done ? (rec.ms || round.ms || 0) : 0;
  words = rec.words.slice();
  drawings = decodeDrawings(rec.drawings || []);
  order = kept ? kept.order.slice() : shuffle(words.map(function(_, i){ return i; }));
  picks = kept && Array.isArray(kept.picks) && kept.picks.length === N
    ? kept.picks.slice() : new Array(N).fill(null);
  selPos = -1;
  // No code yet means guessing never started; the save on the way in sets one.
  if (done) buildResult(); else buildRecall();
}


/* --------------------------------------------------------------- sound --- */
/* Tones are synthesised rather than loaded, so the page still pulls nothing from
   outside. A browser will not let audio start without a gesture, so the context is
   created and resumed on the first tap -- pressing start, in practice -- and every
   later beep runs on that one permission. */
let audio = null;

// Resolves once the context is actually running, so a countdown can wait for it
// instead of scheduling tones into a context that is still suspended and dropping
// them.
function wakeAudio(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return Promise.resolve();
    if (!audio) audio = new Ctx();
    if (audio.state === "suspended"){
      const r = audio.resume();
      if (r && r.then) return r.catch(function(){});
    }
  } catch(e){ audio = null; }      // no audio is not a reason to stop the game
  return Promise.resolve();
}

function tone(freq, startIn, length, peak){
  if (!audio || audio.state !== "running") return;
  try {
    const t0 = audio.currentTime + startIn;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    // Ramped rather than switched, so it does not click at either end.
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t0); osc.stop(t0 + length + 0.02);
  } catch(e){}
}

/* All four countdown tones are scheduled in one go, on the audio clock, against the
   same absolute grid the numbers use. Firing each one from its own setTimeout at
   "currentTime + 0" was the problem: the timeout chain restarted from whenever the
   callback actually ran, so lateness piled up, and a tone asked for at +0 lands on
   the next render quantum rather than now. The audio clock does not drift, so the
   beats stay even however busy the page gets.

   startAt is a performance.now() reading, so the offset is measured rather than
   assumed -- scheduling may happen a little after the countdown became visible,
   while waiting for the context to resume. */
function countdownBeeps(startAt){
  if (!audio || audio.state !== "running") return;
  for (let k = 0; k <= 3; k++){
    const when = (startAt + k * 1000 - performance.now()) / 1000;
    if (when < -0.05) continue;                        // that beat is already gone
    if (k < 3) tone(660, Math.max(0, when), 0.12, 0.14);   // 3, 2, 1
    else       tone(990, Math.max(0, when), 0.22, 0.17);   // draw
  }
}
function beepScores(){                                        // the board is in
  tone(523.25, 0,    0.16, 0.11);
  tone(659.25, 0.13, 0.16, 0.11);
  tone(783.99, 0.26, 0.30, 0.13);
}

document.addEventListener("pointerdown", wakeAudio, { once: true });
