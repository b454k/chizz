/* What this device has done with a given day. There is no archive -- only today
   can be played -- so yesterday is kept purely so a late finish survives midnight,
   and everything older is dropped. */
function savedDay(day){
  const s = loadStore();
  return (s.days || {})[String(day)] || null;
}

function rememberDay(day, patch){
  if (!day) return;
  const store = loadStore();
  store.days = store.days || {};
  const rec = store.days[String(day)] || {};
  Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
  store.days[String(day)] = rec;
  Object.keys(store.days).forEach(function(k){ if (Number(k) < day - 1) delete store.days[k]; });
  saveStore(store);
}

/* Every screen the player arrives at is an entry in the browser's own history, carrying
   the screen and the round it belongs to. That one record is what the back button walks,
   what a reload reads to come back to the screen it was on, and what a fresh visit lacks
   -- which is how the two are told apart.

   A drawing round owns a single entry from its countdown on, so the back button can be
   caught there and asked about instead of silently throwing the drawings away. */
const ROUND_SCREENS = { send: 1, review: 1, result: 1, recall: 1, gate: 1, pick: 1, choose: 1, answers: 1 };

let historyQuiet = false;    // the next arrival replaces the entry rather than adding one
let leavingRound = false;    // a deliberate exit from a round, not a back press to catch

function historyUrl(screen){
  return location.pathname +
    (ROUND_SCREENS[screen] && lastCode ? "?o=" + encodeURIComponent(lastCode) : "");
}

function recordArrival(screen){
  if (screen === "loading" || screen === "draw") return;   // on the way, or inside the round's entry
  if (screen === "countdown") screen = "draw";
  const here = history.state || {};
  const state = { screen: screen, code: ROUND_SCREENS[screen] ? lastCode : "", depth: here.depth || 0 };
  if (screen === "answers") state.who = answersOf;
  if (screen === "scores") state.mode = dayBoard.mode;
  try {
    // Replace when restoring, when nothing has changed, or when a round ends: a finished
    // or abandoned round is not a step to go back into.
    if (historyQuiet || (here.screen === screen && here.code === state.code) || here.screen === "draw"){
      history.replaceState(state, "", historyUrl(screen));
    } else {
      state.depth = (here.depth || 0) + 1;
      history.pushState(state, "", historyUrl(screen));
    }
  } catch (e) { /* private modes that refuse history: the game still works */ }
  historyQuiet = false;
}

/* Back, for the arrows drawn on the page: the same step the browser's own button takes,
   so the two can never disagree. With nothing earlier in this visit to go back to, the
   fallback screen instead. */
function goBack(fallback){
  if (history.state && history.state.depth > 0) history.back();
  else show(fallback || "home");
}

/* Put a history entry's screen back on, without adding another entry for it. */
/* Everything that sits on top of the game. A step through history puts a different screen
   underneath, so whatever was open belongs to a round that is no longer there. Four of
   these were already closed here and the rest were not, which is how a card asking for a
   name came to be left standing over somebody else's round. */
function closeOverlays(){
  ["confirm", "finishAsk", "timeAsk", "fbAsk", "howAsk"].forEach(function(id){
    const el = $(id);
    if (el) el.classList.remove("on");
  });
  if (typeof closeSheet === "function") closeSheet();
  if (typeof closeModal === "function") closeModal();
  if (typeof closeZoom === "function") closeZoom();
}

function restoreEntry(st){
  closeOverlays();
  historyQuiet = true;
  const s = st && st.screen;
  if (s === "scores"){ openDayBoard(MODES.some(function(m){ return m.id === st.mode; }) ? st.mode : "typed"); return; }
  if (s === "dayPick"){ showDayPick(); return; }
  if (s === "archiveScreen"){ buildArchive("archiveFull", 0); show("archiveScreen"); return; }
  // The link form and the kolay/zor question, before the round is saved, have no code
  // yet: their drawings are the unsaved ones.
  if (s === "between" || ((s === "send" || s === "choose") && !st.code)){
    const p = loadStore().pending;
    if (p && Array.isArray(p.words) && p.words.length === N){
      resumePending(p);
      historyQuiet = true;
      if (s === "send") openShareScreen("between");
      else if (s === "choose") showChoose();
      return;
    }
  }
  if (ROUND_SCREENS[s] && st.code){
    // The round already in memory: put the screen back as it was.
    if (st.code === lastCode && words && words.length === N){
      if (s === "result"){ buildResult(); return; }
      if (s === "review"){ buildReview(); return; }
      if (s === "recall"){ buildRecall(); return; }
      if (s === "send"){ openShareScreen("home"); return; }
      if (s === "pick"){ showPick(); return; }
      if (s === "gate"){ show("gate"); return; }
      // Once guessing has begun the mode is settled: going back to the question would let
      // a round begun in kolay, with the words in front of you, be begun again in zor.
      if (s === "choose"){ if (recallStart) buildRecall(); else showChoose(); return; }
      if (s === "answers" && st.who){ openAnswers(st.who); return; }
    }
    loadGame(st.code, s, st.who);
    return;
  }
  show("home");
}

window.addEventListener("popstate", function(e){
  const drawing = $("draw").classList.contains("on") || $("countdown").classList.contains("on");
  if (drawing && !leavingRound){
    // A half-drawn round is not something to step out of by accident: put the round's
    // entry back, and ask, exactly as the arrow on the drawing screen does.
    try {
      history.pushState({ screen: "draw", code: "", depth: ((e.state && e.state.depth) || 0) + 1 }, "", location.pathname);
    } catch (err) {}
    askExit();
    return;
  }
  // Twenty drawings have just happened, and the round they were started from is not a
  // step back: going into it would swap what the player is holding for somebody else's
  // round, name and link, one tap away from a paylaş that sends theirs. Back leaves for
  // the start screen; the drawings are kept and arşiv has them.
  if ($("between").classList.contains("on")){
    closeOverlays();
    show("home");
    return;
  }
  // Guessing is not something to step out of by accident either, and the step landed on
  // the kolay/zor question -- which, once the words have been seen in kolay, is a way to
  // begin again in zor already knowing them. The entry goes back and the question is the
  // one the arrow on this screen asks: çık, or oyuna dön.
  if ($("recall").classList.contains("on") && !leavingRound){
    try {
      history.pushState({ screen: "recall", code: lastCode, depth: ((e.state && e.state.depth) || 0) + 1 },
                        "", historyUrl("recall"));
    } catch (err) {}
    askExit();
    return;
  }
  leavingRound = false;
  restoreEntry(e.state || { screen: "home", depth: 0 });
});

/* Twenty drawings with nowhere to live yet: a round gets its code when it is sent or
   when guessing starts, so until then a reload would throw the drawings away. */
function rememberPending(){
  const store = loadStore();
  store.pending = {
    setId: setId, modeId: modeId, secs: secs,
    words: words, drawings: encodeDrawings(drawings), at: Date.now()
  };
  saveStore(store);
}

function clearPending(){
  const store = loadStore();
  if (!store.pending) return;
  delete store.pending;
  saveStore(store);
}

/* The same twenty drawings can sit in arşiv twice: once as the round that was saved, and
   once as the drawing it was made from, when the copy on the device outlived the save --
   which is what happened whenever the device could not write at the moment the round got
   its code. A saved round keeps no words on the device, so the record alone cannot tell
   the two apart; the archive fetches them to paint its thumbnails, and that is where the
   unsaved twin is recognised. Twenty words in one order belong to one round: they are
   dealt shuffled, so two rounds sharing all of them in sequence does not happen.

   store.pending is left alone. It is the round the player may be standing in the middle
   of, and it becomes a draft of its own accord as soon as another round starts. */
function dropDraftsLike(words){
  if (!Array.isArray(words) || words.length !== N) return false;
  const key = words.join("␀");
  const store = loadStore();
  const drafts = store.drafts || [];
  const kept = drafts.filter(function(d){
    return !(d && Array.isArray(d.words) && d.words.join("␀") === key);
  });
  if (kept.length === drafts.length) return false;
  store.drafts = kept;
  saveStore(store);
  return true;
}

/* The round on the between screen is store.pending; a new round used to delete it, so
   only the last unsaved drawing ever survived. Now it moves to store.drafts instead, if
   anything was drawn in it -- a round with no line anywhere is not worth keeping. */
function hasLines(p){
  return !!(p && Array.isArray(p.words) && p.words.length === N &&
            Array.isArray(p.drawings) && p.drawings.some(function(d){ return d && d.length; }));
}

function shelve(store){
  const p = store.pending;
  delete store.pending;
  if (!hasLines(p)) return;
  store.drafts = (store.drafts || []).filter(function(d){ return d.at !== p.at; });
  store.drafts.push(p);
}

function shelvePending(){
  const store = loadStore();
  if (!store.pending) return;
  shelve(store);
  saveStore(store);
}

/* Back to an older unsaved drawing from arşiv: it becomes the round on the between
   screen, and whatever was there goes to the drafts. */
function reopenDraft(p){
  const store = loadStore();
  if (store.pending && store.pending.at !== p.at) shelve(store);
  store.drafts = (store.drafts || []).filter(function(d){ return d.at !== p.at; });
  store.pending = p;
  saveStore(store);
  resumePending(p);
}

function resumePending(rec){
  isDaily = false; dailyDay = 0; afterDraw = "";
  setId = typeof rec.setId === "string" ? rec.setId : "mix";
  modeId = MODES.some(function(m){ return m.id === rec.modeId; }) ? rec.modeId : modeId;
  secs = clampSecs(rec.secs);
  role = "solo"; drawerName = ""; lastCode = "";
  scores = []; scoreSent = false;
  recallStart = 0; recallMs = 0;
  words = rec.words.slice();
  drawings = decodeDrawings(rec.drawings || []);
  order = shuffle(words.map(function(_, i){ return i; }));
  picks = new Array(N).fill(null);
  selPos = -1;
  show("between");
}

function drewToday(){
  const rec = savedDay(dailyDayNumber());
  return !!(rec && rec.drawn);
}

function rememberRound(code, patch){
  if (!code) return;
  const store = loadStore();
  const rec = store.rounds[code] || {};
  Object.keys(patch).forEach(function(k){ rec[k] = patch[k]; });
  // When the round was, and not a moment later. Every answer typed, every link opened
  // again, every score posted comes through here, and stamping the time on each of them
  // made arşiv put whatever had last been touched at the top, under today's date, instead
  // of the newest round. It is also what the thirty-day drop and the forty kept are
  // measured by, and the server expires a round thirty days after it was saved, so the
  // day it was made is the right mark for those too.
  if (!rec.at) rec.at = Date.now();
  store.rounds[code] = rec;
  saveStore(store);
}

// Put the round in the address bar so a reload returns to it instead of the home
// screen. replaceState, not pushState: the back button should still leave.
/* The code arrives after the send screen's history entry was made, so that one entry is
   given its code here. Every other screen gets its address as it is arrived at. */
function setUrlCode(code){
  try {
    const st = Object.assign({}, history.state || {}, { code: code });
    history.replaceState(st, "", location.pathname + "?o=" + encodeURIComponent(code));
  } catch(e){}
}

function shuffle(a){
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

function show(id, as){
  const list = document.querySelectorAll(".screen");
  for (let i = 0; i < list.length; i++) list[i].classList.toggle("on", list[i].id === id);
  if (typeof closeZoom === "function") closeZoom();
  if (id === "home"){
    // A friend's round may have lent its language; the start screen is the device's own.
    const own = deviceLang();
    if (own && own !== lang){ useLang(own); buildHome(); }
    // The day's line goes stale the moment it is played, and every route back to the
    // start screen has to show the new state, not just the ones that rebuild the page.
    if (typeof buildDailyRow === "function") buildDailyRow();
    // So is arşiv: a round drawn or finished since the page was built belongs in it.
    if (typeof archiveButton === "function") archiveButton();
    // A device that has never played is shown how, once.
    if (typeof maybeHowTo === "function") maybeHowTo();
  }
  // A friend's link is where most people meet the game, so it is shown there as well: over
  // the question about how to guess, and over "önce sen çiz". Both are screens a link
  // lands on, and both are read before anything is played.
  if (id === "choose" || id === "gate"){
    if (typeof maybeHowTo === "function") maybeHowTo();
  }
  // "as" is for a screen that borrows another's section: the drawings-with-board screen
  // is the result's section, but it is not the result.
  if (typeof recordArrival === "function") recordArrival(as || id);
  track("screen", { screen: as || id });
  // The code can arrive from a save, a reload, or a link, so the chip is refreshed
  // on every screen change rather than at any one of those points.
  if (typeof updateCodeChip === "function") updateCodeChip();
  // stop polling on any screen other than the score board
  if (id !== "result" && id !== "scores" && typeof stopBoardPoll === "function") stopBoardPoll();
}

/* ------------------------------------------------- cevap normalizasyonu --- */

const TURKISH_FOLD = { "ç":"c","ğ":"g","ı":"i","ö":"o","ş":"s","ü":"u","â":"a","î":"i","û":"u","ê":"e" };

let PUNCTUATION;
try { PUNCTUATION = new RegExp("[^\\p{L}\\p{N}\\s]", "gu"); }
catch (e){ PUNCTUATION = /[^a-z0-9\s]/g; }

function norm(s){
  s = String(s == null ? "" : s);
  s = s.toLocaleLowerCase("tr");
  s = s.replace(/̇/g, "");                     // combining dot left by lowercasing "İ"
  s = s.replace(/[çğıöşüâîûê]/g, function(ch){ return TURKISH_FOLD[ch] || ch; });
  s = s.replace(PUNCTUATION, " ");
  s = s.replace(/\s+/g, " ").trim();
  return s;
}

// Levenshtein mesafesi <= 1 mi
function withinOneEdit(a, b){
  if (a === b) return true;
  const la = a.length, lb = b.length;
  if (Math.abs(la - lb) > 1) return false;
  if (la === lb){
    let d = 0;
    for (let i = 0; i < la; i++) if (a[i] !== b[i] && ++d > 1) return false;
    return true;
  }
  const kisa = la < lb ? a : b, uzun = la < lb ? b : a;
  let i = 0, j = 0, d = 0;
  while (i < kisa.length && j < uzun.length){
    if (kisa[i] === uzun[j]){ i++; j++; }
    else { if (++d > 1) return false; j++; }
  }
  return true;
}

/* Every English name in the pool, normalised. English names are short and close together --
   cat, hat, bat, car, jar and ear are all drawings -- so an answer that is itself one of them
   is taken as meant: it counts for its own drawing and is not a typo for another. Without
   this, hat answered for the cat. */
let enForms = null;
function isEnglishForm(a){
  if (!enForms){
    enForms = {};
    Object.keys(WORDS_EN).forEach(function(w){
      WORDS_EN[w].forEach(function(f){ enForms[norm(f)] = true; });
    });
  }
  return !!enForms[a];
}

/* An answer is judged against the word in both languages, so a board marks a row the same
   for everyone reading it, whichever language each of them plays in. */
function isCorrect(cevap, kelime){
  const a = norm(cevap);
  if (!a) return false;                 // a blank answer is always wrong
  const names = [kelime].concat(ALSO[kelime] || [], WORDS_EN[kelime] || []);
  const exact = isEnglishForm(a);
  for (let i = 0; i < names.length; i++){
    const n = norm(names[i]);
    if (a === n || (!exact && withinOneEdit(a, n))) return true;
  }
  return false;
}

function modeCard(m){
  const b = document.createElement("button");
  b.className = "diff";
  b.dataset.mode = m.id;          // kolay and zor each get their own colour and picture
  const tag = document.createElement("span");
  tag.className = "mtag";
  tag.textContent = TEXT[m.tag];
  const name = document.createElement("b");
  name.className = "mname";
  name.textContent = TEXT[m.key];
  b.appendChild(tag);
  const desc = document.createElement("span");
  desc.className = "mdesc";
  desc.textContent = TEXT[m.desc];
  b.appendChild(name); b.appendChild(desc);
  return b;
}

/* Before any guessing starts, on your own round or a friend's: kolay or zor. It is a
   question about guessing, so it is asked on the way in rather than before the drawing,
   and the choice is kept with the round, so a guess left half done comes back the way it
   was begun. The day is not asked: it is the same game for everybody. */
function showChoose(keepTyped){
  const theirs = role === "guesser";
  $("chooseTitle").textContent = theirs
    ? (drawerName ? TEXT.whatDidDraw.replace("{name}", drawerName) : TEXT.whatWasDrawn)
    : TEXT.chooseTitle;
  $("chooseBody").textContent = theirs ? TEXT.chooseTitle : "";
  // Somebody else's round, and no name on this device yet: the board at the end of it is
  // what the name is for, so it is asked before the guessing rather than after.
  $("chooseName").hidden = !(theirs && !myName);
  if (!keepTyped) $("chooseNameField").value = "";
  $("chooseNameErr").textContent = "";
  // The language to guess in, as two small flags. The round opens in the drawer's
  // language; a tap here is the guesser's own choice, kept for the device and the round.
  const flags = $("chooseFlags");
  flags.innerHTML = "";
  [["tr", "türkçe"], ["en", "english"]].forEach(function(pair){
    const b = document.createElement("button");
    b.className = pair[0] === lang ? "sel" : "";
    b.lang = pair[0];
    b.title = pair[1];
    b.setAttribute("aria-label", pair[1]);
    b.setAttribute("aria-pressed", pair[0] === lang ? "true" : "false");
    b.innerHTML = FLAGS[pair[0]];
    b.onclick = function(){
      if (pair[0] === lang) return;
      chooseLang(pair[0]);
      if (lastCode) rememberRound(lastCode, { lang: pair[0] });
      showChoose(true);
    };
    flags.appendChild(b);
  });
  const box = $("chooseModes");
  box.innerHTML = "";
  MODES.forEach(function(m){
    const b = modeCard(m);
    b.onclick = function(){
      // The name travels with the choice: one tap, not a second screen.
      if (!$("chooseName").hidden && !setName($("chooseNameField").value)){
        $("chooseNameErr").textContent = TEXT.enterName;
        $("chooseNameField").focus();
        return;
      }
      modeId = m.id;
      rememberRound(lastCode, { modeId: m.id });
      // The day keeps it too: it decides which of the day's two boards the score joins,
      // and a day picked up again later resumes the way it was begun. Only for the day
      // this device drew: a choice made for a friend's daily round used to be written here
      // as well, and the player's own guessing then began in it without being asked.
      if (isDaily && dailyDay && !theirs) rememberDay(dailyDay, { modeId: m.id });
      buildRecall();
    };
    box.appendChild(b);
  });
  show("choose");
}

/* ------------------------------------------------------------- arşiv --- */

/* What this device has finished, newest first. The store already keeps thirty days of
   rounds and no more -- the same clock the server expires them on -- so "the last thirty
   days" is simply everything in it that has been played to the end.

   Only the bookkeeping is on the device; the drawings live on the server. Fetching forty
   rounds the moment the start screen opens would be rude, so a row asks for its own
   drawings when it comes into view, and what arrives is kept for the rest of the visit. */
const archiveSeen = {};        // code -> the round as the server has it

let archiveIO = null;

/* Twenty small canvases can be handed their drawings before the layout has given them a
   width, and a canvas painted at zero width stays empty for good. The round grid keeps a
   ResizeObserver for the same reason; this is the archive's. */
const archiveRO = typeof ResizeObserver !== "undefined"
  ? new ResizeObserver(function(entries){
      for (let i = 0; i < entries.length; i++) paintThumb(entries[i].target);
    })
  : null;

/* One drawing, small. The strokes are on the canvas itself, so a repaint needs nothing
   looked up: whatever the row fetched is still here when the width arrives. */
function paintThumb(cv){
  const strokes = cv.__strokes;
  if (!strokes) return;
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  paintStrokes(ctx, strokes, size, Math.max(1, size * 0.05));
}

function archiveWhen(at){
  const d = new Date(at || Date.now());
  const p = function(n){ return n < 10 ? "0" + n : String(n); };
  if (lang === "en") return d.getDate() + " " + TEXT.months.split(" ")[d.getMonth()];
  return p(d.getDate()) + "/" + p(d.getMonth() + 1);
}

/* What the archive holds, newest first: every round this device finished, every round it
   drew that nobody has guessed yet, and a drawing never saved at all. The last has no code,
   so it is carried as the drawing itself. */
function archiveItems(){
  const store = loadStore();
  const items = Object.keys(store.rounds || {})
    .filter(function(c){ const r = store.rounds[c]; return r && (r.done || r.mine); })
    .map(function(c){ return { code: c, at: store.rounds[c].at || 0 }; });
  (store.drafts || []).concat(store.pending ? [store.pending] : []).forEach(function(p){
    if (hasLines(p)) items.push({ pending: p, at: p.at || 0 });
  });
  return items.sort(function(a, b){ return b.at - a.at; });
}

/* Into whichever list is asked for: the short one on the start screen, or the whole
   thing on its own page. A limit of 0 means all of them. */
function buildArchive(boxId, limit){
  const box = $(boxId);
  if (!box) return;
  const store = loadStore();
  const all = archiveItems();
  const items = limit ? all.slice(0, limit) : all;

  if ($("archiveEmpty")) $("archiveEmpty").hidden = all.length > 0;
  if (archiveIO) archiveIO.disconnect();
  if (archiveRO) archiveRO.disconnect();
  archiveIO = typeof IntersectionObserver !== "undefined"
    ? new IntersectionObserver(function(rows){
        rows.forEach(function(r){
          if (!r.isIntersecting) return;
          archiveIO.unobserve(r.target);
          fillArchiveRow(r.target);
        });
      }, { rootMargin: "200px" })
    : null;

  box.innerHTML = "";
  items.forEach(function(item){
    const rec = item.pending ? { mine: true } : store.rounds[item.code];
    const row = document.createElement("button");
    row.className = "arow";
    if (item.code) row.dataset.code = item.code;

    const head = document.createElement("div");
    head.className = "ahead";
    const when = document.createElement("span");
    when.className = "awhen";
    when.textContent = archiveWhen(item.at);
    const who = document.createElement("span");
    who.className = "awho";
    who.textContent = rec.mine ? TEXT.archiveMine : TEXT.archiveTheirs;
    const score = document.createElement("span");
    score.className = "ascore";
    // Nobody has guessed it yet, so there is no score to show -- not a score of zero.
    score.textContent = rec.done ? (rec.score || 0) + "/" + N : "\u2014";
    head.appendChild(when); head.appendChild(who); head.appendChild(score);

    const strip = document.createElement("div");
    strip.className = "astrip";
    for (let i = 0; i < N; i++){
      const t = document.createElement("div");
      t.className = "athumb";
      t.appendChild(document.createElement("canvas"));
      strip.appendChild(t);
    }

    const code2 = document.createElement("div");
    code2.className = "acode";
    code2.textContent = item.pending
      ? TEXT.archiveUnsaved
      : item.code + (rec.ms ? " \u00b7 " + timeLabel(rec.ms) : "");

    row.appendChild(head);
    row.appendChild(strip);
    row.appendChild(code2);
    box.appendChild(row);

    if (item.pending){
      // Drawn here and never saved: the drawings are on the device, and with no code there
      // is no board, so it opens where a just-drawn round opens.
      row.onclick = function(){ reopenDraft(item.pending); };
      paintArchiveRow(row, { drawings: decodeDrawings(item.pending.drawings || []), day: 0 });
      return;
    }
    // Finished opens the result; drawn but not yet guessed opens the drawings with the board.
    row.onclick = function(){ loadGame(item.code, rec.done ? "" : "review"); };
    if (archiveIO) archiveIO.observe(row); else fillArchiveRow(row);
  });
}

/* One row's drawings. A round that has expired on the server simply keeps its empty
   squares: the score beside them is this device's own record and still true. */
// The list is rebuilt where it stands when a twin goes, so the row that is gone is not
// left behind on the screen.
function archiveAgain(row){
  if (row.closest("#archiveFull")) buildArchive("archiveFull", 0);
  else archiveButton();
}

function fillArchiveRow(row){
  const code = row.dataset.code;
  if (!code) return;
  const had = archiveSeen[code];
  if (had){
    // Read once, checked every time: a drawing kept here may have been shelved after the
    // round beside it was first looked at.
    if (dropDraftsLike(had.words)){ archiveAgain(row); return; }
    paintArchiveRow(row, had);
    return;
  }
  api("/api/game/" + encodeURIComponent(code)).then(function(r){
    if (!r.ok || !r.data) return;
    const round = {
      drawings: decodeDrawings(r.data.drawings),
      day: Number(r.data.day) > 0 ? Number(r.data.day) : 0,
      name: typeof r.data.name === "string" ? r.data.name : "",
      words: Array.isArray(r.data.words) ? r.data.words : null
    };
    archiveSeen[code] = round;
    // Now that the words are known, an unsaved copy of this very round can be recognised
    // and dropped.
    if (dropDraftsLike(round.words)){ archiveAgain(row); return; }
    paintArchiveRow(row, round);
  }).catch(function(){ /* offline: the row keeps its score and its empty squares */ });
}

function paintArchiveRow(row, round){
  // Whether it was a daily round is something only the server knows, so it is said here,
  // where the answer arrives.
  if (round.day){
    const who = row.querySelector(".awho");
    if (who) who.textContent = TEXT.archiveDaily;
  }
  const cvs = row.querySelectorAll(".athumb canvas");
  for (let i = 0; i < cvs.length; i++){
    cvs[i].__strokes = round.drawings[i] || [];
    paintThumb(cvs[i]);                     // now, if it already has a width
    if (archiveRO) archiveRO.observe(cvs[i]);   // and again when it gets one
  }
}

/* The day's puzzle sits above everything else. Once it is done it stops being a
   button to play and becomes the result plus a way back to the board -- there is
   no second attempt, which is the only thing that makes the score mean anything. */
function buildDailyRow(){
  const day = dailyDayNumber();
  const rec = savedDay(day) || {};
  const go = $("dailyGo");
  $("dailyDate").textContent = dailyDateLabel(day);
  // The same date as a leaf off a wall calendar: weekday, day, month, in Turkey's time.

  $("leafDay").textContent = TEXT.weekdays.split(" ")[leaf.getUTCDay()];

$("dailyBoard").onclick = showDayPick;

  if (rec.done){ showDayPick(); return; }

    return;

};

/* Put your own day back in play from what this device stored. The day record holds
   the drawings; once guessing has started, the answers so far are kept against the
   round's code, so they are read from there. Comes back to the grid if the day is
   still open and to the result if it is finished. */
function resumeDaily(rec){
  const round = (rec.code && savedRound(rec.code)) || {};
  const kept = Array.isArray(round.order) && round.order.length === N ? round
             : (Array.isArray(rec.order) && rec.order.length === N ? rec : null);
  const done = !!(rec.done || round.done);
  dailyDay = dailyDayNumber();
  isDaily = true; secs = 3; setId = null;
  modeId = MODES.some(function(m){ return m.id === rec.modeId; }) ? rec.modeId : "typed";
  role = "solo"; drawerName = ""; lastCode = rec.code || "";
  scores = []; scoreSent = !!rec.sent;
  recallStart = round.startedAt || 0;
  recallMs = done ? (rec.ms || round.ms || 0) : 0;
  words = rec.words.slice();
  drawings = decodeDrawings(rec.drawings || []);
  order = kept ? kept.order.slice() : shuffle(words.map(function(_, i){ return i; }));
  picks = kept && Array.isArray(kept.picks) && kept.picks.length === N
    ? kept.picks.slice() : new Array(N).fill(null);
  selPos = -1;
  // No code yet means guessing never started; the save on the way in sets one.
  if (done) buildResult();
  else if (!rec.modeId) showChoose();
  else buildRecall();
}


/* --------------------------------------------------------------- sound --- */
/* Tones are synthesised rather than loaded, so the page still pulls nothing from
   outside. A browser will not let audio start without a gesture, so the context is
   created and resumed on the first tap -- pressing start, in practice -- and every
   later beep runs on that one permission. */
let audio = null;

// Resolves once the context is actually running, so a countdown can wait for it
// instead of scheduling tones into a context that is still suspended and dropping
// them.
function wakeAudio(){
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (!Ctx) return Promise.resolve();
    if (!audio) audio = new Ctx();
    if (audio.state === "suspended"){
      const r = audio.resume();
      if (r && r.then) return r.catch(function(){});
    }
  } catch(e){ audio = null; }      // no audio is not a reason to stop the game
  return Promise.resolve();
}

function tone(freq, startIn, length, peak){
  if (!audio || audio.state !== "running") return;
  try {
    const t0 = audio.currentTime + startIn;
    const osc = audio.createOscillator();
    const gain = audio.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(freq, t0);
    // Ramped rather than switched, so it does not click at either end.
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + length);
    osc.connect(gain); gain.connect(audio.destination);
    osc.start(t0); osc.stop(t0 + length + 0.02);
  } catch(e){}
}

/* All four countdown tones are scheduled in one go, on the audio clock, against the
   same absolute grid the numbers use. Firing each one from its own setTimeout at
   "currentTime + 0" was the problem: the timeout chain restarted from whenever the
   callback actually ran, so lateness piled up, and a tone asked for at +0 lands on
   the next render quantum rather than now. The audio clock does not drift, so the
   beats stay even however busy the page gets.

   startAt is a performance.now() reading, so the offset is measured rather than
   assumed -- scheduling may happen a little after the countdown became visible,
   while waiting for the context to resume. */
function countdownBeeps(startAt){
  if (!audio || audio.state !== "running") return;
  for (let k = 0; k <= 3; k++){
    const when = (startAt + k * 1000 - performance.now()) / 1000;
    if (when < -0.05) continue;                        // that beat is already gone
    if (k < 3) tone(660, Math.max(0, when), 0.12, 0.14);   // 3, 2, 1
    else       tone(990, Math.max(0, when), 0.22, 0.17);   // draw
  }
}
function beepScores(){                                        // the board is in
  tone(523.25, 0,    0.16, 0.11);
  tone(659.25, 0.13, 0.16, 0.11);
  tone(783.99, 0.26, 0.30, 0.13);
}

document.addEventListener("pointerdown", wakeAudio, { once: true });

/* -------------------------------------------------------------- game flow --- */

let cdTimer = null;

function startGame(){
  shelvePending();
  setId = "mix";
  isDaily = false; dailyDay = 0; afterDraw = "";

  role      = "solo";
  drawerName  = "";
  lastCode   = "";
  recallStart = 0;
  recallMs  = 0;
  scores  = [];
  scoreSent = false;
  words    = shuffle(freshWords());
  rememberSeen(words);
  drawings = words.map(function(){ return []; });
  order    = shuffle(words.map(function(_, i){ return i; }));
  picks    = new Array(N).fill(null);
  selPos   = -1;
  closeSheet(); closeModal();

  beginRound();
}

/* The day's puzzle. Everyone gets the same twenty words and the same settings, so
   a score posted to the day board means the same thing for everybody. The settings
   panel is deliberately ignored here. */
function startDaily(){
  shelvePending();
  dailyDay = dailyDayNumber();
  isDaily  = true;
  modeId   = "typed";       // until the question after the drawing
  secs     = 3;
  setId    = null;

  role      = "solo";
  drawerName  = "";
  lastCode   = "";
  recallStart = 0;
  recallMs  = 0;
  scores  = [];
  scoreSent = false;
  words    = dailyWords(dailyDay);
  rememberSeen(words, true);
  drawings = words.map(function(){ return []; });
  order    = shuffle(words.map(function(_, i){ return i; }));
  picks    = new Array(N).fill(null);
  selPos   = -1;
  closeSheet(); closeModal();

  beginRound();
}

function beginRound(){
  show("countdown");
  const num = $("cdNum");
  const startAt = performance.now();

  // The tones go on the clock as soon as the context is awake; both they and the
  // numbers are pinned to startAt, so they cannot slide apart.
  wakeAudio().then(function(){ countdownBeeps(startAt); });

  const step = function(k){
    num.textContent = String(3 - k);
    num.classList.remove("pop"); void num.offsetWidth; num.classList.add("pop");
    // Each wait is measured back to startAt rather than being a flat 1000, so a
    // late callback does not push everything after it later still.
    const nextAt = startAt + (k + 1) * 1000;
    const wait = Math.max(0, nextAt - performance.now());
    cdTimer = setTimeout(k < 2 ? function(){ step(k + 1); } : startDrawPhase, wait);
  };
  step(0);
}

/* ----------------------------------------------------------- drawing phase --- */

const pad = $("pad");
const pctx = pad.getContext("2d");

let padSize = 0;
let strokes = [];
// One stroke per pointer, keyed by pointerId. A single shared "current stroke"
// made a second finger carry on the first one, so two hands drew a line joining
// them instead of two separate lines. Any number of pointers now draw at once.
const live = new Map();
let idx = 0;
let wordStart = 0;
let raf = 0;

function sizePad(){
  const stage = $("stage");
  const size = Math.max(160, Math.floor(Math.min(stage.clientWidth, stage.clientHeight)));
  if (size === padSize) return;
  padSize = size;
  const dpr = window.devicePixelRatio || 1;
  pad.style.width  = size + "px";
  pad.style.height = size + "px";
  pad.width  = Math.round(size * dpr);
  pad.height = Math.round(size * dpr);
  pctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  paintPad();
}

function penWidth(){ return Math.max(3, padSize * 0.011); }

function paintPad(){
  pctx.clearRect(0, 0, padSize, padSize);
  paintStrokes(pctx, strokes, padSize, penWidth());
}

function paintStrokes(ctx, list, size, lw){
  ctx.lineWidth = lw;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.strokeStyle = PEN;
  ctx.fillStyle = PEN;
  for (let k = 0; k < list.length; k++){
    const s = list[k];
    if (!s || !s.length) continue;
    if (s.length === 1){
      ctx.beginPath();
      ctx.arc(s[0].x * size, s[0].y * size, lw / 2, 0, Math.PI * 2);
      ctx.fill();
      continue;
    }
    ctx.beginPath();
    ctx.moveTo(s[0].x * size, s[0].y * size);
    for (let i = 1; i < s.length; i++) ctx.lineTo(s[i].x * size, s[i].y * size);
    ctx.stroke();
  }
}

function padPoint(e){
  const r = pad.getBoundingClientRect();
  const x = (e.clientX - r.left) / r.width;
  const y = (e.clientY - r.top)  / r.height;
  return { x: Math.min(1, Math.max(0, x)), y: Math.min(1, Math.max(0, y)), t: performance.now() - olcWordAt };
}

pad.addEventListener("pointerdown", function(e){
  if (!$("draw").classList.contains("on")) return;
  e.preventDefault();
  try { pad.setPointerCapture(e.pointerId); } catch(err){}
  if (olcRound && !olcRound.input) olcRound.input = e.pointerType;
  const stroke = [padPoint(e)];
  live.set(e.pointerId, stroke);
  strokes.push(stroke);
  paintPad();
});

pad.addEventListener("pointermove", function(e){
  const stroke = live.get(e.pointerId);
  if (!stroke) return;
  e.preventDefault();
  // getCoalescedEvents sometimes returns an empty array; fall back to the event
  let evts = e.getCoalescedEvents ? e.getCoalescedEvents() : null;
  if (!evts || !evts.length) evts = [e];
  const lw = penWidth();
  pctx.lineWidth = lw; pctx.lineCap = "round"; pctx.lineJoin = "round"; pctx.strokeStyle = PEN;
  for (let i = 0; i < evts.length; i++){
    const p = padPoint(evts[i]);
    const prev = stroke[stroke.length - 1];
    if (Math.abs(p.x - prev.x) + Math.abs(p.y - prev.y) < 0.0015) continue;
    pctx.beginPath();
    pctx.moveTo(prev.x * padSize, prev.y * padSize);
    pctx.lineTo(p.x * padSize, p.y * padSize);
    pctx.stroke();
    stroke.push(p);
  }
});

function endStroke(e){
  if (!e){ live.clear(); return; }        // called with nothing = drop every pointer
  if (!live.has(e.pointerId)) return;     // a finger that was never drawing
  e.preventDefault();
  live.delete(e.pointerId);
}
// Start this drawing again. The word and its clock carry on: the time lost is the point.
$("clearPad").onclick = function(){
  olcClears++;
  endStroke();                  // a finger still down is not left drawing on a clean page
  strokes = [];
  paintPad();
};

pad.addEventListener("pointerup", endStroke);
pad.addEventListener("pointercancel", endStroke);
pad.addEventListener("pointerleave", endStroke);

function startDrawPhase(){
  show("draw");
  padSize = 0;
  sizePad();            // layout is ready after show(), so measure synchronously
  olcRoundFor(true);
  startWord(0);
}

/* The word used to appear at the top of a blank page with the clock already running,
   which on a phone is easy to start drawing over before reading it. It now arrives in
   the middle of the page, big, and flies up into the header -- ending exactly where and
   how the word will sit while you draw, so the two read as one thing rather than a
   title card followed by a page. The pen is dead until it lands. */
const REVEAL_HOLD = 700;    // the word alone in the middle of the page
const REVEAL_FADE = 300;    // and fading out as the pen wakes
let revealing = false;
let revealPending = false;
let revealTimer = 0;

/* The biggest size at which the word still fits the square, found by halving rather
   than guessed: one number cannot suit both "ev" and "çamaşır makinesi". */
const REVEAL_EDGE = 40;    // the gap left on either side, the same on both
const REVEAL_MIN  = 20;
const REVEAL_MAX  = 76;    // a short word at 96 was pressing against the square

function fitWord(el, boxW, boxH){
  let lo = REVEAL_MIN, hi = REVEAL_MAX, best = REVEAL_MIN;
  el.style.width = boxW + "px";
  while (lo <= hi){
    const mid = (lo + hi) >> 1;
    el.style.fontSize = mid + "px";
    if (el.scrollWidth <= boxW && el.scrollHeight <= boxH){ best = mid; lo = mid + 1; }
    else hi = mid - 1;
  }
  el.style.fontSize = best + "px";
}

/* How far the letters sit below the middle of their own line box, in pixels.
   Above the letters is the font's full ascender; below them only the descender, which a
   word like "domuz" never reaches. Centring the box therefore leaves more room above
   than below. The canvas reports both the font's box and the ink's, so the difference
   can be measured for the actual word rather than guessed at. */
function inkNudge(el, text){
  try {
    const cv = inkNudge.cv || (inkNudge.cv = document.createElement("canvas"));
    const c = cv.getContext("2d");
    const cs = getComputedStyle(el);
    c.font = cs.fontWeight + " " + cs.fontSize + " " + cs.fontFamily;
    const m = c.measureText(text);
    const fa = m.fontBoundingBoxAscent, fd = m.fontBoundingBoxDescent;
    const ia = m.actualBoundingBoxAscent, id = m.actualBoundingBoxDescent;
    if (![fa, fd, ia, id].every(function(v){ return typeof v === "number" && isFinite(v); })) return 0;
    return ((fa - ia) - (fd - id)) / 2;
  } catch (e) { return 0; }        // older browsers: leave it where it is
}

function revealThenDraw(i){
  revealing = true;
  const el = $("revealWord");
  const rv = $("reveal");
  el.textContent = say(words[i]);
  el.style.transition = "none";
  el.style.opacity = "1";
  rv.classList.add("on");

  // Over the square itself, so the word is centred on the paper it is about to be
  // drawn on, with the same air on all four sides of it.
  const pad = $("pad").getBoundingClientRect();
  rv.style.left = Math.round(pad.left) + "px";
  rv.style.top = Math.round(pad.top) + "px";
  rv.style.width = Math.round(pad.width) + "px";
  rv.style.height = Math.round(pad.height) + "px";
  fitWord(el, Math.round(pad.width) - REVEAL_EDGE * 2, Math.round(pad.height) - REVEAL_EDGE * 2);
  // Equal air above and below the letters themselves.
  el.style.transform = "translateY(" + (-Math.round(inkNudge(el, say(words[i])))) + "px)";

  void el.offsetWidth;                     // let that state land before the fade

  clearTimeout(revealTimer);
  revealTimer = setTimeout(function(){
    /* The word's own time starts as it begins to fade, so the second spent reading it
       is not taken out of the drawing. The pen has been live throughout, and the word in
       the header never left, so nothing is lost when this one goes. */
    revealing = false;
    wordStart = performance.now();
    raf = requestAnimationFrame(tick);

    el.style.transition = "opacity " + REVEAL_FADE + "ms linear";
    el.style.opacity = "0";
    revealTimer = setTimeout(function(){
      rv.classList.remove("on");
    }, REVEAL_FADE);
  }, REVEAL_HOLD);
}

function clearReveal(){
  clearTimeout(revealTimer);
  revealing = false;
  revealPending = false;
  $("reveal").classList.remove("on");
  const el = $("revealWord");
  el.style.transition = "none";
  el.style.opacity = "1";
  el.style.transform = "none";
}

function startWord(i){
  idx = i;
  strokes = [];
  live.clear();
  paintPad();
  // Nothing about guessing has been chosen yet at this point, so the header carries the
  // one setting the drawing does have.
  $("drawLevel").textContent = secsText(secs);
  $("word").textContent = say(words[i]);
  $("counter").textContent = (i + 1) + " / " + N;
  $("bar").style.transform = "scaleX(1)";
  olcWordAt = performance.now();
  olcClears = 0;
  revealThenDraw(i);
}

function tick(){
  const ms = roundMs();
  const el = performance.now() - wordStart;
  $("bar").style.transform = "scaleX(" + Math.max(0, 1 - el / ms) + ")";
  if (el >= ms){ nextWord(); return; }
  raf = requestAnimationFrame(tick);
}

function nextWord(){
  cancelAnimationFrame(raf);
  live.clear();
  drawings[idx] = strokes.filter(function(s){ return s && s.length; });   // empty drawing = []
  olcWordDrawn(idx, drawings[idx]);
  if (idx + 1 < N){ startWord(idx + 1); return; }

  if (isDaily){
    // Keep the drawings: the player may go and guess their friend's round first
    // and come back to their own, possibly after a reload.
    rememberDay(dailyDay, { drawn: true, words: words, drawings: encodeDrawings(drawings) });
  } else {
    rememberPending();
  }
  if (afterDraw === "pick"){ afterDraw = ""; showPick(); }
  else show("between");
}

// rAF stops while the tab is in the background. Push wordStart forward by the
// hidden duration so the player does not lose the rest of the word.
let hiddenAt = 0;
document.addEventListener("visibilitychange", function(){
  if (pausedAt) return;              // already paused by the leave confirmation
  if (document.hidden) hiddenAt = performance.now();
  else if (hiddenAt){ wordStart += performance.now() - hiddenAt; hiddenAt = 0; }
});

/* --------------------------------------------------- leave confirmation --- */

let pausedAt = 0;

function pauseTimer(){
  if (!$("draw").classList.contains("on") || pausedAt) return;
  cancelAnimationFrame(raf);
  pausedAt = performance.now();          // freeze the timer while the dialog is open
  // Asked to leave while the word is still up: hold the reveal too, or the drawing
  // time would run out behind the dialog.
  if (revealing){ clearTimeout(revealTimer); revealPending = true; }
}

function resumeTimer(){
  // do nothing unless we actually paused, or a second rAF loop starts and time runs twice as fast
  if (!pausedAt || !$("draw").classList.contains("on")) return;
  if (revealPending){                    // paused before the word had been shown
    revealPending = false;
    pausedAt = 0;
    revealThenDraw(idx);
    return;
  }
  wordStart += performance.now() - pausedAt;
  pausedAt = 0;
  raf = requestAnimationFrame(tick);
}

function askExit(){
  pauseTimer();
  // Leaving a drawing loses it; leaving the guessing does not, since every answer is
  // written down as it is given and the link comes back to them. The question is the same
  // one either way, so it says which of the two this is.
  $("confirmBody").textContent = $("recall").classList.contains("on")
    ? TEXT.leaveBodyGuess
    : TEXT.leaveBody;
  $("confirm").classList.add("on");
}

function cancelExit(){
  $("confirm").classList.remove("on");
  resumeTimer();
}

function confirmExit(){
  $("confirm").classList.remove("on");
  cancelAnimationFrame(raf);
  clearTimeout(cdTimer);
  clearReveal();
  pausedAt = 0;
  live.clear();
  closeSheet(); closeModal(); closeZoom();
  shelvePending();
  // The round's own entry goes with it: back from wherever this lands must not lead into
  // a round that no longer exists.
  if (history.state && history.state.screen === "draw" && history.state.depth > 0){
    leavingRound = true;
    history.back();
  } else {
    show("home");
  }
}

$("backDraw").onclick    = askExit;
$("backRecall").onclick  = askExit;
$("confirmStay").onclick = cancelExit;
$("confirmLeave").onclick = confirmExit;
$("confirm").onclick = function(e){ if (e.target === $("confirm")) cancelExit(); };

window.addEventListener("resize", function(){
  if ($("draw").classList.contains("on")){
    const keep = strokes;
    padSize = 0; sizePad(); strokes = keep; paintPad();
  }
  const cvs = document.querySelectorAll(".grid canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
});

/* ----------------------------------------------------------- recall screen --- */

function paintCell(cv){
  const size = cv.clientWidth;
  if (!size) return;
  const dpr = window.devicePixelRatio || 1;
  cv.width  = Math.round(size * dpr);
  cv.height = Math.round(size * dpr);
  const ctx = cv.getContext("2d");
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, size, size);
  paintStrokes(ctx, drawings[Number(cv.dataset.di)] || [], size, Math.max(1.5, size * 0.028));
}

function paintAll(gridId){
  const cvs = $(gridId).querySelectorAll("canvas");
  for (let i = 0; i < cvs.length; i++) paintCell(cvs[i]);
}

// If the grid is built before layout exists (a background tab, width 0) the
// drawings paint at the wrong size and never repaint. Repaint once a cell has one.
const gridRO = typeof ResizeObserver !== "undefined"
  ? new ResizeObserver(function(girisler){
      for (let i = 0; i < girisler.length; i++) paintCell(girisler[i].target);
    })
  : null;

function resetGridObserver(){ if (gridRO) gridRO.disconnect(); }

function makeCell(pos, di){
  const cell = document.createElement("div");
  cell.className = "cell";
  cell.dataset.pos = pos;
  const box = document.createElement("div");
  box.className = "box";
  const cv = document.createElement("canvas");
  cv.dataset.di = di;
  const num = document.createElement("span");
  num.className = "num";
  num.textContent = pos + 1;      // grid order is shuffled, so the number gives nothing away
  box.appendChild(cv);
  box.appendChild(num);
  if (gridRO) gridRO.observe(cv);
  const cap = document.createElement("div");
  cap.className = "cap";
  cell.appendChild(box); cell.appendChild(cap);
  return cell;
}

function buildRecall(){
  viewOnly = false;
  const g = $("recallGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    cell.onclick = function(){ onCellTap(pos); };
    g.appendChild(cell);
  });
  $("recallLevel").textContent = roundLabel();
  $("recallTitle").textContent = role === "guesser"
    ? (drawerName ? TEXT.whatDidDraw.replace("{name}", drawerName) : TEXT.whatWasDrawn)
    : TEXT.whichWasWhich;
  $("recallHint").textContent = modeId === "typed"
    ? TEXT.hintTyped
    : TEXT.hintPool;
  closeSheet(); closeModal();
  if (!recallStart){
    recallStart = Date.now();
    if (lastCode) rememberRound(lastCode, { startedAt: recallStart });
  }
  ensureCode();
  olcRoundFor(false);
  refreshRecall();
  show("recall");
  paintAll("recallGrid");
}

function onCellTap(pos){
  if (modeId === "typed"){ selPos = pos; openModal(pos); refreshRecall(); return; }
  if (picks[pos]){                       // tapping an assigned cell releases the word
    picks[pos] = null; selPos = -1; closeSheet(); refreshRecall(); return;
  }
  selPos = pos;
  openSheet(pos);
  refreshRecall();
}

// Wall clock from the grid appearing to the finish button. Kept with the round so
// a reload carries on the same clock instead of restarting it.
function elapsedMs(){
  if (recallMs) return recallMs;
  return recallStart ? Math.max(0, Date.now() - recallStart) : 0;
}

function timeLabel(ms){
  if (!ms) return "\u2013";
  const s = ms / 1000;
  if (s < 60) return (s < 10 ? s.toFixed(1) : Math.round(s)) + " " + TEXT.secUnit;
  const m = Math.floor(s / 60);
  return m + ":" + String(Math.round(s - m * 60)).padStart(2, "0");
}

function answeredCount(){
  return picks.filter(function(p){ return p && String(p).trim(); }).length;
}

function refreshRecall(){
  const g = $("recallGrid");
  order.forEach(function(di, pos){
    const cell = g.children[pos];
    if (!cell) return;
    const dolu = !!(picks[pos] && String(picks[pos]).trim());
    cell.classList.toggle("sel", pos === selPos);
    cell.classList.toggle("done", dolu);
    const cap = cell.querySelector(".cap");
    cap.innerHTML = "";
    if (dolu){
      const s = document.createElement("span");
      s.className = "pick";
      s.textContent = picks[pos];
      cap.appendChild(s);
    }
  });
  const n = answeredCount();
  $("assigned").textContent = n + " / " + N;
  $("recall").style.setProperty("--done", String(n / N));   // the bar beside the count
  // any mode can be finished early; anything left blank counts as wrong
  $("finish").disabled = false;
  // Keep the answers on the device: a reload should come back to this grid with
  // the work still in it. The order goes with them -- see loadGame.
  if (lastCode) rememberRound(lastCode, { order: order, picks: picks });
  olcPicks();
}

/* kelime havuzu */
function openSheet(pos){
  const used = {};
  picks.forEach(function(w){ if (w) used[w] = true; });
  // A pick is the name as it was shown, so a word is used under either of its names: a
  // round begun in one language may be finished in the other.
  const pool = words.filter(function(w){ return !used[w] && !used[say(w)]; })
                    .map(say)
                    .sort(function(a, b){ return a.localeCompare(b, lang); });
  $("sheetTitle").textContent = TEXT.whatIsThis;
  const box = $("chips");
  box.innerHTML = "";
  pool.forEach(function(w){
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = w;
    b.onclick = function(){ picks[pos] = w; selPos = -1; closeSheet(); refreshRecall(); };
    box.appendChild(b);
  });
  const sc = $("recallGrid").parentElement;
  if (sc && sheetScroll < 0) sheetScroll = sc.scrollTop;   // where to come back to
  paintPreview($("sheetPrev"), order[pos]);   // the cell is too small to judge from
  $("sheetScrim").hidden = false;
  $("sheet").classList.add("on");
  $("recallGrid").style.paddingBottom = ($("sheet").offsetHeight + 20) + "px";
}

// The pool is position:fixed, so the grid takes on bottom padding to keep its last
// rows reachable above it. That padding is scrollable space which exists only while
// the pool is open: dropping it shrinks the scroll range, the browser clamps
// scrollTop, and the whole grid slides under the player, who reads it as the
// drawings having swapped places. How far it slides depends on the screen, which is
// why it looked different on every device. Nothing can hold a position inside space
// that no longer exists, so instead the offset from before the pool opened is put
// back -- it was reached with the padding collapsed, so it is always reachable again.
let sheetScroll = -1;

function closeSheet(){
  const g = $("recallGrid");
  const sc = g.parentElement;
  $("sheetScrim").hidden = true;
  $("sheet").classList.remove("on");
  g.style.paddingBottom = "14px";
  if (sc && sheetScroll >= 0) sc.scrollTop = sheetScroll;
  sheetScroll = -1;
}

$("sheetX").onclick = function(){ selPos = -1; closeSheet(); refreshRecall(); };

/* Reaching the little cross in the corner one-handed is a stretch on a phone, so
   both panels also close by dragging them down or tapping away from them. */
const SWIPE_CLOSE_PX = 60;

function enableSwipeDown(el, close, holdsOwnGesture, scrim){
  let startY = 0, dragging = false;

  function clear(){
    el.style.transition = "";
    el.style.transform = "";
    if (scrim) scrim.style.opacity = "";
  }

  el.addEventListener("pointerdown", function(e){
    if (holdsOwnGesture && holdsOwnGesture(e.target)) return;   // scrolling or typing
    dragging = true;
    startY = e.clientY;
    el.style.transition = "none";
    try { el.setPointerCapture(e.pointerId); } catch(err){}
  });

  el.addEventListener("pointermove", function(e){
    if (!dragging) return;
    const dy = e.clientY - startY;
    if (dy <= 0) return;                                        // downward only
    el.style.transform = "translateY(" + dy + "px)";
    // The backdrop thins out as the panel goes, so the two move together.
    if (scrim) scrim.style.opacity = String(Math.max(0, 1 - dy / (el.offsetHeight || 300)));
  });

  const release = function(e){
    if (!dragging) return;
    dragging = false;
    const dy = e.clientY - startY;

    if (dy <= SWIPE_CLOSE_PX){ clear(); return; }               // springs back

    // Carry on in the direction the finger was going, rather than snapping back to
    // the top and only then playing the close animation.
    let finished = false;
    const done = function(){
      if (finished) return;
      finished = true;
      el.removeEventListener("transitionend", done);
      clear();
      close();
    };
    el.style.transition = "transform .18s ease-in";
    el.style.transform = "translateY(" + (el.offsetHeight + 60) + "px)";
    if (scrim) scrim.style.opacity = "0";
    el.addEventListener("transitionend", done);
    setTimeout(done, 260);      // transitionend never fires if nothing actually moves
  };

  el.addEventListener("pointerup", release);
  el.addEventListener("pointercancel", release);
}

function dismissSheet(){ selPos = -1; closeSheet(); refreshRecall(); }

$("sheetScrim").onclick = dismissSheet;
enableSwipeDown($("sheet"), dismissSheet, function(t){
  return !!(t.closest && t.closest("#chips"));      // the word list scrolls on its own
}, $("sheetScrim"));
enableSwipeDown($("modalCard"), function(){ selPos = -1; closeModal(); refreshRecall(); }, function(t){
  return !!(t.closest && t.closest("input, button, textarea"));
});

/* typed answer */
function openModal(pos){
  paintPreview($("modalPrev"), order[pos]);
  const inp = $("modalInput");
  inp.value = picks[pos] || "";
  $("modal").classList.add("on");
  modalYerlestir();              // sized for the keyboard before it is looked at
  // Focus must happen synchronously inside the tap handler for the keyboard to
  // open: setTimeout breaks the user-gesture chain and iOS ignores it.
  inp.focus();
  inp.select();
  setTimeout(modalYerlestir, 60);
}

function closeModal(){
  $("modal").classList.remove("on");
  $("modal").style.height = "";
  $("modal").style.top = "";
  $("modal").style.removeProperty("--sheet");
}

// Every enlarged view of a drawing goes through here. The canvas keeps its fixed
// backing size and CSS scales it, so the strokes stay smooth however big it gets.
function paintPreview(cv, di){
  if (!cv) return;
  const ctx = cv.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, cv.width, cv.height);
  paintStrokes(ctx, drawings[di] || [], cv.width, Math.max(3, cv.width * 0.025));
}

/* ----------------------------------------------------------- daily duel --- */

/* Two rounds are in play during a daily duel: yours and the one a friend sent.
   Whose round it is gets written into the day record when their link is opened, so
   the way between the two survives a reload. Nothing about it is held only in memory. */

// The round that is not on screen and still waiting to be guessed, or null.
function duelPartner(){
  const today = dailyDayNumber();
  if (!isDaily || dailyDay !== today) return null;
  const day = savedDay(today) || {};
  if (role === "guesser"){
    const ready = day.drawn && Array.isArray(day.words) && day.words.length === N;
    return ready && !day.done ? { mine: true } : null;
  }
  if (!day.duelCode || day.duelCode === lastCode) return null;
  const theirs = savedRound(day.duelCode) || {};
  return theirs.done ? null : { mine: false, code: day.duelCode, name: day.duelName || "" };
}

// Go to the other round. Both routes put it in the address bar, so a reload from
// there comes back to it.
function goToOther(){
  const other = duelPartner();
  if (!other) return;
  if (other.mine) resumeDaily(savedDay(dailyDay));
  else loadGame(other.code);
}

function showPick(){
  const day = savedDay(dailyDay) || {};
  $("pickTheirs").textContent = day.duelName
    ? TEXT.guessTheirsFirst.replace("{name}", day.duelName)
    : TEXT.guessMyself;
  show("pick");
}

$("gateDraw").onclick = function(){ wakeAudio(); afterDraw = "pick"; startDaily(); };
$("gateHome").onclick = function(){ show("home"); };
$("pickMine").onclick = function(){ resumeDaily(savedDay(dailyDayNumber())); };
$("pickTheirs").onclick = function(){
  const day = savedDay(dailyDayNumber()) || {};
  // After a reload on this screen the friend's round is already the one loaded.
  if (role === "guesser" && lastCode === day.duelCode){ if (recallStart) buildRecall(); else showChoose(); }
  else if (day.duelCode) loadGame(day.duelCode);
};
$("switchRound").onclick = goToOther;

/* --------------------------------------------------------- the picture --- */
/* A round is twenty drawings and what everyone made of them, which is the part worth
   keeping, and a screenshot of the screen gets it in pieces: the grid scrolls, and what
   comes out carries the browser with it. So the picture is drawn here instead -- the same
   grid at a fixed width, each answer under its drawing, in whichever theme is on. */
const SHOT = 2;                     // drawn at twice the size, so it stays sharp
const SHOT_FACE = 'ui-rounded, "SF Pro Rounded", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif';

function shotFont(size, weight){ return (weight || 400) + " " + size + "px " + SHOT_FACE; }

function shotTheme(){
  const cs = getComputedStyle(document.documentElement);
  const pick = function(n, fallback){ return (cs.getPropertyValue(n) || "").trim() || fallback; };
  return {
    bg:    pick("--bg",    "#F4EFE6"),
    dot:   pick("--dot",   "rgba(74,60,38,.17)"),
    ink:   pick("--ink",   "#1D1B18"),
    muted: pick("--muted", "#6B6459"),
    line:  pick("--line",  "#E3D9C6"),
    line2: pick("--line2", "#CDBFA6"),
    edge:  pick("--edge",  "#1D1B18"),
    shadow:pick("--shadow","#1D1B18"),
    hi:    pick("--hi",    "#FFC53D"),
    ok:    pick("--ok",    "#1C7D45"),
    no:    pick("--no",    "#C8322A"),
    paper: pick("--paper", "#FFFFFF")
  };
}

// The page the picture is drawn on: the same dot grid the game sits on.
function shotDots(ctx, t, W, H){
  ctx.fillStyle = t.dot;
  for (let y = 11; y < H; y += 22){
    for (let x = 11; x < W; x += 22){ ctx.beginPath(); ctx.arc(x, y, 1.3, 0, Math.PI * 2); ctx.fill(); }
  }
}

// The wordmark, from the very paths the start screen draws it with.
function shotMark(ctx, t, x, y, h){
  const logo = $("logo");
  if (!logo || typeof Path2D === "undefined") return false;
  const k = h / 124;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(k, k);
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  logo.querySelectorAll("path").forEach(function(p){
    ctx.strokeStyle = p.classList.contains("sw") ? t.hi : t.ink;
    ctx.lineWidth = p.classList.contains("sw") ? 11 : 13;
    ctx.stroke(new Path2D(p.getAttribute("d")));
  });
  ctx.beginPath();
  ctx.arc(131, 31, 9, 0, Math.PI * 2);
  ctx.fillStyle = t.hi;
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = t.ink;
  ctx.stroke();
  ctx.restore();
  return true;
}

function roundedPath(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// A long word is set smaller before it is cut, so answers stay readable rather than
// disappearing. Leaves the font it settled on in place for measuring the strike-through.
function fitLine(ctx, text, max, size, weight){
  let s = size;
  ctx.font = shotFont(s, weight);
  while (s > size - 7 && ctx.measureText(text).width > max){ s -= 1; ctx.font = shotFont(s, weight); }
  if (ctx.measureText(text).width <= max) return text;
  let out = text;
  while (out.length > 1 && ctx.measureText(out + "\u2026").width > max) out = out.slice(0, -1);
  return out + "\u2026";
}

// One answer, centred under its drawing. A wrong one is struck through, the way the
// screen strikes it.
function shotCap(ctx, text, cx, y, max, size, colour, strike){
  const shown = fitLine(ctx, text, max, size, 700);
  ctx.fillStyle = colour;
  ctx.textAlign = "center";
  ctx.fillText(shown, cx, y);
  if (!strike) return;
  const w = ctx.measureText(shown).width;
  ctx.strokeStyle = colour;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(cx - w / 2, y - size * 0.3);
  ctx.lineTo(cx + w / 2, y - size * 0.3);
  ctx.stroke();
}

// The paper square with the drawing on it, and the number the grid showed: lifted off the
// page on a hard shadow and outlined, the way the grid draws it, green when it was right.
function shotTile(ctx, t, x, y, size, di, num, frame){
  const r = size * 0.07;
  ctx.save();
  roundedPath(ctx, x, y + 5, size, size, r);
  ctx.fillStyle = frame || t.shadow;
  ctx.fill();
  roundedPath(ctx, x, y, size, size, r);
  ctx.fillStyle = t.paper;
  ctx.fill();
  ctx.save();
  ctx.clip();
  ctx.translate(x, y);
  paintStrokes(ctx, drawings[di] || [], size, Math.max(3, size * 0.025));
  ctx.restore();
  roundedPath(ctx, x, y, size, size, r);
  ctx.strokeStyle = frame || t.edge;
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();
  if (!num) return;
  ctx.font = shotFont(Math.round(size * 0.08), 800);
  ctx.fillStyle = "#ADA595";
  ctx.textAlign = "left";
  ctx.fillText(num, x + size * 0.06, y + size * 0.135);
}

// What the round was, in one line: whose drawings, which day, how it was played, how long.
function shotLine(){
  const bits = [];
  if (role === "guesser" && drawerName) bits.push(TEXT.drawingsOf.replace("{whose}", whose(drawerName)));
  if (isDaily && dailyDay) bits.push(TEXT.dailyTitle + " \u00b7 " + dailyDateLabel(dailyDay));
  bits.push(roundLabel());
  bits.push(TEXT.totalTime + " " + timeLabel(recallMs || elapsedMs()));
  return bits.join(" \u00b7 ");
}

// chizz, the line above, and the score: the same three things the result screen leads with,
// the score circled in red pen as it is there.
function shotHead(ctx, t, W, PAD, top){
  ctx.textBaseline = "alphabetic";
  ctx.textAlign = "right";
  ctx.fillStyle = t.ink;
  ctx.font = shotFont(40, 900);
  const tally = score + "/" + N;
  const tw = ctx.measureText(tally).width;
  ctx.fillText(tally, W - PAD - 14, top + 42);
  ctx.strokeStyle = t.no;
  ctx.lineWidth = 3;
  ctx.lineCap = "round";
  ctx.beginPath();
  ctx.ellipse(W - PAD - 14 - tw / 2, top + 28, tw / 2 + 20, 30, -0.07, -1.25, Math.PI * 2 - 0.95);
  ctx.stroke();
  const room = W - PAD * 2 - tw - 60;
  if (myName){
    ctx.fillStyle = t.muted;
    ctx.font = shotFont(21, 700);
    ctx.fillText(myName, W - PAD - 14, top + 86);
  }
  ctx.textAlign = "left";
  if (!shotMark(ctx, t, PAD - 6, top - 8, 56)){
    ctx.fillStyle = t.ink;
    ctx.font = shotFont(42, 900);
    ctx.fillText("chizz", PAD, top + 40);
  }
  ctx.fillStyle = t.muted;
  ctx.fillText(fitLine(ctx, shotLine(), room, 21, 700), PAD, top + 86);
  ctx.strokeStyle = t.line2;
  ctx.lineWidth = 2;
  ctx.setLineDash([6, 6]);
  ctx.beginPath();
  ctx.moveTo(PAD, top + 108);
  ctx.lineTo(W - PAD, top + 108);
  ctx.stroke();
  ctx.setLineDash([]);
}

function shotFoot(ctx, t, W, y){
  ctx.textAlign = "center";
  ctx.fillStyle = t.muted;
  ctx.font = shotFont(21, 800);
  ctx.fillText("chizz.party", W / 2, y);
}

function shotCanvas(W, H, t){
  const cv = document.createElement("canvas");
  cv.width = W * SHOT;
  cv.height = H * SHOT;
  const ctx = cv.getContext("2d");
  ctx.scale(SHOT, SHOT);
  ctx.fillStyle = t.bg;
  ctx.fillRect(0, 0, W, H);
  shotDots(ctx, t, W, H);
  return { cv: cv, ctx: ctx };
}

/* The whole round: four across, the answer and the word under each drawing. */
function shotBoard(){
  const t = shotTheme();
  const COLS = 4, CELL = 236, GAP = 18, PAD = 44, CAP = 76, HEAD = 140, FOOT = 72;
  const rows = Math.ceil(N / COLS);
  const W = PAD * 2 + COLS * CELL + (COLS - 1) * GAP;
  const H = PAD + HEAD + rows * (CELL + CAP) + (rows - 1) * GAP + FOOT;
  const c = shotCanvas(W, H, t);
  const ctx = c.ctx;
  shotHead(ctx, t, W, PAD, PAD);
  order.forEach(function(di, pos){
    const x = PAD + (pos % COLS) * (CELL + GAP);
    const y = PAD + HEAD + Math.floor(pos / COLS) * (CELL + CAP + GAP);
    const right = isCorrect(picks[pos], words[di]);
    shotTile(ctx, t, x, y, CELL, di, String(pos + 1), right ? t.ok : "");
    const cx = x + CELL / 2;
    let line = y + CELL + 34;
    if (!right){
      const said = (picks[pos] && String(picks[pos]).trim()) || "\u2014";
      shotCap(ctx, said, cx, line, CELL, 21, t.no, true);
      line += 29;
    }
    shotCap(ctx, say(words[di]), cx, line, CELL, 23, t.ok, false);
  });
  shotFoot(ctx, t, W, H - 30);
  return c.cv;
}

/* One drawing, as the zoom shows it. Before the round is guessed there is nothing to
   tell, so the picture keeps the word to itself as well. */
function shotOne(pos){
  const t = shotTheme();
  const di = order[pos];
  const PAD = 44, TILE = 560, HEAD = 140, FOOT = 72;
  const ok = isCorrect(picks[pos], words[di]);
  const lines = viewOnly ? 0 : (ok ? 1 : 2);
  const W = PAD * 2 + TILE;
  const H = PAD + HEAD + TILE + (lines ? 26 + lines * 42 : 0) + FOOT;
  const c = shotCanvas(W, H, t);
  const ctx = c.ctx;
  shotHead(ctx, t, W, PAD, PAD);
  shotTile(ctx, t, PAD, PAD + HEAD, TILE, di, String(pos + 1), ok && !viewOnly ? t.ok : "");
  let line = PAD + HEAD + TILE + 60;
  if (lines === 2){
    const said = (picks[pos] && String(picks[pos]).trim()) || "\u2014";
    shotCap(ctx, said, W / 2, line, TILE, 30, t.no, true);
    line += 44;
  }
  if (lines) shotCap(ctx, say(words[di]), W / 2, line, TILE, 36, t.ok, false);
  shotFoot(ctx, t, W, H - 30);
  return c.cv;
}

// Named after the round it came from, in characters every phone can keep.
function shotName(suffix){
  const what = isDaily && dailyDay ? dailyDateLabel(dailyDay, true).replace(/\//g, "-")
             : (lastCode || "cizim");
  return "chizz-" + what + (suffix || "") + ".png";
}

/* Saving it. A download on a phone lands in the files, not in the photos -- on an iPhone
   it goes to Dosyalar and the gallery never sees it -- and no page may write to the photo
   library itself. The share sheet may: it carries "Fotoğraflara Kaydet", and the same
   sheet sends the picture straight to a chat, which is what it is usually for anyway. So
   a phone is offered the sheet and everything else keeps the file, which is what a mouse
   and a downloads folder expect. */
function canShareFile(file){
  return !!(navigator.canShare && navigator.share && navigator.maxTouchPoints > 0 &&
            typeof File === "function" && navigator.canShare({ files: [file] }));
}

function saveCanvas(cv, name, then){
  const done = function(){ if (then) then(); };
  // download is what keeps the file; where that attribute is missing -- an older iPhone --
  // the picture is opened instead, to be kept with a long press.
  const hand = function(url, temp){
    done();
    const a = document.createElement("a");
    if (typeof a.download === "string"){
      a.href = url;
      a.download = name;
      document.body.appendChild(a);
      a.click();
      a.remove();
      if (temp) setTimeout(function(){ URL.revokeObjectURL(url); }, 10000);
      return;
    }
    window.open(url, "_blank");           // the new tab is using the url, so it stays
  };
  const offer = function(b){
    let file = null;
    try { file = new File([b], name, { type: "image/png" }); } catch(e){ file = null; }
    if (!file || !canShareFile(file)){ hand(URL.createObjectURL(b), true); return; }
    navigator.share({ files: [file] }).then(done, function(e){
      // Closing the sheet is an answer, and the picture is not wanted after all. Any
      // other refusal means the sheet never opened, so the file is handed over instead.
      if (e && e.name === "AbortError") done();
      else hand(URL.createObjectURL(b), true);
    });
  };
  try {
    if (cv.toBlob){
      cv.toBlob(function(b){
        if (b) offer(b);
        else hand(cv.toDataURL("image/png"), false);
      }, "image/png");
      return;
    }
    hand(cv.toDataURL("image/png"), false);
  } catch(e){ done(); }             // nothing saved is better than a button stuck saying so
}

// The drawing takes no time; the encoding does, so the button is held while it runs and
// the screen is given a frame to show that before the thread goes.
function saveFrom(btn, make, name){
  if (btn.disabled) return;
  const was = btn.textContent;
  btn.disabled = true;
  btn.textContent = TEXT.preparing;
  setTimeout(function(){
    saveCanvas(make(), name, function(){
      btn.disabled = false;
      btn.textContent = was;
    });
  }, 30);
}

// Keep the sheet above the keyboard by sitting it on the visual viewport.
/* How much room the keyboard left the last time it was up. Every card in a round opens
   with the box already focused, so the keyboard is coming either way: remembering the
   height means the second card onwards opens at the size it will keep, and only the
   first one moves. Forgotten when the phone is turned, since the room is different. */
let sheetSpace = 0, sheetAt = 0;

function modalYerlestir(){
  const m = $("modal");
  if (!m.classList.contains("on") || !window.visualViewport) return;
  const room = window.visualViewport.height;
  m.style.height = room + "px";
  m.style.top = window.visualViewport.offsetTop + "px";
  if (sheetAt !== window.innerWidth){ sheetAt = window.innerWidth; sheetSpace = 0; }
  // A fifth of the window gone is a keyboard, not a toolbar sliding away.
  if (room < window.innerHeight * 0.8) sheetSpace = room;
  m.style.setProperty("--sheet", (sheetSpace || room) + "px");
}
if (window.visualViewport){
  window.visualViewport.addEventListener("resize", modalYerlestir);
  window.visualViewport.addEventListener("scroll", modalYerlestir);
}

function buildResult(){
  viewOnly = false;
  if (!recallMs) recallMs = elapsedMs();      // stop the clock before anything is drawn
  score = 0;
  order.forEach(function(di, pos){ if (isCorrect(picks[pos], words[di])) score++; });

  $("score").textContent = role === "guesser"
    ? ((drawerName ? TEXT.inDrawingsOf.replace("{whose}", whose(drawerName)) : TEXT.inTheseDrawings) + score + "/" + N)
    : TEXT.outOf.replace("{n}", N).replace("{score}", score);
  $("scoreSub").textContent = roundLabel() + " \u00b7 " + TEXT.totalTime + " " + timeLabel(elapsedMs());
  $("copyNote").textContent = "";
  $("fallback").style.display = "none";

  const g = $("resultGrid");
  resetGridObserver();
  g.innerHTML = "";
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    markCell(cell, picks[pos], words[di]);
    cell.classList.add("tappable");
    cell.onclick = function(){ openZoom(pos); };
    g.appendChild(cell);
  });

  $("again").textContent = role === "guesser" ? TEXT.youDrawToo : TEXT.playAgain;
  // One way to hand the round on: paylaş, which copies the score and the link
  // together. A second button beside it only made the two look like different things.
  $("reviewGuess").hidden = true;
  $("saveShot").hidden = false;
  $("nameBlock").hidden = false;
  fillNameRow();
  // Record the finish before the board goes up: opening this code again on this
  // device should land here, on the score table, rather than on an empty grid.
  if (lastCode) rememberRound(lastCode, { done: true, score: score, ms: recallMs, order: order, picks: picks, name: myName });
  // No second attempt at the day: closing it here is what makes the score mean
  // something on a board everybody shares.
  if (onDayBoard()) rememberDay(dailyDay, { done: true, score: score, ms: recallMs, order: order, picks: picks });
  // During a daily duel, offer the other round. Asked after the finish is recorded,
  // and answered from storage, so it is still offered after a reload.
  const other = $("switchRound");
  const partner = duelPartner();
  other.hidden = !partner;
  if (partner){
    other.textContent = partner.mine ? TEXT.nowGuessMine
      : (partner.name ? TEXT.nowGuessTheirs.replace("{name}", partner.name) : TEXT.guessMyself);
  }
  showBoard();
  show("result");
  paintAll("resultGrid");
}

/* A cell marked against its word: green with the word when the answer is right, red
   with the answer struck through and the word under it when not. */
function markCell(cell, answer, word){
  const ok = isCorrect(answer, word);
  cell.classList.add(ok ? "right" : "wrong");
  const cap = cell.querySelector(".cap");
  if (!ok){
    const bad = document.createElement("span");
    bad.className = "bad";
    bad.textContent = (answer && String(answer).trim()) ? answer : "\u2014";
    cap.appendChild(bad);
    cap.appendChild(document.createElement("br"));
  }
  const good = document.createElement("span");
  good.className = "good";
  good.textContent = say(word);
  cap.appendChild(good);
  return ok;
}

/* What this device answered, by drawing rather than by grid position: the grid is
   shuffled per player, so only the drawing's own index means the same thing to everyone. */
function answersByDrawing(){
  const out = new Array(N).fill("");
  order.forEach(function(di, pos){ out[di] = picks[pos] ? String(picks[pos]) : ""; });
  return out;
}

/* A round's board can be opened row by row once this device has guessed the round: the
   answers are the words. Never the day's board, and never before guessing. */
function boardOpens(){ return !onDayBoard() && !viewOnly && !!lastCode; }

let answersOf = "";         // whose answers the answers screen shows

function openAnswers(name){
  answersOf = name;
  $("answersTitle").textContent = TEXT.answersOf.replace("{whose}", whose(name));
  $("answersSub").textContent = "";
  $("answersGrid").innerHTML = "";

  note.hidden = false;
  note.textContent = TEXT.loadingAnswers;
  api("/api/scores/" + encodeURIComponent(lastCode) + "?name=" + encodeURIComponent(name)).then(function(r){

    if (r.ok && r.data && Array.isArray(r.data.answers) && r.data.answers.length === N) fillAnswers(r.data.answers);
    else note.textContent = TEXT.noAnswers;
  }).catch(function(){
    if (answersOf === name) note.textContent = TEXT.fetchFailed;
  });
}

function fillAnswers(list){
  $("answersNote").hidden = true;
  const g = $("answersGrid");
  resetGridObserver();
  g.innerHTML = "";
  let right = 0;
  // In this device's grid order, so the drawings sit where the reader last saw them.
  order.forEach(function(di, pos){
    const cell = makeCell(pos, di);
    if (markCell(cell, list[di], words[di])) right++;
    g.appendChild(cell);
  });
  $("answersSub").textContent = right + "/" + N;
  paintAll("answersGrid");
}

$("answersBack").onclick = function(){ goBack("result"); };

/* The drawings and the board, for the drawer who sent the round on and has not
   guessed it yet. The same screen as the result, minus the marking: the board
   belongs under the drawings it is about, not on a screen of its own. */
function buildReview(){
