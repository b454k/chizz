$("reviewGuess").onclick = function(){ buildRecall(); };

/* ------------------------------------------------------- score tablosu --- */

function sameName(a, b){
  return norm(a) === norm(b);          // same rule as the server's name key
}

function showBoard(){
  /* Which round these drawings belong to. It is set before the board's own check, so it
     shows on the screen reached straight after sending a round off -- where the person
     waiting for friends is the one who needs the code. */
  const line = $("boardCode");
  if (line){
    line.hidden = !lastCode;
    line.textContent = lastCode ? TEXT.gameCode.replace("{code}", lastCode) : "";
  }
  $("board").hidden = !hasBoard();
  if (!hasBoard()) return;
  $("boardTitle").textContent = onDayBoard()
    ? TEXT.dailyBoardTitle.replace("{date}", dailyDateLabel(dailyDay))
    : boardHeading();
  // A score needs a name to sit under. Without one the board is still readable,
  // it just has no row for this player until they add one.
  beepScores();
  if (myName && !scoreSent && !viewOnly){ scoreSent = true; sendScore(); }
  renderScores();
  fetchScores();
  startBoardPoll(fetchScores);
}

// Winner first: best score, and on a tie whoever got there quickest. Rows written
// before times were recorded have no ms and fall in behind the timed ones.
function rankScores(list){
  return list.slice().sort(function(a, b){
    if (b.score !== a.score) return b.score - a.score;
    const am = a.ms > 0 ? a.ms : Infinity, bm = b.ms > 0 ? b.ms : Infinity;
    if (am !== bm) return am - bm;
    return (a.ts || 0) - (b.ts || 0);
  });
}

function fillBoard(box, list, opens){
  box.innerHTML = "";
  list.forEach(function(s, i){
    const row = document.createElement("div");
    row.className = "brow" + (myName && sameName(s.name, myName) ? " me" : "");
    const rk = document.createElement("span"); rk.className = "rk"; rk.textContent = String(i + 1);
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = s.name;
    const tm = document.createElement("span"); tm.className = "tm"; tm.textContent = s.ms > 0 ? timeLabel(s.ms) : "";
    const sc = document.createElement("span"); sc.className = "sc"; sc.textContent = s.score + "/" + N;
    row.appendChild(rk); row.appendChild(nm); row.appendChild(tm); row.appendChild(sc);
    if (opens){
      row.classList.add("opens");
      row.onclick = function(){ openAnswers(s.name); };
    }
    box.appendChild(row);
  });
}

/* The board under a round's drawings. */
/* The name this device's row was written under before it was changed, while a board may
   still be showing it. Renaming moves the row on the server, but the board in hand is the
   one from before: the score just re-posted has not come back yet, and the summary every
   reader gets is cached for half a minute. Beside the new name that made one player look
   like two rows with the same score and the same time -- so the old name is held back
   until a board arrives without it. */
let renamedFrom = "", renamedOn = "", renamedAt = 0;
// Long enough to outlast the half-minute the board is cached for, short enough that a
// different player who happens to take that name is not hidden for any length of time.
const RENAME_GRACE = 60 * 1000;

function renderScores(){
  if (renamedFrom && renamedOn !== boardUrl()) renamedFrom = "";      // a different board
  if (renamedFrom && Date.now() - renamedAt > RENAME_GRACE) renamedFrom = "";
  const hiding = !!renamedFrom && !!myName && !viewOnly;
  const liste = rankScores(scores).filter(function(s){
    return !(hiding && sameName(s.name, renamedFrom));
  });
  // The move has landed once the board itself stops carrying the old name.
  if (renamedFrom && !scores.some(function(s){ return sameName(s.name, renamedFrom); })){
    renamedFrom = "";
  }
  // Always show your own row: KV listing is eventually consistent, so a score
  // just written may not be in the list yet.
  if (myName && !viewOnly && !liste.some(function(s){ return sameName(s.name, myName); })){
    liste.push({ name: myName, score: score, ms: elapsedMs() });
  }
  const sirali = rankScores(liste);
  fillBoard($("boardList"), sirali, boardOpens());
  const bos = sirali.length === 0;
  $("boardHint").hidden = bos || !boardOpens();
  $("boardEmpty").hidden = !bos;
  // Column names over nothing at all would be a table pretending to have rows.
  $("boardHead").hidden = bos;
}

// A round has its own board, keyed by its code; the day has a global board per mode,
// which everyone who played that day in that mode lands on.
/* The day board holds your score on your OWN drawings, in the mode you played. Guessing a
   friend's daily round is a different thing -- how well you read their scribbles depends
   on how they draw -- so that goes to their round's own board, exactly like a free-play
   duel. The day this device drew has to be on record as well: the flag alone once let a
   sınırsız score reach the day, when opening the day's board had set it. */
function onDayBoard(){
  return isDaily && role !== "guesser" && !!(savedDay(dailyDay) || {}).drawn;
}

function boardUrl(){
  return onDayBoard()
    ? "/api/daily/" + dailyDay + "?mode=" + encodeURIComponent(modeId)
    : "/api/scores/" + encodeURIComponent(lastCode);
}

function hasBoard(){ return onDayBoard() ? !!dailyDay : !!lastCode; }

function fetchScores(){
  if (!hasBoard()) return;
  api(boardUrl()).then(function(r){
    if (r.ok && r.data && Array.isArray(r.data.scores)){ scores = r.data.scores; renderScores(); }
  }).catch(function(){ /* if the board fails, your own row still shows */ });
}

/* Refresh as friends finish. A read is a single get on the server side, so
   this poll is cheap. */
// A read is a single KV get against a 100,000/day allowance, so a board watched
// for ten minutes costs about 600 of them. The server side was measured at half a
// second, so the poll interval is what the wait actually is.
const POLL_MS = 1000;
let boardTimer = null;
let boardTick = null;

function startBoardPoll(tick){
  stopBoardPoll();
  boardTick = tick;
  boardTimer = setInterval(function(){
    const visible = $("result").classList.contains("on") || $("scores").classList.contains("on");
    if (!visible){ stopBoardPoll(); return; }   // stop once the screen is left
    if (document.hidden) return;               // do not fetch while backgrounded
    boardTick();
  }, POLL_MS);
}

function stopBoardPoll(){
  if (boardTimer){ clearInterval(boardTimer); boardTimer = null; }
  boardTick = null;
}

// Coming back from another app should refresh at once, not wait for the next tick.
document.addEventListener("visibilitychange", function(){
  if (!document.hidden && boardTick) boardTick();
});

// Reached from the start screen once the day is done.

/* The day's two boards. kolay and zor are different games, so they are ranked apart and
   the reader says which one they came for.

   None of this touches what the game is holding. Setting isDaily here was enough to send
   a sınırsız score to the day: a step back to that round's result found the flag still on
   and posted the score where it did not belong. */
let dayBoard = { day: 0, mode: "", scores: [] };

function showDayPick(){
  const box = $("dayPickModes");
  box.innerHTML = "";
  MODES.forEach(function(m){
    const b = modeCard(m);
    b.onclick = function(){ openDayBoard(m.id); };
    box.appendChild(b);
  });
  show("dayPick");
}

function openDayBoard(mode){
  dayBoard = { day: dailyDayNumber(), mode: mode, scores: [] };
  $("scoresTitle").textContent = TEXT.dailyBoardTitle.replace("{date}", dailyDateLabel(dayBoard.day))
    + " \u00b7 " + TEXT[modeById(mode).tag];
  renderDayBoard();
  fetchDayBoard();
  show("scores");
  startBoardPoll(fetchDayBoard);
}

function renderDayBoard(){
  const rec = savedDay(dayBoard.day) || {};
  const list = rankScores(dayBoard.scores);
  // Your own row before the listing catches up -- on the board you actually played.
  const mine = rec.done && (rec.modeId || "typed") === dayBoard.mode;
  if (mine && myName && !list.some(function(s){ return sameName(s.name, myName); })){
    list.push({ name: myName, score: rec.score || 0, ms: rec.ms || 0 });
  }
  const sirali = rankScores(list);
  fillBoard($("scoresList"), sirali, false);
  const bos = sirali.length === 0;
  $("scoresEmpty").hidden = !bos;
  $("scoresHead").hidden = bos;
}

function fetchDayBoard(){
  const day = dayBoard.day, mode = dayBoard.mode;
  api("/api/daily/" + day + "?mode=" + encodeURIComponent(mode)).then(function(r){
    if (dayBoard.day !== day || dayBoard.mode !== mode) return;    // moved on since
    if (r.ok && r.data && Array.isArray(r.data.scores)){ dayBoard.scores = r.data.scores; renderDayBoard(); }
  }).catch(function(){ /* if the board fails, your own row still shows */ });
}

$("dayPickBack").onclick = function(){ show("home"); };

// The only board with a screen to itself is the day's, which is global and has no
// drawings of its own. Every other score table sits under the drawings it is about.
$("scoresBack").onclick = function(){
  stopBoardPoll();
  goBack("home");
};

function sendScore(){
  if (!hasBoard() || !myName) return;
  renderScores();                                 // show your own row without waiting
  const rec = (onDayBoard() ? savedDay(dailyDay) : savedRound(lastCode)) || {};
  api(boardUrl(), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      name: myName,
      score: score,
      ms: elapsedMs(),
      // So friends can tap this row and see them. The day's board has no use for them.
      answers: onDayBoard() ? undefined : answersByDrawing(),
      // What this round was last posted under, and the proof it was us, so a
      // rename moves the row rather than adding a second one.
      was: rec.postedAs || "",
      token: rec.scoreToken || ""
    })
  }).then(function(r){
    const patch = { sent: true, postedAs: myName };   // do not post it again on a revisit
    if (r.ok && r.data && r.data.token) patch.scoreToken = r.data.token;
    if (onDayBoard()) rememberDay(dailyDay, patch); else rememberRound(lastCode, patch);
    if (r.ok && r.data && Array.isArray(r.data.scores)){ scores = r.data.scores; renderScores(); }
  }).catch(function(){ /* already shown locally, fail quietly */ });
}

/* ------------------------------------------------------- geri bildirim --- */

const FB_MIN = 10, FB_MAX = 500;
const FB_COOLDOWN = 60 * 1000;      // one report a minute from a device
let fbKind = "";
let fbFrom = "";
let fbSending = false;

function screenNow(){
  const st = history.state;
  const on = document.querySelector(".screen.on");
  return (st && st.screen) || (on ? on.id : "");
}

// Everything a report needs that a person would not think to type.
function feedbackContext(){

    from: fbFrom,

    address: location.pathname + location.search,

    day: dailyDayNumber(),
    daily: !!isDaily,
    role: role,
    mode: modeId,
    secs: secs,
    theme: theme,
    device: navigator.userAgent,
    language: navigator.language || "",
    viewport: window.innerWidth + "x" + window.innerHeight + " @" + (window.devicePixelRatio || 1),
    online: navigator.onLine,
    errors: recentErrors.slice(),
    visit: OLC_OFF ? "" : visitId       // opens this visit's timeline in /admin
  };
}

function fbSay(text, tone){
  $("fbMsg").textContent = text || "";
  $("fbMsg").className = tone || "";

// Nothing is asked before a round any more: you press start and draw. A name is
// only needed to put your round in someone else's hands, or your score on a
// board, so it is asked at exactly those two points.
function setName(raw){
  const name = String(raw || "").trim().slice(0, NAME_MAX);
  if (!name) return "";

function shareText(){
  let rows = "";
  order.forEach(function(di, pos){
    rows += (isCorrect(picks[pos], words[di]) ? "🟩" : "🟥");
    // The grid is 4 across and 5 down on a phone, so the shared squares match it:
    // a 5-wide block was not the shape the player had been looking at.
    if (pos % 4 === 3 && pos !== N - 1) rows += "\n";
  });
  // The set is never named in the share text, so it cannot leak which words came up.
  // Whose drawings these are: the other player's when guessing, your own otherwise.
  // Guessing your own round used to fall through to the bare title, so sharing it
  // said nothing about who drew it.
  const who = role === "guesser" ? drawerName : myName;
  const head = "chizz 🎨" + dailyTag() + (who ? " " + TEXT.drawingsOf.replace("{whose}", whose(who)) : "");
  let out = head + "\n" + roundLabel() + "\n" + score + "/" + N
          + " \u00b7 " + timeLabel(elapsedMs()) + "\n\n" + rows;
  // Anyone reading the score can play the same round straight from the message.
  if (lastCode) out += "\n\n" + inviteText();
  return out;
}

// The tail that goes under a score: the message above it already says what this is.
function inviteText(){
  return TEXT.guessTooInvite + "\n" + gameLink(lastCode);
}

/* The whole message, for the places that send the link on its own. It has to say
   something in words, because a message containing nothing but a URL is swallowed
   whole by the link preview -- WhatsApp shows the card and not a single line of
   text, so the reader never sees who sent it or why. */
/* Whether a round is the day's puzzle is the first thing a reader needs to know, so
   it goes into every line this game shares -- the drawings, the score, the invite --
   rather than only the ones posted from the day board. */
function dailyTag(){
  return isDaily && dailyDay ? " " + TEXT.dailyShare.replace("{date}", dailyDateLabel(dailyDay)) : "";
}

function inviteMessage(){
  const who = role === "guesser" ? drawerName : myName;
  const head = "chizz \u{1F3A8}" + dailyTag() + (who ? " " + TEXT.drawingsOf.replace("{whose}", whose(who)) : "");
  return head + "\n" + TEXT.inviteBlurb + "\n\n" + inviteText();
}

function copyText(t){
  return new Promise(function(resolve){
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(t).then(
        function(){ resolve(true); },
        function(){ resolve(legacyCopy(t)); }
      );
      return;
    }
    resolve(legacyCopy(t));
  });
}

function legacyCopy(t){
  try {
    const ta = document.createElement("textarea");
    ta.value = t;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    ta.setAttribute("readonly", "readonly");
    document.body.appendChild(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, t.length);
    const ok = document.execCommand("copy");
    ta.remove();
    return ok;
  } catch(err){ return false; }
}

// round to 0-255 integers and drop consecutive points closer than 2 units
function encodeDrawings(list){
  return list.map(function(strokeList){
    const out = [];
    (strokeList || []).forEach(function(st){
      if (!st || !st.length) return;
      const pts = [];
      let last = null;
      for (let i = 0; i < st.length; i++){
        const x = Math.round(Math.min(1, Math.max(0, st[i].x)) * 255);
        const y = Math.round(Math.min(1, Math.max(0, st[i].y)) * 255);
        if (last){
          const dx = x - last[0], dy = y - last[1];
          if (dx * dx + dy * dy < 4){ continue; }
        }
        pts.push([x, y]); last = [x, y];
      }
      // keep the last point so the stroke end survives
      const sonX = Math.round(Math.min(1, Math.max(0, st[st.length - 1].x)) * 255);
      const sonY = Math.round(Math.min(1, Math.max(0, st[st.length - 1].y)) * 255);
      if (!pts.length || pts[pts.length - 1][0] !== sonX || pts[pts.length - 1][1] !== sonY){
        pts.push([sonX, sonY]);
      }
      out.push(pts);
    });
    return out;
  });
}

function decodeDrawings(raw){
  if (!Array.isArray(raw)) return [];
  return raw.map(function(strokeList){
    if (!Array.isArray(strokeList)) return [];
    return strokeList.map(function(st){
      if (!Array.isArray(st)) return [];
      return st.map(function(p){
        return { x: (Number(p[0]) || 0) / 255, y: (Number(p[1]) || 0) / 255 };
      });
    }).filter(function(st){ return st.length; });
  });
}

function api(yol, opts){
  const ctrl = typeof AbortController !== "undefined" ? new AbortController() : null;
  const t = setTimeout(function(){ if (ctrl) ctrl.abort(); }, 12000);
  const o = opts || {};
  if (ctrl) o.signal = ctrl.signal;
  return fetch(yol, o).then(function(r){
    clearTimeout(t);
    return r.json().catch(function(){ return {}; }).then(function(j){
      return { ok: r.ok, status: r.status, data: j };
    });
  }, function(e){ clearTimeout(t); throw e; });
}

// One place that posts a round, so the share screen and the automatic save on the
// way into guessing cannot drift apart.
function postRound(name){
  return api("/api/save", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({
      setId: setId,
      mode: modeId,
      seconds: secs,
      day: isDaily ? dailyDay : 0,
      name: name || "",
      lang: lang,                   // what the link preview is written in
      words: words,
      drawings: encodeDrawings(drawings)
    })
  }).then(function(r){
    if (!r.ok || !r.data || !r.data.code) throw new Error("save failed");
    lastCode = r.data.code;
    if (olcRound) olcSend(olcRound, {});      // the drawn round now has a code to join on
    if (name) drawerName = name;
    // Guessing may have started before this save returned, when there was no code to
    // stamp the start time on, so it travels with the save.
    // Dated by when it was drawn rather than when it was saved: that is what arşiv shows,
    // and the two can be minutes or days apart when a drawing is picked up again later.
    const drawn = (loadStore().pending || {}).at || 0;
    rememberRound(lastCode, { mine: true, owner: r.data.owner || "", order: order, picks: picks,
                              startedAt: recallStart || 0, at: drawn });
    clearPending();                 // it has a code now; that is the better record
    dropDraftsLike(words);          // and so is any older copy of the same drawings
    if (isDaily) rememberDay(dailyDay, { code: lastCode });
    setUrlCode(lastCode);
    return lastCode;
  });
}

/* People want to play the same round side by side, so the round is saved as soon
   as its own guessing begins rather than only when the share screen is opened.
   The code then exists for the corner chip, and for the invite line in the share
   text, without the player having to do anything first. */
function ensureCode(){
  if (lastCode || role === "guesser") return;
  if (!drawings.some(function(d){ return d && d.length; })) return;   // nothing worth sharing
  postRound(myName).then(updateCodeChip).catch(function(){
    /* offline, or the save failed: the chip stays hidden and the share screen can
       still try again later. Nothing is lost, the drawings are in memory. */
  });
}

// Push the current name onto the round this device saved: either filling the blank
// left by the automatic save, or replacing a name that has since been changed. The
// token proves the round is ours to rename.
function syncRoundName(){
  if (!lastCode || !myName || role === "guesser") return;
  if (drawerName === myName) return;
  const rec = savedRound(lastCode) || {};
  drawerName = myName;
  api("/api/game/" + encodeURIComponent(lastCode), {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ name: myName, owner: rec.owner || "" })
  }).catch(function(){});
}

// A link sent to a friend must always point at the public address. One generated
// while playing on localhost, or from a file:// copy, will not open for them.
// When the domain changes, this is the ONLY line to edit.
const PUBLIC_BASE_URL = "https://chizz.party";

function gameLink(code){
  // Local, file:// and the old pages.dev address must not be used as the link
  // base: the first two never open for the recipient, and pages.dev is filtered
  // by some networks. Fall back to the canonical address in all three cases.
  const nonCanonical = location.protocol === "file:" ||
                       !location.hostname ||
                       /^(localhost|127\.0\.0\.1|0\.0\.0\.0|\[?::1\]?)$/i.test(location.hostname) ||
                       /\.pages\.dev$/i.test(location.hostname);
  const base = nonCanonical
    ? PUBLIC_BASE_URL
    : location.origin + location.pathname.replace(/index\.html$/i, "");
  return base.replace(/\/+$/, "") + "/?o=" + code;
}

function loadGame(code, want, who){
  code = String(code || "").toUpperCase();
  show("loading");
  $("loadTitle").textContent = TEXT.loadingDrawings;
  $("loadMsg").textContent = "";
  $("loadHome").hidden = true;
  $("loadReport").hidden = true;

  api("/api/game/" + encodeURIComponent(code)).then(function(r){
    if (r.status === 404) throw new Error("notfound");
    if (!r.ok) throw new Error("error");
    const v = r.data || {};
    const loadedWords = v.words, loadedDrawings = decodeDrawings(v.drawings);
    if (!Array.isArray(loadedWords) || loadedWords.length !== N || loadedDrawings.length !== N) throw new Error("malformed");

    setId    = typeof v.setId === "string" ? v.setId : "mix";
    // Accept both shapes: rounds shared before modes existed only have a difficulty.
    const legacy = LEGACY_DIFFS[v.difficulty];
    modeId = MODES.some(function(m){ return m.id === v.mode; }) ? v.mode
           : (legacy ? legacy.mode : "pool");
    secs   = v.seconds !== undefined ? clampSecs(v.seconds)
           : (legacy ? legacy.seconds : SECS_DEFAULT);
    lastCode   = code;
    scores  = [];
    drawerName  = typeof v.name === "string" ? v.name.slice(0, NAME_MAX) : "";
    words    = loadedWords;
    drawings = loadedDrawings;
    selPos   = -1;

    // Has this device been here before? The grid order has to be restored with
    // the answers: it is reshuffled on every visit, so putting old picks against
    // a fresh order would pin every answer to the wrong drawing.
    const rec = savedRound(code);
    if (rec && MODES.some(function(m){ return m.id === rec.modeId; })) modeId = rec.modeId;
    const resumable = !!(rec && Array.isArray(rec.order) && rec.order.length === N);
    role      = rec && rec.mine ? "drawer" : "guesser";
    // Somebody else's round is guessed in the language it was drawn in, unless a flag on the
    // kolay/zor screen has picked the other one for it. A round saved before there was a
    // choice was drawn in Turkish. A device that has never picked a language keeps this one.
    if (role === "guesser"){
      const drawnIn = v.lang === "en" ? "en" : "tr";
      const l = rec && (rec.lang === "tr" || rec.lang === "en") ? rec.lang : drawnIn;
      if (deviceLang()) useLang(l); else chooseLang(l);
    }
    scoreSent = !!(rec && rec.sent);
    order     = resumable ? rec.order.slice()
                          : shuffle(words.map(function(_, i){ return i; }));
    picks     = resumable && Array.isArray(rec.picks) && rec.picks.length === N
                  ? rec.picks.slice()
                  : new Array(N).fill(null);
    recallStart = rec && rec.startedAt ? rec.startedAt : 0;
    recallMs  = rec && rec.done && rec.ms ? rec.ms : 0;
    if (!resumable) rememberRound(code, { order: order });
    isDaily = Number(v.day) > 0;
    dailyDay = isDaily ? Number(v.day) : 0;
    buildHome();

    const todaysDuel = isDaily && dailyDay === dailyDayNumber() && role === "guesser";
    if (todaysDuel) rememberDay(dailyDay, { duelCode: code, duelName: drawerName });

    // Today's puzzle is the same twenty words for everyone, so looking at a
    // friend's grid before drawing would show the reader the words. Hold it.
    if (todaysDuel && !drewToday()){
      show("gate");
      return;
    }

    if (rec && rec.done && want === "answers" && who){ openAnswers(who); return; }
    if (rec && rec.done){             // already played on this device: straight to the scores
      buildResult();
      return;
    }
    // A round of this device's own can be looked at two ways -- the link screen or the
    // drawings with their board -- and the address says nothing about which. The history
    // entry, or the archive, does.
    if (rec && rec.mine && want === "review"){ buildReview(); return; }
    if (rec && rec.mine && want === "send"){ openShareScreen("home"); return; }
    // Drawn today but neither round started: a reload on the choice screen returns to it.
    const day = todaysDuel ? (savedDay(dailyDay) || {}) : null;
    if (day && !day.code && !day.done && !recallStart){
      showPick();
      return;
    }
    // Was guessing its own drawings: back to the grid. A daily round is only ever saved
    // on the way into guessing, so for one of those the share screen is never right.
    if (rec && rec.mine && (rec.startedAt || isDaily)){
      buildRecall();
      return;
    }
    if (rec && rec.mine){             // this device drew the round: back to the share screen
      $("code").textContent = code;
      $("link").textContent = gameLink(code);
      sendShow("done");
      show("send");
      return;
    }
    // A friend's round not started yet: how to guess it comes first, every time.
    if (!recallStart){ showChoose(); return; }
    buildRecall();                    // back into guessing; the name comes later
  }).catch(function(e){
    historyQuiet = false;
    $("loadTitle").textContent = e && e.message === "notfound"
      ? TEXT.codeInvalid
      : TEXT.fetchFailed;
    $("loadMsg").textContent = e && e.message === "notfound" ? "" : TEXT.checkConnection;
    $("loadHome").hidden = false;
    $("loadReport").hidden = false;
  });
}

/* Nasıl oynanır: once, the first time a device that has never played reaches the start
   screen. Anything the device keeps from a round -- a name, a word dealt to it, a day, a
   round drawn or guessed, an unsaved drawing -- means it has played, so nobody who was
   playing before this existed sees it. Closing it is what counts as having seen it. */
function hasPlayed(store){
  return !!(store.name || store.pending
    || Object.keys(store.rounds || {}).length || Object.keys(store.days || {}).length
    || Object.keys(store.seen || {}).length
    || (Array.isArray(store.drafts) && store.drafts.length)
    || (Array.isArray(store.dailyPlayed) && store.dailyPlayed.length));
}
// The loop is drawn in the page and only runs while the card is on screen, so every
// opening starts it from the first scene.
function openHowTo(){
  $("howAsk").classList.add("on");
}
/* Whether this device had played anything when the page opened. Decided once, at the
   start, because opening a friend's link writes the round down before any of this runs --
   and that alone made the device look like a player, which is why the people most in need
   of being shown how, the ones arriving by a link for the first time, were the ones who
   never saw it. */
let newHere = false;

function maybeHowTo(){
  const store = loadStore();
  if (store.howSeen || $("howAsk").classList.contains("on")) return;
  if (!newHere && hasPlayed(store)) return;
  openHowTo();
}
function closeHowTo(){
  $("howAsk").classList.remove("on");
  const store = loadStore();
  store.howSeen = true;
  saveStore(store);
}
$("howOpen").onclick = openHowTo;
$("howGo").onclick = closeHowTo;
$("howAsk").onclick = function(e){ if (e.target === $("howAsk")) closeHowTo(); };

/* iOS stopped honouring user-scalable=no years ago, so the meta tag alone leaves
   double-tap zoom working. Worse, once it has zoomed there is no way back out,
   because the same tag blocks pinching out again. Three things are needed:
   touch-action:manipulation in the CSS, refusing Safari's own pinch gestures, and
   swallowing the second tap of a double-tap before it counts as one. */
["gesturestart", "gesturechange", "gestureend"].forEach(function(type){
  document.addEventListener(type, function(e){ e.preventDefault(); }, { passive: false });
});

let lastTapAt = 0, lastTapX = 0, lastTapY = 0;
document.addEventListener("touchend", function(e){
  const t = e.changedTouches && e.changedTouches[0];
  const now = Date.now();
  const x = t ? t.clientX : 0, y = t ? t.clientY : 0;
  // Time and place both, so tapping a cell and then a chip in quick succession is
  // still two taps, while tapping the same spot twice is the zoom gesture and dies.
  if (now - lastTapAt <= 350 && Math.abs(x - lastTapX) < 30 && Math.abs(y - lastTapY) < 30){
    e.preventDefault();
  }
  lastTapAt = now; lastTapX = x; lastTapY = y;
}, { passive: false });

// A second finger anywhere but the pad is a pinch, never a drawing gesture.
document.addEventListener("touchmove", function(e){
  if (e.touches.length > 1 && e.target !== pad) e.preventDefault();
}, { passive: false });

// Safari also zooms when a form field is focused and the font is under 16px.
document.addEventListener("dblclick", function(e){ e.preventDefault(); }, { passive: false });

/* ------------------------------------------------------------- fitting --- */
/* The word being drawn and the score over a result are written by the game as plain text,
   and a long one -- "tekerlekli sandalye", or a friend's name in front of a score -- ran
   off the side and was cut to an ellipsis, so the word on the clock could not be read in
   full. Each is set smaller until it fits, whenever it changes, down to a floor; the score
   may wrap after that. The header keeps one height throughout, so the paper never moves. */
function fitText(el, max, min, wrap){
  el.style.whiteSpace = "";
  let size = max;
  el.style.fontSize = size + "px";
  while (size > min && el.scrollWidth > el.clientWidth + 1){ size -= 1; el.style.fontSize = size + "px"; }
  if (wrap && el.scrollWidth > el.clientWidth + 1) el.style.whiteSpace = "normal";
}
function fitHeadWord(){ fitText($("word"), 32, 17, false); }
function fitScoreLine(){ if ($("score").textContent) fitText($("score"), 46, 28, true); }
if (typeof MutationObserver !== "undefined"){
  new MutationObserver(fitHeadWord).observe($("word"), { childList: true, characterData: true, subtree: true });
  new MutationObserver(fitScoreLine).observe($("score"), { childList: true, characterData: true, subtree: true });
}
/* The time question's sentence changes as the slider moves, and "2,5" is wider than "3", so
   it went from one line to two and back under the thumb. It is sized once for the widest
   value it can say -- measured, since widths differ from font to font -- and then keeps
   that size on one line for every value. */
function fitTimeLine(){
  const el = $("timeAskText");
  if (!el.clientWidth) return;
  const cs = getComputedStyle(el);
  const c = (fitTimeLine.cv || (fitTimeLine.cv = document.createElement("canvas"))).getContext("2d");
  c.font = cs.fontWeight + " 22px " + cs.fontFamily;
  let widest = 0;
  for (let v = SECS_MIN; v <= SECS_MAX; v += 0.5){
    widest = Math.max(widest, c.measureText(TEXT.timeNotice.replace("{n}", numText(v))).width);
  }
  el.style.fontSize = Math.max(14, Math.min(22, Math.floor(220 * el.clientWidth / widest) / 10)) + "px";
}
if (typeof MutationObserver !== "undefined"){
  new MutationObserver(fitTimeLine).observe($("timeAskText"), { childList: true, characterData: true, subtree: true });
}
window.addEventListener("resize", function(){ fitHeadWord(); fitScoreLine(); fitTimeLine(); });

myName = savedName();             // the device already knows who is playing

applyLang();
buildHome();

/* Where to start.

   A reload -- or coming back to this page with the back or forward button -- lands on a
   history entry that says which screen it was, so that screen comes back. A round link
   opened fresh loads that round. Anything else is a fresh visit and starts at the start,
   with an entry of its own so there is a start screen to come back to. */
(function(){
  newHere = !hasPlayed(loadStore());     // before a link writes the round down
  const st = history.state;
  if (st && st.screen){ restoreEntry(st); return; }

  const m = /[?&]o=([^&]+)/.exec(location.search || "");
  if (m){
    historyQuiet = true;      // opened from a link: back should leave, not step into the app
    loadGame(decodeURIComponent(m[1]));
    return;
  }

  try { history.replaceState({ screen: "home", code: "", depth: 0 }, "", location.pathname); } catch (e) {}
  track("screen", { screen: "home" });
  maybeHowTo();             // the start screen is up without show() on a fresh visit
})();

document.documentElement.classList.add("intro");

})();
